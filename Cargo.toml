[workspace]
resolver = "2"
members = [
    "crates/fleetforge-core",
    "crates/fleetforge-providers",
    "crates/fleetforge-tui",
    "crates/fleetforge-web",
    "apps/gui/src-tauri",
]

# Les trois façades partagent ces versions : un décalage entre le GUI, le TUI
# et le serveur web sur serde ou tokio se paierait en conversions à la
# frontière du cœur.
[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Stéphane VAXELAIRE"]
license = "MIT"

[workspace.dependencies]
fleetforge-core = { path = "crates/fleetforge-core" }
fleetforge-providers = { path = "crates/fleetforge-providers" }

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
