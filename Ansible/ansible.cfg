# Configuration Ansible du dépôt.
#
# Ansible ne lit ce fichier que si le répertoire courant est `Ansible/`. C'est
# déjà ce que suppose `play.sh` (tous ses chemins sont
# relatifs), et c'est aussi le `cwd` que l'application et le TUI imposent
# désormais avant chaque appel — la configuration s'applique donc aux trois.
#
# Attention : Ansible IGNORE un `ansible.cfg` situé dans un répertoire
# accessible en écriture à tous. Ne pas relâcher les droits de `Ansible/`.

[defaults]
# Mot de passe du vault. Sans cette ligne, tout playbook touchant un
# `group_vars` chiffré demanderait le mot de passe de façon interactive — ce
# qui casserait les lancements depuis l'interface graphique et le TUI, qui
# n'ont pas de terminal pour répondre.
#
# Le fichier est en 0600 hors du dépôt : il n'est ni versionné, ni lisible par
# les autres comptes de la machine.
vault_password_file = ~/.config/fleetforge/vault-pass

# Les hôtes sont désignés par leur nom d'inventaire ; leur clé SSH est vérifiée
# par `known_hosts`, que les rôles de sauvegarde alimentent explicitement.
interpreter_python = auto_silent

# ── Cache des faits ────────────────────────────────────────────────────────
# Plusieurs ENTRÉES d'inventaire décrivent une même MACHINE — neuf sur
# celle de `prometheus1`. Un play qui les vise toutes se connecte donc neuf fois au
# même serveur pour y collecter neuf fois les mêmes faits.
#
# Hors du dépôt, comme le mot de passe du vault : un cache est un état local à
# la machine, pas un contenu versionné. Le placer sous `Ansible/` le ferait
# entrer dans l'historique au premier `git add -A`.
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts

# Deux heures. Ce qui est mis en cache, ce sont les faits du module `setup` —
# distribution, architecture, interfaces — qui ne changent pas d'une heure à
# l'autre. La borne existe pour qu'une machine réinstallée ou mise à niveau
# cesse d'être décrite par ce qu'elle était.
#
# Ne sont PAS mis en cache, vérifié sur ce dépôt : `ansible_facts.services`,
# `getent_passwd` et `packages`. Ils viennent de modules dédiés
# (`service_facts`, `getent`, `package_facts`), qui les injectent dans le play
# sans les persister — l'état d'un service relu ici est donc toujours frais.
fact_caching_timeout = 7200
