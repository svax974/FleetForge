---
# Retire UNE instance web3c-sync : conteneur, sonde, cible Prometheus et
# autorisation de scrape. CONSERVE les données (sync.db, blobs), l'image, la
# copie des sources et les sauvegardes — leur suppression relève de
# `sync-server-purge`. Aucune autre instance de la machine partagée n'est
# touchée (le filtrage DOCKER-USER, l'image et les sources sont communs).

- name: Stop and remove the sync container
  community.docker.docker_container:
    name: "{{ sync_container }}"
    state: absent
  become: true

# ── Supervision ─────────────────────────────────────────────────────────────
# La sonde ET la cible partent avec le service : laissées en place, elles
# publieraient `service_up 0` / `up 0` indéfiniment et feraient sonner une
# alerte sur un service volontairement désinstallé (CLAUDE.md). La cible
# svcprobe de la MACHINE n'est pas retirée : elle porte les sondes des autres
# services qui y tournent.
- name: Remove the sync probe
  ansible.builtin.file:
    path: "{{ svcprobe_checks_dir | default('/etc/svcprobe/checks.d') }}/sync-{{ sync_instance }}.json"
    state: absent
  become: true
  tags: [monitoring]

- name: Remove the sync Prometheus target
  ansible.builtin.file:
    path: "/home/{{ remote_username }}/prometheus/prometheus-configs/{{ sync_mon_job }}/{{ inventory_hostname }}.json"
    state: absent
  delegate_to: "{{ prometheus_host }}"
  become: true
  tags: [monitoring]

- name: Remove the Prometheus scrape drop-in
  ansible.builtin.file:
    path: "{{ sync_mon_dropin_dir }}/sync-{{ sync_instance }}.conf"
    state: absent
  become: true
  register: sync_remove_dropin
  tags: [monitoring]

# L'autorisation n'a plus d'objet une fois le conteneur parti ; on réapplique
# tout de même les règles pour que iptables reflète le disque. Sans effet sur
# les autres services (le script est idempotent).
- name: Reapply the Docker port rules
  ansible.builtin.command: "{{ sync_mon_firewall_script }}"
  become: true
  changed_when: false
  failed_when: false
  when: sync_remove_dropin.changed
  tags: [monitoring]

- name: Remind the operator what remove leaves in place
  ansible.builtin.debug:
    msg: >-
      {{ sync_container }} supprimé. Conservés : données ({{ sync_home }}/data),
      image et sources, sauvegardes, CNAME {{ sync_hostname }}, vhost du proxy
      (il répondra 502 tant que le service est absent : le retirer avec
      `proxy-update` tasks_from remove-one-site, site sync-{{ sync_instance }}.conf,
      ou supprimer le gabarit puis rejouer update-proxy.yml) et les
      entrées `docker_ports_rules` des ports {{ app_port | default('?') }} /
      {{ sync_metrics_port | default('?') }} (playbooks/host_vars/ctdapi.yml,
      sans conséquence tant que rien n'écoute dessus, à nettoyer avant de
      réattribuer ces ports ; si c'est la DERNIÈRE règle du fichier, un flush
      manuel DOCKER-USER est nécessaire — voir la limite connue dans
      docker-ports-security/defaults). Pour supprimer aussi les données :
      purge-sync-server.yml.
