---
# Voir defaults/main.yml, et tasks/keys.yml pour les options de chaque clé
# (`restrict`, `command=` vers la passerelle, `from=` selon
# `readonly_key_from`).

- name: Build the authorized lines of the read-only keys
  ansible.builtin.import_tasks: keys.yml

- name: Install the read-only account
  when: ro_key_lines | length > 0
  block:
    - name: Install the read-only gate
      ansible.builtin.copy:
        src: ro-gate.py
        dest: "{{ readonly_user_gate }}"
        owner: root
        group: root
        mode: "0755"

    - name: Create the read-only account {{ readonly_user_name }}
      ansible.builtin.user:
        name: "{{ readonly_user_name }}"
        shell: /bin/bash
        password_lock: true
        create_home: true

    - name: Allow the gate, and only the gate, through sudo
      ansible.builtin.template:
        src: sudoers.j2
        dest: "/etc/sudoers.d/{{ readonly_user_name }}"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    - name: Authorize the read-only keys of the parc, bound to the gate
      ansible.posix.authorized_key:
        user: "{{ readonly_user_name }}"
        state: present
        exclusive: true
        key: "{{ ro_key_lines | join('\n') }}"

# Le dossier fait foi jusqu'au bout : vidé, il révoque la dernière clé. Le
# compte reste (readonly-user-remove le retire), mais plus rien n'y entre.
# Même chose quand toutes les clés ont été écartées faute d'origine valide.
- name: Revoke every read-only key when the parc declares none
  ansible.builtin.file:
    path: "/home/{{ readonly_user_name }}/.ssh/authorized_keys"
    state: absent
  when: ro_key_lines | length == 0
