---
# Publication automatique des enregistrements DNS sur Cloudflare pour chaque
# entrée de `mail_domains` (A, SPF, DKIM, DMARC).
#
# Sans ces enregistrements, un message émis par le relais est rejeté ou classé
# en spam : le domaine expéditeur ne résout pas, l'IP n'est pas autorisée par
# SPF, et rien n'est signé. Ils étaient jusqu'ici affichés en fin de rôle pour
# être créés à la main — donc en pratique jamais créés.
mailrelay_manage_dns: true

# Nom du serveur (`myhostname`, nom annoncé en HELO, royaume SASL du compte
# relais) : l'attribut `hostname` de l'entrée d'inventaire, c'est-à-dire
# l'identité machine publiée en A. Constat du 24/10/2026 : le rôle composait
# `inventory_hostname`.`domain_name`, juste sur papanglabs (entrée `mail`) par
# coïncidence, mais `mail1.web3c.cc` sur web3c, où l'entrée déclare
# `hostname: mail.web3c.cc`. Un déploiement aurait changé le nom annoncé et le
# royaume SASL, donc invalidé le compte relais en service.
mailrelay_hostname: "{{ hostname | default(inventory_hostname ~ '.' ~ domain_name) }}"

# Le jeton d'API est pris sur l'entrée du domaine (`cloudflare_token`) si elle
# en porte un, sinon sur la variable globale `cloudflare_token`.
#
# Un jeton Cloudflare est lié à UN compte et à un périmètre de zones : deux
# domaines hébergés sur deux comptes distincts ne peuvent pas en partager un.
# Sans cette surcharge, publier le second échouerait en 403 (zone invisible du
# jeton) alors que la configuration paraîtrait correcte.
#
#   mail_domains:
#     - name: "the.tradekong.app"
#       cloudflare_token: "…"        # facultatif — défaut : cloudflare_token

# IP publique annoncée pour le relais (enregistrement A et mécanisme SPF ip4).
mailrelay_public_ip: "{{ ansible_host }}"

# IP(s) d'un relais précédent encore autorisées par SPF PENDANT une bascule : le
# temps que l'ancien relais ait fini d'émettre, on les garde en `ip4:` à côté de
# l'IP courante. Vide en régime établi, à retirer une fois l'ancien éteint —
# sinon SPF continue d'autoriser une machine qui n'envoie plus rien.
#   mailrelay_spf_extra_ip4: ["<ip-ancien-relais>"]
mailrelay_spf_extra_ip4: []

# Bascule vers un nouveau relais : la clé DKIM est GÉNÉRÉE sur chaque machine,
# donc le nouveau relais publierait une autre clé `mail._domainkey` et les
# messages déjà signés par l'ancienne deviendraient invalides. Copier AVANT le
# déploiement la clé privée de l'ancien relais vers le nouveau
# (`/etc/opendkim/keys/<domaine>/mail.private` et `mail.txt`, propriétaire
# `opendkim`, mode 0600) : `opendkim-genkey` est alors sauté (`creates:`) et la
# clé publiée ne change pas.

# Sélecteur DKIM — doit correspondre au nom de clé généré par ce rôle (mail.txt).
mailrelay_dkim_selector: mail

# `-all` rejette tout émetteur non listé ; `~all` (softfail) est plus permissif
# le temps d'une mise en route.
mailrelay_spf_qualifier: "-all"

# Politique DMARC : `none` observe sans rejeter — à durcir en quarantine/reject
# une fois SPF et DKIM confirmés alignés. Surchargeable par domaine via la clé
# `dmarc_policy` d'une entrée de `mail_domains` : le défaut reste permissif pour
# qu'un nouveau domaine ne parte jamais en rejet avant d'avoir été observé.
mailrelay_dmarc_policy: none

# Destinataire des rapports agrégés (tag `rua`), à défaut de clé `dmarc_rua`
# dans l'entrée de `mail_domains`. `reply_address` était utilisé faute de mieux
# et reste le repli, mais c'est un mauvais défaut : c'est une adresse de contact
# humaine, alors que le flux est quotidien, automatique et illisible sans outil.
#
# Contrainte à respecter en choisissant l'adresse : si son domaine n'est ni
# identique ni parent du domaine rapporté (dmarc@gmail.com pour the.web3c.cc),
# c'est une « destination externe » au sens RFC 7489 §7.1. Le domaine
# destinataire doit alors publier `<domaine-rapporté>._report._dmarc.<son-nom>`
# pour donner son accord — ce que gmail.com ne fera jamais. Sans cet
# enregistrement, les receveurs conformes n'envoient tout simplement rien, sans
# la moindre erreur visible : on croit superviser, et aucun rapport n'arrive.
mailrelay_dmarc_rua: ""

# Domaines organisationnels sur lesquels publier un enregistrement DMARC
# d'observation, en plus des sous-domaines de `mail_domains`.
#
# `mail_domains` ne contient que des sous-domaines techniques de relais
# (mail.papanglabs.com). Protéger ceux-là seuls ne sert à rien : personne
# n'usurpe un sous-domaine de relais, on usurpe le domaine racine, celui qui
# porte les adresses humaines. Sans `_dmarc.papanglabs.com`, ce domaine-là n'a
# aucune politique et aucun rapport.
#
# Chaque entrée : `name`, `policy` (défaut `none`) et `rua`. Laisser `none` tant
# que les rapports n'ont pas prouvé que TOUS les émetteurs légitimes du domaine
# (Mailjet, Cloudflare Email Routing…) sont alignés en SPF ou DKIM — durcir à
# l'aveugle sur un domaine racine coupe le courrier légitime.
mailrelay_dmarc_org_domains: []

# Supprime un CNAME préexistant portant le même nom qu'un domaine de
# `mail_domains` avant de publier son enregistrement A. Cloudflare refuse la
# coexistence des deux (erreur 81054), donc sans cela un CNAME hérité d'un
# ancien nommage bloque la publication de façon permanente.
mailrelay_dns_replace_conflicting: true

# Lien identifiant SASL -> adresse(s) expéditrice(s) (OPTIONNEL, vide = comportement
# historique inchangé : tout compte authentifié peut émettre sous n'importe quelle
# adresse, ce qui est le cas du compte `relay_user` partagé).
#
# Chaque entrée LIE un identifiant à ses seules adresses d'enveloppe (MAIL FROM) :
# sur 465 et 587, ce compte ne peut plus émettre sous une autre adresse (« 553 5.7.1
# Sender address rejected: not owned by user »). Les comptes NON listés (dont
# `relay_user`) ne sont pas touchés : le contrôle ne vise que les identifiants listés.
# Rendu : /etc/postfix/sender_login_maps (adresse -> identifiant, `smtpd_sender_login_maps`
# en texthash) et /etc/postfix/sasl_bound_logins (identifiants liés, aiguillés par
# `check_sasl_access` vers `reject_sender_login_mismatch`), /etc/postfix/bound_null_sender
# (l'expéditeur nul `<>`, que cette restriction laisse passer, est refusé aux seuls identifiants
# liés) et /etc/postfix/sender_bindings.json (lu par mailfilter.py, qui refuse un `From:` qui
# n'appartient pas à l'identifiant listé). Aucun mot de passe ici.
#
# `login` : nom SASL sans royaume (le royaume `mailrelay_hostname` est ajouté, comme
# Postfix le fait avec `smtpd_sasl_local_domain`) ou déjà qualifié `nom@royaume`.
# `senders` : adresse ou liste d'adresses COMPLÈTES, d'un domaine de `mail_domains`
# (les autres ne sont pas signées DKIM). Pas de `@domaine` : une liaison ne doit pas
# rouvrir tout le domaine. Le compte SASL lui-même se crée à la main (mot de passe
# saisi par le propriétaire) — voir docs/avant-ouverture-public.md.
#   mailrelay_sender_bindings:
#     - login: gateway
#       senders: ["approvals@the.example.com"]
mailrelay_sender_bindings: []

# Répertoire de configuration de Postfix (surchargé seulement par les tests hors machine).
mailrelay_postfix_dir: /etc/postfix

# Comptes SASL dédiés (OPTIONNEL, vide = comportement historique inchangé : seul `relay_user` existe).
#
# Chaque entrée crée, dans la base Cyrus sasldb du relais (royaume = `mailrelay_hostname`), un compte
# qui n'est PAS `relay_user` — typiquement celui d'une application qui n'envoie que sous UNE adresse,
# liée par `mailrelay_sender_bindings` (même `login`). Le compte et sa liaison se déclarent donc côte à
# côte ; `mailrelay_sasl_require_binding: true` en fait une obligation.
#
#   mailrelay_sasl_accounts:
#     - login: gateway                       # minuscules, sans royaume (« nom », pas « nom@royaume »)
#       password: "{{ vault_gateway_smtp }}" # variable de coffre — jamais en clair dans un fichier suivi
#
# Garanties :
#   - le mot de passe voyage sur l'ENTRÉE STANDARD de `saslpasswd2 -c -p -f <base> -u <royaume> <login>` :
#     jamais en argument (visible dans `ps`), jamais dans un fichier du rôle ; toutes les tâches qui le
#     touchent sont en `no_log` ;
#   - IDEMPOTENT : un compte déjà présent dans la base (`sasldblistusers2`) n'est PAS réécrit à chaque
#     passage — on ne peut pas relire un mot de passe sasldb, donc on ne sait pas s'il a changé. Changer
#     la valeur du coffre ne change donc RIEN sur le relais tant que la rotation n'est pas demandée ;
#   - ROTATION explicite : `-e mailrelay_sasl_reset_login=<login>` réécrit le mot de passe de CE compte
#     (qui doit être déclaré ici), sur ce passage seulement. Le compte n'est pas supprimé puis recréé :
#     pas de fenêtre où il n'existe pas ;
#   - un mot de passe absent, vide, plus court que `mailrelay_sasl_min_password_length` ou contenant un
#     saut de ligne est refusé AVANT toute écriture (le message nomme les identifiants, jamais la valeur) ;
#   - un compte déclaré n'est jamais retiré en le supprimant d'ici : `saslpasswd2 -d -u <royaume> <login>`
#     à la main (un retrait automatique couperait un client en service sur une simple faute de frappe).
#
# Le fichier sasldb garde son propriétaire et son mode (root:sasl 0640, voir tâche « Set sasldb2
# permissions » de main.yml, jouée APRÈS la création) : postfix y accède par le groupe `sasl`.
# Les mots de passe y sont stockés EN CLAIR (propre à sasldb et aux mécanismes PLAIN/LOGIN) : c'est
# le fichier à protéger, et la raison de lier chaque compte à une seule adresse expéditrice.
mailrelay_sasl_accounts: []

# Identifiant dont on réécrit le mot de passe sur ce passage (rotation). Vide = aucune.
# À passer en ligne de commande (`-e`), pas ici.
mailrelay_sasl_reset_login: ""

# Longueur minimale d'un mot de passe de `mailrelay_sasl_accounts`.
mailrelay_sasl_min_password_length: 20

# true : tout compte de `mailrelay_sasl_accounts` doit apparaître dans `mailrelay_sender_bindings`
# (sinon il pourrait émettre sous n'importe quelle adresse des domaines du relais, comme `relay_user`).
mailrelay_sasl_require_binding: false

# Base sasldb (mêmes valeur et chemin que `sasldb_path` de sasl-smtpd.conf.j2) ; surchargé
# seulement par les tests hors machine.
mailrelay_sasldb_path: /etc/sasldb2
