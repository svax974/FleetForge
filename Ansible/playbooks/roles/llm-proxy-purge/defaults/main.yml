---
# Dupliqués depuis llm-proxy-remove/defaults plutôt que hérités via
# `include_role` (qui exigerait `public: true` pour les exposer ici) : ce
# rôle a besoin de ces variables dans SES PROPRES tâches (volumes, CNAME), pas
# seulement dans celles de llm-proxy-remove qu'il inclut (motif agenthub-purge).
llm_proxy_src: "/Users/steph/Dev/Apps/llm-proxy/"
llm_proxy_hostname: "llm-proxy.{{ domain_name }}"
llm_proxy_front_port: "{{ hostvars['llm-proxy'].app_port | default(4800) }}"
llm_proxy_back_port: "{{ hostvars['llm-proxy'].back_port | default(4801) }}"
