---
- name: Fail early without an API token
  ansible.builtin.assert:
    that:
      - cfopull_token | length > 0
    fail_msg: >-
      `cloudflare_token` est vide. Le jeton du parc doit porter « Zone → SSL and
      Certificates → Edit » en plus de « Edit zone DNS », limité à la zone
      {{ cfopull_zone }} (My Profile → API Tokens).
    success_msg: "Jeton présent, zone {{ cfopull_zone }}."
  delegate_to: localhost
  become: false

# ── Autorité + certificat client, générés UNE fois sur le poste de contrôle ──
# `creates:` rend chaque étape idempotente : relancer le playbook ne régénère
# rien. Pour renouveler, supprimer le répertoire puis rejouer — l'ancien
# certificat reste actif chez Cloudflare jusqu'à ce que le nouveau le remplace
# (tâche d'envoi plus bas), et nginx ne reçoit que la nouvelle autorité : faire
# suivre immédiatement le déploiement du côté nginx.
- name: Create the key directory
  ansible.builtin.file:
    path: "{{ cfopull_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate the CA
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -nodes
      - -sha256
      - -days
      - "{{ cfopull_valid_days }}"
      - -subj
      - "{{ cfopull_subject_ca }}"
      - -keyout
      - "{{ cfopull_dir }}/ca.key"
      - -out
      - "{{ cfopull_dir }}/ca.pem"
    creates: "{{ cfopull_dir }}/ca.pem"
  delegate_to: localhost
  become: false

- name: Generate the client key and signing request
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -newkey
      - rsa:2048
      - -nodes
      - -sha256
      - -subj
      - "{{ cfopull_subject_client }}"
      - -keyout
      - "{{ cfopull_dir }}/client.key"
      - -out
      - "{{ cfopull_dir }}/client.csr"
    creates: "{{ cfopull_dir }}/client.csr"
  delegate_to: localhost
  become: false

- name: Write the client certificate extensions
  ansible.builtin.copy:
    dest: "{{ cfopull_dir }}/client.ext"
    mode: "0600"
    content: |
      basicConstraints=CA:FALSE
      keyUsage=digitalSignature
      extendedKeyUsage=clientAuth
  delegate_to: localhost
  become: false

- name: Sign the client certificate with the CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -sha256
      - -days
      - "{{ cfopull_valid_days }}"
      - -in
      - "{{ cfopull_dir }}/client.csr"
      - -CA
      - "{{ cfopull_dir }}/ca.pem"
      - -CAkey
      - "{{ cfopull_dir }}/ca.key"
      - -CAcreateserial
      - -extfile
      - "{{ cfopull_dir }}/client.ext"
      - -out
      - "{{ cfopull_dir }}/client.pem"
    creates: "{{ cfopull_dir }}/client.pem"
  delegate_to: localhost
  become: false

- name: Restrict the private keys
  ansible.builtin.file:
    path: "{{ cfopull_dir }}/{{ item }}"
    mode: "0600"
  loop: [ca.key, client.key]
  delegate_to: localhost
  become: false

# ── Cloudflare ─────────────────────────────────────────────────────────────
- name: Look up the zone
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones?name={{ cfopull_zone }}"
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
  register: cfopull_zone_lookup
  no_log: true
  changed_when: false
  delegate_to: localhost
  become: false

- name: Fail when the zone is not found
  ansible.builtin.assert:
    that: cfopull_zone_lookup.json.result | length > 0
    fail_msg: "Zone {{ cfopull_zone }} introuvable avec ce jeton."
  delegate_to: localhost
  become: false

- name: Set the zone identifier
  ansible.builtin.set_fact:
    cfopull_zone_id: "{{ cfopull_zone_lookup.json.result[0].id }}"
  delegate_to: localhost
  become: false

- name: Read the client certificate
  ansible.builtin.slurp:
    src: "{{ cfopull_dir }}/client.pem"
  register: cfopull_client_cert
  delegate_to: localhost
  become: false

# Authenticated Origin Pulls PER HOSTNAME (only the -back names of the cloudflare_front entries): the certificate lives in
# the per-hostname store (`origin_tls_client_auth/hostnames/certificates`), NOT the zone-level one (`origin_tls_client_auth`),
# whose certificates the hostname binding below does not know (fixed 2026-10-30). Every call accepts the error statuses so
# that Cloudflare's own `errors` (code + message, never the token) are shown: the uri module's error is hidden by no_log.
- name: List the client certificates already uploaded for hostnames
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones/{{ cfopull_zone_id }}/origin_tls_client_auth/hostnames/certificates"
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    status_code: [200, 400, 401, 403, 404]
  register: cfopull_uploaded
  no_log: true
  changed_when: false
  delegate_to: localhost
  become: false

- name: Fail clearly when Cloudflare refuses the listing
  ansible.builtin.assert:
    that: cfopull_uploaded.status == 200
    fail_msg: >-
      Cloudflare refuse le listage des certificats par nom d'hôte (HTTP {{ cfopull_uploaded.status }}) :
      {{ (cfopull_uploaded.json | default({})).errors | default([]) | to_json }}.
      Permission attendue sur le jeton cloudflare_token : « Zone → SSL and Certificates → Edit » sur {{ cfopull_zone }}.
      Rien n'a encore été changé chez Cloudflare ni sur les proxies (le vhost ne se pose qu'après cette étape).
  delegate_to: localhost
  become: false

# Comparaison sur la première ligne de base64 du PEM (la ligne 0 est l'en-tête
# BEGIN, identique pour tous) : Cloudflare renvoie le certificat avec ses propres
# retours à la ligne, une égalité stricte du bloc ne tiendrait pas.
- name: Find the certificate that matches ours
  ansible.builtin.set_fact:
    cfopull_pem_marker: "{{ (cfopull_client_cert.content | b64decode | trim).split('\n')[1] }}"
  delegate_to: localhost
  become: false

- name: Keep the identifier of the matching uploaded certificate
  ansible.builtin.set_fact:
    cfopull_cert_id: >-
      {{ cfopull_uploaded.json.result | default([], true)
         | selectattr('certificate', 'defined')
         | selectattr('certificate', 'search', cfopull_pem_marker | regex_escape)
         | map(attribute='id') | list | first | default('') }}
  delegate_to: localhost
  become: false

- name: Upload the client certificate for hostnames
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones/{{ cfopull_zone_id }}/origin_tls_client_auth/hostnames/certificates"
    method: POST
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    body_format: json
    body:
      certificate: "{{ cfopull_client_cert.content | b64decode }}"
      private_key: "{{ lookup('ansible.builtin.file', cfopull_dir ~ '/client.key') }}"
      bundle_method: ubiquitous
    status_code: [200, 201, 202, 400, 401, 403, 404, 409]
  register: cfopull_upload
  no_log: true
  changed_when: cfopull_upload.status in [200, 201, 202]
  delegate_to: localhost
  become: false
  when: cfopull_cert_id | length == 0

- name: Fail clearly when Cloudflare refuses the upload
  ansible.builtin.assert:
    that: cfopull_upload.status in [200, 201, 202]
    fail_msg: >-
      Cloudflare refuse le certificat (HTTP {{ cfopull_upload.status }}) :
      {{ (cfopull_upload.json | default({})).errors | default([]) | to_json }}.
      Rien n'est rattaché aux noms d'hôte ni posé sur les proxies.
  delegate_to: localhost
  become: false
  when: cfopull_cert_id | length == 0

- name: Keep the identifier of the uploaded certificate
  ansible.builtin.set_fact:
    cfopull_cert_id: "{{ cfopull_upload.json.result.id }}"
  delegate_to: localhost
  become: false
  when: cfopull_cert_id | length == 0

# Association nom → certificat : c'est elle qui fait que Cloudflare présente le
# certificat sur ce nom. Le PUT ne porte que les noms de `cfopull_hostnames` ;
# les autres noms de la zone ne sont pas touchés.
- name: Build the hostname bindings
  ansible.builtin.set_fact:
    cfopull_bindings: >-
      {%- set out = [] -%}
      {%- for h in cfopull_hostnames -%}
      {%- set _ = out.append({'hostname': h, 'cert_id': cfopull_cert_id, 'enabled': true}) -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  become: false

- name: Enable Authenticated Origin Pulls on the hostnames
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones/{{ cfopull_zone_id }}/origin_tls_client_auth/hostnames"
    method: PUT
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    body_format: json
    body:
      config: "{{ cfopull_bindings }}"
    status_code: [200, 202, 400, 401, 403, 404]
  register: cfopull_binding
  no_log: true
  changed_when: cfopull_binding.status in [200, 202]
  delegate_to: localhost
  become: false

- name: Fail clearly when Cloudflare refuses the hostname binding
  ansible.builtin.assert:
    that: cfopull_binding.status in [200, 202]
    fail_msg: >-
      Cloudflare refuse le rattachement de {{ cfopull_hostnames | join(', ') }} (HTTP {{ cfopull_binding.status }}) :
      {{ (cfopull_binding.json | default({})).errors | default([]) | to_json }}.
      Le vhost des proxies n'est pas encore posé : la prod est inchangée.
  delegate_to: localhost
  become: false

# Cloudflare accepte l'association (202) puis la déploie en quelques minutes (initializing → pending_deployment → active).
# Le vhost qui exige le certificat ne doit être posé qu'ensuite, sinon les requêtes via Cloudflare échouent le temps du
# déploiement. `ignore_errors` : à court d'essais, Ansible marque l'élément en échec quoi que dise failed_when, et no_log
# en masque le détail ; l'assertion suivante donne alors le statut lisible.
- name: Wait until Cloudflare presents the certificate on every hostname
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones/{{ cfopull_zone_id }}/origin_tls_client_auth/hostnames/{{ item }}"
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    status_code: [200, 400, 401, 403, 404]
  register: cfopull_hostname_status
  until: ((cfopull_hostname_status.json | default({})).result | default({}, true)).status | default('') == 'active'
  retries: 36
  delay: 10
  loop: "{{ cfopull_hostnames }}"
  no_log: true
  changed_when: false
  ignore_errors: true
  delegate_to: localhost
  become: false

- name: Fail clearly when a hostname is not active
  ansible.builtin.assert:
    that: ((item.json | default({})).result | default({}, true)).status | default('') == 'active'
    fail_msg: >-
      {{ item.item }} n'est pas actif chez Cloudflare après 6 minutes (HTTP {{ item.status }},
      statut {{ ((item.json | default({})).result | default({}, true)).status | default('?') }},
      certificat {{ ((item.json | default({})).result | default({}, true)).cert_status | default('?') }}) :
      {{ (item.json | default({})).errors | default([]) | to_json }}. Rejouer plus tard : le vhost n'est pas encore posé.
  loop: "{{ cfopull_hostname_status.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false

- name: Say what is left to do
  ansible.builtin.debug:
    msg: >-
      Cloudflare présente désormais le certificat client de {{ cfopull_zone }} sur
      {{ cfopull_hostnames | join(', ') }}. Reste à déployer l'autorité sur les
      proxies (play suivant) puis le vhost qui la vérifie. Autorité :
      {{ cfopull_dir }}/ca.pem.
  delegate_to: localhost
  become: false
