---
- name: Fail early without an API token
  ansible.builtin.assert:
    that:
      - cfopull_token | length > 0
    fail_msg: >-
      `cloudflare_token` est vide. Le jeton du parc doit porter « Zone → Zone → Read » et « Zone → SSL and
      Certificates → Edit » en plus de « Edit zone DNS », sur CHAQUE zone dont un nom est activé
      ({{ cfopull_hostnames_by_zone.keys() | list | join(', ') }} ; un seul jeton pour toutes : ressources de zone « Toutes les zones »
      ou la liste de ces zones) (My Profile → API Tokens).
    success_msg: "Jeton présent, zones {{ cfopull_hostnames_by_zone.keys() | list | join(', ') }}."
  delegate_to: localhost
  become: false

# `cloudflare_origin_pull` : seules les valeurs `observe` et `enforce` existent (cfopull_aop, defaults), et deux entrées ne se
# contredisent pas sur un même nom. Refusé AVANT tout appel à Cloudflare : une faute de frappe ne doit pas laisser croire qu'un nom
# est protégé (le vhost, lui, refuse aussi de se rendre, mais personne ne l'aurait encore posé).
- name: Fail early on an invalid or contradictory Authenticated Origin Pulls declaration
  ansible.builtin.assert:
    that: cfopull_aop | dict2items | rejectattr('value', 'in', ['observe', 'enforce']) | list | length == 0
    fail_msg: >-
      `cloudflare_origin_pull` invalide ou contradictoire : {{ cfopull_aop | dict2items | rejectattr('value', 'in', ['observe', 'enforce'])
      | map(attribute='key') | map('regex_replace', '[^A-Za-z0-9_.?-]', '#') | list | join(', ') }}. Valeurs admises : `observe`
      (le certificat est vérifié et journalisé, rien n'est refusé) ou `enforce` (une socket Cloudflare sans certificat est refusée) ;
      toutes les entrées qui portent un même nom (`proxy_hostname`, `cloudflare_origin_pull_aliases`) doivent déclarer la même.
      Rien n'a été changé chez Cloudflare ni sur les proxies.
    quiet: true
  delegate_to: localhost
  become: false
  run_once: true

# Chaque nom doit appartenir à une zone du parc (`cfopull_zones` : zone principale + `domains`, suffixe le plus long). Refusé AVANT tout appel
# à Cloudflare et toute génération : activer un nom sous une zone qui ne le contient pas ne peut que échouer chez Cloudflare, ou (pire)
# réussir sur la mauvaise zone si le même nom y existe.
- name: Fail early on a hostname that belongs to no zone of the parc
  ansible.builtin.assert:
    that: cfopull_unzoned_hostnames | length == 0
    fail_msg: >-
      Nom(s) d'hôte hors de toute zone du parc : {{ cfopull_unzoned_hostnames | map('regex_replace', '[^A-Za-z0-9_.?-]', '#') | list | join(', ') }}.
      Zones connues : {{ cfopull_zones | join(', ') }} (zone principale `cfopull_zone` = `domain_name`, puis `domains` du parc ; un nom est
      rattaché à la plus longue zone dont il est le sommet ou un sous-domaine). Ajouter la zone à `domains` (group_vars du parc) ou
      corriger le nom. Rien n'a été changé chez Cloudflare ni sur les proxies.
    quiet: true
  delegate_to: localhost
  become: false
  run_once: true

# ── Autorité + certificat client, générés UNE fois sur le poste de contrôle ──
# `creates:` rend chaque étape idempotente : relancer le playbook ne régénère
# rien. Pour renouveler, supprimer le répertoire puis rejouer — l'ancien
# certificat reste actif chez Cloudflare jusqu'à ce que le nouveau le remplace
# (tâche d'envoi plus bas), et nginx ne reçoit que la nouvelle autorité : faire
# suivre immédiatement le déploiement du côté nginx.
- name: Create the key directory
  ansible.builtin.file:
    path: "{{ cfopull_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate the CA
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -nodes
      - -sha256
      - -days
      - "{{ cfopull_valid_days }}"
      - -subj
      - "{{ cfopull_subject_ca }}"
      - -keyout
      - "{{ cfopull_dir }}/ca.key"
      - -out
      - "{{ cfopull_dir }}/ca.pem"
    creates: "{{ cfopull_dir }}/ca.pem"
  delegate_to: localhost
  become: false

- name: Generate the client key and signing request
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -newkey
      - rsa:2048
      - -nodes
      - -sha256
      - -subj
      - "{{ cfopull_subject_client }}"
      - -keyout
      - "{{ cfopull_dir }}/client.key"
      - -out
      - "{{ cfopull_dir }}/client.csr"
    creates: "{{ cfopull_dir }}/client.csr"
  delegate_to: localhost
  become: false

- name: Write the client certificate extensions
  ansible.builtin.copy:
    dest: "{{ cfopull_dir }}/client.ext"
    mode: "0600"
    content: |
      basicConstraints=CA:FALSE
      keyUsage=digitalSignature
      extendedKeyUsage=clientAuth
  delegate_to: localhost
  become: false

- name: Sign the client certificate with the CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -sha256
      - -days
      - "{{ cfopull_valid_days }}"
      - -in
      - "{{ cfopull_dir }}/client.csr"
      - -CA
      - "{{ cfopull_dir }}/ca.pem"
      - -CAkey
      - "{{ cfopull_dir }}/ca.key"
      - -CAcreateserial
      - -extfile
      - "{{ cfopull_dir }}/client.ext"
      - -out
      - "{{ cfopull_dir }}/client.pem"
    creates: "{{ cfopull_dir }}/client.pem"
  delegate_to: localhost
  become: false

- name: Restrict the private keys
  ansible.builtin.file:
    path: "{{ cfopull_dir }}/{{ item }}"
    mode: "0600"
  loop: [ca.key, client.key]
  delegate_to: localhost
  become: false

# ── Cloudflare, ZONE PAR ZONE ──────────────────────────────────────────────
# Un seul jeton (`cfopull_token`) pour toutes les zones, UNE autorité et UN certificat client (envoyé à chaque zone qui porte au moins un
# nom). Les zones sans nom ne sont jamais appelées. Deux passes, la première en LECTURE SEULE : (1) chaque zone est trouvée avec ce jeton
# et, avec PLUSIEURS zones, la liste de ses certificats par nom d'hôte est lisible (permissions « Zone → Zone → Read » et « Zone → SSL and Certificates » : une
# zone introuvable ou refusée arrête tout AVANT la moindre écriture, avec la zone et la permission nommées) ; (2) activation, attente,
# mode TLS et témoin, zone après zone (tasks/zone.yml).
- name: Read the client certificate
  ansible.builtin.slurp:
    src: "{{ cfopull_dir }}/client.pem"
  register: cfopull_client_cert
  delegate_to: localhost
  become: false

- name: Check every zone with the token before writing anything
  ansible.builtin.include_tasks: zone-check.yml
  loop: "{{ cfopull_hostnames_by_zone | dict2items }}"
  loop_control:
    loop_var: cfopull_zone_item
    label: "{{ cfopull_zone_item.key }}"
  vars:
    cfopull_zone_name: "{{ cfopull_zone_item.key }}"

- name: Activate the certificate on the hostnames of each zone
  ansible.builtin.include_tasks: zone.yml
  loop: "{{ cfopull_hostnames_by_zone | dict2items }}"
  loop_control:
    loop_var: cfopull_zone_item
    label: "{{ cfopull_zone_item.key }}"
  vars:
    cfopull_zone_name: "{{ cfopull_zone_item.key }}"
    cfopull_zone_hostnames: "{{ cfopull_zone_item.value }}"
    cfopull_zone_id: "{{ cfopull_zone_ids[cfopull_zone_item.key] }}"
