---
# Authenticated Origin Pulls PAR ZONE avec un certificat client PROPRE au parc.
#
# Pourquoi pas le certificat d'origine par défaut de Cloudflare : il est
# commun à TOUS les clients Cloudflare — quiconque ouvre un compte gratuit et
# pointe un domaine vers un proxy le présente aussi. Une autorité à nous, dont
# Cloudflare détient le certificat client, ne laisse passer que NOTRE zone.
#
# Deux temps, deux plays dans deploy-cloudflare-origin-pull.yml :
#   cloudflare.yml  (localhost)  autorité + certificat client, puis, ZONE PAR ZONE (`cfopull_hostnames_by_zone` : zone principale
#                                + `domains`, un seul jeton) : zone-check.yml (lecture seule, toutes les zones d'abord) et zone.yml
#                                (envoi à Cloudflare, activation sur les noms de `cfopull_hostnames` de la zone, mode TLS, témoin)
#   nginx.yml       (proxies)    dépôt de l'autorité que nginx vérifie
#
# Rien ici ne FERME un vhost : `_cloudflare_front.inc` pose `ssl_verify_client
# optional` pour toute entrée `cloudflare_front: true` ou `cloudflare_named: true`, et
# `_access.inc` exige le certificat dans les locations en mode public de ces entrées.
# `nginx.yml` est aussi inclus par proxy-update (main, deploy-one-site, deploy-webapp-site)
# avant tout gabarit. Aucune de ces entrées : aucun nom à activer, Cloudflare n'est
# pas appelé (le jeton n'a alors pas besoin de la permission SSL).
# En mode `--check` les appels à l'API Cloudflare (`uri`) sont sautés : leurs résultats n'ont pas de `json`, et les
# `assert` qui les lisent échouaient (« object of type 'dict' has no attribute 'json' »). Le côté Cloudflare n'est donc
# pas simulé : il crée un certificat, l'envoie et l'active, ce qu'aucune simulation ne peut prouver.
- name: Say that the Cloudflare side is not simulated
  ansible.builtin.debug:
    msg: >-
      Côté Cloudflare non simulé en --check (certificat client, activation sur {{ cfopull_hostnames | join(', ') }}) :
      rien n'est lu ni écrit chez Cloudflare.
  when:
    - cfopull_part | default('cloudflare') == 'cloudflare'
    - cfopull_hostnames | length > 0
    - ansible_check_mode

- name: Run the Cloudflare side
  ansible.builtin.include_tasks: cloudflare.yml
  when:
    - cfopull_part | default('cloudflare') == 'cloudflare'
    - cfopull_hostnames | length > 0
    - not ansible_check_mode

- name: Run the nginx side
  ansible.builtin.include_tasks: nginx.yml
  when: cfopull_part | default('cloudflare') == 'nginx'
