#
# Première passe de cloudflare.yml, en LECTURE SEULE, pour UNE zone (`cfopull_zone_name`) : elle est trouvée avec le jeton, son
# identifiant est retenu (`cfopull_zone_ids`) et, quand le parc a PLUSIEURS zones, la liste de ses certificats par nom d'hôte est lisible. Toute zone refusée arrête
# le déploiement ICI, avant la première écriture sur n'importe quelle zone : pas de zone activée « à moitié ».
- name: Look up the zone
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones?name={{ cfopull_zone_name }}"
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    status_code: [200, 400, 401, 403, 404]
  register: cfopull_zone_lookup
  no_log: true
  changed_when: false
  delegate_to: localhost
  become: false

# Cloudflare répond 200 et une liste VIDE pour une zone que le jeton ne couvre pas (ressources de zone du jeton), et une erreur HTTP
# pour une permission « Zone → Zone → Read » absente. Le nom retourné doit être celui demandé : jamais l'identifiant d'une autre zone.
- name: Fail clearly when the zone is not found or not permitted for this token
  ansible.builtin.assert:
    that: >-
      cfopull_zone_lookup.status == 200
      and ((cfopull_zone_lookup.json | default({})).result | default([], true) | length) > 0
      and ((cfopull_zone_lookup.json.result[0].name | default('')) | lower) == (cfopull_zone_name | lower)
    fail_msg: >-
      Zone {{ cfopull_zone_name }} introuvable ou non autorisée avec le jeton `cloudflare_token` (HTTP {{ cfopull_zone_lookup.status }},
      {{ ((cfopull_zone_lookup.json | default({})).result | default([], true) | length) }} zone(s) trouvée(s)) :
      {{ (cfopull_zone_lookup.json | default({})).errors | default([]) | to_json }}. Permissions attendues sur le jeton :
      « Zone → Zone → Read » et « Zone → SSL and Certificates → Edit » sur {{ cfopull_zone_name }} (ressources de zone du jeton :
      « Toutes les zones », ou une liste qui contient {{ cfopull_zone_name }}) ; la zone doit exister dans CE compte Cloudflare.
      Rien n'a été changé chez Cloudflare ni sur les proxies (aucune zone n'est activée tant que toutes ne sont pas lisibles).
  delegate_to: localhost
  become: false

- name: Remember the identifier of the zone
  ansible.builtin.set_fact:
    cfopull_zone_ids: "{{ cfopull_zone_ids | default({}) | combine({cfopull_zone_name: cfopull_zone_lookup.json.result[0].id}) }}"
  delegate_to: localhost
  become: false

# Seulement avec PLUSIEURS zones : la lecture des certificats de la zone est refaite par zone.yml, et un parc à une seule zone n'a aucune
# écriture partielle à craindre (échec du premier appel = rien d'écrit). Même trafic Cloudflare qu'avant sur une seule zone.
- name: Read the client certificates uploaded for hostnames in the zone
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones/{{ cfopull_zone_ids[cfopull_zone_name] }}/origin_tls_client_auth/hostnames/certificates"
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    status_code: [200, 400, 401, 403, 404]
  register: cfopull_zone_readable
  no_log: true
  changed_when: false
  delegate_to: localhost
  become: false
  when: cfopull_hostnames_by_zone | length > 1

- name: Fail clearly when the zone refuses the listing of its client certificates
  ansible.builtin.assert:
    that: cfopull_zone_readable.status == 200
    fail_msg: >-
      Cloudflare refuse le listage des certificats par nom d'hôte de la zone {{ cfopull_zone_name }} (HTTP {{ cfopull_zone_readable.status }}) :
      {{ (cfopull_zone_readable.json | default({})).errors | default([]) | to_json }}.
      Permission attendue sur le jeton cloudflare_token : « Zone → SSL and Certificates → Edit » sur {{ cfopull_zone_name }}.
      Rien n'a été changé chez Cloudflare ni sur les proxies (aucune zone n'est activée tant que toutes ne sont pas lisibles).
  delegate_to: localhost
  become: false
  when: cfopull_hostnames_by_zone | length > 1

# Mode TLS de la zone : « Full (strict) » (Cloudflare → origine en HTTPS, certificat vérifié). Un autre mode (Flexible : HTTP
# vers le port 80, qui redirige vers https = boucle) casserait un nom proxifié. LECTURE seule ici (la première passe n'écrit rien) ;
# `strict` est POSÉ par zone.yml, avant tout envoi de certificat, pour toute zone qui porte un nom qui l'exige
# (`cfopull_enforce_tls_strict`, vrai par défaut ; `false` rétablit le refus ci-dessous). Aucune valeur secrète ici.
- name: Read the TLS mode of the zone
  ansible.builtin.uri:
    url: "{{ cfopull_api }}/zones/{{ cfopull_zone_ids[cfopull_zone_name] }}/settings/ssl"
    headers:
      Authorization: "Bearer {{ cfopull_token }}"
    status_code: [200, 400, 401, 403, 404]
  register: cfopull_tls
  no_log: true
  changed_when: false
  delegate_to: localhost
  become: false

- name: Remember the TLS mode of the zone
  ansible.builtin.set_fact:
    cfopull_tls_by_zone: "{{ cfopull_tls_by_zone | default({}) | combine({cfopull_zone_name: {'status': cfopull_tls.status, 'json': (cfopull_tls.json | default({}))}}) }}"
  delegate_to: localhost
  become: false

- name: Report the TLS mode of the zone
  ansible.builtin.debug:
    # Dit ce qui est LU, puis ce qui va être FAIT — jamais le souhait à la place de l'observation.
    msg: >-
      {%- set _mode = ((cfopull_tls.json.result.value | default('illisible')) if cfopull_tls.status == 200
                       else 'illisible (HTTP ' ~ cfopull_tls.status ~ ', jeton sans « Zone Settings : Read »)') -%}
      {%- set _demanded = ((cfopull_strict_entries | default({})).get(cfopull_zone_name, 0) | int > 0) -%}
      {%- set _will_set = (cfopull_enforce_tls_strict | bool) and _demanded -%}
      {%- if _mode == 'strict' -%}
      Mode TLS de {{ cfopull_zone_name }} : strict (lu).
      {%- elif _will_set -%}
      Mode TLS de {{ cfopull_zone_name }} : « {{ _mode }} » — « Full (strict) » est EXIGÉ par un nom de cette zone : ce passage
      le POSE pour TOUTE la zone (jeton « Zone Settings : Edit »), avant tout envoi de certificat.
      {%- elif (cfopull_enforce_tls_strict | bool) -%}
      Mode TLS de {{ cfopull_zone_name }} : « {{ _mode }} » — aucun nom de cette zone n'exige « Full (strict) » : rien n'est posé.
      {%- else -%}
      ATTENTION — mode TLS de {{ cfopull_zone_name }} : « {{ _mode }} » — « Full (strict) » est exigé pour les noms proxifiés, et
      ce passage ne le pose pas (`cfopull_enforce_tls_strict: false`).
      {%- endif -%}
  delegate_to: localhost
  become: false

# Un nom `cloudflare_named` porte `/mcp` et OAuth : en « Full » (non strict) Cloudflare joint l'origine en HTTPS SANS vérifier son
# certificat, donc le segment Cloudflare → origine n'est pas authentifié (un tiers sur le chemin se fait passer pour l'origine). Mode
# lisible et non strict : BLOQUANT. Mode illisible (jeton sans « Zone Settings : Read ») : BLOQUANT aussi, tâche suivante.
# `cfopull_allow_non_strict_tls` : échappatoire explicite (décision du propriétaire, faux par défaut ; `true` pour toutes les zones, une liste
# de zones pour celles-ci seulement). Le refus et l'échappatoire s'appliquent ZONE PAR ZONE (`cfopull_strict_entries`). Pas pour `cloudflare_front`
# seul : l'avertissement d'avant, inchangé.
# Jamais en `--check` : tout le côté Cloudflare y est sauté (tasks/main.yml), ses résultats
# n'ont ni `status` ni `json`. MÊME exigence pour un nom `cloudflare_origin_pull` (observe comme enforce : la décision du propriétaire est
# « zone en strict » pour les API publiques papanglabs) : il compte dans `cfopull_strict_entries` de SA zone, et ces refus sont rendus ICI, en lecture seule, AVANT toute écriture sur n'importe quelle zone : une zone refusée ne laisse aucune zone
# activée à moitié, ni aucun témoin (sauf échappatoire explicite).
- name: Refuse a Cloudflare-served name while the TLS mode of the zone is readable and not strict
  vars:
    _named_entries: "{{ cfopull_strict_entries.get(cfopull_zone_name, 0) }}"
    _zone_escape: >-
      {%- set allowed = cfopull_allow_non_strict_tls | default(false) -%}
      {%- if allowed is sequence and allowed is not string and allowed is not mapping -%}
      {{ cfopull_zone_name in allowed }}
      {%- else -%}
      {{ allowed is sameas true or (allowed is string and (allowed | lower) == 'true') }}
      {%- endif -%}
  ansible.builtin.assert:
    that: false
    fail_msg: >-
      Mode TLS de {{ cfopull_zone_name }} : « {{ cfopull_tls.json.result.value | default('?') }} » — « Full (strict) » est EXIGÉ pour un nom
      `cloudflare_named` ou `cloudflare_origin_pull` : sans lui Cloudflare ne vérifie pas le certificat de l'origine (segment Cloudflare → proxy
      non authentifié). Ce passage le POSE normalement tout seul (`cfopull_enforce_tls_strict` vaut `true` par défaut : `strict` pour TOUTE la
      zone, jeton « Zone Settings : Edit ») ; s'il ne l'a pas fait, c'est que l'opt-out `-e cfopull_enforce_tls_strict=false` a été demandé.
      Rejouer sans cet opt-out, ou poser le mode à la main (SSL/TLS → Overview → Full (strict)).
      Échappatoire explicite, à assumer : `-e cfopull_allow_non_strict_tls=true` (toutes les zones) ou
      `-e '{"cfopull_allow_non_strict_tls": ["{{ cfopull_zone_name }}"]}'` (cette zone seulement).
      Rien n'a été changé chez Cloudflare ni sur les proxies (aucune zone n'est activée tant que toutes ne sont pas lisibles et acceptées).
    quiet: true
  delegate_to: localhost
  become: false
  when:
    - not ansible_check_mode
    - (_named_entries | int) > 0
    - not (cfopull_enforce_tls_strict | bool)
    - cfopull_tls.status | default(0) == 200
    - (cfopull_tls.json.result.value | default('')) != 'strict'
    - not (_zone_escape | bool)

# Mode ILLISIBLE (jeton sans « Zone → Zone Settings → Read », HTTP 401/403/404) : même refus pour un nom `cloudflare_named`. Ne pas
# pouvoir lire le mode n'est pas la preuve qu'il est `strict` : le déploiement ne doit pas poser un vhost OAuth/MCP public sur une
# hypothèse. Mêmes règles que le refus ci-dessus (échappatoire `cfopull_allow_non_strict_tls`, jamais en `--check`, jamais de lecture
# du `.json` d'une tâche sautée : `cfopull_tls.status` est lu seulement quand le mode n'est pas posé par ce déploiement). `cloudflare_front`
# seul : l'avertissement d'avant, octet pour octet.
- name: Refuse a Cloudflare-served name while the TLS mode of the zone cannot be read
  vars:
    _named_entries: "{{ cfopull_strict_entries.get(cfopull_zone_name, 0) }}"
    _zone_escape: >-
      {%- set allowed = cfopull_allow_non_strict_tls | default(false) -%}
      {%- if allowed is sequence and allowed is not string and allowed is not mapping -%}
      {{ cfopull_zone_name in allowed }}
      {%- else -%}
      {{ allowed is sameas true or (allowed is string and (allowed | lower) == 'true') }}
      {%- endif -%}
  ansible.builtin.assert:
    that: false
    fail_msg: >-
      Mode TLS de {{ cfopull_zone_name }} ILLISIBLE (HTTP {{ cfopull_tls.status | default('?') }}) : le jeton `cloudflare_token` n'a pas la
      permission « Zone → Zone Settings → Read/Edit » sur {{ cfopull_zone_name }}. « Full (strict) » est EXIGÉ pour un nom `cloudflare_named` et
      ne peut pas être vérifié. Ce passage le pose normalement tout seul (`cfopull_enforce_tls_strict` vaut `true` par défaut) ; s'il ne
      l'a pas fait, c'est que l'opt-out `-e cfopull_enforce_tls_strict=false` a été demandé. Deux remèdes : (1) ajouter
      « Zone → Zone Settings → Read » (ou « Edit », pour que le passage pose `strict` tout seul) au jeton, puis rejouer ; (2) assumer
      explicitement l'absence de contrôle avec
      `-e cfopull_allow_non_strict_tls=true` (toutes les zones) ou `-e '{"cfopull_allow_non_strict_tls": ["{{ cfopull_zone_name }}"]}'`
      (cette zone seulement), après avoir vérifié à la main SSL/TLS → Overview → Full (strict).
      Rien n'a été changé chez Cloudflare ni sur les proxies (aucune zone n'est activée tant que toutes ne sont pas lisibles et acceptées).
    quiet: true
  delegate_to: localhost
  become: false
  when:
    - not ansible_check_mode
    - (_named_entries | int) > 0
    - not (cfopull_enforce_tls_strict | bool)
    - cfopull_tls.status | default(0) != 200
    - not (_zone_escape | bool)
