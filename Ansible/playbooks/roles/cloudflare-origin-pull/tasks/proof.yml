#
# Contrôles des Authenticated Origin Pulls des vhosts écrits à la main sur `_cloudflare_realip.inc` (`cloudflare_origin_pull`, papanglabs),
# joués AVANT que quoi que ce soit soit écrit sur un proxy : au tout début de la resynchronisation complète (proxy-update/tasks/resync.yml,
# avant la sauvegarde et le vidage de /etc/nginx : un refus ne passe jamais par la restauration) et, par nginx.yml, avant tout gabarit
# de `deploy-one-site`, `deploy-webapp-site` et du play « côté proxies » de deploy-cloudflare-origin-pull.yml.
# Aucune entrée ne déclare `cloudflare_origin_pull` : `cfopull_aop` est vide, aucune de ces tâches ne fait rien
# (hors la première : proof.yml n'est joué que lorsqu'une entrée du parc porte un nom servi par Cloudflare).
#
# Trois preuves pour `enforce`, dans cet ordre : le témoin d'activation local (ci-dessous), puis la preuve SUR LE PROXY (journal
# `cf-aop-*.log` récent) — le témoin ne dit pas que Cloudflare présente encore le certificat, le trafic réel le dit.
- name: Fail when the origin-pull authority is missing, before anything is touched
  ansible.builtin.assert:
    that: (cfopull_dir ~ '/ca.pem') is file
    fail_msg: >-
      {{ cfopull_dir }}/ca.pem est absent sur ce poste alors qu'une entrée de l'inventaire porte un nom servi par Cloudflare : le vhost
      vérifie le certificat client. Jouer d'abord `./play.sh <parc> deploy-cloudflare-origin-pull.yml` (génère l'autorité de CE parc dans
      `cfopull_dir`, l'envoie à Cloudflare, l'active sur les noms), ou reprendre le répertoire depuis le poste qui l'a générée. Rien n'a
      été touché sur les proxies.
    quiet: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail on an invalid or contradictory Authenticated Origin Pulls declaration
  ansible.builtin.assert:
    that: cfopull_aop | dict2items | rejectattr('value', 'in', ['observe', 'enforce']) | list | length == 0
    fail_msg: >-
      `cloudflare_origin_pull` invalide ou contradictoire : {{ cfopull_aop | dict2items | rejectattr('value', 'in', ['observe', 'enforce'])
      | map(attribute='key') | map('regex_replace', '[^A-Za-z0-9_.?-]', '#') | list | join(', ') }}. Valeurs admises : `observe` ou
      `enforce` ; toutes les entrées qui portent un même nom (`proxy_hostname`, `cloudflare_origin_pull_aliases`) doivent déclarer la même.
      Aucun gabarit n'a été posé.
    quiet: true
  delegate_to: localhost
  become: false
  run_once: true

# `enforce` = le vhost refuse (403) une socket Cloudflare sans certificat client vérifié : TOUT le trafic légitime reçoit 403 tant que
# Cloudflare ne présente pas le certificat sur ce nom (constat attendu si on pose le vhost AVANT l'activation). La preuve est le
# témoin local que `cloudflare.yml` n'écrit qu'après l'activation constatée `active` et le mode TLS de la zone accepté, au nom de CETTE
# autorité (empreinte de ca.pem) : absent ou périmé (autorité renouvelée, autre poste de contrôle), le dépôt est refusé ICI, avant
# tout gabarit. `observe` n'exige rien : rien n'est refusé, le journal dit ce que Cloudflare présente.
- name: Hash the origin-pull authority that enforced names must have been activated with
  ansible.builtin.stat:
    path: "{{ cfopull_dir }}/ca.pem"
    checksum_algorithm: sha256
  register: cfopull_ca_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: cfopull_aop | dict2items | selectattr('value', 'equalto', 'enforce') | list | length > 0

- name: Fail when Cloudflare has not been proven to present the certificate on an enforced name
  ansible.builtin.assert:
    that: >-
      (cfopull_dir ~ '/active/' ~ item ~ '.json') is file
      and ((lookup('ansible.builtin.file', cfopull_dir ~ '/active/' ~ item ~ '.json') | from_json).ca_sha256 | default(''))
      == (cfopull_ca_stat.stat.checksum | default('no-authority'))
    fail_msg: >-
      {{ item }} est en `cloudflare_origin_pull: enforce` mais l'activation des Authenticated Origin Pulls chez Cloudflare n'est pas
      PROUVÉE depuis ce poste ({{ cfopull_dir }}/active/{{ item }}.json absent, ou écrit pour une autre autorité). Poser ce vhost
      maintenant répondrait 403 à TOUT le trafic légitime de ce nom. Jouer d'abord
      `./play.sh <parc> deploy-cloudflare-origin-pull.yml` (active le certificat sur les noms, attend `active`, lit le mode TLS de la
      zone, écrit le témoin), contrôler le journal `cf-aop-*.log` en mode `observe` (verify=SUCCESS), puis rejouer. Aucun gabarit
      n'a été posé.
    quiet: true
  loop: "{{ cfopull_aop | dict2items | selectattr('value', 'equalto', 'enforce') | map(attribute='key') | list }}"
  delegate_to: localhost
  become: false
  run_once: true

# Preuve SUR LE PROXY (jouée sur chaque proxy ciblé par `--limit`, sans délégation) : le témoin ci-dessus prouve que l'activation a eu
# lieu depuis ce poste, pas que Cloudflare présente ENCORE le certificat (réglage retiré dans le tableau de bord, origin pulls de zone avec
# le certificat partagé, nom derrière un Load Balancer non éprouvé). Seul le trafic réel le dit : pour chaque nom `enforce`, le journal
# `cf-aop-*.log` (courant et `.1`) du proxy doit porter, sur les `cfopull_evidence_hours` dernières heures (24 h par défaut), au moins
# `cfopull_evidence_min_success` lignes `cf_socket=1 verify="SUCCESS"` du nom (`host=`, vhost en mode observe ou enforce) ET AUCUNE
# ligne `cf_socket=1 untrusted=1` de statut < 400 (trafic accepté que `enforce` refuserait). La commande est en LECTURE SEULE (cat, awk,
# date) et n'imprime que trois compteurs : jamais d'URI, d'adresse ni de User-Agent. nginx échappe `"` et les caractères de contrôle des
# champs journalisés (une ligne ne peut pas en forger une autre) mais PAS les espaces : `claimed` (CF-Connecting-IP), `uri` (`$uri`
# décode `%20`), `ray` et `ua` sont écrits par le CLIENT. Ils sont donc à la FIN du format (partiel `_cloudflare_realip.inc`) et chaque
# expression est ANCRÉE au début de ligne sur le préfixe que nginx détermine seul (`<date> host= socket= cf_socket= verify="…"
# untrusted= mode= status= method=`) : aucun champ forgé dans la fin d'une ligne ne compte. Une fenêtre qui ne peut pas être calculée
# (ni `date -d` GNU ni `date -v` BSD) REFUSE, au lieu de lire tout le journal. En `--check` la lecture est jouée quand même (lecture seule).
# Premier déploiement sur une machine où aucun trafic ne peut être observé : `-e cfopull_allow_unobserved=true`, explicite, faux par défaut
# (le témoin reste exigé).
- name: Read, on the proxy, what the dedicated Authenticated Origin Pulls log says about each enforced name
  ansible.builtin.shell:
    executable: /bin/sh
    cmd: |
      set -u
      cutoff=$(date -d "-${AOP_HOURS} hours" +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -v-${AOP_HOURS}H +%Y-%m-%dT%H:%M:%S 2>/dev/null)
      [ -n "$cutoff" ] || { echo "cannot compute the start of the window: refusing rather than reading the whole log" >&2; exit 1; }
      cat "$AOP_LOG_DIR"/cf-aop-*.log "$AOP_LOG_DIR"/cf-aop-*.log.1 2>/dev/null | awk -v n="$AOP_NAME" -v c="$cutoff" '
        BEGIN {
          gsub(/[^A-Za-z0-9-]/, "[&]", n)
          head = "^[^ ]+ host=" n " socket=[^ ]+ cf_socket="
          tail = " mode=(observe|enforce) status="
          any = head "[01] verify=\"[^\"]*\" untrusted=[01]" tail "[0-9]+ method="
          good = head "1 verify=\"SUCCESS\" untrusted=0" tail "[0-9]+ method="
          accepted = head "1 verify=\"[^\"]*\" untrusted=1" tail "[123][0-9][0-9] method="
        }
        substr($1, 1, 19) < c { next }
        $0 ~ any { lines++ }
        $0 ~ good { ok++ }
        $0 ~ accepted { bad++ }
        END { printf "{\"lines\": %d, \"success\": %d, \"untrusted_ok\": %d}\n", lines, ok, bad }'
  environment:
    AOP_NAME: "{{ item }}"
    AOP_HOURS: "{{ cfopull_evidence_hours | int }}"
    AOP_LOG_DIR: "{{ cfopull_log_dir }}"
  register: cfopull_evidence
  changed_when: false
  check_mode: false
  loop: "{{ [] if (cfopull_allow_unobserved | bool) else (cfopull_aop | dict2items | selectattr('value', 'equalto', 'enforce') | map(attribute='key') | list) }}"

- name: Fail when the proxy holds no recent proof that Cloudflare presents the certificate on an enforced name
  vars:
    # Seuil du NOM : `cfopull_evidence_min_success_by_name[<nom>]` sinon `cfopull_evidence_min_success`. Toujours >= 1 (voir ci-dessous).
    _min_success: "{{ (cfopull_evidence_min_success_by_name | default({})).get(item.item, cfopull_evidence_min_success) | int }}"
  ansible.builtin.assert:
    that:
      - _min_success | int >= 1
      - (item.stdout | from_json).success | int >= _min_success | int
      - (item.stdout | from_json).untrusted_ok | int == 0
    fail_msg: >-
      {{ inventory_hostname }} : {{ item.item }} est en `cloudflare_origin_pull: enforce` mais le journal {{ cfopull_log_dir }}/cf-aop-*.log
      ne prouve pas que Cloudflare présente le certificat de notre zone sur ce nom, sur les {{ cfopull_evidence_hours }} dernières heures :
      lignes du nom = {{ (item.stdout | from_json).lines }}, `cf_socket=1 verify="SUCCESS"` = {{ (item.stdout | from_json).success }}
      (minimum {{ _min_success }}{{ ' — plancher : un seuil < 1 est refusé' if (_min_success | int) < 1 else '' }}), `cf_socket=1 untrusted=1` acceptées (statut < 400) = {{ (item.stdout | from_json).untrusted_ok }}
      (attendu 0 : `enforce` les refuserait). Poser `enforce` maintenant risque de répondre 403 à tout le trafic légitime. Étapes : jouer
      `./play.sh <parc> deploy-cloudflare-origin-pull.yml`, poser `observe` (`update-proxy.yml --limit <proxy>`), laisser passer du trafic,
      relire ce journal, puis rejouer. Nom à faible trafic : `cfopull_evidence_min_success_by_name` (seuil du nom, jamais < 1). Proxy qui ne
      reçoit AUCUN trafic de ce nom (secours du Load Balancer) : l'exclure par `--limit`, jamais en coupant la preuve. Premier déploiement
      sans trafic observable : `-e cfopull_allow_unobserved=true` (assumé). Aucun gabarit n'a été posé.
    quiet: true
  loop: "{{ cfopull_evidence.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
