---
# Allow connections from proxies and whitelist
- name: Allow RPC connections on "{{ proxy_front_port }}" from back servers
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ proxy_front_port }}"
  loop: "{{ groups['backs'] | default([]) }}"

- name: Allow RPC connections on "{{ proxy_front_port }}" from Proxies
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ proxy_front_port }}"
  loop: "{{ groups['proxies'] | default([]) }}"

- name: Allow RPC connections on "{{ proxy_front_port }}" from vpns
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ proxy_front_port }}"
  loop: "{{ groups['vpns'] | default([]) }}"

- name: Allow connections from whitelist
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    port: "{{ proxy_front_port }}"
  with_items:
    "{{ whitelist }}"
