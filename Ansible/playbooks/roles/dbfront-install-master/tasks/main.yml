---
- name: Creates directory for container
  ansible.builtin.file:
    path: ~/pgdatabase/
    state: directory
    mode: '0750'
- name: Creates directory for PG data
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/pgdatabase/data"
    state: directory
    mode: '0750'
    owner: 70
  become: true

# Copy needed files on servers : docker-compose.yml and init script
- name: Copy docker-compose.yml for master
  template:
    src: docker-compose_master.yml
    dest: ~/pgdatabase/docker-compose.yml
- name: Copy init-master.sql for master
  template:
    src: init-master.sql
    dest: ~/pgdatabase/init-master.sql

# Start container and wait for the server to be up
- name: Start postgres
  community.docker.docker_compose_v2:
    project_src: ~/pgdatabase/
    state: present
- name: Get container information
  community.docker.docker_container_info:
    name: postgres
  register: container_info
- name: Wait max 2'30" for container to be running
  until: container_info.container.State.Status == "running"
  retries: 30
  delay: 5
  community.docker.docker_container_info:
    name: postgres
  register: container_info

######################################################## MASTER STUFF
- name: Copy pg_hba.conf
  template:
    src: pg_hba_master.conf
    dest: "{{ ansible_env.HOME }}/pgdatabase/data/pg_hba.conf"
    owner: "{{ ansible_env.LOGNAME }}"
    mode: '0750'
  become: yes

- name: Restart postgresql master server in container to take the newpg_hba.conf into account
  community.docker.docker_container_exec:
    container: postgres
    user: postgres
    command: "pg_ctl -D /var/lib/postgresql/data -m fast -w reload -U {{ postgres_user }}"
    detach: no
