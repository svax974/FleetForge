---
# Secrets du service : génération, mise au vault, clé SSH dédiée.
#
# Principe : RIEN n'est écrasé. Chaque secret est produit une seule fois, à son
# premier déploiement, puis vit dans le vault du parc — donc versionné,
# relisible dans un diff sans être lisible, et identique à chaque rejeu. Un
# secret régénéré à chaque déploiement serait pire qu'inutile : il invaliderait
# les accès sans que rien ne l'explique.
#
# Tout se passe sur le POSTE DE CONTRÔLE : c'est lui qui détient le mot de
# passe du vault, et c'est le dépôt qui garde la trace.

# Ces tâches portent aussi `authorize` : `--tags authorize` rejoue le
# play d'autorisation de la clé, qui lit `ff_public_key`. Sans elles `ff_fleet`
# reste indéfini, `ff_key_path` retombe sur `id_fleetforge_fleet` — un fichier
# qui n'existe pas — et la lecture de la clé publique échoue.
# `fileglob` et non `find` : les group_vars du parc sont des LIENS vers le dépôt
# privé (link-private.sh) et `find` écarte les liens — la liste revenait vide,
# donc aucun parc identifiable.
# Le parc est celui dont le nom de groupe correspond à un fichier group_vars.
# Déduit plutôt que déclaré : une seconde liste à tenir à jour finirait par
# diverger de la première, et le secret atterrirait dans le mauvais parc.
- name: Identify the fleet this host belongs to
  ansible.builtin.set_fact:
    ff_fleet: >-
      {{ (group_names | intersect(
            query('ansible.builtin.fileglob', playbook_dir ~ '/group_vars/*.yml')
            | map('basename') | map('splitext') | map('first') | list)) | first | default('') }}
  tags: [secrets, authorize]

- name: Fail when the fleet cannot be identified
  ansible.builtin.assert:
    that: ff_fleet | length > 0
    fail_msg: >-
      Aucun fichier playbooks/group_vars/<parc>.yml ne correspond aux groupes de
      {{ inventory_hostname }} ({{ group_names | join(', ') }}). Impossible de
      savoir où déposer les secrets : ils iraient dans le mauvais parc, ou nulle
      part.
  tags: [secrets, authorize]

- name: Settle the fleet vault file
  ansible.builtin.set_fact:
    ff_vault_file: "{{ playbook_dir }}/group_vars/{{ ff_fleet }}.yml"
    ff_repo_root: "{{ playbook_dir }}/.."
  tags: [secrets, authorize]

# ── Mot de passe d'accès à l'interface ─────────────────────────────────────
# Le clair ne quitte JAMAIS le vault : la machine ne reçoit que son empreinte
# argon2, produite par le binaire lui-même (`fleetforge-web hash-password`).
- name: Draw the web password (first deployment only)
  ansible.builtin.set_fact:
    ff_web_password: >-
      {{ lookup('ansible.builtin.password',
                '/dev/null length=32 chars=ascii_letters,digits') }}
    ff_web_password_is_new: true
  no_log: true
  when: ff_web_password is not defined
  tags: [secrets]

# `--stdin-name` et non la valeur en argument : `ps` rend les arguments de
# commande lisibles par tous les comptes de la machine.
- name: Encrypt the web password for the fleet vault
  ansible.builtin.command:
    cmd: ansible-vault encrypt_string --stdin-name ff_web_password
    chdir: "{{ ff_repo_root }}"
    stdin: "{{ ff_web_password }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  register: ff_web_password_vaulted
  changed_when: true
  no_log: true
  when: ff_web_password_is_new | default(false)
  tags: [secrets]

- name: Store the web password in the fleet vault
  ansible.builtin.blockinfile:
    path: "{{ ff_vault_file }}"
    marker: "# {mark} ff_web_password — posé par fleetforge-install"
    insertbefore: EOF
    block: |
      # Mot de passe d'accès à l'interface web de FleetForge (authentification
      # basique). Tiré au hasard au premier déploiement, puis inchangé : la
      # machine n'en reçoit que l'empreinte argon2, ce fichier est le seul
      # endroit d'où il puisse être relu.
      {{ ff_web_password_vaulted.stdout }}
  delegate_to: localhost
  become: false
  when: ff_web_password_is_new | default(false)
  tags: [secrets]

# ── Mot de passe du compte d'automatisation (AgentHub) ────────────────────
# Même principe que le mot de passe d'accès : tiré une fois, vault seul
# détenteur du clair, empreinte seule sur la machine. Sauté sans `ff_api_user`.
- name: Draw the automation password (first deployment only)
  ansible.builtin.set_fact:
    ff_api_password: >-
      {{ lookup('ansible.builtin.password',
                '/dev/null length=40 chars=ascii_letters,digits') }}
    ff_api_password_is_new: true
  no_log: true
  when:
    - ff_api_user | length > 0
    - ff_api_password is not defined
  tags: [secrets]

- name: Encrypt the automation password for the fleet vault
  ansible.builtin.command:
    cmd: ansible-vault encrypt_string --stdin-name ff_api_password
    chdir: "{{ ff_repo_root }}"
    stdin: "{{ ff_api_password }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  register: ff_api_password_vaulted
  changed_when: true
  no_log: true
  when: ff_api_password_is_new | default(false)
  tags: [secrets]

- name: Store the automation password in the fleet vault
  ansible.builtin.blockinfile:
    path: "{{ ff_vault_file }}"
    marker: "# {mark} ff_api_password — posé par fleetforge-install"
    insertbefore: EOF
    block: |
      # Mot de passe du compte d'automatisation de FleetForge (`ff_api_user`,
      # AgentHub) : à saisir dans le connecteur FleetForge d'AgentHub. Tiré au
      # premier déploiement, puis inchangé ; la machine n'en reçoit que
      # l'empreinte argon2.
      {{ ff_api_password_vaulted.stdout }}
  delegate_to: localhost
  become: false
  when: ff_api_password_is_new | default(false)
  tags: [secrets]

# ── Clé SSH dédiée ─────────────────────────────────────────────────────────
# Tout ce qui suit ne concerne que le pilotage réel du parc.
- name: Draw the key passphrase (first deployment only)
  ansible.builtin.set_fact:
    ff_key_passphrase: >-
      {{ lookup('ansible.builtin.password',
                '/dev/null length=40 chars=ascii_letters,digits') }}
    ff_key_passphrase_is_new: true
  no_log: true
  when:
    - ff_deploy_secrets | bool
    - ff_key_passphrase is not defined
  tags: [secrets]

- name: Encrypt the key passphrase for the fleet vault
  ansible.builtin.command:
    cmd: ansible-vault encrypt_string --stdin-name ff_key_passphrase
    chdir: "{{ ff_repo_root }}"
    stdin: "{{ ff_key_passphrase }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  register: ff_key_passphrase_vaulted
  changed_when: true
  no_log: true
  when: ff_key_passphrase_is_new | default(false)
  tags: [secrets]

- name: Store the key passphrase in the fleet vault
  ansible.builtin.blockinfile:
    path: "{{ ff_vault_file }}"
    marker: "# {mark} ff_key_passphrase — posé par fleetforge-install"
    insertbefore: EOF
    block: |
      # Passphrase de la clé SSH dédiée à FleetForge ({{ ff_key_path }} sur le
      # poste de contrôle). À conserver : sans elle la clé est inutilisable, et
      # il faut en régénérer une puis la réautoriser sur tout le parc.
      #
      # Le serveur reçoit la passphrase en clair — un démon qui démarre seul
      # doit pouvoir s'en servir sans personne pour la saisir. Elle n'y protège
      # donc que contre le vol du seul fichier de clé, pas contre un accès root
      # à la machine.
      {{ ff_key_passphrase_vaulted.stdout }}
  delegate_to: localhost
  become: false
  when: ff_key_passphrase_is_new | default(false)
  tags: [secrets]

# La passphrase est fournie à ssh-keygen par un programme d'invite
# (`SSH_ASKPASS`, `SSH_ASKPASS_REQUIRE=force`, OpenSSH ≥ 8.4) qui la lit dans
# l'ENVIRONNEMENT du seul processus. Ni `-N`, qui la mettrait dans les arguments
# de la commande, lisibles par tous les comptes du poste, ni l'entrée standard :
# ssh-keygen interroge alors le terminal quand il y en a un — un déploiement lancé
# depuis un shell interactif restait suspendu ou échouait, tandis qu'une
# exécution sans terminal passait. L'invite sert dans les deux cas.
#
# `creates:` est ce qui garantit l'absence d'écrasement : une clé déjà présente
# n'est jamais régénérée, ce qui la rendrait d'un coup inconnue de tout le parc.
- name: Generate the dedicated SSH key on the control machine
  ansible.builtin.shell:
    cmd: |
      mkdir -p -m 700 "$(dirname {{ ff_key_path | quote }})"
      askpass=$(mktemp)
      trap 'rm -f "$askpass"' EXIT
      printf '#!/bin/sh\nprintf "%%s\\n" "$FF_PASSPHRASE"\n' > "$askpass"
      chmod 700 "$askpass"
      SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force \
        ssh-keygen -t ed25519 -q -f {{ ff_key_path | quote }} -C "fleetforge@{{ ff_fleet }}"
    creates: "{{ ff_key_path }}"
  environment:
    FF_PASSPHRASE: "{{ ff_key_passphrase }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: ff_deploy_secrets | bool
  tags: [secrets]

- name: Read the dedicated public key
  ansible.builtin.slurp:
    src: "{{ ff_key_path }}.pub"
  delegate_to: localhost
  become: false
  register: ff_pub_key
  when: ff_deploy_secrets | bool
  tags: [secrets, authorize]

- name: Publish the public key for the authorization play
  ansible.builtin.set_fact:
    ff_public_key: "{{ (ff_pub_key.content | b64decode) | trim }}"
  when: ff_deploy_secrets | bool
  tags: [secrets, authorize]

# La clé rejoint le dossier qui fait foi pour les authorized_keys de `srvc`, avec
# son origine. Posée seulement sur le parc par le play `authorize`, un
# `setup-server.yml` ultérieur (exclusive: true) la retirerait ; ici elle est
# dans la liste voulue. `from=` : volée, la clé ne sert que depuis cette machine.
# Une adresse qui n'en est pas une est REFUSÉE — une clé sans origine vaudrait
# srvc, donc root, depuis n'importe où.
- name: Check that the origin of the dedicated key is an IP address
  ansible.builtin.assert:
    that: ansible_host is match('^[0-9A-Fa-f.:]+$')
    fail_msg: >-
      `ansible_host` de {{ inventory_hostname }} ({{ ansible_host }}) n'est pas
      une adresse IP : `from="…"` ne la restreindrait pas à cette machine.
  when: ff_deploy_secrets | bool
  tags: [secrets, authorize]

- name: Ensure the parc control keys folder exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../keys/{{ parc_name }}/control"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  when: ff_deploy_secrets | bool
  tags: [secrets, authorize]

- name: Drop the dedicated public key, bound to this machine, in the parc control keys
  ansible.builtin.copy:
    content: >-
      from="{{ ansible_host }}",no-agent-forwarding,no-port-forwarding,no-X11-forwarding
      {{ ff_public_key }}
    dest: "{{ playbook_dir }}/../keys/{{ parc_name }}/control/{{ ff_control_key_name }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: ff_deploy_secrets | bool
  register: ff_control_pub
  tags: [secrets, authorize]

# Un secret neuf n'est utile que s'il est COMMIS : le prochain déploiement
# depuis un autre clone en tirerait un second, et l'accès posé par le premier
# deviendrait inexplicablement invalide.
- name: Remind that the fleet vault has changed
  ansible.builtin.debug:
    msg: >-
      {{ ff_vault_file }} a été complété. Committer ce fichier — c'est
      désormais le seul endroit d'où le mot de passe d'accès
      {{ 'et la passphrase de la clé ' if ff_key_passphrase_is_new | default(false) else '' }}{{ "et le mot de passe du compte d'automatisation " if ff_api_password_is_new | default(false) else '' }}puissent
      être relus.
  when: >-
    (ff_web_password_is_new | default(false))
    or (ff_key_passphrase_is_new | default(false))
    or (ff_api_password_is_new | default(false))
  tags: [secrets]
