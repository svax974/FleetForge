---
# Passerelle MCP de FleetForge : garde STATIQUE de son entrée (asserts locaux, AUCUNE connexion) et préparation de ce
# que SEUL FleetForge sait — joué par deploy-fleetforge.yml sur `fleetforge_gateways`, avant l'import de
# deploy-webapp.yml. La passerelle est une entrée `webapp` DURCIE (`webapp_hardening`) : son déploiement, son pare-feu,
# son vhost et son durcissement sont ceux de la famille générique (docs/etude-passerelle-sur-webapp.md). Reste ici ce
# qui relève de l'infra de FleetForge :
#   • l'entrée est DÉDIÉE (hors `infras`, sans la famille `fleetforge` : elle ne doit jamais passer pour un nœud de
#     contrôle), privée (E1), durcie, avec `/mcp` relayé au back-lb derrière une liste NOMMÉE ;
#   • chaque amont (`ffg_upstreams`) désigne une entrée FleetForge qui admet la passerelle (`access_linked`) et porte
#     les trois comptes BORNÉS (liste blanche exacte, refus requis, `accept_own_checks: false`) ;
#   • les mots de passe aval sont nommés par `webapp_env_from_vault` (un par compte, rien d'autre), `FFG_UPSTREAMS`
#     est exigé dans back/.env (`webapp_env_required`) ;
#   • faits : `wa_env_injected` (FFG_UPSTREAMS, JSON sans secret) et, au PREMIER déploiement, les mots de passe que
#     fleetforge-install vient de tirer dans CE run (pas encore relus depuis le group_vars du parc), no_log.

- name: Check the deployment scope
  ansible.builtin.assert:
    that: (ff_deploy_scope | default('all')) in ['all', 'gateway']
    fail_msg: >-
      ff_deploy_scope vaut « {{ ff_deploy_scope | default('') }} » : la passerelle ne se déploie qu'avec all ou gateway
      (`fleetforge` exclut la passerelle, même avec un `-e webapp=…`).
    quiet: true

- name: Check the gateway entry is dedicated, private and hardened
  vars:
    # `/mcp` : UNE seule location, relayée au back-lb, URI brute contrôlée, soit derrière une liste nommée (E1), soit en
    # `mode: public` (E2, exactement la forme de la liste blanche contrôlée par la tâche suivante).
    _mcp_path: '^/mcp(/.*)?$'
    _mcp_locs: "{{ webapp_vhost_locations | default([]) | select('mapping') | selectattr('path', 'defined') | selectattr('path', 'equalto', _mcp_path) | list }}"
    _mcp_ok: >-
      {{ _mcp_locs | length == 1
         and (_mcp_locs[0].upstream | default('')) == 'back'
         and _mcp_locs[0].raw_uri is defined
         and ((_mcp_locs[0].access is defined and (_mcp_locs[0].mode | default('private')) != 'public')
              or ((_mcp_locs[0].mode | default('')) == 'public' and _mcp_locs[0].access is not defined)) }}
    _upstream_egress: >-
      {{ (webapp_hardening.egress_allow | default([]) if webapp_hardening is mapping else [])
         | select('mapping') | selectattr('name', 'defined') | selectattr('name', 'equalto', 'upstream') | list }}
  ansible.builtin.assert:
    that:
      - inventory_hostname not in (groups['infras'] | default([]))
      - "'fleetforge' not in (ansible_roles | default([]))"
      - "'webapp' in (ansible_roles | default([]))"
      - webapp_hardening is defined
      # Vhost PRIVÉ au niveau de l'entrée, E2 compris : seules les locations de la liste blanche exacte (tâche suivante) peuvent
      # être `mode: public` (docs/avant-ouverture-public.md).
      - access_mode is defined
      - access_mode == 'private'
      - hostname is defined
      - proxy_hostname is defined
      - proxy_hostname is search('[.]' ~ (domain_name | regex_escape) ~ '(?!(?s:.))')
      - proxy_hostname != 'proxy.' ~ domain_name
      - _mcp_ok | bool
      # Sorties du sous-réseau (pare-feu du profil) : l'amont par UN proxy nommé, en 443, et le relais SMTP
      # (connexion par code e-mail, `authMethods: ["email"]`) — exigées NOMMÉMENT : sans elles, la passerelle ne pilote
      # rien ou n'envoie aucun code, sans erreur visible au déploiement. Le proxy est celui de la machine de
      # l'amont (contrôlé par amont, plus bas : le nom privé y est servi). Proxy de CETTE machine : INPUT, sous l'adresse
      # du conteneur. Proxy DISTANT : FORWARD puis MASQUERADE, le proxy voit l'adresse publique de cette machine —
      # exigé explicitement (`masquerade_ack: true`), la garde générique du profil (webapp-setup/hardening.yml) refusant
      # en plus toute machine à identité privilégiée ou dont une autre entrée est nommée par adresse.
      - _upstream_egress | length == 1
      - _upstream_egress[0].proxies is not defined and _upstream_egress[0].host is not defined
      - _upstream_egress[0].inventory_host | default('') in (groups['proxies'] | default([]))
      - >-
        hostvars[_upstream_egress[0].inventory_host | default('')].ansible_host | default('') == ansible_host
        or (_upstream_egress[0].masquerade_ack | default(false) | bool)
      # 443 (vhost partagé du proxy) OU le port d'un écouteur DÉDIÉ de l'amont (contrôlé par amont, plus bas).
      - (_upstream_egress[0].port | string) is match('^[1-9][0-9]{0,4}(?!(?s:.))')
      - webapp_hardening.egress_allow | default([]) | selectattr('name', 'defined') | selectattr('name', 'equalto', 'smtp') | list | length == 1
    fail_msg: >-
      Entrée {{ inventory_hostname }} invalide pour la passerelle : entrée dédiée hors du groupe `infras`, famille
      `webapp` (jamais `fleetforge`), `webapp_hardening`, `access_mode: private`, `hostname`, `proxy_hostname`
      (nom de la zone, pas le front des proxies), et UNE location `^/mcp(/.*)?$` de `webapp_vhost_locations` relayée au back-lb
      (`upstream: back`), URI brute contrôlée (`raw_uri`), derrière une liste nommée (`access`, E1) ou en `mode: public`
      (E2, sans `access`) ; `webapp_hardening.egress_allow`
      avec `{name: upstream, inventory_host: <le proxy de la machine de l'amont>, port: 443 ou celui d'un écouteur dédié}` (jamais `proxies: true` ;
      `masquerade_ack: true` si ce proxy n'est pas sur CETTE machine) et une entrée `smtp` (relais du parc : à renseigner
      par le propriétaire avant le premier déploiement).
    quiet: true

# Un vhost écrit à la main `parcs/<parc>/nginx/sites-enabled/<projet>.conf` REMPLACE le vhost générique (proxy-update/tasks/
# webapp-sites.yml : même chemin, même nom de projet) : il échapperait à tout ce que la passerelle exige du rendu (accès privé,
# listes nommées, locations publiques de la liste blanche, certificat client, `vhost --public`). Refusé pour l'entrée de la passerelle.
# Contrôle local, par NOM de fichier seulement (le contenu n'est jamais lu ni affiché).
- name: Check no hand-written vhost replaces the generic one of the gateway
  vars:
    _hand_written_vhost: "{{ playbook_dir }}/../parcs/{{ parc_name | default('') }}/nginx/sites-enabled/{{ webapp_project | default(inventory_hostname) }}.conf"
  ansible.builtin.assert:
    that:
      - parc_name is defined
      - (parc_name | string | length) > 0
      - not (_hand_written_vhost is file)
    fail_msg: >-
      {{ inventory_hostname }} : un vhost écrit à la main `parcs/{{ parc_name | default('?') }}/nginx/sites-enabled/{{ webapp_project | default(inventory_hostname) }}.conf`
      existe (ou `parc_name` manque) : il remplacerait le vhost généré de la passerelle et échapperait à ses gardes
      (`vhost`, `vhost --public`). Le retirer : la passerelle n'a que le vhost générique (`webapp_vhost_locations`).
    quiet: true

# E2 : locations PUBLIQUES (`mode: public`, aucune liste d'adresses ; la barrière est l'allow-list par credential de
# l'application, plus le certificat client de NOTRE Cloudflare exigé par `_access.inc`). LISTE BLANCHE EXACTE : ces cinq
# chemins, chacun avec SA `raw_uri`, relayé au back-lb, corps borné, délai ≤ 90 s (Cloudflare coupe à ~100 s) ; tout autre chemin
# public, tout joker, `access` mêlé à `mode`, un chemin déclaré deux fois, un préfixe `^~` qui masquerait une regex publique est
# REFUSÉ. `/mcp/connections` (page du front « Mes connexions MCP ») reste une location PRIVÉE du front, `^~` : sans elle la regex
# `^/mcp(/.*)?$` l'enverrait au back. Les mêmes valeurs sont contrôlées sur le vhost RENDU par
# scripts/webapp_hardening_check.py (`vhost --public`, PUBLIC_LOCATIONS) ; un test compare les deux listes.
# La liste vit dans `vars:` (une extra-var l'écraserait : no-overrides.yml la détecte).
- name: Check the public locations of the gateway entry
  vars:
    _mcp_path: '^/mcp(/.*)?$'
    _public_timeout_max: 90
    _public_allowed:
      '^/mcp(/.*)?$': {raw_uri: '^/mcp(/|[?]|$)', body: 131072, body_required: true, timeout_required: true}
      '^/.well-known/oauth-protected-resource(/mcp)?$': {raw_uri: '^/.well-known/oauth-protected-resource(/mcp)?([?]|$)', body: 16384, body_required: false, timeout_required: false}
      '^/.well-known/oauth-authorization-server$': {raw_uri: '^/.well-known/oauth-authorization-server([?]|$)', body: 16384, body_required: false, timeout_required: false}
      '^/api/v1/mcp-access/oauth/(authorize|token|revoke)$': {raw_uri: '^/api/v1/mcp-access/oauth/(authorize|token|revoke)([?]|$)', body: 16384, body_required: true, timeout_required: false}
      '^/api/v1/mcp-access/oauth/register$': {raw_uri: '^/api/v1/mcp-access/oauth/register([?]|$)', body: 16384, body_required: true, timeout_required: false}
    _locations: "{{ webapp_vhost_locations | default([]) }}"
    _public_problems: >-
      {%- set ns = namespace(p=[]) -%}
      {%- set paths = _locations | select('mapping') | map(attribute='path', default='') | list -%}
      {%- set mcp_public = _locations | select('mapping') | selectattr('path', 'defined') | selectattr('path', 'equalto', _mcp_path) | selectattr('mode', 'defined') | selectattr('mode', 'equalto', 'public') | list | length > 0 -%}
      {%- for l in _locations -%}
      {%- if l is not mapping -%}
      {%- set ns.p = ns.p + ['a location is not a mapping'] -%}
      {%- else -%}
      {%- set path = l.path | default('') | string -%}
      {%- if l.access is defined and l.mode is defined -%}{%- set ns.p = ns.p + [path ~ ': `access` and `mode` on the same location'] -%}{%- endif -%}
      {%- if (paths | select('equalto', l.path | default('')) | list | length) > 1 -%}{%- set ns.p = ns.p + [path ~ ': declared twice'] -%}{%- endif -%}
      {%- if (l.mode | default('')) == 'public' -%}
      {%- set rule = _public_allowed[path] | default({}) -%}
      {%- if not rule or not (l.regex | default(false) | bool) -%}
      {%- set ns.p = ns.p + [path ~ ': not on the whitelist of public locations (exact regex path required)'] -%}
      {%- else -%}
      {%- set body = l.body | default('') | string | lower -%}
      {%- set body_bytes = (body | regex_replace('[kmg]$', '') | int) * ({'k': 1024, 'm': 1048576, 'g': 1073741824}.get(body[-1:], 1)) -%}
      {%- set timeout = l.timeout | default('') | string | lower -%}
      {%- set timeout_seconds = (timeout | regex_replace('[a-z]+$', '') | int) * ({'ms': 0.001, 's': 1, 'm': 60, 'h': 3600}.get(timeout | regex_replace('^[0-9]+', ''), 1)) -%}
      {%- if (l.raw_uri | default('')) != rule.raw_uri -%}{%- set ns.p = ns.p + [path ~ ': raw_uri must be exactly ' ~ rule.raw_uri] -%}{%- endif -%}
      {%- if (l.upstream | default('')) != 'back' -%}{%- set ns.p = ns.p + [path ~ ': upstream must be back'] -%}{%- endif -%}
      {%- if l.priority | default(false) | bool or l.ws | default(false) | bool -%}{%- set ns.p = ns.p + [path ~ ': no priority (^~) nor websocket'] -%}{%- endif -%}
      {%- if rule.body_required and not body -%}{%- set ns.p = ns.p + [path ~ ': body limit required'] -%}{%- endif -%}
      {#- `client_max_body_size 0` = illimité pour nginx : une limite exigée doit être strictement positive. -#}
      {%- if body and body_bytes <= 0 -%}{%- set ns.p = ns.p + [path ~ ': body limit must be above 0 (0 means unlimited)'] -%}{%- endif -%}
      {%- if body and body_bytes > rule.body -%}{%- set ns.p = ns.p + [path ~ ': body above ' ~ rule.body ~ ' bytes'] -%}{%- endif -%}
      {%- if rule.timeout_required and not timeout -%}{%- set ns.p = ns.p + [path ~ ': timeout required'] -%}{%- endif -%}
      {%- if timeout and timeout_seconds > _public_timeout_max -%}{%- set ns.p = ns.p + [path ~ ': timeout above ' ~ _public_timeout_max ~ ' s'] -%}{%- endif -%}
      {#- Un préfixe `^~` qui couvre ce chemin court-circuite les regex : la location publique ne serait jamais atteinte. -#}
      {%- for q in _locations if q is mapping and (q.priority | default(false) | bool) and not (q.regex | default(false) | bool) and (q.path | default('')) | string | length > 0 -%}
      {%- if path[1:].startswith(q.path | string) -%}{%- set ns.p = ns.p + [path ~ ': hidden by the priority prefix ' ~ q.path] -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if mcp_public -%}
      {%- set conn = _locations | select('mapping') | selectattr('path', 'defined') | selectattr('path', 'equalto', '/mcp/connections') | list -%}
      {%- if conn | length != 1 or not ((conn[0].priority | default(false) | bool) and not (conn[0].regex | default(false) | bool)
            and conn[0].mode is not defined and conn[0].access is not defined and (conn[0].upstream | default('front')) == 'front') -%}
      {%- set ns.p = ns.p + ['/mcp/connections: a private front location with priority (^~) is required while /mcp is public'] -%}
      {%- endif -%}
      {%- endif -%}
      {{ ns.p | join(' | ') }}
    _any_public: "{{ _locations | select('mapping') | selectattr('mode', 'defined') | selectattr('mode', 'equalto', 'public') | list | length > 0 }}"
    # Sonde du bord public (A3) : `/mcp` sans identifiant → 401 par le nom, 403 en joignant l'origine sans certificat client.
    _public_probe_ok: >-
      {{ (webapp_public_checks | default([])) is sequence and (webapp_public_checks | default([])) is not string
         and (webapp_public_checks | default([]) | select('mapping') | selectattr('path', 'defined') | selectattr('path', 'equalto', '/mcp')
              | selectattr('edge_status', 'defined') | selectattr('edge_status', 'in', [401, '401'])
              | selectattr('origin_status', 'defined') | selectattr('origin_status', 'in', [403, '403']) | list | length) > 0 }}
  ansible.builtin.assert:
    that:
      - _locations is not string
      - _public_problems | trim | length == 0
      # Une location publique n'a de sens que derrière NOTRE Cloudflare (certificat client exigé par `_access.inc`) : sans
      # `cloudflare_named`, `mode: public` serait ouvert à Internet, sans barrière d'adresse ni de certificat.
      - not (_any_public | bool) or (cloudflare_named | default(false) | string | lower) == 'true'
      # Pas de bord public sans sa sonde : un vhost ouvert par erreur doit se voir (service_check_up{check="public_edge"}).
      - not (_any_public | bool) or (_public_probe_ok | bool)
    fail_msg: >-
      {{ inventory_hostname }} : locations publiques refusées — {{ _public_problems | trim or 'aucune' }}.
      Seules sont admises (`mode: public`, regex, `upstream: back`, `raw_uri` exacte, corps et délai bornés) :
      {{ _public_allowed.keys() | join(' ; ') }} ; l'entrée doit porter `cloudflare_named: true`
      ({{ cloudflare_named | default('absent') }}), jamais `access` avec `mode`, `/mcp/connections` reste une location
      privée du front (`priority: true`), et `webapp_public_checks` porte la sonde du bord public :
      { name, path: /mcp, edge_status: 401, origin_status: 403 } (sondes svcprobe `<name>` et `<name>_origin`).
    quiet: true

# Chaque amont : l'entrée FleetForge qu'il désigne doit admettre la passerelle (`access_linked`) et porter les trois
# comptes BORNÉS attendus — jamais le compte d'AgentHub (`ff_api_user`) ni un compte plus large.
- name: Check each upstream against its FleetForge entry
  vars:
    _e: "{{ item.entry | default('') }}"
    _ev: "{{ hostvars[_e] if _e in hostvars else {} }}"
    _users: "{{ ffg_default_users | combine(item.users | default({})) }}"
    _accounts: "{{ _ev.ff_api_accounts | default([]) }}"
    _read: "{{ _accounts | selectattr('user', 'defined') | selectattr('user', 'equalto', _users.read) | first | default({}) }}"
    _check: "{{ _accounts | selectattr('user', 'defined') | selectattr('user', 'equalto', _users.check) | first | default({}) }}"
    _run: "{{ _accounts | selectattr('user', 'defined') | selectattr('user', 'equalto', _users.run) | first | default({}) }}"
    _parc: "{{ _ev.parc_name | default('') }}"
    _upstream_egress: >-
      {{ (webapp_hardening.egress_allow | default([]) if webapp_hardening is mapping else [])
         | select('mapping') | selectattr('name', 'defined') | selectattr('name', 'equalto', 'upstream') | list }}
    # Port de la sortie `upstream` : 443 (vhost partagé du proxy) ou celui d'un écouteur DÉDIÉ de l'amont — un `server {}`
    # unique, admis à cette seule passerelle (proxy-security/tasks/dedicated-listeners.yml). Avec un écouteur dédié, le
    # pare-feu de la passerelle n'admet que ce port du proxy : plus aucun autre vhost de ce proxy n'est joignable.
    _up_port: "{{ (_upstream_egress[0].port | default(443)) | int }}"
    _authority: "{{ _ev.hostname | default('') ~ ((':' ~ _up_port) if (_up_port | int) != 443 else '') }}"
    _listeners: >-
      {{ (_ev.dedicated_listeners | default([]) if _ev.dedicated_listeners | default([]) is not string else [])
         | select('mapping') | selectattr('port', 'defined') | selectattr('port', 'in', [_up_port | string, _up_port | int]) | list }}
    _probe: "{{ webapp_upstream_checks | default([]) | select('mapping') | selectattr('id', 'defined') | selectattr('id', 'equalto', item.id | default('')) | list }}"
    # Playbooks de la liste blanche qu'un motif de refus de ffg_check/ffg_run toucherait (glob FleetForge : `*`, `?`),
    # traduit en regex sans antislash.
    _denied_allowed: >-
      {{ ffg_allowed_playbooks
         | select('match', '^(' ~ (((_check.deny_playbooks | default([])) + (_run.deny_playbooks | default([])))
             | map('regex_replace', '[.]', '[.]') | map('regex_replace', '[?]', '.') | map('regex_replace', '[*]', '.*')
             | join('|')) ~ ')$') | list }}
    # Mot de passe de chaque compte : nommé dans `webapp_env_from_vault`, exactement.
    _slots: >-
      {%- set out = {} -%}
      {%- for role in ['read', 'check', 'run'] -%}
      {%- set _ = out.update({'FFG_UPSTREAM_' ~ (item.id | default('') | upper) ~ '_' ~ (role | upper) ~ '_PASSWORD': 'ff_api_password_' ~ _users[role]}) -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id is match('^[a-z][a-z0-9_]{0,31}(?!(?s:.))')
      - _e in (groups['infras'] | default([]))
      - _ev.proxy_hostname is defined
      - _ev.proxy_hostname is match('^[a-z0-9][a-z0-9.-]{0,252}(?!(?s:.))')
      # L'amont est joint par le nom PRIVÉ de sa machine (`hostname`, enregistrement A), servi par le seul proxy de la
      # même machine (server_name du vhost FleetForge du parc) : la sortie `upstream` de la passerelle vise donc CE proxy
      # (la machine de l'amont), que la passerelle soit sur cette machine ou non.
      - _ev.hostname is defined
      - _ev.hostname is match('^[a-z0-9][a-z0-9.-]{0,252}(?!(?s:.))')
      - _ev.hostname is search('[.]' ~ (domain_name | regex_escape) ~ '(?!(?s:.))')
      - hostvars[_upstream_egress[0].inventory_host | default('')].ansible_host | default('') == _ev.ansible_host | default('')
      # Hors 443 : l'amont déclare CET écouteur dédié (`dedicated_listeners`), dont le seul client est cette passerelle.
      # Sans lui la sortie ouverte ne mène à aucun `server {}`. Le contrôle de la déclaration (port, clients, adresses)
      # est celui de proxy-security/tasks/dedicated-listeners.yml, avant toute ouverture.
      - (_up_port | int) == 443 or (_listeners | length == 1 and (_listeners[0].clients | default([])) == [inventory_hostname])
      # La sonde `upstream_<id>` (`webapp_upstream_checks`) joint le MÊME nom et le MÊME port que `FFG_UPSTREAMS`.
      - _probe | length == 0 or (_probe[0].url | default('')) is match('^https://' ~ (_authority | regex_escape) ~ '(/|(?!(?s:.)))')
      - inventory_hostname in (_ev.access_linked | default([]))
      - item.parcs is defined and item.parcs is not string and item.parcs | length > 0
      - (_users.values() | unique | list | length) == 3
      - (_ev.ff_api_user | default('')) not in _users.values()
      - _read.mode | default('read') == 'read' and _read.user is defined
      - _check.mode | default('') == 'check'
      - _run.mode | default('') == 'run'
      - _users.check in (_run.accept_checks_from | default([]))
      # Séparation réelle : le compte run n'utilise PAS ses propres checks.
      - not (_run.accept_own_checks | default(true) | bool)
      - _check.max_hosts is defined and _run.max_hosts is defined
      - ffg_required_denies | difference(_check.deny_playbooks | default([])) | length == 0
      - ffg_required_denies | difference(_run.deny_playbooks | default([])) | length == 0
      # Liste blanche EXACTE (décision du propriétaire), et aucun motif de refus du compte ne la touche.
      - (_check.allow_playbooks | default([]) | sort) == (ffg_allowed_playbooks | sort)
      - (_run.allow_playbooks | default([]) | sort) == (ffg_allowed_playbooks | sort)
      - _denied_allowed | length == 0
      - item.parcs | difference(_read.parcs | default([_parc])) | length == 0
      - item.parcs | difference(_check.parcs | default([_parc])) | length == 0
      - item.parcs | difference(_run.parcs | default([_parc])) | length == 0
      - _slots.items() | list | difference((webapp_env_from_vault | default({})).items() | list) | length == 0
    fail_msg: >-
      Amont « {{ item.id | default('?') }} » de {{ inventory_hostname }} : l'entrée `{{ _e }}` doit être du groupe
      `infras`, sur la machine du proxy de la sortie `upstream`, déclarer `proxy_hostname` et `hostname` (nom privé de la
      machine, dans {{ domain_name }}, ajouté au server_name du vhost FleetForge du proxy de cette machine), nommer {{ inventory_hostname }} dans `access_linked`, et porter dans
      `ff_api_accounts` {{ _users.read }} (read), {{ _users.check }} (check, max_hosts) et {{ _users.run }} (run,
      max_hosts, accept_checks_from: [{{ _users.check }}], accept_own_checks: false) couvrant les parcs
      {{ item.parcs | default([]) | join(', ') }}, check et run avec `allow_playbooks` = {{ ffg_allowed_playbooks | join(', ') }}
      et refusant {{ ffg_required_denies | join(', ') }} ; trois noms distincts, aucun égal au compte d'AgentHub
      (`ff_api_user`) ; `webapp_env_from_vault` de la passerelle : {{ _slots.keys() | join(', ') }} ; hors 443 : `dedicated_listeners`
      de l'entrée avec le port {{ _up_port }} et `clients: [{{ inventory_hostname }}]` ; la sonde `webapp_upstream_checks`
      de cet amont vise https://{{ _authority }}/…
  loop: "{{ ffg_upstreams | default([]) }}"
  loop_control:
    label: "{{ item.id | default('?') }} → {{ item.entry | default('?') }}"

- name: Check the upstreams and the keys the gateway needs
  vars:
    _expected: >-
      {%- set out = [] -%}
      {%- for u in ffg_upstreams | default([]) if u is mapping -%}
      {%- for role in ['read', 'check', 'run'] -%}
      {%- set _ = out.append('FFG_UPSTREAM_' ~ (u.id | default('') | upper) ~ '_' ~ (role | upper) ~ '_PASSWORD') -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.assert:
    that:
      - ffg_upstreams | default([]) is not string
      - ffg_upstreams | default([]) | length > 0
      - ffg_upstreams | map(attribute='id') | unique | list | length == ffg_upstreams | length
      # Aucun secret de plus que les mots de passe aval : rien d'autre ne transite par cette voie.
      - (webapp_env_from_vault | default({})).keys() | list | sort == _expected | sort
      - "'FFG_UPSTREAMS' in (webapp_env_required | default([]))"
    fail_msg: >-
      {{ inventory_hostname }} : `ffg_upstreams` (liste d'amonts {id, entry, parcs}, ids uniques) vide ou invalide, ou
      `webapp_env_from_vault` ≠ {{ _expected | join(', ') }}, ou FFG_UPSTREAMS absent de `webapp_env_required`.
    quiet: true

# Sauvegarde de la base (famille `backup`, deploy-backup.yml) : opt-in par `backup` dans `ansible_roles`. Absent : rien
# n'est vérifié, comportement INCHANGÉ. Présent : destination d'une autre machine, dump chiffré, port explicite — voir
# gateway-backup-guard.yml, que deploy-backup.yml joue aussi.
- name: Check the database backup declaration of the gateway
  when: "'backup' in (ansible_roles | default([]))"
  ansible.builtin.import_tasks: gateway-backup-guard.yml

# FFG_UPSTREAMS : JSON sans secret (id, URL https de l'amont, parcs, noms de comptes), écrit par webapp-env-update.
# URL : le nom PRIVÉ de la machine de l'amont (`hostname`, enregistrement A : le proxy de cette machine), jamais
# `proxy_hostname` (CNAME vers le front de TOUS les proxies : la sortie `upstream` n'en admet qu'un).
- name: Work out FFG_UPSTREAMS
  vars:
    # Port de la sortie `upstream` (443 : absent de l'URL ; sinon celui de l'écouteur dédié, contrôlé plus haut).
    _up_port: >-
      {{ ((webapp_hardening.egress_allow | default([]) if webapp_hardening is mapping else [])
          | select('mapping') | selectattr('name', 'defined') | selectattr('name', 'equalto', 'upstream') | map(attribute='port')
          | first | default(443)) | int }}
    _upstreams: >-
      [{% for u in ffg_upstreams %}{"id": {{ u.id | to_json }}, "baseUrl": {{ ('https://' ~ hostvars[u.entry].hostname ~ ((':' ~ _up_port) if (_up_port | int) != 443 else '')) | to_json }}, "parcs": {{ u.parcs | to_json }}{% if u.users is defined %}, "users": {{ u.users | to_json }}{% endif %}}{{ '' if loop.last else ', ' }}{% endfor %}]
  ansible.builtin.set_fact:
    wa_env_injected:
      FFG_UPSTREAMS: "{{ _upstreams | trim }}"

- name: Check FFG_UPSTREAMS
  ansible.builtin.assert:
    that:
      - wa_env_injected.FFG_UPSTREAMS is match('^[][{}A-Za-z0-9 ",:._/-]+(?!(?s:.))')
      - wa_env_injected.FFG_UPSTREAMS | from_json | length == ffg_upstreams | length
    fail_msg: "FFG_UPSTREAMS hors grammaire (ids, noms publics et parcs : [A-Za-z0-9._-])."
    quiet: true

# Premier déploiement : fleetforge-install vient de tirer les mots de passe dans CE run (fait `ff_api_new_passwords`
# de l'entrée FleetForge) — ils ne sont pas encore relus depuis le group_vars. Fait d'hôte du même nom que la variable
# du coffre, que `webapp_env_from_vault` lit ensuite. Jamais affiché.
- name: Take the passwords drawn in this run when the vault does not have them yet
  vars:
    _users: "{{ ffg_default_users | combine(item.0.users | default({})) }}"
    _user: "{{ _users[item.1] }}"
    _drawn: "{{ (hostvars[item.0.entry].ff_api_new_passwords | default({}))[_user] | default('') }}"
  ansible.builtin.set_fact:
    "{{ 'ff_api_password_' ~ _user }}": "{{ _drawn }}"
  loop: "{{ ffg_upstreams | product(['read', 'check', 'run']) | list }}"
  loop_control:
    label: "{{ item.0.id }} {{ item.1 }}"
  when:
    - lookup('ansible.builtin.vars', 'ff_api_password_' ~ _user, default='') | length == 0
    - _drawn | length > 0
  no_log: true
