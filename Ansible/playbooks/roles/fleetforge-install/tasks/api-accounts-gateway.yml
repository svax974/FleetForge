---
# Comptes de la passerelle MCP (`ffg_*` de `ff_api_accounts`) : bornés AVANT tout tirage et avant d'écrire
# api-accounts.json, quel que soit `ff_deploy_scope` (revue du 15/11/2026 : `-e ff_deploy_scope=fleetforge` les posait
# sans passer par la garde de la passerelle). Mêmes règles que gateway-guard.yml : check et run avec EXACTEMENT la liste
# blanche, la liste de refus minimale et aucun refus qui la touche, `max_hosts` ; run n'accepte que les checks d'un
# AUTRE compte (`accept_checks_from`, `accept_own_checks: false`) ; read sans liste ni checks. Aucune connexion :
# fichier joué hors ligne par scripts/test_webapp_hardening_check.py.

- name: Check the required deny lists are non-empty lists of patterns
  # Échec fermé : une liste vide ou qui n'est pas une liste ferait passer tout compte (`difference` d'une liste vide = rien à exiger).
  ansible.builtin.assert:
    that:
      - (ffg_required_denies | default(none) | type_debug) == 'list'
      - ffg_required_denies | length > 0
      - ffg_required_denies | select('string') | list | length == ffg_required_denies | length
      - (ffg_required_denies_run | default(none) | type_debug) == 'list'
      - ffg_required_denies_run | length > 0
      - ffg_required_denies_run | select('string') | list | length == ffg_required_denies_run | length
    fail_msg: >-
      `ffg_required_denies` et `ffg_required_denies_run` (fleetforge-install/defaults) doivent être des listes de motifs
      NON vides : une liste vide ou d'un autre type ne bornerait aucun compte de la passerelle.
    quiet: true

# Les comptes que la passerelle UTILISE sont ceux de `ffg_upstreams[].users` (défaut `ffg_default_users`) : un nom
# renommé hors du préfixe `ffg_` (`users: {run: deployer}`) échapperait aux bornes ci-dessous. Préfixe IMPOSÉ, pour
# toute entrée de `fleetforge_gateways` du parc (quatrième revue).
- name: Check the account names the gateways use
  vars:
    _named: >-
      {{ groups['fleetforge_gateways'] | default([]) | map('extract', hostvars) | map(attribute='ffg_upstreams', default=[])
         | flatten | select('mapping') | map(attribute='users', default={}) | list }}
  ansible.builtin.assert:
    that:
      - _named | reject('mapping') | list | length == 0
      - _named | map('dict2items') | flatten | map(attribute='key') | reject('in', ['read', 'check', 'run']) | list | length == 0
      - _named | map('dict2items') | flatten | map(attribute='value') | map('string') | reject('match', '^ffg_[a-z0-9_]{1,27}(?!(?s:.))') | list | length == 0
    fail_msg: >-
      `ffg_upstreams[].users` d'une passerelle (groupe `fleetforge_gateways`) : un mapping {read, check, run} de noms
      `ffg_<…>` (minuscules, chiffres, _) — tout autre nom échapperait aux bornes des comptes de la passerelle.
    quiet: true

- name: Check the bounded accounts of the MCP gateway
  vars:
    _denies: "{{ item.deny_playbooks | default([]) }}"
    _denied_allowed: >-
      {{ (ffg_allowed_playbooks
          | select('match', '^(' ~ (_denies | map('regex_replace', '[.]', '[.]') | map('regex_replace', '[?]', '.')
              | map('regex_replace', '[*]', '.*') | join('|')) ~ ')$') | list) if _denies | length > 0 else [] }}
  ansible.builtin.assert:
    that:
      - item.mode | default('read') in ['read', 'check', 'run']
      - item.mode | default('read') != 'read' or (item.allow_playbooks is not defined and item.accept_checks_from is not defined)
      - item.mode | default('read') == 'read' or (item.allow_playbooks | default([]) | sort) == (ffg_allowed_playbooks | sort)
      - item.mode | default('read') == 'read' or (ffg_required_denies + (ffg_required_denies_run if item.mode == 'run' else [])) | difference(_denies) | length == 0
      - item.mode | default('read') == 'read' or _denied_allowed | length == 0
      - item.mode | default('read') == 'read' or item.max_hosts is defined
      - item.mode | default('read') != 'run' or not (item.accept_own_checks | default(true) | bool)
      - item.mode | default('read') != 'run' or item.accept_checks_from | default([]) | select('match', '^ffg_') | list | length > 0
      - not (item.allow_extra_vars | default(false) | bool)
      - not (item.allow_diff | default(false) | bool)
    fail_msg: >-
      Compte de la passerelle `{{ item.user }}` invalide : check/run avec `allow_playbooks` =
      {{ ffg_allowed_playbooks | join(', ') }} exactement, `deny_playbooks` ⊇ ffg_required_denies
      (+ ffg_required_denies_run pour run ; fleetforge-install/defaults) sans toucher la liste blanche, `max_hosts` ; run avec `accept_checks_from` (un compte
      ffg_ check) et `accept_own_checks: false` ; read sans liste ni checks ; jamais `allow_extra_vars`/`allow_diff`.
    quiet: true
  loop: "{{ ff_api_accounts | default([]) | selectattr('user', 'defined') | selectattr('user', 'match', '^ffg_') | list }}"
  loop_control:
    label: "{{ item.user }}"
