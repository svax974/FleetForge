---
# Supprime Prometheus ET ses données : conteneur, image, TSDB, configuration,
# règles d'alerte et cibles de service discovery. Destructif et irréversible —
# l'historique des métriques est perdu.

- name: Stop and remove Prometheus container
  community.docker.docker_container:
    name: prometheus
    state: absent
  become: true
  ignore_errors: true

- name: Remove Prometheus firewall rules
  community.general.ufw:
    rule: "{{ item }}"
    proto: tcp
    port: "{{ prometheus_port }}"
    delete: true
  loop: [allow, deny]
  become: true
  ignore_errors: true

- name: Remove Prometheus image
  community.docker.docker_image_remove:
    name: "prom/prometheus:latest"
  become: true
  ignore_errors: true

- name: Remove Prometheus directory (TSDB, config, rules, targets)
  ansible.builtin.file:
    path: "{{ prometheus_home }}"
    state: absent
  become: true

# ── Supervision ────────────────────────────────────────────────────────────
# Convention `-monitoring` (CLAUDE.md) : c'est le rôle de suppression du service qui retire sa sonde.
# Une sonde laissée en place publierait `service_up 0` indéfiniment et ferait sonner `ServiceDown`
# sur un service volontairement désinstallé.
- name: Remove the svcprobe check
  ansible.builtin.file:
    path: "/etc/svcprobe/checks.d/prometheus.json"
    state: absent
  become: true
  tags: [monitoring]
