---
# Stop and remove mailserver services — preserves certs, DKIM keys, config

- name: Stop all mailserver services
  ansible.builtin.import_role:
    name: mailserver-stop

- name: Remove Postfix and OpenDKIM packages
  ansible.builtin.apt:
    name:
      - postfix
      - opendkim
      - opendkim-tools
      - prometheus-postfix-exporter
    state: absent
    purge: no

- name: Remove mailfilter user (home directory preserved)
  ansible.builtin.user:
    name: mailfilter
    state: absent
    remove: no

- name: Remove Prometheus target file for postfix on monitor
  ansible.builtin.file:
    path: "/home/{{ remote_username }}/prometheus/prometheus-configs/postfix/{{ inventory_hostname }}.json"
    state: absent
  delegate_to: "{{ prometheus_host }}"
  ignore_errors: yes

- name: Reload Prometheus after target removal
  community.docker.docker_container:
    name: prometheus
    state: started
    restart: yes
  delegate_to: "{{ prometheus_host }}"
  ignore_errors: yes

- name: Remove UFW rules for mail ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: yes
  loop:
    - "465"
    - "587"
  become: yes
  ignore_errors: yes
