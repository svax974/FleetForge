---
# Purge monitoring stack — removes containers, config files and all metrics data.

- name: Set prometheus home directory
  ansible.builtin.set_fact:
    prometheus_home: "/home/{{ remote_username }}/prometheus"

- name: Stop and remove Prometheus container
  community.docker.docker_container:
    name: prometheus
    state: absent
  ignore_errors: true

- name: Stop and remove Grafana container
  community.docker.docker_container:
    name: grafana
    state: absent
  ignore_errors: true

- name: Remove prometheus home directory (config + data + target configs)
  ansible.builtin.file:
    path: "{{ prometheus_home }}"
    state: absent

- name: Remove Docker images
  community.docker.docker_image:
    name: "{{ item }}"
    state: absent
  loop:
    - prom/prometheus
    - grafana/grafana
  ignore_errors: true
