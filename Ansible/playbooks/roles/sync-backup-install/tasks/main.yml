---
# Installe la sauvegarde SQLite de l'instance `{{ sync_instance }}` vers
# `{{ sync_backup_dest_host }}`. Modèle : postgres-backup-install. Joué par
# deploy-backup.yml (sur le groupe `sync_servers`).

# Destination : compte dédié et passerelle `backup-gate` (rôle backup-setup), jamais `srvc`.

# `-e` l'emporte sur l'inventaire : le script est lancé (cron, root), le journal reçoit sa sortie.
- name: Check the script and log paths are plain absolute paths
  ansible.builtin.assert:
    that:
      - sync_backup_script is match('^/[A-Za-z0-9._/-]*(?!(?s:.))')
      - sync_backup_log is match('^/[A-Za-z0-9._/-]*(?!(?s:.))')
    fail_msg: "sync_backup_script, sync_backup_log : chemins absolus sans espace ni métacaractère."
    quiet: true
  tags: [always]

- name: Fail if the backup destination is not in the inventory
  ansible.builtin.fail:
    msg: >-
      L'hôte de destination `{{ sync_backup_dest_host }}` est absent de
      l'inventaire. Ajoute-le au groupe `backups` avant de jouer ce rôle.
  when: sync_backup_dest_host not in hostvars
  tags: [always]

- name: Check the backup name, the retention and the encryption recipient
  ansible.builtin.assert:
    that:
      - sync_backup_name is match('^[a-z0-9][a-z0-9-]{0,62}(?!(?s:.))')
      - sync_backup_keep | string is match('^[0-9]{1,4}(?!(?s:.))') and sync_backup_keep | int >= 1 and sync_backup_keep | int <= 1000
      - sync_backup_encrypt_recipient | length == 0 or sync_backup_encrypt_recipient is match('^age1[02-9ac-hj-np-z]{58}(?!(?s:.))')
    fail_msg: >-
      sync_backup_name (minuscules, chiffres, tirets), sync_backup_keep (1 à 1000) ou sync_backup_encrypt_recipient
      (vide, ou destinataire age « age1… » de 62 caractères) invalide.
    quiet: true
  tags: [always]

- name: Report the resolved backup destination
  ansible.builtin.debug:
    msg: >-
      Sauvegarde de {{ sync_instance }} → {{ sync_backup_dest_user }}@{{ sync_backup_dest_addr }}:{{ sync_backup_dest_port }}
      ({{ sync_backup_dest_dir }}, rétention {{ sync_backup_keep }} générations,
      {{ 'chiffrée (age)' if sync_backup_encrypt_recipient | length > 0 else 'NON chiffrée' }}).
  tags: [retarget]

# Outil générique, jamais retiré par remove/purge. `VACUUM INTO` exige SQLite
# >= 3.27 (Ubuntu 20.04+ : 3.31).
- name: Install the sqlite3 command-line tool
  ansible.builtin.apt:
    name: sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# ── Chiffrement (même mécanisme que postgres-backup-install) ────────────────
- name: Install age (encrypted archives)
  when: sync_backup_encrypt_recipient | length > 0
  tags: [retarget]
  block:
    - name: Install the age package
      ansible.builtin.apt:
        name: age
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
  rescue:
    - name: Refuse to back up without encryption
      ansible.builtin.fail:
        msg: >-
          Le paquet `age` est introuvable sur {{ ansible_distribution | default('?') }}
          {{ ansible_distribution_version | default('?') }} (paquet officiel : Ubuntu 22.04+, Debian 12+).
          Le chiffrement est demandé (`sync_backup_encrypt_recipient`) : aucune archive ne partira en clair.

# ── Clé, destination (compte dédié, répertoire, clé liée, pare-feu), known_hosts ──
- name: Ensure root's .ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true
  tags: [retarget]

# Tag `retarget` : la clé publique est lue par les tâches de destination, qui le portent.
- name: Generate the dedicated backup SSH key
  community.crypto.openssh_keypair:
    path: "{{ sync_backup_ssh_key }}"
    type: ed25519
    comment: "{{ inventory_hostname }}-{{ sync_backup_name }}-backup"
  become: true
  register: sync_backup_key
  tags: [retarget]

- name: Prepare the destination for this source
  ansible.builtin.import_role:
    name: backup-setup
    tasks_from: source
  vars:
    bk_dest_host: "{{ sync_backup_dest_host }}"
    bk_dest_port: "{{ sync_backup_dest_port }}"
    bk_name: "{{ sync_backup_name }}"
    bk_keep: "{{ sync_backup_keep }}"
    bk_pubkey: "{{ sync_backup_key.public_key }}"
    bk_comment: "{{ inventory_hostname }}-{{ sync_backup_name }}-backup"
  tags: [retarget]

# Les scripts tournent en root : le known_hosts est celui de root. Clé d'hôte lue sur la destination par la
# connexion d'Ansible (backup-setup/tasks/source.yml, `bk_dest_hostkey`), pas par un `ssh-keyscan` du poste.
- name: Refresh the destination host key in root's known_hosts
  ansible.builtin.known_hosts:
    path: "{{ sync_backup_known_hosts }}"
    name: "{{ sync_backup_known_host }}"
    key: "{{ sync_backup_known_host }} {{ bk_dest_hostkey }}"
    state: present
  become: true
  tags: [retarget]

# ── Métriques ───────────────────────────────────────────────────────────────
- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: '0755'
  become: true

# ── Script, cron, rotation du journal ───────────────────────────────────────
- name: Deploy the backup script
  ansible.builtin.template:
    src: sync-backup.sh.j2
    dest: "{{ sync_backup_script }}"
    owner: root
    group: root
    mode: '0750'
  become: true
  register: sync_backup_script_deployed
  tags: [retarget]

- name: Schedule the backup
  ansible.builtin.cron:
    name: "{{ sync_instance }} sqlite backup"
    user: root
    hour: "{{ sync_backup_cron_hour }}"
    minute: "{{ sync_backup_cron_minute }}"
    job: "{{ sync_backup_script | quote }} >> {{ sync_backup_log | quote }} 2>&1"
  become: true

- name: Rotate the backup log
  ansible.builtin.copy:
    dest: "/etc/logrotate.d/sync-backup-{{ sync_instance }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ sync_backup_log }} {
          weekly
          rotate 8
          compress
          missingok
          notifempty
          copytruncate
      }
  become: true

# Première exécution à l'installation (et à chaque changement du script) : elle
# prouve la chaîne complète (SSH, VACUUM INTO, archive, métrique) au lieu de
# l'attendre à 04:xx, et fait exister `backup_last_success_timestamp_seconds`
# dès le déploiement. Le script sort en 0 sans rien faire s'il n'y a pas encore
# de base.
- name: Run the backup once to prove the whole chain
  ansible.builtin.command: "{{ sync_backup_script | quote }}"
  become: true
  changed_when: sync_backup_script_deployed.changed
  when: sync_backup_script_deployed.changed
