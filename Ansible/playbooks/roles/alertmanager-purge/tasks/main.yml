---
# Supprime Alertmanager ET ses données : conteneur, image, configuration
# (identifiants SMTP inclus) et état persistant (silences, historique).

- name: Stop and remove Alertmanager container
  community.docker.docker_container:
    name: alertmanager
    state: absent
  become: true
  ignore_errors: true

- name: Remove Alertmanager firewall rules
  community.general.ufw:
    rule: "{{ item }}"
    proto: tcp
    port: "{{ alertmanager_port }}"
    delete: true
  loop: [allow, deny]
  become: true
  ignore_errors: true

- name: Remove Alertmanager image
  community.docker.docker_image_remove:
    name: "prom/alertmanager:latest"
  become: true
  ignore_errors: true

- name: Remove Alertmanager directory (config with SMTP credentials, state)
  ansible.builtin.file:
    path: "{{ alertmanager_home }}"
    state: absent
  become: true

# ── Supervision ────────────────────────────────────────────────────────────
# La cible native est retirée avec le service : une cible orpheline reste
# `down` pour toujours et fait sonner `TargetDown` sur un service désinstallé.
- name: Remove the Prometheus target
  ansible.builtin.file:
    path: "/home/{{ remote_username }}/prometheus/prometheus-configs/alertmanager/{{ inventory_hostname }}.json"
    state: absent
  delegate_to: "{{ prometheus_host }}"
  become: true
  when: prometheus_host is defined and prometheus_host in hostvars
  tags: [monitoring]
