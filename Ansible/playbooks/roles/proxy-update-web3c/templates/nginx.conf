user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {  
        # Basic Settings
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        server_names_hash_bucket_size 128;
        # server_name_in_redirect off;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # SSL Settings
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        # Logging Settings
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Gzip Settings
        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        #include /etc/nginx/conf.d/*.conf;
        limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=5r/s;
        
        client_header_buffer_size 16k;
        large_client_header_buffers 4 32k;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # To allow large docker images upload
        client_max_body_size 0;

        include /etc/nginx/sites-enabled/*;
}

stream {
    limit_conn_zone $binary_remote_addr zone=stream_limit_conn:10m;
    log_format stream_log_format '$remote_addr [$time_local] $protocol '
                                 '"$status" $bytes_sent $bytes_received '
                                 '"$session_time"';
    access_log /var/log/nginx/stream-access.log stream_log_format buffer=32k;
    error_log /var/log/nginx/stream-error.log;
    include /etc/nginx/streams-enabled/*;
}
