server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           back.tradekong.app;

  location / {
    proxy_pass         http://{{ hostvars['tradekong'].ansible_host }}:{{ hostvars['tradekong'].back_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   on;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # Allow connections from VPNs, back servers and whitelist
    # DEBUG vpns: {{ groups['vpns'] | length }} hosts
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
    {% endfor %}
    # DEBUG whitelist: {{ whitelist | length }} IPs
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    {% for ip in cloudflare_ips %}
    allow {{ ip }};
    {% endfor %}
    allow {{ hostvars['tradekong'].ansible_host }};
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/tradekong.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tradekong.app/privkey.pem;
}
