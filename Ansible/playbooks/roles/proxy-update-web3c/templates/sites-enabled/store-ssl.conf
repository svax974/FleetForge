server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           store.{{ domain_name }};

  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;

    # Allow connections from VPNs, back servers and whitelist
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    {% for host in groups.get('backs', []) %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    {# TODO: Uncomment this when we have front servers
    {% for host in groups['fronts'] %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    #}
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
  #include /etc/letsencrypt/options-ssl-nginx.conf;
  #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
