server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           docker-repo.{{ domain_name }};

  location / {
    proxy_pass         http://{{ hostvars['docker-repo'].ansible_host }}:{{ docker_repo_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # Needed for docker registry
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    # For PATCH chunked
    chunked_transfer_encoding on;
    # For large blobs
    proxy_max_temp_file_size 0;

    # Allow connections from VPNs, back servers and whitelist
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    {% for host in groups.get('backs', []) %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    {% for host in groups['fronts'] %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
  #include /etc/letsencrypt/options-ssl-nginx.conf;
  #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
