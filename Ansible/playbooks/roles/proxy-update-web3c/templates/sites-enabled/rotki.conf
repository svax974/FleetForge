{# ── Rotki (sidecar de valorisation de portefeuille, TradeKong) ────────────────
   Le service lui-même est déployé par les rôles `rotki-*` sur l'hôte nommé par
   `rotki_host` (machine de `ctdapi`, dédiée — jamais co-localisée avec un
   proxy, contrairement à SearXNG). Ce gabarit ne décide de rien : il RÉSOUT
   l'adresse du backend et se tait quand ce proxy n'a pas le droit de
   l'atteindre.

   Un proxy écarté de `rotki_allowed_proxies` ne reçoit AUCUN vhost : servir
   une page qui répondrait 502 vers un port fermé serait pire que ne rien
   servir — l'erreur ressemblerait à une panne de Rotki. #}
{% set rk_allowed = rotki_allowed_proxies | default([]) %}
{% if (rotki_host | default('rotki')) in hostvars and inventory_hostname in rk_allowed %}
{% set rk_ip = hostvars[rotki_host | default('rotki')].ansible_host %}
{% set rk_upstream = 'http://' ~ rk_ip ~ ':' ~ (rotki_port | default(4302)) %}
# Backend Rotki : {{ rk_upstream }} (hôte distant {{ rotki_host | default('rotki') }}, jamais co-localisé)

# ── Redirect plain HTTP ──────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name {{ rotki_hostname | default('rotki.' ~ domain_name) }};
    return 301 https://$host$request_uri;
}

# ── API vhost — token-gated ──────────────────────────────────────────────────
# Restreint QUI peut même parler à Rotki depuis l'extérieur de cette machine ;
# ne remplace pas l'authentification propre de Rotki (session/API applicative)
# pour les appels qui en ont besoin — c'est une couche en plus, pas à la place.
server {
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name {{ rotki_hostname | default('rotki.' ~ domain_name) }};

    ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}//fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}//privkey.pem;

    set $expected_key "{{ rotki_api_key }}";

    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_cache off;

    location / {
        {% set access_entry = rotki_host | default('rotki') %}
        {% set access_mode_local = none %}
        {% include '_access.inc' %}
        if ($http_x_api_key != $expected_key) {
            return 401;
        }

        proxy_pass       {{ rk_upstream }};

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}

# ── The web UI, on the operator networks only ────────────────────────────────
# Rotki a sa PROPRE authentification (compte/mot de passe applicatif) : pas de
# jeton en-tête ici, un navigateur n'en envoie pas. Mode PRIVÉ forcé pour ce
# bloc (`access_mode_local`), quel que soit le mode de l'entrée — qui ne
# concerne que l'API gardée par jeton ci-dessus.
#
# `deny all` n'est PAS optionnel : sans lui, ce bloc serait une instance Rotki
# ouverte sur Internet — portefeuilles et intégrations exchange compris.
server {
    listen      80;
    server_name rotki.lan;

    location / {
        {% set access_mode_local = 'private' %}
        {% include '_access.inc' %}

        proxy_pass       {{ rk_upstream }};
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
{% else %}
# Rotki n'est pas déployé sur ce parc, ou {{ inventory_hostname }} ne fait pas
# partie de `rotki_allowed_proxies` : aucun vhost n'est servi ici.
{% endif %}
