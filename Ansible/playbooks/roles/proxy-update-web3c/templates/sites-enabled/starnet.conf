{# ── StarNet ─────────────────────────────────────────────────────────────────
   Harnais d'agents IA (UI + moteur dans un seul process Node), déployé par les
   rôles `starnet-*` sur l'hôte nommé par `starnet_host` (machine de
   `ctdapi`, partagée, jamais co-localisée avec un proxy). Le sidecar n'écoute
   que sur 127.0.0.1 ; ce gabarit vise le RELAI (`app_port`), qui renvoie sur
   la boucle locale, et que starnet-security n'ouvre qu'aux proxies, à la
   whitelist, à Prometheus et aux VPN.

   Mode PRIVÉ (`access_mode` de l'entrée, _access.inc) : whitelist +
   supervision + VPN, par demande explicite (09/10/2026) : aucune autre machine n'a de raison d'ouvrir cette interface. Le
   jeton d'API est INJECTÉ dans la page servie : quiconque la charge pilote la
   station, outils shell compris. Ces `allow` sont la seule barrière.

   Deux en-têtes RÉÉCRITS, sans quoi le sidecar répond 403 à tout
   (sidecar/apiauth.js, garde anti-DNS-rebinding) :
     • `Host` → la boucle locale (« forbidden host » sinon) ;
     • `Origin` → http://127.0.0.1:<port du sidecar>, UNIQUEMENT quand il vaut
       l'origine publique de ce vhost. Toute autre origine passe telle quelle
       et reste refusée par le sidecar : on ne neutralise pas son contrôle
       anti-CSRF, on lui présente notre propre origine sous le nom qu'il
       connaît. #}
{% set sn_host = starnet_host | default('starnet') %}
{% if sn_host in hostvars %}
{% set sn_upstream = 'http://' ~ hostvars[sn_host].ansible_host ~ ':' ~ (hostvars[sn_host].app_port | default(4720)) %}
{% set sn_sidecar_port = starnet_sidecar_port | default(8787) %}
{% set sn_name = starnet_hostname | default('starnet.' ~ domain_name) %}
# Backend StarNet (relai) : {{ sn_upstream }} (hôte distant {{ sn_host }})

# Contexte http (sites-enabled est inclus dans le bloc http de nginx.conf) :
# nom de variable propre à ce vhost, une `map` étant globale.
map $http_origin $starnet_upstream_origin {
    default                  $http_origin;
    "https://{{ sn_name }}"  "http://127.0.0.1:{{ sn_sidecar_port }}";
}

# ── Redirect plain HTTP ──────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name {{ sn_name }};
    return 301 https://$host$request_uri;
}

server {
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name {{ sn_name }};

    ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Pièces jointes du canal COMMS (upload de fichiers vers les agents).
    client_max_body_size 50m;

    location / {
        {% set access_entry = sn_host %}
        {% include '_access.inc' %}

        proxy_pass         {{ sn_upstream }};
        proxy_set_header   Host              127.0.0.1:{{ sn_sidecar_port }};
        proxy_set_header   Origin            $starnet_upstream_origin;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Le frontal consomme l'état du harnais en flux continus (SSE et
        # NDJSON de /api/run) : jamais bufferisés, jamais coupés au bout des
        # 60 s par défaut — une exécution d'agent dure bien plus.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
{% else %}
# StarNet n'est pas déployé sur ce parc (pas d'entrée `{{ sn_host }}` dans
# l'inventaire) : aucun vhost n'est servi ici.
{% endif %}
