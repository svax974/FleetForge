server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           www.tradekong.app;

  location / {
    proxy_pass         http://{{ hostvars['tradekong'].ansible_host }}:{{ hostvars['tradekong'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   on;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }
  ssl_certificate /etc/letsencrypt/live/tradekong.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tradekong.app/privkey.pem;
}
