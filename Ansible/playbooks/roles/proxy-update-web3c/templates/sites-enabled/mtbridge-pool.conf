# MTBridge Gateway Pool — nginx consistent hash proxy
#
# Routes requests to backend MTBridge instances based on X-MT5-User header.
# Same userId always hits the same backend (ketama consistent hashing).
# On pool resize, only ~1/N users are redistributed.
#
# Usage:
#   cp nginx-pool.conf /etc/nginx/conf.d/mtbridge-pool.conf
#   # Edit server IPs/ports to match your VPS instances
#   nginx -t && systemctl reload nginx

upstream mtbridge_pool {
    hash $http_x_mt5_user consistent;

    server {{ hostvars['mtbridge'].ansible_host }}:{{ hostvars['mtbridge'].app_port }} max_fails=3 fail_timeout=30s;  # VPS 1
    #server 10.0.0.2:5005 max_fails=3 fail_timeout=30s;  # VPS 2
    #server 10.0.0.3:5005 max_fails=3 fail_timeout=30s;  # VPS 3 (uncomment when ready)

    keepalive 16;
}

server {
    listen 443 ssl;
    server_name mtbridge.web3c.cc;

    location / {
        proxy_pass http://mtbridge_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-MT5-User $http_x_mt5_user;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        # Allow connections from VPNs, back servers and whitelist
        {% for host in groups['vpns'] %}
        allow {{ hostvars[host]['ansible_host'] }};
        {% endfor %}
        {% for ip in whitelist %}
        allow {{ ip }};
        {% endfor %}
        {% for ip in cloudflare_ips %}
        allow {{ ip }};
        {% endfor %}
        {% for host in groups['apps'] %}
        allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
        {% endfor %}
        deny all;
    }
    ssl_certificate /etc/letsencrypt/live/web3c.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web3c.cc/privkey.pem;

    client_max_body_size 10m;
}