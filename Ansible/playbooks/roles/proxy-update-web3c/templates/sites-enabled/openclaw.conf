{# Déployé sur TOUS les proxies (proxy1 ET proxy2) : openclaw.web3c.cc pointe
   sur eux, pas sur l'IP propre de la machine hub (entrée `openclaw`, derrière le NAT domestique,
   ce n'est pas là que le vhost écoute).

   `proxy_pass` vise TOUJOURS l'IP publique de l'entrée `openclaw` (`ansible_host`), y
   compris depuis proxy2 : proxy2 partage cette même IP publique (NAT
   domestique), donc un `proxy_pass` vers elle depuis proxy2 revient en
   hairpin NAT — le service verrait alors la même adresse pour un relai réel
   et pour un client testant depuis ce même réseau, ce qui invaliderait
   `gateway.trustedProxies` (openclaw-install) pour ce chemin précis.
   Non traité ici : proxy1 (Contabo, réellement distant) est le chemin
   RÉELLEMENT servi pour ce vhost, le cas proxy2 est resté théorique. S'il
   doit un jour relayer ce service, ajouter un `app_lan_ip` sur l'entrée `openclaw`
   (IP LAN sur 192.168.1.0/24) et
   distinguer les deux cas comme le fait déjà mtbridge.conf/searxng.conf. #}
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           openclaw.{{ domain_name }};

  # Allow cloudflare IP to rewrite the remote_addr with real addr
  {% for ip in cloudflare_ips %}
  set_real_ip_from {{ ip }};
  {% endfor %}
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  location / {
    proxy_pass         http://{{ hostvars['openclaw'].ansible_host }}:{{ hostvars['openclaw'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    # ÉCRASER X-Forwarded-For, ne pas l'enrichir : `$proxy_add_x_forwarded_for`
    # ajoute $remote_addr à la suite d'un éventuel en-tête déjà présent (celui
    # que Cloudflare a posé, réécrit par `real_ip_recursive` mais pas retiré),
    # ce qui produit une chaîne à plusieurs valeurs. La gateway OpenClaw exige
    # que le proxy de confiance ÉCRASE l'en-tête avec une seule adresse — sinon
    # elle la juge « proxy-shaped mais non attribuable » et rejette la requête
    # (proxy_attribution_required), même quand le pair TCP figure bien dans
    # gateway.trustedProxies (constaté le 09/09/2026, doc gateway/trusted-proxy-auth).
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    {% set access_entry = 'openclaw' %}
    {% include '_access.inc' %}
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
