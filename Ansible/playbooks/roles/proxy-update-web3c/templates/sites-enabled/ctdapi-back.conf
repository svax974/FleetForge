# Websockets : `Connection` ne doit valoir "upgrade" QUE sur une vraie demande
# d'upgrade. L'envoyer sur toutes les requêtes laisse l'upstream Node face à un
# `Connection: upgrade` sans `Upgrade`, ce qu'il peut garder ouvert jusqu'au
# timeout. Variable préfixée : les fichiers de sites-enabled partagent le même
# http{}, un nom générique entrerait en collision avec un autre vhost.
map $http_upgrade $ctdapi_connection_upgrade {
  default upgrade;
  ''      close;
}

# Quand l'upstream est injoignable, nginx fabrique lui-même la 502/504 et cette
# réponse ne porte aucun en-tête CORS : le navigateur masque alors la vraie
# panne derrière « No 'Access-Control-Allow-Origin' header ». On ne réintroduit
# l'en-tête QUE si l'upstream n'en a pas déjà mis un (sinon le navigateur rejette
# la réponse pour en-tête dupliqué), et uniquement pour nos propres origines.
map $http_origin $ctdapi_cors_origin {
  default                                    '';
  '~^https://([a-z0-9-]+\.)*tradekong\.app$' $http_origin;
  '~^https://([a-z0-9-]+\.)*web3c\.cc$'      $http_origin;
  '~^http://localhost(:[0-9]+)?$'            $http_origin;
}

map $upstream_http_access_control_allow_origin $ctdapi_cors_fallback {
  ''      $ctdapi_cors_origin;
  default '';
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           ctdapi-back.{{ domain_name }};

  location / {
    proxy_pass         http://{{ hostvars['ctdapi'].ansible_host }}:{{ hostvars['ctdapi'].back_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $ctdapi_connection_upgrade;

    # Défaut nginx (60s) trop court face au budget de llm-proxy (jusqu'à
    # forwardTimeoutMs par tentative de fallback) : une seule tentative lente
    # fait tomber ici en 504 avant que llm-proxy ait pu échouer proprement ou
    # basculer sur le backend suivant.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Valeur vide = en-tête non ajouté : sur une réponse normale l'upstream garde
    # la main sur sa politique CORS, sur une page d'erreur nginx on prend le relais.
    add_header Access-Control-Allow-Origin $ctdapi_cors_fallback always;

    # Allow connections from VPNs, back servers and whitelist
    # DEBUG vpns: {{ groups['vpns'] | length }} hosts
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
    {% endfor %}
    # DEBUG whitelist: {{ whitelist | length }} IPs
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    # DEBUG apps: {{ groups['apps'] | length }} hosts
    {% for ip in cloudflare_ips %}
    allow {{ ip }};
    {% endfor %}
    {% for host in groups['apps'] %}
    allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
