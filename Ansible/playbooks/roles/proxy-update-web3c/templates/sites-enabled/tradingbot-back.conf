server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           tradingbot-back.{{ domain_name }};

  location / {
    proxy_pass         http://{{ hostvars['tradingbot'].ansible_host }}:{{ hostvars['tradingbot'].back_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # Allow connections from VPNs, back servers and whitelist
    # DEBUG vpns: {{ groups['vpns'] | length }} hosts
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
    {% endfor %}
    # DEBUG whitelist: {{ whitelist | length }} IPs
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    allow {{ hostvars['tradingbot'].ansible_host }};
    {% for ip in cloudflare_ips %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
  #include /etc/letsencrypt/options-ssl-nginx.conf;
  #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
