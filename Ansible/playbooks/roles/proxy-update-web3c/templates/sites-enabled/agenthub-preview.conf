{# ── AgentHub — aperçus des serveurs de dev (une origine par session et par port) ──
   Un agent lance un serveur de dev ; le hub le rend visible à l'opérateur sur
   `<sessionId>-<port>.preview.<domain_name>` (docs/preview-origin.md du dépôt AgentHub) : une ORIGINE
   PAR APERÇU, pour qu'une appli de dev (du code non fiable) ne partage ni cookies ni stockage avec le
   hub ni avec un autre aperçu. Le hub répond sur ces noms, et NULLE PART ailleurs sous ce domaine
   (AGENTHUB_PREVIEW_HOST) : il ne sert que le tunnel d'aperçu, jamais son API.

   Contrairement au vhost `agenthub`, la cible est le back-lb (`back_port`), pas le conteneur front : la
   route d'aperçu vit dans le back, le nginx du front ne relaie que /api/.

   Certificat : `*.preview.<domain_name>` est un wildcard À DEUX niveaux ; le `*.<domain_name>` du parc
   n'en couvre qu'un. Certificat dédié `preview.<domain_name>` (cert-install, tâche « preview »), et
   enregistrement DNS `*.preview` en CNAME vers le front des proxies (DNS seul, jamais proxifié).

   Même mode d'accès que l'entrée `agenthub` (privé : vpns + supervision + whitelist) : un aperçu exécute du
   code d'agent, il ne doit pas être public. #}
{% set ah_ip = hostvars['agenthub'].ansible_host %}
{% set ah_back_port = hostvars['agenthub'].back_port %}
{% set access_entry = 'agenthub' %}
# Aperçus AgentHub (back-lb) : http://{{ ah_ip }}:{{ ah_back_port }}

server {
    listen      80;
    listen      [::]:80;
    server_name *.preview.{{ domain_name }};
    return 301 https://$host$request_uri;
}

server {
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name *.preview.{{ domain_name }};

    ssl_certificate     /etc/letsencrypt/live/preview.{{ domain_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.{{ domain_name }}/privkey.pem;

    location / {
        {% include '_access.inc' %}

        proxy_pass         http://{{ ah_ip }}:{{ ah_back_port }};
        proxy_http_version 1.1;
        # Le hub lit le Host : il porte l'identifiant de session et le port.
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # HMR (WebSocket) du serveur de dev, jamais bufferisé ni coupé à 60 s.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
