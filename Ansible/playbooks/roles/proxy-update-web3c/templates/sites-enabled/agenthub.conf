{# ── AgentHub hub ─────────────────────────────────────────────────────────
   Hub AgentHub (front nginx + back NestJS + Postgres, Docker Compose,
   AppTemplate) déployé par les rôles `agenthub-*` sur l'hôte `agenthub` —
   MÊME machine que `ctdapi`/`rotki`/`xbot`/`docker-repo`/`dev` (machine
   partagée). Un seul point d'entrée HTTP côté hôte : le conteneur front (son
   propre nginx interne relaie /api/ vers le back NestJS à l'intérieur du
   réseau Docker du projet, voir
   docs/plans/2026-09-24-agenthub/01-architecture.md D11) — ce gabarit ne
   proxifie donc QUE vers `app_port` (front), jamais directement vers
   `back_port`.

   DNS : CNAME vers le front des proxies (round-robin, cloudflare-dns-update),
   pas de record A vers l'IP propre de cet hôte — même mécanisme que
   rotki.conf/freellm.conf (`proxy_hostname` sur l'entrée `agenthub` de
   l'inventaire, CNAME publié par la synchronisation générique). Le trafic
   ne passe donc jamais par l'edge Cloudflare (`proxied: false` sur ce CNAME) :
   $remote_addr est déjà la vraie IP cliente ici — contrairement à
   ctdapi.conf (record A direct + Cloudflare proxifié), pas besoin de
   `set_real_ip_from`/`CF-Connecting-IP`.

   Mode PRIVÉ (`access_mode` de l'entrée `agenthub`, _access.inc) : vpns +
   supervision + whitelist. Outil interne (auth admin wallet + clés API à
   scopes, 01-architecture.md D6/D7), pas un site public. Jusqu'au 11/10/2026
   le vhost autorisait TOUT le parc : aucune machine n'en était cliente — le
   runner colocalisé joint le hub en boucle locale (ws://127.0.0.1), pas par
   ce vhost. Un runner DISTANT ou un consommateur API (D7) se déclare dans
   `access_linked` de l'entrée, pas en rouvrant tout le parc.

   WebSocket : le hub sert trois canaux sous /api/v1/agenthub/ws/ (ui,
   terminal/:id, runner — D11) qui doivent rester ouverts durablement (une
   session tmux/agent en cours) et ne jamais être bufferisés par nginx — bloc
   dédié ci-dessous, séparé de `location /` pour ne pas imposer ces réglages
   (timeout d'1h, buffering désactivé) au reste du trafic (assets statiques,
   REST classique). #}
{% set ah_ip = hostvars['agenthub'].ansible_host %}
{% set ah_port = hostvars['agenthub'].app_port %}
{% set ah_upstream = 'http://' ~ ah_ip ~ ':' ~ ah_port %}
{% set access_entry = 'agenthub' %}
# Backend AgentHub (front) : {{ ah_upstream }}

server {
    listen      80;
    listen      [::]:80;
    server_name agenthub.{{ domain_name }};
    return 301 https://$host$request_uri;
}

server {
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name agenthub.{{ domain_name }};

    ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;

    # Sessions WebSocket longue durée (UI, terminal partagé, runner) : jamais
    # bufferisées, jamais coupées par le défaut nginx de 60s. Isolé de
    # `location /` pour ne pas imposer ces réglages au reste du trafic.
    location /api/v1/agenthub/ws/ {
        {% include '_access.inc' %}

        proxy_pass         {{ ah_upstream }};
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Au moins 1h (demande explicite) : une session agent/terminal peut
        # rester ouverte bien plus longtemps qu'une requête HTTP classique.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Indispensable pour un tunnel WebSocket : nginx ne doit jamais
        # attendre d'avoir bufferisé une trame complète avant de la relayer.
        proxy_buffering    off;
    }

    # Remote git hébergé par le hub (clone / fetch / push des runners, smart HTTP) : un push transporte
    # des packfiles entiers — pas de plafond de corps à 1 Mo, corps streamé sans mise en tampon disque,
    # transferts longs non coupés à 60 s. Isolé de `location /` comme le bloc WebSocket ci-dessus.
    # Le conteneur front (même réglage dans son nginx) relaie ensuite vers le back.
    location /api/v1/agenthub/git/ {
        {% include '_access.inc' %}

        proxy_pass            {{ ah_upstream }};
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        client_max_body_size  4g;
        proxy_request_buffering off;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    location / {
        {% include '_access.inc' %}

        proxy_pass         {{ ah_upstream }};
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
