{# ── FreeLLMAPI ──────────────────────────────────────────────────────────────
   Proxy unifié multi-fournisseurs LLM (tableau de bord + API OpenAI-compatible
   /v1), déployé par les rôles `freellm-*` sur l'hôte nommé par `freellm_host`.
   Ce gabarit ne décide de rien : il RÉSOUT l'adresse du backend et se tait
   quand ce proxy n'a pas le droit de l'atteindre.

   Service à usage unique (single-user, cf. install.sh) : pas d'authentification
   applicative sur le tableau de bord, la restriction vit ENTIÈREMENT dans ce
   vhost — mode PRIVÉ (`access_mode` de l'entrée, _access.inc). L'API /v1 porte son propre jeton bearer côté
   application, mais reste derrière la même restriction réseau par cohérence :
   elle n'a pas vocation à être publique.

   Deux situations, cf. freellm-install/defaults :
     • FreeLLMAPI est sur CETTE machine → 127.0.0.1, le trafic ne quitte jamais
       la boucle locale et le port n'est publié que dessus ;
     • FreeLLMAPI est ailleurs → son IP publique, et c'est `freellm-security`
       qui autorise ce proxy dans la chaîne DOCKER-USER de la machine distante.

   Un proxy écarté de `freellm_allowed_proxies` ne reçoit AUCUN vhost : servir
   une page qui répondrait 502 vers un port fermé serait pire que ne rien
   servir — l'erreur ressemblerait à une panne de FreeLLMAPI. #}
{% set fl_allowed = freellm_allowed_proxies | default(groups['proxies'] | default([])) %}
{% if (freellm_host | default('freellm')) in hostvars and inventory_hostname in fl_allowed %}
{% set fl_ip = hostvars[freellm_host | default('freellm')].ansible_host %}
{% set fl_backend = '127.0.0.1' if fl_ip == ansible_host else fl_ip %}
{% set fl_port = hostvars[freellm_host | default('freellm')].app_port | default(3001) %}
{% set fl_upstream = 'http://' ~ fl_backend ~ ':' ~ fl_port %}
# Backend FreeLLMAPI : {{ fl_upstream }}
# ({{ 'co-localisé sur ce proxy' if fl_backend == '127.0.0.1' else 'hôte distant ' ~ (freellm_host | default('freellm')) }})

# ── Redirect plain HTTP ──────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name {{ freellm_hostname | default('freellm.' ~ domain_name) }};
    return 301 https://$host$request_uri;
}

server {
{# HTTP/2 s'active de deux façons selon la version de nginx, et la mauvaise
   n'est pas ignorée : elle empêche nginx de DÉMARRER. Le parc n'est pas
   homogène (cf. searxng.conf) — on rend la forme valide pour l'hôte plutôt
   que d'aligner les versions. #}
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name {{ freellm_hostname | default('freellm.' ~ domain_name) }};

    ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        {% set access_entry = freellm_host | default('freellm') %}
        {% include '_access.inc' %}

        proxy_pass         {{ fl_upstream }};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Requêtes de complétion : un modèle amont lent peut largement dépasser
        # le défaut nginx de 60s.
        proxy_read_timeout 120s;
    }
}
{% else %}
# FreeLLMAPI n'est pas déployé sur ce parc, ou {{ inventory_hostname }} ne fait
# pas partie de `freellm_allowed_proxies` : aucun vhost n'est servi ici.
{% endif %}
