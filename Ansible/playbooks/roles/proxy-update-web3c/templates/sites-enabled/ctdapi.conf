server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           ctdapi.{{ domain_name }};

  # Allow cloudflare IP to rewrite the remote_addr with real addr
  {% for ip in cloudflare_ips %}
  set_real_ip_from {{ ip }};
  {% endfor %}
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  location / {
    proxy_pass         http://{{ hostvars['ctdapi'].ansible_host }}:{{ hostvars['ctdapi'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # Allow every host of the fleet (web3c couvre tous les groupes, VPN et
    # back compris), dédupliqué — plusieurs entrées d'inventaire partagent la
    # même adresse — plus la whitelist opérateur.
    {% for ip in groups['web3c'] | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list %}
    allow {{ ip }};
    {% endfor %}
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
