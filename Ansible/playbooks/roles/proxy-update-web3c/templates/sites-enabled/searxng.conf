{# ── Relai SearXNG ────────────────────────────────────────────────────────────
   Le service lui-même est déployé par les rôles `searxng-*` sur l'hôte nommé
   par `searxng_host`. Ce gabarit ne décide de rien : il RÉSOUT l'adresse du
   backend et se tait quand ce proxy n'a pas le droit de l'atteindre.

   Deux situations, cf. searxng-install/defaults :
     • SearXNG est sur CETTE machine (le cas de proxy1) → 127.0.0.1, le trafic
       ne quitte jamais la boucle locale et le port n'est publié que dessus ;
     • SearXNG est ailleurs → son IP publique, et c'est `searxng-security` qui
       autorise ce proxy dans la chaîne DOCKER-USER de la machine distante.

   Un proxy écarté de `searxng_allowed_proxies` ne reçoit AUCUN vhost : servir
   une page qui répondrait 502 vers un port fermé serait pire que ne rien
   servir — l'erreur ressemblerait à une panne de SearXNG. #}
{% set sx_allowed = searxng_allowed_proxies | default(groups['proxies'] | default([])) %}
{% if (searxng_host | default('searxng')) in hostvars and inventory_hostname in sx_allowed %}
{% set sx_ip = hostvars[searxng_host | default('searxng')].ansible_host %}
{% set sx_backend = '127.0.0.1' if sx_ip == ansible_host else sx_ip %}
{% set sx_upstream = 'http://' ~ sx_backend ~ ':' ~ (searxng_port | default(8888)) %}
# Backend SearXNG : {{ sx_upstream }}
# ({{ 'co-localisé sur ce proxy' if sx_backend == '127.0.0.1' else 'hôte distant ' ~ (searxng_host | default('searxng')) }})

# ── Redirect plain HTTP ──────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name {{ searxng_hostname | default('searxng.' ~ domain_name) }};
    return 301 https://$host$request_uri;
}

# ── API vhost — token-gated ──────────────────────────────────────────────────
server {
{# HTTP/2 s'active de deux façons selon la version de nginx, et la mauvaise n'est
   pas ignorée : elle empêche nginx de DÉMARRER (« unknown directive "http2" »,
   proxy2 à terre le 13/08/2026). Le parc n'est pas homogène — proxy1 en 1.30.0,
   proxy2 en 1.24.0 fournie par Ubuntu — donc on rend la forme valide pour
   l'hôte plutôt que d'aligner les versions, ce qui ne tient pas dans le temps. #}
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name {{ searxng_hostname | default('searxng.' ~ domain_name) }};

    ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}//fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}//privkey.pem;

    # The app sends this as the X-Api-Key header. The value lives in
    # group_vars (`searxng_api_key`), not here: a secret written into a config
    # template gets copied around by people who never read it. Rotate with
    #   openssl rand -base64 32
    set $expected_key "{{ searxng_api_key }}";

    # Nothing here is a browsable site: keep it out of search engines and logs
    # of referrers.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Requests carry a shared secret — never let a proxy cache them.
    proxy_cache off;

    location / {
        {% set access_entry = searxng_host | default('searxng') %}
        {% set access_mode_local = none %}
        {% include '_access.inc' %}
        # `if` inside `location` is famously restricted in nginx, but a bare
        # variable comparison that returns a status is one of the two documented
        # safe cases — this is the pattern, not a workaround.
        if ($http_x_api_key != $expected_key) {
            return 401;
        }

        proxy_pass       {{ sx_upstream }};

        proxy_set_header Host              $host;
        # The limiter, if you left it on, judges by client IP. Without these it
        # sees every request as coming from nginx itself and throttles the lot.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A metasearch fans out to upstream engines: a cold query is slow.
        # The app gives up at 15 s, so anything above that is wasted patience.
        proxy_read_timeout 20s;
    }

    # ── Variant: HTTP Basic instead of the token header ──────────────────────
    # Delete the `if` block above and uncomment these two lines, then leave the
    # token field EMPTY in the app and put the credentials in the instance URL
    # (https://user:password@SEARX_HOSTNAME). Both schemes can also be combined.
    #
    #   auth_basic           "SearXNG";
    #   auth_basic_user_file /etc/nginx/searxng.htpasswd;
    #
    # Create the file with:  sudo htpasswd -c /etc/nginx/searxng.htpasswd USER
}

# ── The web UI, on the operator networks only ────────────────────────────────
# Gating on a header kills the browser UI on the vhost above — no browser sends
# X-Api-Key. This second name keeps the UI reachable without the gate.
#
# `deny all` is NOT optional: in nginx, `allow` directives without a closing
# `deny all` leave everything else ALLOWED. Without it this block is an open
# metasearch instance on port 80 — reachable by anyone who sends the right Host
# header, which is trivial. An open instance gets abused, then blocked by the
# upstream engines, and the relay above dies with it.
# Mode PRIVÉ forcé pour ce bloc (`access_mode_local`, _access.inc), quel que
# soit le mode de l'entrée — qui ne concerne que l'API gardée par jeton.
server {
    listen      80;
    server_name searx.lan;

    location / {
        {% set access_mode_local = 'private' %}
        {% include '_access.inc' %}

        proxy_pass       {{ sx_upstream }};
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
{% else %}
# SearXNG n'est pas déployé sur ce parc, ou {{ inventory_hostname }} ne fait pas
# partie de `searxng_allowed_proxies` : aucun vhost n'est servi ici.
{% endif %}
