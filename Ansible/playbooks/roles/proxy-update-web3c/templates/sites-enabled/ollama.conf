{# ── Ollama (API d'inférence) ─────────────────────────────────────────────────
   Le service est déployé par les rôles `ollama-*` sur l'entrée `ollama`
   (machine hub, derrière le NAT domestique). Publié en MODE
   PRIVÉ (`access_mode`, _access.inc) : vpns + supervision + whitelist.

   L'API Ollama n'a AUCUNE authentification : qui l'atteint liste les modèles,
   en télécharge (disque plein) et consomme le GPU. Les `allow` ci-dessous et
   le filtrage du port 11434 (ollama-security) sont ses deux seules barrières.

   `proxy_pass` vise l'IP publique de l'entrée, comme openclaw.conf : proxy1
   (distant) est le chemin servi. Depuis proxy2 — même NAT que hub — ce serait
   un hairpin NAT, non traité ici. Le port doit être redirigé par le routeur
   (11434 → hub), hors Ansible : sans redirection, le vhost répond 502.

   Un proxy qui ne trouve pas l'entrée `ollama` ne reçoit AUCUN vhost. #}
{% if 'ollama' in hostvars %}
{% set ol_upstream = 'http://' ~ hostvars['ollama'].ansible_host ~ ':' ~ (hostvars['ollama'].app_port | default(11434)) %}
{% set ol_name = hostvars['ollama'].proxy_hostname | default('ollama.' ~ domain_name) %}
# Backend Ollama : {{ ol_upstream }}

# ── Redirect plain HTTP ──────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name {{ ol_name }};
    return 301 https://$host$request_uri;
}

server {
{% if nginx_version is version('1.25.1', '>=') %}
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
{% else %}
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
{% endif %}
    server_name {{ ol_name }};

    ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Les requêtes /api/chat et /api/generate peuvent porter des images en
    # base64 : le défaut de 1 Mo les refuserait en 413.
    client_max_body_size 100m;

    location / {
        {% set access_entry = 'ollama' %}
        {% include '_access.inc' %}

        proxy_pass         {{ ol_upstream }};
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Les réponses sont streamées jeton par jeton (NDJSON) : jamais
        # bufferisées, et une génération longue ou un premier chargement de
        # modèle dépasse largement les 60 s par défaut.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
{% else %}
# Ollama n'est pas déployé sur ce parc (pas d'entrée `ollama` dans
# l'inventaire) : aucun vhost n'est servi ici.
{% endif %}
