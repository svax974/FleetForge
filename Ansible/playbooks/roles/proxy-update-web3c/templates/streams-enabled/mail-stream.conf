# Mail services stream proxy configuration
# Proxies mail traffic to localhost where mail services are running

# Define upstream servers (localhost in this case)
#upstream mail_smtp {
#    server {{ hostvars['mail1'].ansible_host }}:25 max_fails=3 fail_timeout=30s;
#}

upstream mail_smtps {
    server {{ hostvars['mail1'].ansible_host }}:465 max_fails=3 fail_timeout=30s;
}

upstream mail_submission {
    server {{ hostvars['mail1'].ansible_host }}:587 max_fails=3 fail_timeout=30s;
}

#upstream mail_imap {
#    server {{ hostvars['mail1'].ansible_host }}:143 max_fails=3 fail_timeout=30s;
#}

upstream mail_imaps {
    server {{ hostvars['mail1'].ansible_host }}:993 max_fails=3 fail_timeout=30s;
}

#upstream mail_pop3 {
#    server {{ hostvars['mail1'].ansible_host }}:110 max_fails=3 fail_timeout=30s;
#}

#upstream mail_pop3s {
#    server {{ hostvars['mail1'].ansible_host }}:995 max_fails=3 fail_timeout=30s;
#}

# Define maps for allowed IPs
map $remote_addr $allowed_ip {
    default 0;
{% for ip in allowed_ips | default([]) %}
    {{ ip }} 1;
{% endfor %}
}

# Note: The actual mail services are secured by UFW firewall rules
# The stream proxy is optional and can be used for additional logging/monitoring
# Mail clients should connect directly to the standard ports on this server

# For monitoring and logging purposes, we can proxy to localhost
# But the firewall handles the actual access control 