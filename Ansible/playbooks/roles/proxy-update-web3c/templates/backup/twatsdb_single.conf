upstream pgpool_cluster {
    server {{ hostvars['dbmaster'].ansible_host }}:{{ postgres_port }};
    #ADDSERVERS
}

server {
  listen {{ postgres_proxy_port }};
  #server_name twatsdb.{{ domain_name }};

  proxy_pass pgpool_cluster;
  # Allow connections from VPNs, back servers and whitelist
  {% for host in groups['vpns'] %}
  allow {{ hostvars[host]['ansible_host'] }};
  {% endfor %}
  {% for host in groups['backs'] %}
  allow {{ hostvars[host]['ansible_host'] }};
  {% endfor %}
  {% for ip in whitelist %}
  allow {{ ip }};
  {% endfor %}
  deny all;
}
