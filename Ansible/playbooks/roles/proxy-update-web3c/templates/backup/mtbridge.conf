server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           mtbridge.{{ domain_name }};

  location / {
    proxy_pass         http://{{ hostvars['mtbridge'].ansible_host }}:{{ hostvars['mtbridge'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";

    # Allow connections from VPNs, back servers and whitelist
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};
    {% endfor %}
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    allow {{ hostvars['tradekong']['ansible_host'] }};
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
