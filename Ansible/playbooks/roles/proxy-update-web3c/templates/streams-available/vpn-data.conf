{# Amonts construits depuis le groupe `vpns` et non par nom d'hôte en dur :
   `vpn2` a disparu de l'inventaire, et un seul nom mort ici faisait échouer
   TOUTE la mise à jour des proxies, gabarits sans rapport compris. Premier
   hôte du groupe = actif, les suivants = secours (pas de balancing). #}
upstream pritunl_data1 {
        # No balancing in master/backup mode
        #hash $remote_addr consistent;
{% for host in groups['vpns'] %}
        server {{ hostvars[host].ansible_host }}:{{ vpn_data_port }}{% if loop.first %} max_fails=3 fail_timeout=10s{% else %} backup{% endif %};
{% endfor %}
}
server {
        listen {{ vpn_data_port }};
        proxy_pass pritunl_data1;
}

upstream pritunl_data2 {
        #hash $remote_addr consistent;
{% for host in groups['vpns'] %}
        server {{ hostvars[host].ansible_host }}:{{ vpn_data_port2 }}{% if loop.first %} max_fails=3 fail_timeout=10s{% else %} backup{% endif %};
{% endfor %}
}
server {
        listen {{ vpn_data_port2 }};
        proxy_pass pritunl_data2;
}
