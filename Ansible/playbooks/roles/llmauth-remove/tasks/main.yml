---
# Arrête et retire llmauth : conteneur, fichier compose (qui porte les
# secrets), contexte de construction et sonde. CONSERVE le répertoire de
# données et keys.sqlite — les clés émises restent valides au prochain
# déploiement, à condition de redéployer avec le MÊME pepper. Leur suppression
# relève de `llmauth-purge`. L'image est conservée elle aussi (purge).

- name: Check for the llmauth compose file
  ansible.builtin.stat:
    path: "{{ llmauth_base_dir }}/docker-compose.yml"
  become: true
  register: llmauth_compose

- name: Stop and remove the llmauth compose project
  community.docker.docker_compose_v2:
    project_src: "{{ llmauth_base_dir }}"
    state: absent
    remove_orphans: true
  become: true
  when: llmauth_compose.stat.exists
  ignore_errors: true

# Filet de sécurité : compose absent ou incohérent, le conteneur nommé
# disparaît quand même.
- name: Remove the llmauth container
  community.docker.docker_container:
    name: "{{ llmauth_container }}"
    state: absent
  become: true
  ignore_errors: true

# Le compose contient le pepper et le jeton d'administration : il n'a aucune
# raison de rester sur un hôte qui ne fait plus tourner le service.
- name: Remove the llmauth compose file and build context
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ llmauth_base_dir }}/docker-compose.yml"
    - "{{ llmauth_base_dir }}/app"

- name: Remove any ufw rule left on the llmauth port
  community.general.ufw:
    rule: "{{ item }}"
    proto: tcp
    port: "{{ llmauth_port | string }}"
    delete: true
  loop: [allow, deny]
  become: true
  ignore_errors: true

# ── Supervision ────────────────────────────────────────────────────────────
# La sonde part avec le service : laissée en place, elle publierait
# `service_up 0` indéfiniment et ferait sonner `ServiceDown` sur un service
# volontairement désinstallé.
#
# La CIBLE Prometheus de svcprobe n'est pas retirée : elle vaut pour la
# MACHINE et porte les sondes des autres services qui y tournent (nginx…).
- name: Remove the llmauth probe and its collector
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ svcprobe_checks_dir | default('/etc/svcprobe/checks.d') }}/llmauth.json"
    - "{{ svcprobe_lib_dir | default('/usr/local/lib/svcprobe') }}/llmauth-metrics.sh"
  tags: [monitoring]

- name: Warn that nginx still delegates authentication to llmauth
  ansible.builtin.debug:
    msg: >-
      llmauth supprimé, mais un vhost nginx qui fait `auth_request` vers
      127.0.0.1:{{ llmauth_port }} répondra désormais 500 à TOUTES les
      requêtes (sous-requête d'authentification en échec). Retirer
      l'auth_request du vhost puis rejouer la mise à jour des proxies.
