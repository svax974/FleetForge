---
# Voir defaults/main.yml.

- name: Refuse to purge without explicit confirmation
  ansible.builtin.assert:
    that: (confirm | default('')) == 'yes'
    fail_msg: >-
      Purge refusée : elle supprime la base de la passerelle (credentials MCP,
      audit, approbations, registre des lancements), non reconstructible sans
      sauvegarde. Relancer avec -e confirm=yes en connaissance de cause.

- name: Remove the containers, probe, firewall and account
  ansible.builtin.include_role:
    name: fleetforge-gateway-remove

- name: Check the project name (it becomes a purge pattern)
  ansible.builtin.assert:
    that: ffg_project_name is match('^[a-z][a-z0-9-]{0,40}$')
    quiet: true

- name: List the volumes and images
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [docker, volume, ls, -q]
    - [docker, images, --format, '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}']
  become: true
  register: ffg_listing
  changed_when: false
  check_mode: false

# Seul un nom qui commence par `<projet>_` ou `<projet>-` est supprimé, quoi
# que réponde Docker.
- name: Remove the gateway volumes
  community.docker.docker_volume:
    name: "{{ item }}"
    state: absent
  loop: "{{ ffg_listing.results[0].stdout_lines | select('match', '^' ~ (ffg_project_name | regex_escape) ~ '[_-]') | list }}"
  become: true

- name: Remove the gateway images
  community.docker.docker_image_remove:
    name: "{{ item }}"
  loop: "{{ ffg_listing.results[1].stdout_lines | select('match', '^' ~ (ffg_project_name | regex_escape) ~ '[_-]') | list }}"
  become: true
  ignore_errors: true

- name: Remove the gateway CNAME
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_token }}"
    zone: "{{ domain_name }}"
    record: "{{ proxy_hostname }}"
    type: CNAME
    state: absent
  delegate_to: localhost
  become: false
  when:
    - cloudflare_token | default('') | length > 0
    - proxy_hostname is defined

- name: Remind what remains
  ansible.builtin.debug:
    msg: >-
      Passerelle purgée. Restent à retirer à la main : l'entrée d'inventaire et
      le gabarit sites-enabled/fleetforge-gateway.conf (puis update-proxy.yml),
      la passerelle dans `access_linked` de l'entrée FleetForge, les comptes
      `ffg_*` de son `ff_api_accounts` (puis deploy-fleetforge.yml --limit
      <entrée FleetForge>) et leurs mots de passe au vault, le coffre
      .private/apps/fleetforge-gateway.
