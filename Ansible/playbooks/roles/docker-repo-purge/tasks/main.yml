---
# Purge du registre Docker privé : tout ce que fait `docker-repo-remove`, PLUS toutes les images stockées, la
# configuration et les comptes (/opt/docker-repo). Irréversible : les hôtes ne pourront plus tirer leurs images tant que
# les applications n'auront pas été reconstruites et poussées de nouveau.

- name: Remove the container, the retention and the probe first
  ansible.builtin.include_role:
    name: docker-repo-remove

- name: Remove the registry directory (data, config, accounts)
  ansible.builtin.file:
    path: /opt/docker-repo
    state: absent
  become: true
