---
# Purge private Docker registry — removes container and all stored images.

- name: Stop and remove registry container
  community.docker.docker_container:
    name: registry
    state: absent
  ignore_errors: true

- name: Remove registry data directory
  ansible.builtin.file:
    path: /var/lib/registry
    state: absent

- name: Remove registry config
  ansible.builtin.file:
    path: /etc/docker/registry
    state: absent
  ignore_errors: true

# ── Supervision ────────────────────────────────────────────────────────────
# Convention `-monitoring` (CLAUDE.md) : c'est le rôle de suppression du
# service qui retire sa sonde. Une sonde laissée en place publierait
# `service_up 0` indéfiniment et ferait sonner `ServiceDown` sur un service
# volontairement désinstallé — l'alerte qu'on apprend à ignorer, et qui finit
# par masquer les vraies.
- name: Remove the svcprobe check
  ansible.builtin.file:
    path: "/etc/svcprobe/checks.d/docker-repo.json"
    state: absent
  become: true
  tags: [monitoring]
