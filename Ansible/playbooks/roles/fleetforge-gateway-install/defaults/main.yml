---
# Passerelle MCP de FleetForge (`fleetforge-gateway`, app Nest du gabarit
# vx-public, dépôt PRIVÉ séparé) — famille déployée par deploy-fleetforge.yml
# (plays du groupe `fleetforge_gateways`), qui déploie FleetForge ET elle.
#
# Ce rôle ne construit ni ne démarre RIEN (le code de l'app part par les
# scripts de son dépôt, rôle `fleetforge-gateway-deploy`). Il pose :
#   • le contrôle STATIQUE de l'entrée d'inventaire (tasks/inventory.yml, joué
#     aussi par le play de garde du playbook, sans connexion) ;
#   • le compte Unix DÉDIÉ sous lequel tournent les conteneurs de l'app ;
#   • le CNAME du nom public vers le front des proxies.
#
# Exception assumée à « srvc pilote ce qu'il déploie » (CLAUDE.md § 2) : la
# passerelle détient trois comptes d'automatisation du parc et peut partager
# sa machine avec le nœud de contrôle (infra1). Elle tourne donc sous un compte
# SANS shell, sans home, hors des groupes docker/sudo/adm et hors du groupe de
# `remote_username` : une évasion de conteneur n'hérite ni des clés SSH, ni de
# l'arbre Ansible, ni du vault de srvc. srvc garde la main (docker, journaux).

# Nom du projet compose (PROJECT_NAME de l'app) : préfixe des conteneurs,
# volumes et projets `<nom>-back-<hôte>` / `<nom>-front-<hôte>` de deploy-full.sh.
ffg_project_name: fleetforge-gateway

# Compte Unix dédié (uid/gid passés à l'app : FFG_RUNTIME_UID / FFG_RUNTIME_GID).
ffg_unix_user: ffgateway

# Groupes interdits au compte dédié : chacun vaut root, ou l'accès aux fichiers
# de srvc (clés, vault, arbre Ansible).
ffg_forbidden_groups: [docker, sudo, adm, lxd, root, "{{ remote_username }}"]

# Chemins que le compte dédié ne doit NI lire NI traverser (vérifié par
# fleetforge-gateway-security, jamais modifié) et qu'aucun conteneur ne monte :
# le home ENTIER du compte de service (clés SSH, répertoire de FleetForge,
# arbre Ansible, mot de passe du vault). Complétés par l'inventaire
# (`ffg_protected_paths` de l'entrée : socket de l'agent SSH de FleetForge…) —
# aucun chemin propre à une machine n'est écrit ici.
ffg_protected_paths_base:
  - "/home/{{ remote_username }}"

# Proxies ADMIS à joindre la passerelle : ceux dont l'adresse n'est celle
# d'aucun serveur VPN (même calcul que le front `proxy-private`). Un proxy qui
# partage l'adresse d'un VPN (ou d'un NAT domestique) admettrait tout ce qui
# sort par cette adresse. Formule IDENTIQUE dans fleetforge-gateway-security
# (vérifié par scripts/ffg_isolation_check.py).
ffg_vpn_addresses: "{{ groups['vpns'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
ffg_eligible_proxies: >-
  {{ groups['proxies'] | default([]) | map('extract', hostvars)
     | rejectattr('ansible_host', 'in', ffg_vpn_addresses)
     | map(attribute='inventory_hostname') | list }}

# Sous-réseau privé /16 à /32 (même grammaire que `_access.inc`), sans zéro en
# tête d'un octet (`010` serait lu en octal par certains outils).
ffg_private_cidr_regex: '^(10[.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})|172[.](1[6-9]|2[0-9]|3[01])[.](0|[1-9][0-9]{0,2})|192[.]168[.](0|[1-9][0-9]{0,2}))[.](0|[1-9][0-9]{0,2})/(1[6-9]|2[0-9]|3[0-2])$'

# `/mcp` : les adresses des serveurs VPN en sont écartées (whitelist ET
# serveurs nommés). `true` OUVRE /mcp À TOUT CE QUI SORT PAR LE VPN (et par le
# NAT qu'il partage) : décision explicite du propriétaire, pour des tests.
ffg_mcp_allow_vpn_addresses: false
ffg_ipv4_regex: '^[0-9]{1,3}([.][0-9]{1,3}){3}$'

# Comptes aval par défaut (plan 06 §2.4, noms corrigés à l'étape 6.1).
ffg_default_users: { read: ffg_read, check: ffg_check, run: ffg_run }

# Motifs que les comptes `check` et `run` doivent refuser : la passerelle ne
# redéploie ni FleetForge ni elle-même, ne touche ni aux accès (SSH, pare-feu,
# VPN, proxies, DNS, certificats, clés), ni aux sauvegardes, ni aux
# suppressions. Liste MINIMALE vérifiée par la garde ; l'inventaire peut en
# ajouter, jamais en retirer.
ffg_required_denies:
  - "*-fleetforge.yml"
  - "*-fleetforge-gateway.yml"
  - "*-readonly-user.yml"
  - "setup-server.yml"
  - "purge-*.yml"
  - "remove-*.yml"
  - "update-security-*.yml"
  - "update-sshd-security.yml"
  - "update-ufw-all.yml"
  - "deploy-vpn*"
  - "install-vpn-routes*"
  - "deploy-cloudflare-origin-pull*"
  - "update-cloudflare-dns*"
  - "deploy-proxy*"
  - "update-proxy*"
  - "deploy-install-cert*"
  - "deploy-webapp*"
  - "retarget-backups*"
  - "restore-*"
  - "export-*-keys*"
  - "deploy-copyfail-patch*"
  - "deploy-docker-repo*"
  - "temp.yml"
  # Playbooks « sensibles » (un play sur localhost — le nœud de contrôle —,
  # all, proxies, infras, vpns ou la supervision, un motif d'hôte templaté) :
  # couverture exigée par scripts/ffg_isolation_check.py (`coverage`).
  - "backup-*"
  - "migrate-*"
  - "*timescale*"
  - "deploy-agenthub*"
  - "deploy-alertmanager*"
  - "deploy-astar*"
  - "deploy-backup*"
  - "deploy-btc-pipeline*"
  - "deploy-exporter-sys*"
  - "deploy-freellm*"
  - "deploy-grass*"
  - "deploy-llamacpp*"
  - "deploy-llm-proxy*"
  - "deploy-mailrelay*"
  - "deploy-mailserver*"
  - "deploy-monero*"
  - "deploy-*monitoring*"
  - "update-*monitoring*"
  - "deploy-openclaw*"
  - "deploy-opencode*"
  - "deploy-papanglabs-*"
  - "deploy-prometheus*"
  - "deploy-rpcbtc*"
  - "deploy-starnet*"
  - "deploy-storj*"
  - "deploy-sync-server*"
  - "deploy-theta-edge*"
  - "deploy-wordpress*"
  - "deploy-xmrig*"
  - "update-journald-all*"
  - "update-loadtest-scrape*"
  - "update-opencode-model*"

# LISTE BLANCHE des comptes `ffg_check` / `ffg_run` (décision du propriétaire,
# 15/11/2026) : EXACTEMENT ces playbooks, posés en `allow_playbooks` sur les
# deux comptes et vérifiés par la garde. Aucun motif de `ffg_required_denies`
# ne doit les toucher (le refus l'emporte dans FleetForge).
#   • update-prometheus-alerts.yml : rend les règles d'alerte, les valide par
#     `docker run promtool`, les installe et REDÉMARRE le conteneur Prometheus
#     (become) — courte coupure de la supervision ;
#   • check-monitoring.yml : lecture seule (requêtes `uri` à l'API Prometheus
#     locale, aucun shell/command, aucune tâche `check_mode: false`).
# `deploy-exporter-sys.yml` reste EXCLU : il ouvre des règles ufw.
ffg_allowed_playbooks:
  - update-prometheus-alerts.yml
  - check-monitoring.yml
