---
# Passerelle MCP de FleetForge (`fleetforge-gateway`, app Nest du gabarit
# vx-public, dépôt PRIVÉ séparé) — famille déployée par deploy-fleetforge.yml
# (plays du groupe `fleetforge_gateways`), qui déploie FleetForge ET elle.
#
# Ce rôle ne construit ni ne démarre RIEN (le code de l'app part par les
# scripts de son dépôt, rôle `fleetforge-gateway-deploy`). Il pose :
#   • le contrôle STATIQUE de l'entrée d'inventaire (tasks/inventory.yml, joué
#     aussi par le play de garde du playbook, sans connexion) ;
#   • le compte Unix DÉDIÉ sous lequel tournent les conteneurs de l'app ;
#   • le CNAME du nom public vers le front des proxies.
#
# Exception assumée à « srvc pilote ce qu'il déploie » (CLAUDE.md § 2) : la
# passerelle détient trois comptes d'automatisation du parc et peut partager
# sa machine avec le nœud de contrôle (infra1). Elle tourne donc sous un compte
# SANS shell, sans home, hors des groupes docker/sudo/adm et hors du groupe de
# `remote_username` : une évasion de conteneur n'hérite ni des clés SSH, ni de
# l'arbre Ansible, ni du vault de srvc. srvc garde la main (docker, journaux).

# Nom du projet compose (PROJECT_NAME de l'app) : préfixe des conteneurs,
# volumes et projets `<nom>-back-<hôte>` / `<nom>-front-<hôte>` de deploy-full.sh.
ffg_project_name: fleetforge-gateway

# Compte Unix dédié (uid/gid passés à l'app : FFG_RUNTIME_UID / FFG_RUNTIME_GID).
ffg_unix_user: ffgateway

# Groupes interdits au compte dédié : chacun vaut root, ou l'accès aux fichiers
# de srvc (clés, vault, arbre Ansible).
ffg_forbidden_groups: [docker, sudo, adm, lxd, root, "{{ remote_username }}"]

# Chemins que le compte dédié ne doit NI lire NI traverser (vérifié par
# fleetforge-gateway-security, jamais modifié). Complétés par l'inventaire
# (`ffg_protected_paths` de l'entrée : répertoire de FleetForge, arbre Ansible…)
# — aucun chemin d'une machine précise n'est écrit ici.
ffg_protected_paths_base:
  - "/home/{{ remote_username }}/.ssh"

# Sous-réseau privé /16 à /32 (même grammaire que `_access.inc`).
ffg_private_cidr_regex: '^(10[.][0-9]{1,3}[.][0-9]{1,3}|172[.](1[6-9]|2[0-9]|3[01])[.][0-9]{1,3}|192[.]168[.][0-9]{1,3})[.][0-9]{1,3}/(1[6-9]|2[0-9]|3[0-2])$'
ffg_ipv4_regex: '^[0-9]{1,3}([.][0-9]{1,3}){3}$'

# Comptes aval par défaut (plan 06 §2.4, noms corrigés à l'étape 6.1).
ffg_default_users: { read: ffg_read, check: ffg_check, run: ffg_run }

# Motifs que les comptes `check` et `run` doivent refuser : la passerelle ne
# redéploie ni FleetForge ni elle-même (deploy-fleetforge.yml les porte tous deux).
ffg_required_denies: ["*-fleetforge.yml", "*-fleetforge-gateway.yml"]
