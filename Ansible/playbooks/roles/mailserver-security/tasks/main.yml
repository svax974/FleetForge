---
# Firewall and Fail2ban rules for SMTP relay

# ── UFW rules ─────────────────────────────────────────────────────────────────

- name: Deny inbound SMTP port 25 from internet
  community.general.ufw:
    rule: deny
    port: "25"
    proto: tcp
    comment: "Block inbound SMTP — relay-only server"
  become: yes

# 465/587 ne sont PAS ouverts à Internet : seuls nos serveurs, la whitelist et
# les conteneurs locaux peuvent soumettre. Voir defaults/main.yml.
- name: Allow SMTPS port 465 from authorized sources only
  community.general.ufw:
    rule: allow
    port: "465"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "SMTPS — authenticated relay"
  loop: "{{ mailserver_allowed_sources }}"
  become: yes

- name: Allow Submission port 587 from authorized sources only
  community.general.ufw:
    rule: allow
    port: "587"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Submission — authenticated relay"
  loop: "{{ mailserver_allowed_sources }}"
  become: yes

# Pas de règle DENY explicite : la politique UFW par défaut est déjà
# `deny (incoming)`, ce qui suffit. Une DENY explicite est non seulement
# redondante, elle est PIÈGEUSE — UFW évalue par ordre numérique, et si elle se
# retrouve avant les ALLOW (ce qui arrive dès qu'une règle antérieure est
# supprimée et que la numérotation glisse), elle bloque les sources autorisées.
# C'est exactement ce qui s'est produit ici : DENY en [102]/[103], ALLOW en
# [104]+, et le relais injoignable pour tout le monde.
- name: Remove blanket rules on 465/587 that would shadow the per-source allows
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: tcp
    delete: true
  loop:
    - { rule: deny,  port: "465" }
    - { rule: deny,  port: "587" }
    - { rule: allow, port: "465" }
    - { rule: allow, port: "587" }
  become: yes
  ignore_errors: true

# ── Fail2ban for Postfix ──────────────────────────────────────────────────────

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Deploy fail2ban Postfix jail configuration
  ansible.builtin.copy:
    content: |
      # ignoreip : nos propres sources ne doivent JAMAIS être bannies. Un
      # incident d'authentification transitoire a suffi à faire bannir le bridge
      # Docker pour 24 h, coupant l'envoi des alertes de supervision — le
      # bannissement devenait alors lui-même la panne.
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 {{ mailserver_allowed_sources | join(' ') }}

      [postfix]
      enabled  = true
      port     = smtp,465,587
      filter   = postfix
      logpath  = /var/log/mail.log
      maxretry = 5
      bantime  = 3600
      findtime = 600

      [postfix-sasl]
      enabled  = true
      port     = smtp,465,587
      filter   = postfix[mode=auth]
      logpath  = /var/log/mail.log
      maxretry = 3
      bantime  = 86400
      findtime = 600
    dest: /etc/fail2ban/jail.d/postfix.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: yes
    daemon_reload: yes

- name: Flush UFW to apply new rules
  community.general.ufw:
    state: enabled
  become: yes
