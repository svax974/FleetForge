---
# Purge Nginx reverse proxy — removes packages, all configs and SSL certificates.

- name: Stop and disable nginx service
  ansible.builtin.systemd:
    name: nginx
    state: stopped
    enabled: no
  ignore_errors: true

- name: Remove nginx packages
  ansible.builtin.apt:
    name:
      - nginx
      - nginx-common
    state: absent
    purge: yes

- name: Remove nginx configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx
    - /var/log/nginx
    - /var/www/html

- name: Remove Let's Encrypt certificates and config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/letsencrypt
    - /var/lib/letsencrypt
  ignore_errors: true

# ── Supervision ────────────────────────────────────────────────────────────
# Convention `-monitoring` (CLAUDE.md) : c'est le rôle de suppression du
# service qui retire sa sonde. Une sonde laissée en place publierait
# `service_up 0` indéfiniment et ferait sonner `ServiceDown` sur un service
# volontairement désinstallé — l'alerte qu'on apprend à ignorer, et qui finit
# par masquer les vraies.
- name: Remove the svcprobe check
  ansible.builtin.file:
    path: "/etc/svcprobe/checks.d/proxy.json"
    state: absent
  become: true
  tags: [monitoring]
