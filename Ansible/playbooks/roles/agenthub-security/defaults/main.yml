---
# Restriction réseau du hub AgentHub. Les deux ports (front, back-lb) sont
# PUBLIÉS PAR DOCKER (scripts/docker-compose.yml du template) : invisibles
# pour ufw (CLAUDE.md, docker-ports-security/defaults). Les règles vivent dans
# `docker_ports_rules` (host_vars/agenthub.yml — entrée CANONIQUE de la
# machine, une liste par MACHINE) et sont appliquées en jouant ce rôle sur
# `agenthub` (voir deploy-agenthub.yml).

agenthub_front_port: "{{ hostvars['agenthub'].app_port | default(4700) }}"
agenthub_back_port: "{{ hostvars['agenthub'].back_port | default(4701) }}"

# Ports réellement publiés par Docker : avec `cloudflare_front: true`, le front
# est sur Cloudflare Pages et aucun conteneur front n'écoute sur l'hôte.
agenthub_published_ports: >-
  {{ [agenthub_back_port]
     if hostvars['agenthub'].cloudflare_front | default(false) | bool
     else [agenthub_front_port, agenthub_back_port] }}
