---
# Joué sur `agenthub`, entrée canonique de la machine — voir defaults/main.yml.

- name: Apply the machine's Docker port rules
  ansible.builtin.include_role:
    name: docker-ports-security

# Une machine dont host_vars/agenthub.yml ignorerait ces deux ports les
# publierait sur 0.0.0.0 sans aucun filtre, et `ufw status` afficherait
# néanmoins des DENY rassurants (constat du 06/08/2026 sur `prometheus1`,
# reproduit ici en garde-fou plutôt qu'en commentaire).
- name: Fail when an AgentHub port is not declared in docker_ports_rules
  ansible.builtin.assert:
    that:
      - (docker_ports_rules | default([]) | selectattr('port', 'equalto', item | int) | list | length) > 0
    fail_msg: >-
      Le port {{ item }} (AgentHub) est publié par Docker mais absent de
      `docker_ports_rules` : il serait joignable depuis Internet sans filtre,
      et ufw n'y peut rien. Ajouter une entrée dans
      playbooks/host_vars/agenthub.yml (rôle docker-ports-security), avec
      `sources` limité aux IP des proxies + `allow_whitelist`/`allow_vpns`.
    success_msg: "Port {{ item }} déclaré dans docker_ports_rules."
  loop:
    - "{{ agenthub_front_port }}"
    - "{{ agenthub_back_port }}"

# Le script/unité changés n'ont notifié qu'un HANDLER, qui ne tournerait qu'en
# fin de play — or le contrôle ci-dessous tourne AVANT. `docker-ports-security`
# se charge maintenant de ce flush lui-même avant de rendre la main, donc la
# chaîne lue ici est déjà post-application ; sans cette garantie, un premier
# déploiement (ou tout changement de `docker_ports_rules`) lisait une chaîne
# encore vide et faisait échouer un contrôle pourtant sain. `state: started` ne
# sauve pas l'affaire : l'unité est un oneshot `RemainAfterExit=yes`, déjà
# active, donc elle ne se relance pas. (Échec du play = handler abandonné =
# chaîne jamais appliquée : c'est ce qui a laissé 4700/4701 exposés.)
#
# Contrôle immédiat de l'état RÉEL de la chaîne, pas seulement des variables :
# `docker-ports-security` peut avoir été sauté (aucun handler notifié) ou
# l'unité peut avoir échoué à démarrer.
- name: Read back the DOCKER-USER chain
  ansible.builtin.command: iptables -S DOCKER-USER
  become: true
  register: agenthub_chain
  changed_when: false
  check_mode: false

- name: Verify the AgentHub ports are really dropped by default
  ansible.builtin.assert:
    that:
      # Motif et non égalité : `iptables -S` intercale `-m tcp` et réordonne
      # les options selon la version (cf. freellm-security).
      - agenthub_chain.stdout is search('--(dport|ctorigdstport) ' ~ item ~ '.*-j DROP')
    fail_msg: >-
      Le port {{ item }} est publié sur 0.0.0.0 mais aucun DROP ne le protège
      dans DOCKER-USER : le hub serait joignable depuis Internet en
      contournant TLS et le vhost des proxies. Vérifier
      `systemctl status docker-ports-firewall` et `iptables -S DOCKER-USER`
      sur {{ inventory_hostname }}.
    success_msg: >-
      Port {{ item }} filtré dans DOCKER-USER (DROP par défaut, ALLOW explicite
      pour les proxies/whitelist/VPN déclarés).
  loop:
    - "{{ agenthub_front_port }}"
    - "{{ agenthub_back_port }}"
  # En simulation (--check), la tâche d'application des règles est sautée par
  # docker-ports-security : la chaîne n'a pas encore les règles et ce contrôle
  # échouerait sur un hôte parfaitement sain.
  when: not ansible_check_mode

# Même garantie en IPv6 : Docker publie aussi sur `[::]` et pose une chaîne
# `ip6tables DOCKER-USER` — des règles IPv4 seules la laisseraient vide, et le
# hub resterait joignable en IPv6 en contournant tout le filtrage (une source
# `2a01:…::/64` de `whitelist` est d'ailleurs exactement ce qui faisait échouer
# le script en IPv4). Chaîne absente = Docker en IPv4 seul : rien à vérifier.
- name: Read back the IPv6 DOCKER-USER chain
  ansible.builtin.command: ip6tables -S DOCKER-USER
  become: true
  register: agenthub_chain6
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify the AgentHub ports are dropped in IPv6 too
  ansible.builtin.assert:
    that:
      # Motif et non égalité : la forme d'une règle varie selon iptables/ip6tables
      # et leurs versions (cf. le contrôle IPv4 ci-dessus).
      - agenthub_chain6.stdout is search('--(dport|ctorigdstport) ' ~ item ~ '.*-j DROP')
    fail_msg: >-
      Port {{ item }} non protégé en IPv6 : la chaîne ip6tables DOCKER-USER
      existe mais ne porte aucun DROP, donc le hub resterait joignable par
      `[::]` en contournant le filtrage IPv4. Vérifier
      `systemctl status docker-ports-firewall` et
      `ip6tables -S DOCKER-USER` sur {{ inventory_hostname }}.
    success_msg: >-
      Port {{ item }} filtré aussi en IPv6 (DROP par défaut, ALLOW explicite
      pour les sources déclarées).
  loop:
    - "{{ agenthub_front_port }}"
    - "{{ agenthub_back_port }}"
  when:
    - not ansible_check_mode
    # `ip6tables` absent ou chaîne non posée : rc != 0, rien à contrôler.
    - agenthub_chain6.rc == 0

- name: Report the exposure
  ansible.builtin.debug:
    msg: >-
      Ports {{ agenthub_front_port }} (front) et {{ agenthub_back_port }}
      (back-lb) filtrés dans DOCKER-USER sur {{ ansible_host }}, autorisés
      pour les deux proxies + whitelist + VPN. Contrôle depuis une machine
      tierce (hors de ces trois listes) :
      `nc -z {{ hostvars['agenthub'].ansible_host }} {{ agenthub_front_port }}`
      doit échouer.
