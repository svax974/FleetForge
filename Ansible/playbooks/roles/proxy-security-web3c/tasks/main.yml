---
############################# HTTP/HTTPS #############################
# Configure basic firewall rules for nginx and PriTunl
- name: Allow HTTPS connections from everywhere
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: any
    port: 443
- name: Allow HTTP connections from everywhere
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: any
    port: 80

############################# VPN #############################
#- name: Allow TCP VPN connections from everywhere
#  community.general.ufw:
#    rule: allow
#    proto: tcp
#    from_ip: any
#    port: "{{ vpn_tcp_port }}"
- name: Allow TCP VPN connections from localhost only since proxified
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: 127.0.0.1
    port: "{{ vpn_tcp_port }}"
- name: Allow UDP VPN connections from everywhere
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: any
    port: "{{ vpn_data_port }}"
- name: Allow UDP VPN connections from everywhere
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: any
    port: "{{ vpn_data_port2 }}"

############################# DB PROXIES #############################
# Allow connections to dbproxies on postgres_proxy_port from whitelist
- name: Allow connections to dbproxies on postgres_proxy_port from whitelist
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    port: "{{ postgres_proxy_port }}"
  with_items:
    "{{ whitelist }}"
- name: Allow connections to dbproxies on postgres_proxy_port from vpns
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ postgres_proxy_port }}"
  loop: "{{ groups['vpns'] | default([]) }}"
- name: Allow connections to dbproxies on postgres_proxy_port from backs
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ postgres_proxy_port }}"
  loop: "{{ groups['backs'] | default([]) }}"

