---
# Pare-feu et durcissement de la passerelle MCP de FleetForge.
#
# Ports PUBLIÉS PAR DOCKER (compose : front `app_port:80`, back-lb
# `back_port:back_port`) : ufw ne les voit pas (CLAUDE.md, « Ports publiés par
# Docker »). Ce rôle travaille dans `DOCKER-USER` avec SON script et SON unité
# (modèle freellm-security : la machine peut n'avoir aucun host_vars, et la
# passerelle ne doit pas dépendre de la liste d'une autre entrée).
#
# Règles, IPv4 et IPv6, sur les seules connexions DNATées vers ces ports
# (`--ctstate DNAT --ctorigdstport`, le front écoutant sur 80 dans son
# conteneur), INSÉRÉES EN TÊTE de la chaîne (un RETURN inconditionnel posé
# avant elles par Docker ou un autre rôle les rendrait décoratives) :
#   • front et back-lb : proxies ADMIS et distants seulement (hors adresses
#     VPN ; un proxy de la même machine passe par 127.0.0.1, chaîne OUTPUT,
#     hors DOCKER-USER) ;
#   • back-lb : plus le sous-réseau Docker DÉDIÉ (relais front → back-lb) ;
#   • puis DROP. Ni whitelist, ni vpns, ni Prometheus : les humains passent par
#     le vhost privé, `/mcp` par sa liste nommée, la supervision par svcprobe
#     sur la boucle locale.
# Le script PURGE les règles qu'il a posées avant de reposer les voulues :
# additif ET soustractif. Toute règle ufw sur ces ports est retirée (décorative,
# et posée par d'autres rôles : `ufw_app_ports: false` sur l'entrée l'empêche).
#
# Fenêtre au redémarrage : Docker relance les conteneurs (`restart:
# unless-stopped`) pendant son propre démarrage, AVANT que l'unité de ce rôle
# (After=docker.service) ne repose les règles — quelques secondes où les ports
# publiés ne sont pas filtrés. Non fermée (Docker n'offre pas de crochet avant
# le redémarrage des conteneurs) ; la sonde svcprobe `firewall_<port>` et
# l'alerte ServiceCheckFailing signalent une chaîne restée vide.

ffg_project_name: fleetforge-gateway
ffg_unix_user: ffgateway
ffg_front_port: "{{ app_port }}"
ffg_back_port: "{{ back_port }}"
ffg_pg_port: "{{ pg_port }}"

# Proxies ADMIS : jamais un proxy dont l'adresse est celle d'un serveur VPN
# (proxy2 = vpn1 sur web3c : `-s <cette adresse>` admettrait tout ce qui sort
# par le NAT domestique). Formule IDENTIQUE dans fleetforge-gateway-install
# (vérifié par scripts/ffg_isolation_check.py).
ffg_vpn_addresses: "{{ groups['vpns'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
ffg_eligible_proxies: >-
  {{ groups['proxies'] | default([]) | map('extract', hostvars)
     | rejectattr('ansible_host', 'in', ffg_vpn_addresses)
     | map(attribute='inventory_hostname') | list }}
ffg_remote_proxies: >-
  {{ ffg_eligible_proxies
     | map('extract', hostvars, 'ansible_host')
     | select('defined')
     | reject('equalto', ansible_host)
     | unique | list }}

# Relais front → back-lb : le trafic entre conteneurs traverse FORWARD, donc
# DOCKER-USER. Seul le sous-réseau Docker DÉDIÉ de la passerelle (fixé par son
# compose durci) est admis — jamais la plage de tous les ponts de la machine.
ffg_internal_cidr: "{{ ffg_docker_subnet }}"

ffg_firewall_script: /usr/local/sbin/fleetforge-gateway-firewall.sh
ffg_firewall_unit: fleetforge-gateway-firewall

# ── Durcissement vérifié à l'exécution (tasks/runtime.yml) ─────────────────
# Services compose qui portent le CODE de la passerelle (et donc les mots de
# passe aval) : durcissement complet exigé. Les autres conteneurs du projet
# (front, back-lb, postgres) : socle (ni privilège, ni socket Docker, ni
# montage interdit, ni espace de noms de l'hôte, no-new-privileges).
ffg_hardened_services: [back, back-worker]
# Relais de confiance de TRUST_PROXY : leur adresse sur le réseau dédié est
# FIXÉE (`ffg_front_ip`, `ffg_back_lb_ip` de l'entrée) et vérifiée.
ffg_front_service: front
ffg_back_lb_service: back-lb

# Montages de l'hôte (`bind`) : AUCUN par défaut — liste d'AUTORISATION.
# Un volume nommé doit être local, sans `driver_opts` bind/device (sinon c'est
# un montage de l'hôte déguisé).
ffg_allowed_bind_sources: []
# Chemins signalés en clair dans le message quand un montage les touche (en
# plus des chemins protégés) — l'interdiction, elle, vaut pour tout bind.
ffg_forbidden_mount_sources:
  - /var/run/docker.sock
  - /run/docker.sock
  - /var/run
  - /run
  - /var/lib/docker
  - /proc
  - /sys
  - /dev
  - /root
  - /etc
  - /
ffg_protected_paths_base:
  - "/home/{{ remote_username }}"
ffg_forbidden_groups: [docker, sudo, adm, lxd, root, "{{ remote_username }}"]

# Formats de `docker inspect` : champs UTILES seulement, jamais `Config.Env`
# (mots de passe aval, DB_PASSWORD, JWT_SECRET, CRYPT_*). `!unsafe` : Ansible ne
# doit pas interpréter les accolades de Go.
ffg_inspect_format: !unsafe '{"Name":{{json .Name}},"HostConfig":{{json .HostConfig}},"Mounts":{{json .Mounts}},"User":{{json .Config.User}},"Labels":{{json .Config.Labels}},"Networks":{{json .NetworkSettings.Networks}}}'
ffg_network_format: !unsafe '{"Name":{{json .Name}},"IPAM":{{json .IPAM}},"Containers":{{json .Containers}},"Labels":{{json .Labels}}}'
ffg_volume_format: !unsafe '{"Name":{{json .Name}},"Driver":{{json .Driver}},"Options":{{json .Options}},"Labels":{{json .Labels}}}'
# Port du conteneur front (nginx du gabarit : 80) ; publié EXACTEMENT sur app_port.
ffg_front_container_port: 80

# Échec du contrôle : arrêter les conteneurs de la passerelle (fermé).
ffg_stop_on_hardening_failure: true
