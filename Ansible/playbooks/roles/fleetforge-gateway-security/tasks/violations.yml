---
# Calcul des écarts de durcissement, À PARTIR des lectures de tasks/runtime.yml
# (ffg_passwd, ffg_groups, ffg_path_probe, ffg_containers, ffg_net_inspect,
# ffg_vol_inspect, ffg_firewall_problems). Aucune commande : fichier séparé pour être éprouvé hors
# ligne sur des descriptions factices (scripts/test_ffg_isolation_check.py).
- name: Work out the hardening violations
  vars:
    _fields: "{{ (ffg_passwd.stdout | default('')).split(':') }}"
    _runtime_user: "{{ (_fields[2] ~ ':' ~ _fields[3]) if _fields | length > 3 else '' }}"
    _networks: "{{ (ffg_net_inspect.stdout_lines | default([])) | map('from_json') | list }}"
    _volumes: "{{ (ffg_vol_inspect.stdout_lines | default([])) | map('from_json') | list }}"
  ansible.builtin.set_fact:
    ffg_violations: >-
      {%- set ns = namespace(v=[], seen=[]) -%}
      {%- if _runtime_user == '' -%}{%- set ns.v = ns.v + ['compte ' ~ ffg_unix_user ~ ' absent'] -%}{%- endif -%}
      {%- if (ffg_firewall_problems | default('') | trim) -%}{%- set ns.v = ns.v + ['pare-feu : ' ~ ffg_firewall_problems] -%}{%- endif -%}
      {%- for g in (ffg_groups.stdout | default('')).split() | intersect(ffg_forbidden_groups) -%}
        {%- set ns.v = ns.v + ['compte ' ~ ffg_unix_user ~ ' dans le groupe ' ~ g] -%}
      {%- endfor -%}
      {%- for r in ffg_path_probe.results | default([]) if (r.rc | default(1)) == 0 -%}
        {%- set ns.v = ns.v + ['compte ' ~ ffg_unix_user ~ ' : test ' ~ r.item.0 ~ ' ' ~ r.item.1 ~ ' réussit'] -%}
      {%- endfor -%}
      {%- for vol in _volumes -%}
        {%- set opts = vol.Options | default({}, true) -%}
        {%- if vol.Driver | default('local') != 'local' or 'device' in opts or 'bind' in (opts.o | default('')) -%}
          {%- set ns.v = ns.v + ['volume ' ~ vol.Name ~ ' : pilote ou options de montage de l hôte'] -%}
        {%- endif -%}
        {#- Volume d'un AUTRE projet (external/name dans le compose) : sa base serait lue. -#}
        {%- if not (vol.Name | default('')).startswith(ffg_project_name ~ '-')
               or not ((vol.Labels | default({}, true))['com.docker.compose.project'] | default('')).startswith(ffg_project_name ~ '-') -%}
          {%- set ns.v = ns.v + ['volume ' ~ vol.Name ~ ' : hors du projet ' ~ ffg_project_name] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for net in _networks if not ((net.Labels | default({}, true))['com.docker.compose.project'] | default('')).startswith(ffg_project_name ~ '-') -%}
        {%- set ns.v = ns.v + ['réseau ' ~ net.Name ~ ' : hors du projet ' ~ ffg_project_name] -%}
      {%- endfor -%}
      {%- for c in ffg_containers -%}
        {%- set name = c.Name | regex_replace('^/', '') -%}
        {%- set svc = (c.Labels | default({}, true))['com.docker.compose.service'] | default('') -%}
        {%- set hc = c.HostConfig | default({}, true) -%}
        {%- set nets = (c.Networks | default({}, true)) -%}
        {%- set ns.seen = ns.seen + [svc] -%}
        {%- if hc.Privileged | default(false) -%}{%- set ns.v = ns.v + [name ~ ' : privileged'] -%}{%- endif -%}
        {%- for k in ['NetworkMode', 'PidMode', 'IpcMode', 'UTSMode', 'UsernsMode', 'CgroupnsMode'] if (hc[k] | default('', true)) == 'host' -%}
          {%- set ns.v = ns.v + [name ~ ' : ' ~ k ~ '=host'] -%}
        {%- endfor -%}
        {%- if (hc.NetworkMode | default('', true)) is match('^(container|service):') -%}{%- set ns.v = ns.v + [name ~ ' : réseau d un autre conteneur'] -%}{%- endif -%}
        {%- if hc.Devices | default([], true) | length > 0 -%}{%- set ns.v = ns.v + [name ~ ' : périphériques de l hôte'] -%}{%- endif -%}
        {%- if hc.CapAdd | default([], true) | length > 0 -%}{%- set ns.v = ns.v + [name ~ ' : capacités ajoutées ' ~ (hc.CapAdd | join(','))] -%}{%- endif -%}
        {%- if (hc.SecurityOpt | default([], true) | select('search', 'unconfined') | list | length) > 0 -%}
          {%- set ns.v = ns.v + [name ~ ' : seccomp/AppArmor unconfined'] -%}
        {%- endif -%}
        {%- if (hc.SecurityOpt | default([], true) | select('match', '^no-new-privileges(:true)?$') | list | length) == 0 -%}
          {%- set ns.v = ns.v + [name ~ ' : sans no-new-privileges'] -%}
        {%- endif -%}
        {%- for m in c.Mounts | default([], true) if m.Type | default('') == 'bind' and (m.Source | default('')) not in ffg_allowed_bind_sources -%}
          {%- set ns.v = ns.v + [name ~ ' : montage de l hôte ' ~ (m.Source | default('?')) ~ ' (aucun bind autorisé hors ffg_allowed_bind_sources)'] -%}
        {%- endfor -%}
        {#- Ports publiés : front et back-lb EXACTEMENT leur port, sur 0.0.0.0 ;
            tout autre conteneur : boucle locale seulement. -#}
        {%- set pb = hc.PortBindings | default({}, true) -%}
        {%- set pbns = namespace(f=[]) -%}
        {%- for cport, binds in pb.items() -%}{%- for b in binds | default([], true) -%}
          {%- set pbns.f = pbns.f + [cport ~ '=' ~ (b.HostIp | default('')) ~ ':' ~ (b.HostPort | default(''))] -%}
        {%- endfor -%}{%- endfor -%}
        {%- set flat = pbns.f -%}
        {%- if svc == ffg_front_service -%}
          {%- if flat != [(ffg_front_container_port | string) ~ '/tcp=0.0.0.0:' ~ (app_port | string)] -%}
            {%- set ns.v = ns.v + [name ~ ' : ports publiés ' ~ (flat | join(',')) ~ ' au lieu de ' ~ ffg_front_container_port ~ '/tcp=0.0.0.0:' ~ app_port] -%}
          {%- endif -%}
        {%- elif svc == ffg_back_lb_service -%}
          {%- if flat != [(back_port | string) ~ '/tcp=0.0.0.0:' ~ (back_port | string)] -%}
            {%- set ns.v = ns.v + [name ~ ' : ports publiés ' ~ (flat | join(',')) ~ ' au lieu de ' ~ back_port ~ '/tcp=0.0.0.0:' ~ back_port] -%}
          {%- endif -%}
        {%- else -%}
          {%- for f in flat if not f.split('=', 1)[1].startswith('127.0.0.1:') -%}
            {%- set ns.v = ns.v + [name ~ ' : port publié hors boucle locale ' ~ f] -%}
          {%- endfor -%}
        {%- endif -%}
        {%- for n in nets | list if not n.startswith(ffg_project_name ~ '-') -%}
          {%- set ns.v = ns.v + [name ~ ' : réseau étranger au projet ' ~ n] -%}
        {%- endfor -%}
        {%- if svc in ffg_hardened_services -%}
          {%- if (c.User | default('')) != _runtime_user -%}{%- set ns.v = ns.v + [name ~ ' : utilisateur ' ~ (c.User | default('') or 'root') ~ ' au lieu de ' ~ _runtime_user] -%}{%- endif -%}
          {%- if not (hc.ReadonlyRootfs | default(false)) -%}{%- set ns.v = ns.v + [name ~ ' : racine en écriture'] -%}{%- endif -%}
          {%- if 'ALL' not in (hc.CapDrop | default([], true)) -%}{%- set ns.v = ns.v + [name ~ ' : capacités non retirées (cap_drop ALL)'] -%}{%- endif -%}
          {%- if (hc.Memory | default(0) | int) <= 0 -%}{%- set ns.v = ns.v + [name ~ ' : sans limite mémoire'] -%}{%- endif -%}
          {%- if (hc.NanoCpus | default(0) | int) <= 0 and (hc.CpuQuota | default(0) | int) <= 0 -%}{%- set ns.v = ns.v + [name ~ ' : sans limite CPU'] -%}{%- endif -%}
        {%- endif -%}
        {%- if svc in ffg_hardened_services + [ffg_front_service, ffg_back_lb_service] -%}
          {%- set subnets = _networks | selectattr('Name', 'in', nets | list) | map(attribute='IPAM.Config') | flatten | map(attribute='Subnet') | list -%}
          {%- if ffg_docker_subnet not in subnets -%}{%- set ns.v = ns.v + [name ~ ' : réseau hors de ffg_docker_subnet ' ~ ffg_docker_subnet] -%}{%- endif -%}
        {%- endif -%}
        {%- set ips = nets.values() | map(attribute='IPAddress') | list -%}
        {%- if svc == ffg_front_service and ffg_front_ip not in ips -%}{%- set ns.v = ns.v + [name ~ ' : adresse du front différente de ffg_front_ip ' ~ ffg_front_ip] -%}{%- endif -%}
        {%- if svc == ffg_back_lb_service and ffg_back_lb_ip not in ips -%}{%- set ns.v = ns.v + [name ~ ' : adresse du back-lb différente de ffg_back_lb_ip ' ~ ffg_back_lb_ip] -%}{%- endif -%}
      {%- endfor -%}
      {%- for s in ffg_hardened_services + [ffg_front_service, ffg_back_lb_service] if s not in ns.seen -%}
        {%- set ns.v = ns.v + ['service ' ~ s ~ ' introuvable'] -%}
      {%- endfor -%}
      {%- for net in _networks -%}
        {%- for cid, att in (net.Containers | default({}, true)).items() if not (att.Name | default('')).startswith(ffg_project_name) -%}
          {%- set ns.v = ns.v + ['réseau ' ~ net.Name ~ ' : conteneur étranger ' ~ (att.Name | default(cid))] -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.v | join(' ; ') }}
  no_log: true
