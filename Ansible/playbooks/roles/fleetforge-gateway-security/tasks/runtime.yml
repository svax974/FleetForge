---
# Contrôle du DURCISSEMENT RÉEL de la passerelle, après son déploiement
# (deploy-fleetforge.yml : dans le bloc du déploiement, puis play « hardening »)
# — lit la machine, ne modifie rien, sauf en cas d'échec : les conteneurs de la
# passerelle sont ARRÊTÉS (fermé, tasks/stop.yml) puis le play échoue.
#
# `docker inspect` est appelé avec un FORMAT limité (HostConfig, Mounts,
# Config.User, Config.Labels, NetworkSettings.Networks) : jamais `Config.Env`,
# qui porte les mots de passe aval, DB_PASSWORD, JWT_SECRET, CRYPT_*. Les
# tâches qui lisent ces descriptions sont `no_log` quand même.
#
# Prouve, sur la machine, que :
#   • aucun conteneur du projet n'est privilégié, n'ajoute de capacité, n'est
#     `unconfined` (seccomp/AppArmor), ne partage un espace de noms de l'hôte,
#     n'a de périphérique de l'hôte, ne monte AUCUN chemin de l'hôte (bind) hors
#     `ffg_allowed_bind_sources` (vide), ni un volume local déguisé en montage
#     (`driver_opts` bind/device), et que tous portent no-new-privileges ;
#   • les services de CODE (`ffg_hardened_services`) tournent sous le compte
#     dédié (uid:gid), racine en lecture seule, toutes capacités retirées,
#     limites mémoire et CPU, sur le réseau de sous-réseau `ffg_docker_subnet` ;
#   • le front et le back-lb (relais de confiance de TRUST_PROXY) ont leurs
#     adresses fixes `ffg_front_ip` / `ffg_back_lb_ip` ;
#   • les réseaux du projet ne portent aucun conteneur d'un autre projet ;
#   • le compte dédié n'est dans aucun groupe privilégié et ne peut ni lire ni
#     traverser les chemins protégés (home du compte de service, et ceux de
#     l'entrée : socket de l'agent SSH de FleetForge…).

- name: Check the names used to select the gateway containers
  ansible.builtin.assert:
    that:
      - ffg_project_name is match('^[a-z][a-z0-9-]{0,40}$')
      - ffg_unix_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - (ffg_protected_paths_base + (ffg_protected_paths | default([]))) | reject('match', '^/[A-Za-z0-9._/-]+$') | list | length == 0
    quiet: true

- name: List the containers with their compose project
  ansible.builtin.command:
    argv: [docker, ps, -a, --format, '{% raw %}{{.ID}} {{.Label "com.docker.compose.project"}}{% endraw %}']
  become: true
  register: ffg_ps
  changed_when: false
  check_mode: false

# Projets de deploy-full.sh : `<nom>-back-<hôte>` et `<nom>-front-<hôte>`.
- name: Keep the gateway containers
  ansible.builtin.set_fact:
    ffg_container_ids: >-
      {{ ffg_ps.stdout_lines | select('match', '^[0-9a-f]+ ' ~ (ffg_project_name | regex_escape) ~ '-(back|front)-')
         | map('split') | map('first') | list }}

- name: Inspect the gateway containers (selected fields, never the environment)
  ansible.builtin.command:
    argv: "{{ ['docker', 'inspect', '--format', ffg_inspect_format] + ffg_container_ids }}"
  become: true
  register: ffg_inspect
  changed_when: false
  check_mode: false
  no_log: true
  when: ffg_container_ids | length > 0

- name: Parse the container descriptions
  ansible.builtin.set_fact:
    ffg_containers: "{{ (ffg_inspect.stdout_lines | default([])) | map('from_json') | list }}"
  no_log: true

- name: Inspect the networks of the gateway containers
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'network', 'inspect', '--format', ffg_network_format]
         + (ffg_containers | map(attribute='Networks') | map('list') | flatten | unique | list) }}
  become: true
  register: ffg_net_inspect
  changed_when: false
  check_mode: false
  no_log: true
  when: ffg_containers | length > 0

- name: Inspect the named volumes of the gateway containers
  ansible.builtin.command:
    argv: "{{ ['docker', 'volume', 'inspect', '--format', ffg_volume_format] + _volumes }}"
  vars:
    _volumes: >-
      {{ ffg_containers | map(attribute='Mounts') | flatten
         | selectattr('Type', 'equalto', 'volume') | map(attribute='Name') | unique | list }}
  become: true
  register: ffg_vol_inspect
  changed_when: false
  check_mode: false
  no_log: true
  when: _volumes | length > 0

# L'ordre et la présence des DROP de la passerelle (même contrôle qu'avant le
# déploiement) : un pare-feu perdu depuis (unité en échec) se voit ici.
- name: Verify the gateway firewall is in place and reached
  ansible.builtin.include_tasks:
    file: firewall-check.yml
    apply:
      tags: [always]
  tags: [always]

- name: Read the dedicated account
  ansible.builtin.command:
    argv: [getent, passwd, "{{ ffg_unix_user }}"]
  register: ffg_passwd
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read the groups of the dedicated account
  ansible.builtin.command:
    argv: [id, -nG, "{{ ffg_unix_user }}"]
  register: ffg_groups
  changed_when: false
  check_mode: false
  failed_when: false

# rc 0 = le compte LIT (-r) ou TRAVERSE (-x) le chemin : interdit.
- name: Probe the protected paths as the dedicated account
  ansible.builtin.command:
    argv: [runuser, -u, "{{ ffg_unix_user }}", --, test, "{{ item.0 }}", "{{ item.1 }}"]
  loop: "{{ ['-r', '-x'] | product(ffg_protected_paths_base + (ffg_protected_paths | default([]))) | list }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"
  become: true
  register: ffg_path_probe
  changed_when: false
  check_mode: false
  failed_when: false
  when: ffg_passwd.rc == 0

# `apply: always` : un include dynamique ne transmet pas les tags de son appelant
# à ses tâches (CLAUDE.md, pièges) ; ce fichier n'est chargé que si son appelant
# a été retenu.
- name: Work out the hardening violations
  ansible.builtin.include_tasks:
    file: violations.yml
    apply:
      tags: [always]
  tags: [always]

- name: Stop the gateway containers when the hardening is not met
  ansible.builtin.include_tasks:
    file: stop.yml
    apply:
      tags: [always]
  tags: [always]
  when:
    - ffg_violations | trim | length > 0
    - ffg_stop_on_hardening_failure | bool

- name: Fail when the hardening is not met
  ansible.builtin.assert:
    that: ffg_violations | trim | length == 0
    fail_msg: >-
      Durcissement de la passerelle NON conforme ({{ 'conteneurs arrêtés' if ffg_stop_on_hardening_failure | bool else 'conteneurs laissés en marche' }}) :
      {{ ffg_violations }}. Le compose de l'app (COMPOSE_FILE_NAME) doit porter, pour
      {{ ffg_hardened_services | join(', ') }} : user "${FFG_RUNTIME_UID}:${FFG_RUNTIME_GID}",
      read_only (+ tmpfs), cap_drop [ALL], mem_limit et cpus ; pour tous : no-new-privileges, aucun
      cap_add, aucun montage de l'hôte ni volume à driver_opts, ni socket Docker ni vmagent ; front et
      back-lb sur le réseau ${FFG_DOCKER_SUBNET} aux adresses ${FFG_FRONT_IP} / ${FFG_BACK_LB_IP},
      publiant EXACTEMENT 0.0.0.0:{{ app_port }} / 0.0.0.0:{{ back_port }}, tout autre port en 127.0.0.1 ;
      volumes et réseaux du seul projet ; pare-feu DOCKER-USER en place.
    success_msg: "Durcissement conforme : {{ ffg_containers | length }} conteneur(s), compte {{ ffg_unix_user }} isolé."
