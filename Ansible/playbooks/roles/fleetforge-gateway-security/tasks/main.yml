---
# Voir defaults/main.yml. Joué AVANT le déploiement de l'app (aucune fenêtre
# où un port publié serait ouvert) puis rejoué par update-ufw-all.yml quand la
# liste des proxies change. Le contrôle du durcissement des conteneurs, lui,
# vit dans tasks/runtime.yml (après le déploiement).

# Les valeurs entrent dans un script root : grammaire tenue avant le rendu.
- name: Check the values written into the firewall script
  ansible.builtin.assert:
    that:
      - ffg_front_port | string is match('^[0-9]{2,5}$')
      - ffg_back_port | string is match('^[0-9]{2,5}$')
      - ffg_front_port | int != ffg_back_port | int
      - ffg_internal_cidr is match('^[0-9]{1,3}([.][0-9]{1,3}){3}/[0-9]{1,2}$')
      - ffg_remote_proxies | reject('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}$') | list | length == 0
      - ffg_remote_proxies | intersect(ffg_vpn_addresses) | length == 0
      - ffg_internal_cidr is not match('^172[.]16[.]0[.]0/12$')
      - ffg_firewall_script is match('^/[A-Za-z0-9._/-]+$')
    fail_msg: >-
      Ports, sous-réseau DÉDIÉ (jamais 172.16.0.0/12) et adresses des proxies : formes
      numériques IPv4 attendues ; aucun proxy admis à l'adresse d'un VPN.
    quiet: true

- name: Deploy the gateway firewall script
  ansible.builtin.template:
    src: fleetforge-gateway-firewall.sh.j2
    dest: "{{ ffg_firewall_script }}"
    owner: root
    group: root
    mode: '0750'
  become: true
  notify: reapply fleetforge-gateway firewall

- name: Deploy the gateway firewall unit
  ansible.builtin.template:
    src: fleetforge-gateway-firewall.service
    dest: "/etc/systemd/system/{{ ffg_firewall_unit }}.service"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reapply fleetforge-gateway firewall

- name: Enable and start the gateway firewall unit
  ansible.builtin.systemd:
    name: "{{ ffg_firewall_unit }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

# Une règle ufw sur un port publié est décorative ; posée par un autre rôle
# (update-ufw-all.yml avant `ufw_app_ports: false`) ou à la main, elle
# raconterait une autre histoire que la chaîne réelle. TOUTES sont retirées,
# quelle que soit leur source, IPv4 et IPv6.
- name: Remove every ufw rule on the gateway ports
  ansible.builtin.include_tasks:
    file: ufw-purge.yml
    apply:
      tags: [always]

# Les handlers tournent en fin de play : application immédiate, puis contrôle
# de l'état RÉEL de la chaîne.
- name: Apply the rules now
  ansible.builtin.command:
    argv: ["{{ ffg_firewall_script }}"]
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Read the firewall state
  ansible.builtin.include_tasks:
    file: firewall-check.yml
    apply:
      tags: [always]

- name: Fail when the gateway firewall is missing or bypassed
  ansible.builtin.assert:
    that: ffg_firewall_problems | trim | length == 0
    fail_msg: >-
      Pare-feu de la passerelle NON conforme : {{ ffg_firewall_problems }}. Vérifier
      `systemctl status {{ ffg_firewall_unit }}` et `iptables -S DOCKER-USER` ; rejouer
      le rôle (le script insère ses règles en tête).
    quiet: true
  when: not ansible_check_mode

# ufw ne filtre pas les ports publiés par Docker, mais il filtre ce qui arrive
# en INPUT : docker-proxy sur `[::]` si une liaison IPv6 apparaissait, et les
# règles que `deploy-full.sh` poserait sur NODE_PORT/DB_PORT (WHITELIST,
# PROXY_HOSTS : refusées dans back/.env). HYPOTHÈSE vérifiée ici : ufw actif,
# politique entrante `deny`.
- name: Read the ufw status
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  become: true
  register: ffg_ufw_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail when ufw is not active with an incoming deny policy
  ansible.builtin.assert:
    that:
      - ffg_ufw_status.stdout is search('Status:[ ]+active')
      - ffg_ufw_status.stdout is search('Default:[ ]+deny [(]incoming[)]')
    fail_msg: >-
      ufw n'est pas actif avec une politique entrante `deny` sur {{ inventory_hostname }} :
      ce qui arrive en INPUT (docker-proxy, règles posées par deploy-full.sh) ne serait pas filtré.
    quiet: true
  when: not ansible_check_mode

- name: Report the exposure
  ansible.builtin.debug:
    msg: >-
      Ports {{ ffg_front_port }} (front) et {{ ffg_back_port }} (back-lb, `/mcp`), publiés
      sur 0.0.0.0, filtrés dans DOCKER-USER : {{ ('proxies distants ' ~ (ffg_remote_proxies | join(', ')))
      if ffg_remote_proxies | length > 0 else 'aucune source externe' }}, puis DROP
      (IPv6 : DROP). Un proxy de cette machine passe par 127.0.0.1 (boucle locale, hors
      DOCKER-USER). Contrôle depuis une machine hors proxies : `nc -z {{ ansible_host }}
      {{ ffg_back_port }}` doit échouer.
