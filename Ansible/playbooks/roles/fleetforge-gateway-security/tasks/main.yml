---
# Voir defaults/main.yml. Joué AVANT le déploiement de l'app (aucune fenêtre
# où un port publié serait ouvert) puis rejoué par update-ufw-all.yml quand la
# liste des proxies change. Le contrôle du durcissement des conteneurs, lui,
# vit dans tasks/runtime.yml (après le déploiement).

# Les valeurs entrent dans un script root : grammaire tenue avant le rendu.
- name: Check the values written into the firewall script
  ansible.builtin.assert:
    that:
      - ffg_front_port | string is match('^[0-9]{2,5}$')
      - ffg_back_port | string is match('^[0-9]{2,5}$')
      - ffg_front_port | int != ffg_back_port | int
      - ffg_internal_cidr is match('^[0-9]{1,3}([.][0-9]{1,3}){3}/[0-9]{1,2}$')
      - ffg_remote_proxies | reject('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}$') | list | length == 0
      - ffg_remote_proxies | intersect(ffg_vpn_addresses) | length == 0
      - ffg_internal_cidr is not match('^172[.]16[.]0[.]0/12$')
      - ffg_firewall_script is match('^/[A-Za-z0-9._/-]+$')
    fail_msg: >-
      Ports, sous-réseau DÉDIÉ (jamais 172.16.0.0/12) et adresses des proxies : formes
      numériques IPv4 attendues ; aucun proxy admis à l'adresse d'un VPN.
    quiet: true

- name: Deploy the gateway firewall script
  ansible.builtin.template:
    src: fleetforge-gateway-firewall.sh.j2
    dest: "{{ ffg_firewall_script }}"
    owner: root
    group: root
    mode: '0750'
  become: true
  notify: reapply fleetforge-gateway firewall

- name: Deploy the gateway firewall unit
  ansible.builtin.template:
    src: fleetforge-gateway-firewall.service
    dest: "/etc/systemd/system/{{ ffg_firewall_unit }}.service"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reapply fleetforge-gateway firewall

- name: Enable and start the gateway firewall unit
  ansible.builtin.systemd:
    name: "{{ ffg_firewall_unit }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

# Une règle ufw sur un port publié est décorative ; posée par un autre rôle
# (update-ufw-all.yml avant `ufw_app_ports: false`) ou à la main, elle
# raconterait une autre histoire que la chaîne réelle. TOUTES sont retirées,
# quelle que soit leur source, IPv4 et IPv6.
- name: Remove every ufw rule on the gateway ports
  ansible.builtin.include_tasks:
    file: ufw-purge.yml
    apply:
      tags: [always]

# Les handlers tournent en fin de play : application immédiate, puis contrôle
# de l'état RÉEL de la chaîne.
- name: Apply the rules now
  ansible.builtin.command:
    argv: ["{{ ffg_firewall_script }}"]
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Read back the IPv4 DOCKER-USER chain
  ansible.builtin.command:
    argv: [iptables, -w, -S, DOCKER-USER]
  become: true
  register: ffg_chain4
  changed_when: false
  check_mode: false

# Chaîne absente = Docker en IPv4 seul : rien à vérifier en IPv6.
- name: Read back the IPv6 DOCKER-USER chain
  ansible.builtin.command:
    argv: [ip6tables, -w, -S, DOCKER-USER]
  become: true
  register: ffg_chain6
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify each published port ends in a DROP (IPv4, and IPv6 when the chain exists)
  ansible.builtin.assert:
    that:
      - (item.0.rc != 0 and item.0.family == 'ip6tables')
        or item.0.stdout is search('--ctorigdstport ' ~ item.1 ~ ' .*fleetforge-gateway:' ~ item.1 ~ ':deny.*-j DROP')
    fail_msg: >-
      {{ item.0.family }} : aucun DROP sur le port {{ item.1 }} dans DOCKER-USER —
      la passerelle serait joignable sans passer par les proxies. Vérifier
      `systemctl status {{ ffg_firewall_unit }}` et `{{ item.0.family }} -S DOCKER-USER`.
    quiet: true
  loop: >-
    {{ [ffg_chain4 | combine({'family': 'iptables'}), ffg_chain6 | combine({'family': 'ip6tables'})]
       | product([ffg_front_port, ffg_back_port]) | list }}
  loop_control:
    label: "{{ item.0.family }} {{ item.1 }}"
  when: not ansible_check_mode

# Le DROP doit être ATTEINT : aucune règle inconditionnelle RETURN/ACCEPT ne
# précède la première règle de la passerelle (sinon elles sont décoratives).
- name: Verify no unconditional RETURN or ACCEPT precedes the gateway rules
  vars:
    _rules: "{{ item.stdout_lines | default([]) | select('match', '^-A DOCKER-USER ') | list }}"
    _first: "{{ (_rules | select('search', 'fleetforge-gateway:') | first | default('')) }}"
    _first_index: "{{ _rules.index(_first) if _first in _rules else -1 }}"
    _bypass: >-
      {{ _rules[: (_first_index | int if _first_index | int >= 0 else 0)]
         | select('match', '^-A DOCKER-USER -j (RETURN|ACCEPT)[ ]*$') | list }}
  ansible.builtin.assert:
    that:
      - (item.rc | default(1)) != 0 or (_first_index | int) >= 0
      - _bypass | length == 0
    fail_msg: >-
      {{ item.family }} : {{ 'aucune règle de la passerelle dans DOCKER-USER'
      if (_first_index | int) < 0 else 'une règle inconditionnelle ' ~ (_bypass | join(' ; ')) ~ ' précède les règles de la passerelle' }} —
      elles ne seraient jamais atteintes. Rejouer le rôle (le script les insère en tête).
    quiet: true
  loop:
    - "{{ ffg_chain4 | combine({'family': 'iptables'}) }}"
    - "{{ ffg_chain6 | combine({'family': 'ip6tables'}) }}"
  loop_control:
    label: "{{ item.family }}"
  when:
    - not ansible_check_mode
    - (item.rc | default(1)) == 0

- name: Report the exposure
  ansible.builtin.debug:
    msg: >-
      Ports {{ ffg_front_port }} (front) et {{ ffg_back_port }} (back-lb, `/mcp`)
      filtrés dans DOCKER-USER : {{ ('proxies distants ' ~ (ffg_remote_proxies | join(', ')))
      if ffg_remote_proxies | length > 0 else 'aucune source externe' }}, puis DROP
      (IPv6 : DROP). Un proxy de cette machine passe par 127.0.0.1. Contrôle depuis
      une machine hors proxies : `nc -z {{ ansible_host }} {{ ffg_back_port }}` doit échouer.
