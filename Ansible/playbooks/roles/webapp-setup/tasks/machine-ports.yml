---
# Lecture des variables de PORT d'entrées d'inventaire AUTRES que celle jouée (inventaire seul, aucune connexion : `debug`
# ne contacte pas l'hôte). Entrée : `wa_mp_entries` (noms d'entrées). Sortie : fait `wa_machine_ports`
# {entrée: {host, ssh, roles, hardened, proxy, engine, machine, ports: {<clé *port>: "<valeur rendue>"}, rules: [ports]}}.
#
# Pourquoi pas `hostvars[<entrée>][<clé>]` : ansible-core 2.21 y rend les valeurs dans un contexte SANS `hostvars` — un port
# défini par un gabarit qui référence `hostvars` (`back_port: "{{ hostvars['x'].app_port | int + 1 }}"`) échoue en
# « 'hostvars' is undefined », y compris par `hostvars[n].clé` et `dict2items`. Ici chaque entrée est lue par une tâche
# DÉLÉGUÉE à elle-même (`ansible_delegated_vars`), rendue dans SON contexte, où `hostvars` existe : la valeur rendue est
# celle qu'utiliserait un déploiement de cette entrée. Une valeur qui ne se rend pas fait échouer la tâche (jamais ignorée).
# Seules les clés `*port` (hors `ansible_port`) et les `port` de `docker_ports_rules` sont rendues.

- name: Read the rendered port variables of the entries that share the machine
  ansible.builtin.debug:
    msg: >-
      {%- set v = ansible_delegated_vars[item] -%}
      {%- set ports = {} -%}
      {%- for k in v.keys() if k is match('^[a-z0-9_]*port$') and k != 'ansible_port' -%}
      {%- set _ = ports.update({k: v[k] | string}) -%}
      {%- endfor -%}
      {%- set rules = [] -%}
      {%- for r in v.docker_ports_rules | default([]) -%}
      {%- set _ = rules.append(r.port | default(0) | int) -%}
      {%- endfor -%}
      {{ {'host': v.ansible_host | default('', true) | string, 'ssh': (v.ansible_port | default(22, true)) | string,
          'roles': v.ansible_roles | default([]), 'hardened': v.webapp_hardening is defined,
          'proxy': v.webapp_proxy | default('internal') | string, 'engine': v.webapp_db_engine | default('') | string,
          'machine': v.webapp_machine | default(item) | string, 'ports': ports, 'rules': rules} }}
  delegate_to: "{{ item }}"
  loop: "{{ wa_mp_entries }}"
  loop_control:
    label: "{{ item }}"
  register: wa_mp_read
  changed_when: false
  tags: [always]

- name: Keep the rendered port variables of the entries
  ansible.builtin.set_fact:
    wa_machine_ports: "{{ dict(wa_mp_entries | zip(wa_mp_read.results | map(attribute='msg'))) }}"
  tags: [always]
