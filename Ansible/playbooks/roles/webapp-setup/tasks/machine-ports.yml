---
# Ports d'entrées d'inventaire AUTRES que celle jouée (inventaire seul, aucune connexion). Entrée : `wa_mp_entries` (noms
# d'entrées). Sortie : fait `wa_machine_ports`
# {entrée: {host, ssh, roles, hardened, proxy, engine, machine, ports: {<clé *port>: "<valeur rendue>"}, rules: [ports]}}.
#
# Les valeurs ne sont PAS rendues ici : chaque entrée les a rendues dans SON contexte (variables de l'entrée ET `hostvars`),
# par un jeu joué sur elle (playbooks/lib/probe-entry-ports.yml, roles/webapp-setup/tasks/probe-ports.yml), fait `wa_mp_self`.
# Aucune lecture depuis l'entrée jouée : `ansible_delegated_vars[n]` rendrait `app_port` dans le contexte de l'entrée jouée
# (4801 au lieu de 4901) et `hostvars[n][clé]` échoue en « 'hostvars' is undefined » sur un gabarit qui référence `hostvars`.
# Une entrée non lue (jeu absent du playbook, `--limit`) ou dont un gabarit ne se rend pas fait ÉCHOUER la garde : jamais
# ignorée, jamais lue à moitié.

- name: Check that every entry to compare was read in its own context
  vars:
    _unread: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for n in wa_mp_entries if hostvars[n].wa_mp_self is not defined or hostvars[n].wa_mp_self.error is defined -%}
      {%- set ns.out = ns.out + [n] -%}
      {%- endfor -%}
      {{ ns.out }}
  ansible.builtin.assert:
    that:
      - _unread | length == 0
    fail_msg: >-
      {{ inventory_hostname }} : les variables de port de {{ _unread | join(', ') }} n'ont pas été lues dans le contexte de
      leur entrée — soit le playbook n'importe pas `probe-entry-ports.yml` (ou est lancé avec `--limit`, qui exclut ces entrées),
      soit une valeur `*port` ou `docker_ports_rules[].port` de l'entrée ne se rend pas (`ansible-inventory --host <entrée>`).
    quiet: true
  tags: [always]

# `set_fact` (et non `register`) : un nom `register` ne peut pas figurer dans la sonde de no-overrides.yml de ce rôle
# (collision de faits).
# `no_log` : les valeurs `*port` d'une entrée peuvent être chiffrées au coffre ; elles ne sortent pas en `-v`.
- name: Gather the rendered ports of the entries that share the machine
  no_log: true
  ansible.builtin.set_fact:
    wa_machine_ports: >-
      {%- set ns = namespace(out={}) -%}
      {%- for n in wa_mp_entries -%}
      {%- set ns.out = ns.out | combine({n: hostvars[n].wa_mp_self}) -%}
      {%- endfor -%}
      {{ ns.out }}
  tags: [always]
