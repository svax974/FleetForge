---
# Profil DURCI d'une entrée `webapp` (`webapp_hardening`) : garde STATIQUE de l'inventaire (asserts locaux, aucune
# connexion) puis faits `wa_h_*` lus par webapp-install, -security, -env-update, -deploy, -monitoring, -remove.
# Inclus par facts.yml (sous `webapp_hardening is defined`) et par le play de garde de deploy-webapp.yml.
# Exige les faits `wa_*` (facts.yml) : `wa_project`, `wa_front_port`, `wa_back_port`, `wa_db_port`, `wa_redis_port`.
#
# Ce que le profil promet (docs/etude-passerelle-sur-webapp.md) : compose durci contrôlé AVANT run.sh, pare-feu
# DOCKER-USER propre à l'app (proxies admis distants seulement, + le sous-réseau dédié vers le back-lb), compte Unix
# dédié, contrôle du durcissement RÉEL après le déploiement, conteneurs ARRÊTÉS au moindre écart.

- name: Settle the hardening profile
  vars:
    _h: "{{ webapp_hardening_defaults | combine(webapp_hardening if webapp_hardening is mapping else {}) }}"
  ansible.builtin.set_fact:
    wa_h_user: "{{ _h.runtime_user | default('') }}"
    wa_h_subnet: "{{ _h.docker_subnet | default('') }}"
    wa_h_front_ip: "{{ _h.front_ip | default('') }}"
    wa_h_back_lb_ip: "{{ _h.back_lb_ip | default('') }}"
    wa_h_protected_paths: "{{ ['/home/' ~ remote_username] + (_h.protected_paths | default([])) }}"
    wa_h_services: "{{ _h.services }}"
    wa_h_allowed_binds: "{{ _h.allowed_bind_sources }}"
    wa_h_compose_file: "{{ webapp_compose_file | default(_h.compose_file) }}"
    wa_h_forbidden_groups: "{{ webapp_forbidden_groups }}"
    wa_h_vpn_addresses: "{{ webapp_vpn_addresses }}"
    wa_h_eligible_proxies: "{{ webapp_eligible_proxies }}"
    wa_h_tag: "webapp-{{ wa_project }}"
    wa_h_firewall_script: "/usr/local/sbin/webapp-{{ wa_project }}-firewall.sh"
    wa_h_firewall_unit: "webapp-{{ wa_project }}-firewall"
  tags: [always]

# Relais de confiance : proxies ADMIS (hors adresses VPN), plus la passerelle du pont dédié quand un proxy admis est
# sur CETTE machine (il atteint les ports publiés par la boucle locale, donc par le pont). Jamais `loopback`,
# `linklocal`, `uniquelocal` génériques. Proxies DISTANTS : ceux que le pare-feu admet (un proxy de la machine passe
# par 127.0.0.1, chaîne OUTPUT, hors DOCKER-USER).
- name: Work out the trusted relays and the admitted proxies
  vars:
    _eligible_addresses: "{{ wa_h_eligible_proxies | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list }}"
    _bridge_gateway: "{{ wa_h_subnet.split('/')[0].rsplit('.', 1)[0] ~ '.1' }}"
  ansible.builtin.set_fact:
    wa_h_remote_proxies: "{{ _eligible_addresses | reject('equalto', ansible_host) | list }}"
    # Un proxy (admis ou non) sur CETTE machine : son nginx joint l'app en local, par la règle OUTPUT `local:nginx`
    # (groupe de contrôle), alors exigée — cgroup v2 et xt_cgroup vérifiés avant de toucher au pare-feu.
    wa_h_local_proxy: >-
      {{ groups['proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | select('defined')
         | select('equalto', ansible_host) | list | length > 0 }}
    wa_h_trusted_relays: "{{ _eligible_addresses + ([_bridge_gateway] if ansible_host in _eligible_addresses else []) }}"
  tags: [always]

# SORTIE du sous-réseau dédié (pare-feu du profil) : liste EXPLICITE `webapp_hardening.egress_allow`, une ligne par
# destination, avec sa raison : [{name, proxies: true | inventory_host: <entrée> | host: <IPv4>, port, proto?}].
# `proxies: true` = les proxies ADMIS. Une destination qui est l'adresse d'un proxy DISTANT sort par FORWARD puis
# MASQUERADE : le proxy voit l'adresse PUBLIQUE de cette machine. Refusé, sauf `masquerade_ack: true` sur la ligne ET
# machine sans identité privilégiée (voir l'assert plus bas). Liste vide ou
# absente = RIEN (hors réponses, trafic interne au sous-réseau et DNS des résolveurs de la machine, lus sur place par
# le pare-feu). Une destination qui est l'adresse de CETTE machine passe par INPUT (port de l'hôte), les autres par
# FORWARD (DOCKER-USER). Tout le reste est refusé : Internet, métadonnées 169.254.169.254, services de l'hôte.
- name: Work out the outbound destinations of the dedicated subnet
  vars:
    _h: "{{ webapp_hardening if webapp_hardening is mapping else {} }}"
    _egress: >-
      {%- set out = [] -%}
      {%- for e in _h.egress_allow | default([]) if e is mapping -%}
      {%- if e.proxies | default(false) | bool -%}
        {%- set addrs = wa_h_eligible_proxies | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list -%}
      {%- elif e.inventory_host is defined -%}
        {%- set addrs = [hostvars[e.inventory_host].ansible_host | default('?')] if e.inventory_host in hostvars else ['?'] -%}
      {%- else -%}
        {%- set addrs = [e.host | default('?')] -%}
      {%- endif -%}
      {%- for a in addrs -%}
        {%- set _ = out.append({'name': e.name | default('?'), 'dest': a | string, 'port': e.port | default('?'),
                                'proto': e.proto | default('tcp'), 'masquerade_ack': e.masquerade_ack | default(false) | bool}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.set_fact:
    wa_h_egress: "{{ _egress }}"
    wa_h_egress_remote: "{{ _egress | rejectattr('dest', 'equalto', ansible_host) | list }}"
    wa_h_egress_host: "{{ _egress | selectattr('dest', 'equalto', ansible_host) | list }}"
  tags: [always]

- name: Write the trusted relays into their settings
  ansible.builtin.set_fact:
    # TRUST_PROXY du back : relais + front et back-lb à adresse fixe.
    wa_h_trust_proxy: "{{ (wa_h_trusted_relays + [wa_h_front_ip, wa_h_back_lb_ip]) | unique | join(',') }}"
    # Directives nginx du back-lb, insérées par l'interpolation de Compose dans son heredoc quoté.
    wa_h_realip: "{{ wa_h_trusted_relays | map('regex_replace', '^', 'set_real_ip_from ') | map('regex_replace', '$', ';') | join(' ') }}"
  tags: [always]

# Garde : tout ce qui suit lit l'inventaire. Un défaut ici serait un déploiement « réussi » d'une app mal isolée.
- name: Check the hardening profile of the entry
  vars:
    _prefix: "{{ wa_h_subnet.split('/')[0].rsplit('.', 1)[0] }}"
    _host_octet: '[.]([2-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$'
    # Sortie FORWARD vers l'adresse d'un proxy (jamais cette machine : celle-là passe par INPUT) : le proxy voit
    # l'adresse PUBLIQUE de cette machine, MASQUERADE oblige. Les vhosts du parc l'admettent au titre de chaque entrée
    # qui la porte (`access_linked`, listes nommées, hôtes de l'inventaire…) : l'app en hériterait.
    _proxy_addresses: >-
      {{ groups['proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | select('defined') | map('string') | list }}
    _masquerade: "{{ wa_h_egress_remote | selectattr('dest', 'in', _proxy_addresses) | list }}"
    # Identités à fort pouvoir (nœud de contrôle, proxies, serveurs VPN, supervision) : jamais celle de cette machine.
    _identity_addresses: >-
      {{ ((groups['infras'] | default([])) + (groups['proxies'] | default([])) + (groups['vpns'] | default([]))
          + ([prometheus_host] if prometheus_host is defined else []))
         | select('in', hostvars) | map('extract', hostvars, 'ansible_host') | select('defined') | map('string') | list }}
    # Autres entrées de la MÊME machine, et noms admis PAR ADRESSE ailleurs (serveurs liés, serveurs nommés d'une liste
    # d'accès) : une autre application de la machine ne doit pas y figurer, sans quoi la sortie masquée en hérite.
    _machine_peers: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('ansible_host', 'defined')
         | selectattr('ansible_host', 'equalto', ansible_host)
         | rejectattr('inventory_hostname', 'equalto', inventory_hostname) | map(attribute='inventory_hostname') | list }}
    _admitted_by_address: >-
      {{ (groups['all'] | map('extract', hostvars) | map(attribute='access_linked', default=[]) | flatten | list)
         + (groups['all'] | map('extract', hostvars) | map(attribute='webapp_vhost_locations', default=[]) | flatten
            | select('mapping') | selectattr('access', 'defined') | map(attribute='access') | select('mapping')
            | map(attribute='hosts', default=[]) | flatten | list) }}
  ansible.builtin.assert:
    that:
      - webapp_hardening is mapping
      - wa_project is match('^[a-z][a-z0-9-]{0,40}$')
      - wa_h_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - wa_h_user != remote_username
      # Jamais un compte réservé, ni celui d'une AUTRE entrée durcie (account.yml refuse aussi tout compte existant
      # qui ne porte pas le marqueur de ce déploiement ; webapp-remove ne supprime que le compte marqué).
      - wa_h_user not in ['root', 'daemon', 'bin', 'sys', 'sync', 'games', 'man', 'lp', 'mail', 'news', 'uucp', 'proxy',
                          'www-data', 'backup', 'list', 'irc', 'nobody', 'systemd-network', 'systemd-resolve',
                          'messagebus', 'sshd', 'syslog', 'ubuntu', 'debian', 'admin', 'docker', 'postgres', 'redis', 'nginx']
      - >-
        groups['all'] | map('extract', hostvars) | rejectattr('inventory_hostname', 'equalto', inventory_hostname)
        | selectattr('webapp_hardening', 'defined') | map(attribute='webapp_hardening')
        | map(attribute='runtime_user', default='') | select('equalto', wa_h_user) | list | length == 0
      - wa_h_subnet is match(webapp_private_cidr_regex)
      - wa_h_subnet is match('^[0-9.]+/24$')
      # Hors des plages que Docker attribue par défaut : un autre projet de la machine ne peut pas recevoir le même.
      - wa_h_subnet is not match('^(172[.](1[6-9]|2[0-9]|3[01])|192[.]168)[.]')
      # Admis par le vhost d'un serveur lié SEULEMENT sur un proxy de la même machine (`_access.inc`) : inutile (et
      # jamais lu) quand aucun proxy n'est sur cette machine.
      - (not (wa_h_local_proxy | bool)) or wa_h_subnet in (access_local_cidrs | default([]))
      - wa_h_front_ip != wa_h_back_lb_ip
      - wa_h_front_ip is match('^' ~ (_prefix | regex_escape) ~ _host_octet)
      - wa_h_back_lb_ip is match('^' ~ (_prefix | regex_escape) ~ _host_octet)
      - wa_h_protected_paths | reject('match', '^/[A-Za-z0-9._/-]+$') | list | length == 0
      - wa_h_services is not string and wa_h_services | length > 0
      - wa_h_services | reject('match', '^[a-z][a-z0-9-]{0,40}$') | list | length == 0
      - wa_h_allowed_binds is not string
      - wa_h_compose_file is match('^[A-Za-z0-9._/-]+$')
      - "'..' not in wa_h_compose_file"
      # Ports publiés par Docker : une règle ufw serait décorative (et resterait après un resserrement).
      - not (ufw_app_ports | default(true) | bool)
      - not (wa_db_exposed | bool)
      - not (webapp_metrics_push | default(false) | bool)
      # update_common.sh resynchroniserait (et pousserait) les bibliothèques APRÈS le contrôle du compose.
      - not (wa_update_common | bool)
      # Front en conteneur sur la même machine que le back : un seul projet compose, donc un seul réseau dédié.
      - wa_front_mode == 'container'
      - not (wa_external | bool)
      - wa_h_remote_proxies | reject('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}$') | list | length == 0
      - wa_h_remote_proxies | intersect(wa_h_vpn_addresses) | length == 0
      - (wa_h_trusted_relays + [wa_h_front_ip, wa_h_back_lb_ip]) | reject('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}$') | list | length == 0
      # Sorties : une ADRESSE IPv4 (jamais un réseau, jamais 0/8, 127/8, 169.254/16), un port, tcp ou udp, un nom.
      - webapp_hardening.egress_allow | default([]) is not string
      - webapp_hardening.egress_allow | default([]) | reject('mapping') | list | length == 0
      - wa_h_egress | map(attribute='dest') | reject('match', '^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}$') | list | length == 0
      - wa_h_egress | map(attribute='dest') | select('match', '^(0[.]|169[.]254[.]|127[.])') | list | length == 0
      - wa_h_egress | map(attribute='port') | map('string') | reject('match', '^[1-9][0-9]{0,4}$') | list | length == 0
      - wa_h_egress | map(attribute='proto') | reject('in', ['tcp', 'udp']) | list | length == 0
      - wa_h_egress | map(attribute='name') | map('string') | reject('match', '^[a-z][a-z0-9_-]{0,31}$') | list | length == 0
      # Jamais un proxy DISTANT sans décision explicite : par FORWARD puis MASQUERADE il verrait l'adresse PUBLIQUE de cette
      # machine, que ses vhosts admettent au titre des autres entrées de la machine — l'app en hériterait. Admis seulement
      # si chaque ligne vers un proxy porte `masquerade_ack: true` ET que la machine n'a aucune identité privilégiée
      # (nœud de contrôle, proxy, serveur VPN, supervision, whitelist) ni autre entrée nommée par adresse ailleurs.
      # Un proxy de CETTE machine passe par INPUT, sous l'adresse du conteneur (`access_local_cidrs`).
      - (_masquerade | length == 0) or (_masquerade | rejectattr('masquerade_ack') | list | length == 0)
      - (_masquerade | length == 0) or (ansible_host | string) not in _identity_addresses
      - (_masquerade | length == 0) or (ansible_host | string) not in (whitelist | default([]) | map('string') | list)
      - (_masquerade | length == 0) or (_machine_peers | intersect(_admitted_by_address) | length == 0)
    fail_msg: >-
      {{ inventory_hostname }} : profil `webapp_hardening` invalide — `runtime_user` (≠ {{ remote_username }}),
      `docker_subnet` privé en /24 hors 172.16/12 et 192.168/16 (listé dans `access_local_cidrs` seulement si un proxy
      est sur cette machine), `front_ip` et
      `back_lb_ip` distincts dans ce /24 (hors .0/.1/.255), `protected_paths` absolus sans métacaractère, `services`
      et `compose_file` (relatif, sans `..`) ; `ufw_app_ports: false` ; `webapp_update_common: false` ; ni
      `webapp_db_exposed` ni `webapp_metrics_push` ;
      front en conteneur, proxy interne ; aucun proxy admis à l'adresse d'un VPN ; `egress_allow` : [{name,
      proxies: true | inventory_host: <entrée> | host: <IPv4>, port, proto: tcp|udp, masquerade_ack?}] (adresse unique,
      hors 0/8, 127/8 et 169.254/16). Une sortie vers un proxy DISTANT (ou une machine qui en porte un) exige
      `masquerade_ack: true` sur chacune de ses lignes — le proxy y voit l'adresse PUBLIQUE de cette machine — et une
      machine qui n'est ni nœud de contrôle (`infras`), ni proxy, ni serveur VPN, ni supervision, ni dans `whitelist`,
      dont aucune autre entrée n'est nommée par adresse (`access_linked`, listes nommées) : {{ _machine_peers | join(', ') or 'aucune autre entrée' }}.
    quiet: true
  tags: [always]

# Ports de l'app (front, back-lb, Postgres, Redis) : libres parmi TOUTES les variables `*port` des autres entrées de
# la machine (pas seulement les `webapp`, dont facts.yml compare déjà les blocs) — un port ajouté demain à une autre
# famille est comparé aussi.
# Les valeurs sont lues par machine-ports.yml (chaque entrée dans SON contexte) : `n[k]` sur l'objet hostvars d'une entrée
# voisine échoue en « 'hostvars' is undefined » dès qu'un de ses `*port` est un gabarit qui référence `hostvars`.
- name: Read the rendered port variables of the entries on this address
  vars:
    _addr: "{{ ansible_host | default('') }}"
  ansible.builtin.include_tasks:
    file: machine-ports.yml
  args:
    apply:
      tags: [always]
      vars:
        wa_mp_entries: >-
          {{ groups['all'] | select('in', hostvars) | map('extract', hostvars) | selectattr('ansible_host', 'defined')
             | selectattr('ansible_host', 'equalto', _addr) | map(attribute='inventory_hostname') | list }}
  tags: [always]

- name: Check the ports of the application are free on the machine
  vars:
    _ours: "{{ [wa_front_port, wa_back_port, wa_db_port, wa_redis_port] | map('int') | list }}"
    _taken: >-
      {%- set ns = namespace(p=[]) -%}
      {%- for n, d in wa_machine_ports.items() if n != inventory_hostname -%}
      {%- for k, v in d.ports.items() if v is match('^[0-9]+$') -%}
      {%- set ns.p = ns.p + [v] -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.p | join(',') }}
    _clash: "{{ _ours | intersect((_taken | string).split(',') | reject('equalto', '') | map('int') | list) }}"
    # Ports filtrés par docker-ports-security sur la machine (`docker_ports_rules` de TOUTE entrée de la même adresse,
    # celle-ci comprise) : deux scripts poseraient leurs règles sur le même port.
    _rule_ports: "{{ wa_machine_ports.values() | map(attribute='rules') | flatten | map('int') | list }}"
    _rule_clash: "{{ _ours | intersect(_rule_ports) }}"
  ansible.builtin.assert:
    that:
      - (_ours | unique | length) == 4
      - _clash | length == 0
      - _rule_clash | length == 0
    fail_msg: >-
      {{ inventory_hostname }} : front/back-lb/Postgres/Redis ({{ _ours | join(', ') }}) doivent être distincts et libres
      sur {{ ansible_host }} — déjà pris par une autre entrée de la machine : {{ _clash | join(', ') or 'aucun' }} ;
      déjà filtrés par `docker_ports_rules` (docker-ports-security) : {{ _rule_clash | join(', ') or 'aucun' }}.
    quiet: true
  tags: [always]
