# Faits INTERNES de la famille `webapp` : calculés par les rôles (contrôles, pare-feu, écarts, cible), jamais donnés par
# l'opérateur. Une extra-var (`-e`) l'emporte sur tout `set_fact` et tout `register` : `-e wa_violations=` effacerait
# les écarts constatés, `-e wa_firewall_problems=` un pare-feu absent, `-e wa_h_compose_check=…` le contrôle du compose,
# `-e webapp_target=<autre>` déplacerait le contrôle à l'exécution sur une autre entrée.
#
# Détection RÉELLE, sans deviner la source : un `set_fact` pose une sonde, puis on relit la variable. Seule une extra-var
# masque un fait d'hôte ; la relecture rend alors SA valeur. Joué sur `localhost`, au premier play des playbooks de la
# famille, avant que les rôles posent ces faits sur les hôtes : la sonde ne reste que sur `localhost`.
#
# Noms LITTÉRAUX, sans boucle (une variable de liste se surchargerait elle-même par `-e` ; une boucle sur des noms de
# faits secrets serait signalée par le contrôle des boucles) : tous les `set_fact`/`register` des rôles webapp-*, les
# `vars` de leurs inclusions et gateway-guard.yml, plus `webapp_target`. Une assertion par nom : celle qui échoue NOMME
# le fait. scripts/test_webapp_hardening_check.py vérifie que les deux listes sont identiques et couvrent tous ces
# faits, et qu'un `-e` de l'un d'eux fait échouer deploy-webapp, remove-webapp et purge-webapp.
