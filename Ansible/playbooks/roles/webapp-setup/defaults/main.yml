---
# Faits d'une application WebAppTemplate (vx-public), calculés depuis l'INVENTAIRE
# (tasks/facts.yml). Les attributs d'entrée sont préfixés `webapp_` (ou sont les
# attributs communs du parc : `app_port`, `back_port`, `proxy_hostname`,
# `access_mode`, `cloudflare_front`) ; les valeurs CALCULÉES le sont par `wa_` —
# un set_fact `webapp_x: "{{ webapp_x | default(…) }}"` se référencerait lui-même.
#
# Attributs MANUELS (jamais devinables) :
#   app_port, proxy_hostname, access_mode, cloudflare_front, webapp_db_engine
# Attributs avec défaut DÉRIVÉ (surchargeables) :
#   webapp_project        PROJECT_NAME (défaut : nom de l'entrée)
#   webapp_app_id         identifiant dans .private/apps/apps.yml (défaut : webapp_project)
#   webapp_env            prod | preprod (défaut prod) — choisit `run.sh <env>` et back/.env[.<env>]
#   back_port             défaut app_port + 1
#   webapp_db_port        défaut app_port + 2    (Postgres publié sur 127.0.0.1)
#   webapp_redis_port     défaut app_port + 3    (Redis publié sur 127.0.0.1)
#   webapp_machine        entrée CANONIQUE de la machine (celle qui porte host_vars/<machine>.yml) ;
#                         défaut : l'entrée elle-même (machine dédiée)
#   webapp_replicas       BACK_REPLICAS (défaut 1)
#   webapp_worker         on | off (BACK_WORKER, défaut off) ; profil durci : le service `back-worker` n'est contrôlé (compose,
#                         exécution) que s'il est `on` ou `true`
#   webapp_db_exposed     true : Postgres/Redis ouverts (INFRA_BIND=0.0.0.0) au profil « non exposé »
#   webapp_registry       false : l'app reste en mode historique (build sur la cible)
#   webapp_proxy          internal (défaut) | external (VPS tiers : ni DNS, ni vhost, ni DOCKER-USER)
#   webapp_upstreams      entrées d'inventaire que le back CONSOMME (ouvertes à ce back, par délégation)
#   webapp_metrics_push   true : vmagent pousse vers les Prometheus du parc (PROMETHEUS_REMOTE_WRITE_URLS)
#   webapp_migrate        true : run.sh --migrate
#   webapp_update_common  false : run.sh --no-update-common (défaut true : bibliothèques partagées à jour)
#   webapp_compose_file   COMPOSE_FILE_NAME du dépôt (défaut : celui du template) — clé POSSÉDÉE si renseigné
#   webapp_publish_bind   adresse de publication du front et du back-lb (FRONT_BIND, BACK_LB_BIND) quand le compose les lie
#                         à 127.0.0.1 par défaut : `0.0.0.0` pour des proxies DISTANTS (le filtre est alors DOCKER-USER)
#   webapp_extra_secrets  secrets propres à l'app : liste de { key, kind (hex_32|base64_32|password|api_key), length?, note? }
#   webapp_back_env_example  modèle du back/.env d'une app neuve (défaut back/.env.example)
#   webapp_admin_wallet   ADMIN_WALLET (adresse publique, clé « si absente » : jamais réécrite)
#   webapp_vhost_locations  blocs supplémentaires du vhost : liste de { path, regex?, mode?, ws?, body?, timeout?, buffering?,
#                         upstream? (front | back : back-lb), priority? (`^~`), access? }. `access: { hosts, whitelist?,
#                         vpn_addresses?, v6_min_prefix? }` remplace le mode par une liste NOMMÉE (proxy-update/_named_access.inc) :
#                         serveurs `hosts` (entrées, IPv4), whitelist filtrée si `whitelist`, adresses VPN écartées sauf
#                         `vpn_addresses: true`, puis `deny all` (`hosts: []` sans whitelist = fermé)
#
# Attributs OPTIONNELS du profil durci et des .env (absents : comportement INCHANGÉ) :
#   webapp_hardening      profil de DURCISSEMENT (tasks/hardening.yml) : { runtime_user, docker_subnet, front_ip, back_lb_ip,
#                         protected_paths?, services?, allowed_bind_sources?, compose_file? } — compose durci contrôlé avant
#                         run.sh, pare-feu DOCKER-USER propre (proxies admis seulement), compte Unix dédié, contrôle à
#                         l'exécution, conteneurs ARRÊTÉS au moindre écart, vhost qui réécrit X-Forwarded-For.
#                         `services` (défaut DÉRIVÉ : [back], plus back-worker quand `webapp_worker` vaut on|true) ne se
#                         donne que pour imposer une autre liste.
#                         docs/etude-passerelle-sur-webapp.md
#   webapp_env_from_vault { CLÉ_DU_ENV: <variable du coffre> } : secrets non tirés par l'app (mots de passe d'un amont),
#                         écrits dans back/.env (no_log) ; absent ou malformé = échec, par NOM
#   webapp_env_required   clés que back/.env doit porter NON VIDES après le rendu (noms seulement)
#   webapp_back_env_fixed { CLÉ: valeur } : clés de back/.env que l'inventaire FIXE à chaque rendu (une ligne `CLÉ="valeur"` remplacée
#                         ou ajoutée ; ex. `DB_SCHEMA_MODE: migrate` : vide en production, le gabarit ne fait rien au démarrage et
#                         l'app plante sur une base vide). Clé `[A-Z_][A-Z0-9_]*` hors `webapp_back_env_forbidden` et hors clés déjà
#                         rendues par Ansible (webapp_env_from_vault, wa_env_injected, clés possédées) : UNE source par clé ; valeur
#                         scalaire non vide (texte ou entier), ASCII imprimable sans `"` `$` `` ` `` `\` ni `{{` `{%` `{#` ; une clé déjà
#                         présente DEUX fois dans le fichier est refusée, jamais laissée en double. Échec fermé, NOMS seulement.
#   webapp_monitor_redis  false : pas de sonde du conteneur `<projet>_redis` (défaut : vrai sauf `webapp_db_engine: sqlite`, dont le compose n'en lance pas)
#   cloudflare_named      true : le nom public `proxy_hostname` est servi par l'edge Cloudflare (enregistrement PROXIFIÉ vers le front
#                         privé des proxies, IP réelle par CF-Connecting-IP, Authenticated Origin Pulls activés sur ce nom, certificat
#                         client exigé dans les locations `mode: public`) ; le front reste EN CONTENEUR derrière les proxies (profil
#                         durci compatible). Distinct de `cloudflare_front` (front sur Pages, API sous `<projet>-back.<domaine>`) : les
#                         deux ensemble sont refusés. Absent ou false : comportement INCHANGÉ (rendu du vhost identique octet pour octet).
#   webapp_front          pages : front sur Cloudflare Pages SANS `cloudflare_front` (l'API reste servie par les proxies, nom `proxy_hostname`)
#   webapp_pages_managed  false : le projet Pages n'est pas géré ici (déjà géré à part, ex. un projet partagé par plusieurs environnements) :
#                         ni projet, ni domaine, ni DNS, et `VITE_API_URL` n'est pas touché
#   webapp_vhost_file     nom du vhost écrit à la main dans parcs/<parc>/nginx/sites-enabled/ (défaut : `<webapp_project>.conf`)
#   webapp_trust_proxy    TRUST_PROXY imposé (chaîne) : app jointe directement par Cloudflare, sans proxy du parc (défaut : proxies du parc)
#   webapp_run_env        { VARIABLE: valeur } ajoutées à l'environnement de `run.sh` (hooks propres à l'app ; jamais un secret)
#   webapp_upstream_checks  sondes svcprobe `upstream_<id>` : [{ id, url }], URL https://<nom>[:<port>]/<chemin> lue DEPUIS le conteneur back

# Ports consécutifs réservés à une app : front, back-lb, Postgres, Redis.
webapp_port_block: 4

# Moteurs de base de données acceptés (DB_ENGINE de back/.env).
webapp_db_engines: [sqlite, postgres, selfhosted, supabase, cloud, neon]
# Moteurs qui démarrent un conteneur Postgres sur la machine.
webapp_db_selfhosted_engines: [postgres, selfhosted]

# Dépôt d'applications du poste de contrôle (identifiant → chemin).
webapp_apps_file: "{{ playbook_dir }}/../.private/apps/apps.yml"

# ── Profil durci (`webapp_hardening`, tasks/hardening.yml) ─────────────────
# Proxies ADMIS par une app durcie : ceux dont l'adresse n'est celle d'AUCUN serveur VPN (même calcul que le front
# `proxy-private`) — un proxy à l'adresse d'un VPN (proxy2 = vpn1, NAT domestique) admettrait tout ce qui sort par elle.
# SEULE définition (scripts/webapp_hardening_check.py le vérifie) ; les autres rôles lisent les faits `wa_h_*`.
webapp_vpn_addresses: "{{ groups['vpns'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
webapp_eligible_proxies: >-
  {{ groups['proxies'] | default([]) | map('extract', hostvars)
     | rejectattr('ansible_host', 'in', webapp_vpn_addresses)
     | map(attribute='inventory_hostname') | list }}
# Sous-réseau privé /16 à /32 (grammaire de `_access.inc`), sans zéro en tête d'un octet.
webapp_private_cidr_regex: '^(10[.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]{0,2})|172[.](1[6-9]|2[0-9]|3[01])[.](0|[1-9][0-9]{0,2})|192[.]168[.](0|[1-9][0-9]{0,2}))[.](0|[1-9][0-9]{0,2})/(1[6-9]|2[0-9]|3[0-2])$'
# Défauts du profil. `services` (services de CODE contrôlés et vérifiés à l'exécution) n'a PAS de défaut fixe : il est DÉRIVÉ du
# drapeau worker par hardening.yml (`[back]`, plus `back-worker` seulement si `webapp_worker` vaut on|true — BACK_WORKER=off ne
# lance aucun conteneur back-worker) ; un `webapp_hardening.services` explicite l'emporte.
webapp_hardening_defaults:
  allowed_bind_sources: []
  protected_paths: []
  compose_file: scripts/docker-compose-hardened.yml
# Clés de back/.env que `webapp_back_env_fixed` ne peut PAS fixer : SEULE liste, lue par le fait `wa_back_env_forbidden` (facts.yml)
# — le rendu des .env (webapp-env-update) la refuse, et le refus du profil durci (webapp-deploy/hardened.yml) en tire les clés
# qui doivent rester vides ou absentes. scripts/test_webapp_hardening_check.py vérifie que toute clé que hardened.yml nomme est
# couverte. S'y ajoutent, au rendu, les clés que le rôle pose lui-même (possédées, « si absentes », retirées, injectées, coffre).
webapp_back_env_forbidden:
  # Jamais non vides en profil durci (deploy-full.sh en ferait des règles ufw).
  empty_only: [WHITELIST, PROXY_HOSTS, BACK_WHITELIST]
  # Cibles du déploiement, relais de confiance, secret Redis, liaison de l'infrastructure.
  names: [BACK_HOSTS, FRONT_HOSTS, TRUST_PROXY, REDIS_PASSWORD, INFRA_BIND]
  # Fichier compose (COMPOSE_FILE*), déploiement (DEPLOY_*, dont DEPLOY_FROM_MAIN), cible distante (REMOTE_*), vmagent
  # (PROMETHEUS_REMOTE_WRITE_URL[S]), calculs du profil durci (HARDEN_*).
  prefixes: [COMPOSE_FILE, DEPLOY_, REMOTE_, PROMETHEUS_REMOTE_WRITE, HARDEN_]
# Groupes interdits au compte dédié : chacun vaut root, ou l'accès aux fichiers de `remote_username` (clés, vault).
webapp_forbidden_groups: [docker, sudo, adm, lxd, root, "{{ remote_username }}"]
