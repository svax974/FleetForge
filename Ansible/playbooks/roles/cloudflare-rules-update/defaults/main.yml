---
# Limitation de débit devant les noms servis par Cloudflare.
#
# Une règle PAR NOM protégé, posée dans le jeu de règles de phase `http_ratelimit`
# de la zone. Le nom et le chemin sont explicites : la règle ne vise jamais « tout
# le site », où elle couperait des services qui n'ont rien à voir.
#
# PÉRIODE ET BLOCAGE : le plan gratuit n'accepte qu'une période de 10 s et un
# `mitigation_timeout` de 10 s, pour UNE seule règle. Les valeurs par défaut restent
# dans ce cadre ; un plan payant peut les allonger en surchargeant `period`/`timeout`.
#
# Ne JAMAIS y mettre un défi (managed challenge / Bot Fight) : les clients MCP sont
# des appels serveur, un défi les casse — c'est ce qui a fait échouer la sonde
# `public_edge` (docs/etude-passerelle-sur-webapp.md).
cfrules_token: "{{ cloudflare_token | default('') }}"
cfrules_zone: "{{ domain_name }}"
cfrules_api: https://api.cloudflare.com/client/v4
# Préfixe des descriptions : il identifie NOS règles, seules remplacées à chaque
# passage. Tout ce que le propriétaire a posé à la main est conservé.
cfrules_description_prefix: "FleetForge"
cfrules_hosts:
  - hostname: "ffg.{{ domain_name }}"
    path_prefix: "/mcp"
    requests: 30
    period: 10
    # Plan gratuit : Cloudflare refuse toute autre valeur que 10 s (« not entitled to use a mitigation
    # timeout different from 10 »). Un plan payant peut l'allonger.
    timeout: 10
