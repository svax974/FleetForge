---
# Retire TOUTES les règles ufw (IPv4 et IPv6, toute source) dont la destination est un port publié d'une application
# durcie — décoratives (Docker DNAT avant ufw) et trompeuses. Inclus par tasks/firewall.yml et par webapp-remove. Par
# numéro, du premier trouvé, en relisant la liste après chaque suppression (les numéros se décalent).

- name: Read the facts of the hardened application
  ansible.builtin.set_fact:
    wa_app: "{{ hostvars[webapp_target | default(inventory_hostname)] }}"

- name: Check the ports given to the ufw purge
  ansible.builtin.assert:
    that:
      - wa_app.wa_front_port | string is match('^[0-9]{2,5}$')
      - wa_app.wa_back_port | string is match('^[0-9]{2,5}$')
    quiet: true

- name: Delete the ufw rules on the application ports
  ansible.builtin.shell: |
    set -euo pipefail
    command -v ufw >/dev/null 2>&1 || exit 0
    for port in {{ wa_app.wa_front_port | int | string | quote }} {{ wa_app.wa_back_port | int | string | quote }}; do
      while true; do
        n=$(ufw status numbered | awk -v p="${port}" '
          match($0, /^\[ *[0-9]+\]/) && !done {
            num = substr($0, 2, RLENGTH - 2) + 0
            rest = substr($0, RLENGTH + 1)
            split(rest, f, " ")
            if (f[1] == p || f[1] == p "/tcp" || f[1] == p "/udp") { print num; done = 1 }
          }')
        [ -z "${n}" ] && break
        ufw --force delete "${n}" >/dev/null
        echo "removed ${port} rule ${n}"
      done
    done
  args:
    executable: /bin/bash
  become: true
  register: wa_ufw_purge
  changed_when: "'removed' in wa_ufw_purge.stdout"
