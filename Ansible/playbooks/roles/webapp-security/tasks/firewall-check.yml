---
# État RÉEL du pare-feu d'une application durcie, lu dans DOCKER-USER : pour chaque port publié, une règle
# `<tag>:<port>:deny` (DROP), et AUCUNE règle autre qu'un DROP/REJECT avant la première règle de l'app (un RETURN/
# ACCEPT, même restreint par `-i`/`-s`, ou un saut vers une autre chaîne rendrait le DROP décoratif). Pose `wa_firewall_problems` (texte, vide = conforme) ; ne fait rien échouer lui-même —
# les appelants décident :
#   • tasks/firewall.yml : échec du rôle ;
#   • webapp-deploy (profil durci) : AVANT run.sh, aucun conteneur démarré sinon ;
#   • tasks/runtime.yml : écart ajouté au durcissement (conteneurs arrêtés).
# IPv6 : la chaîne ip6tables absente n'est PAS une preuve d'absence d'IPv6 (docker-proxy publie `[::]:port` quand le
# conteneur n'a pas d'IPv6) — c'est la liaison explicite `0.0.0.0:` du compose (contrôlée) qui l'empêche.

# `wa_app` : roles/webapp-security/vars/main.yml (lu à la demande, jamais copié dans un fait).

# Table filter ENTIÈRE (et non la seule chaîne) : une règle de fail2ban insérée devant les nôtres saute vers sa chaîne
# `f2b-*`, admise seulement si celle-ci ne fait que refuser ou rendre la main (firewall-problems.yml) — il faut la lire.
# Chaîne DOCKER-USER absente : aucune ligne `-A DOCKER-USER`, rapportée comme « aucune règle ».
- name: Read the IPv4 filter table
  ansible.builtin.command:
    argv: [iptables, -w, -S]
  become: true
  register: wa_chain4
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the IPv6 filter table
  ansible.builtin.command:
    argv: [ip6tables, -w, -S]
  become: true
  register: wa_chain6
  changed_when: false
  failed_when: false
  check_mode: false

# Sortie du sous-réseau vers l'HÔTE (passerelle du pont, adresse publique) : chaîne INPUT, de la même lecture.
- name: Keep the IPv4 table for the INPUT chain
  ansible.builtin.set_fact:
    wa_chain_input: "{{ wa_chain4 }}"

- name: Work out the firewall problems
  ansible.builtin.include_tasks:
    file: firewall-problems.yml
    apply:
      tags: [always]
  tags: [always]
