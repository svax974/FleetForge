---
# Calcul de `wa_firewall_problems` à partir de la table filter lue par firewall-check.yml (`wa_chain4`, `wa_chain6` :
# `iptables -S` ENTIÈRE ; `wa_chain_input` : idem, pour INPUT) et des faits de l'app (`wa_app`). Aucune commande :
# fichier séparé pour être éprouvé hors ligne (scripts/test_webapp_hardening_check.py).
#
# Règles ADMISES devant celles de l'app (insérées en tête, mais fail2ban ou ufw peuvent s'insérer devant après elles) :
#   • un refus : `-j DROP`, `-j REJECT` ;
#   • un saut (`-j`/`-g`) vers une chaîne qui ne fait QUE refuser ou rendre la main : toutes ses règles en DROP,
#     REJECT, RETURN ou saut vers une telle chaîne (fail2ban : `-A f2b-sshd -s X -j REJECT`, `-A f2b-sshd -j RETURN`).
#     Chaîne déclarée (`-N`), profondeur bornée (4), un cycle n'est jamais admis (il faudrait qu'il le soit déjà).
# REFUSÉS : ACCEPT ou RETURN directs (même restreints par `-i`/`-s`), saut vers une chaîne inconnue, vers une chaîne
# qui accepte (chaînes ufw : ACCEPT), règle sans cible.
- name: Work out the firewall problems from the chains
  vars:
    _tag: "{{ wa_app.wa_h_tag }}"
    _subnet: "{{ wa_app.wa_h_subnet }}"
    _families:
      - { family: iptables, result: "{{ wa_chain4 }}", required: true }
      - { family: ip6tables, result: "{{ wa_chain6 }}", required: false }
  ansible.builtin.set_fact:
    wa_firewall_problems: >-
      {%- macro refusing_chains(lines) -%}
        {#- Chaînes « refus seulement », par niveaux : niveau 0 = aucune règle hors DROP/REJECT/RETURN ; niveau k+1 =
            sauts seulement vers le niveau k. -#}
        {%- set declared = lines | select('match', '^-N ') | map('regex_replace', '^-N ([^ ]+).*$', '\\1') | list -%}
        {%- set lv = namespace(safe=[]) -%}
        {%- for depth in range(5) -%}
          {%- set nxt = namespace(safe=[]) -%}
          {%- for c in declared -%}
            {%- set ok = namespace(v=true) -%}
            {%- for r in lines if r.startswith('-A ' ~ c ~ ' ') -%}
              {%- set t = r | regex_search(' -[jg] ([^ ]+)', '\\1') -%}
              {%- if not t or not (t[0] in ['DROP', 'REJECT', 'RETURN'] or t[0] in lv.safe) -%}{%- set ok.v = false -%}{%- endif -%}
            {%- endfor -%}
            {%- if ok.v -%}{%- set nxt.safe = nxt.safe + [c] -%}{%- endif -%}
          {%- endfor -%}
          {%- set lv.safe = nxt.safe -%}
        {%- endfor -%}
        {{ lv.safe | join(' ') }}
      {%- endmacro -%}
      {%- macro admitted(rule, safe) -%}
        {%- set t = rule | regex_search(' -[jg] ([^ ]+)', '\\1') -%}
        {{ 'yes' if t and (t[0] in ['DROP', 'REJECT'] or (t[0] in safe and rule is search(' -[jg] '))) else 'no' }}
      {%- endmacro -%}
      {%- set ns = namespace(p=[]) -%}
      {%- for fam in _families -%}
        {#- Table lue mais SANS chaîne DOCKER-USER (ip6tables sans Docker IPv6) : comme une lecture en échec. -#}
        {%- set _lines = fam.result.stdout_lines | default([]) -%}
        {%- if (fam.result.rc | default(1)) != 0
               or (_lines | select('match', '^-[NA] DOCKER-USER( |(?!(?s:.)))') | list | length) == 0 -%}
          {%- if fam.required -%}{%- set ns.p = ns.p + [fam.family ~ ' : chaîne DOCKER-USER illisible ou absente'] -%}{%- endif -%}
        {%- else -%}
          {%- set all_lines = fam.result.stdout_lines | default([]) -%}
          {%- set safe = refusing_chains(all_lines).split() -%}
          {%- set rules = all_lines | select('match', '^-A DOCKER-USER ') | list -%}
          {%- set ours = rules | select('search', _tag ~ ':') | list -%}
          {%- if ours | length == 0 -%}
            {%- set ns.p = ns.p + [fam.family ~ ' : aucune règle de ' ~ _tag] -%}
          {%- else -%}
            {%- set first = rules.index(ours | first) -%}
            {%- for r in rules[:first] if admitted(r, safe) | trim != 'yes' -%}
              {%- set ns.p = ns.p + [fam.family ~ ' : « ' ~ r ~ ' » précède les règles de ' ~ _tag] -%}
            {%- endfor -%}
          {%- endif -%}
          {%- for port in [wa_app.wa_front_port | string, wa_app.wa_back_port | string] -%}
            {%- if (rules | select('search', '--ctorigdstport ' ~ port ~ ' .*' ~ _tag ~ ':' ~ port ~ ':deny.*-j DROP') | list | length) == 0 -%}
              {%- set ns.p = ns.p + [fam.family ~ ' : aucun DROP sur le port ' ~ port] -%}
            {%- endif -%}
          {%- endfor -%}
          {#- Sortie du sous-réseau dédié vers d'autres machines : DROP final présent. -#}
          {%- if fam.family == 'iptables'
                 and (rules | select('search', '-s ' ~ _subnet ~ ' .*' ~ _tag ~ ':egress:deny.*-j DROP') | list | length) == 0 -%}
            {%- set ns.p = ns.p + ['iptables : aucun DROP de sortie du sous-réseau ' ~ _subnet] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {#- Sortie du sous-réseau vers l'HÔTE (INPUT) : règles de l'app en tête, DROP final présent. -#}
      {%- if (wa_chain_input.rc | default(1)) != 0 -%}
        {%- set ns.p = ns.p + ['iptables : chaîne INPUT illisible'] -%}
      {%- else -%}
        {%- set in_lines = wa_chain_input.stdout_lines | default([]) -%}
        {%- set in_safe = refusing_chains(in_lines).split() -%}
        {%- set inrules = in_lines | select('match', '^-A INPUT ') | list -%}
        {%- set inours = inrules | select('search', _tag ~ ':host:') | list -%}
        {%- if inours | length == 0 -%}
          {%- set ns.p = ns.p + ['iptables : aucune règle INPUT de ' ~ _tag] -%}
        {%- else -%}
          {%- for r in inrules[:inrules.index(inours | first)] if admitted(r, in_safe) | trim != 'yes' -%}
            {%- set ns.p = ns.p + ['iptables INPUT : « ' ~ r ~ ' » précède les règles de ' ~ _tag] -%}
          {%- endfor -%}
        {%- endif -%}
        {%- if (inrules | select('search', '-s ' ~ _subnet ~ ' .*' ~ _tag ~ ':host:deny.*-j DROP') | list | length) == 0 -%}
          {%- set ns.p = ns.p + ['iptables : aucun DROP du sous-réseau ' ~ _subnet ~ ' vers l hôte (INPUT)'] -%}
        {%- endif -%}
        {#- Trafic LOCAL vers l'app (OUTPUT) : règles en tête, un REJECT pour la destination locale (ports publiés) et un
            pour la destination interne (après DNAT). -#}
        {%- set outrules = in_lines | select('match', '^-A OUTPUT ') | list -%}
        {%- set outours = outrules | select('search', _tag ~ ':local:') | list -%}
        {%- if outours | length == 0 -%}
          {%- set ns.p = ns.p + ['iptables : aucune règle OUTPUT de ' ~ _tag ~ ' (trafic local vers l app)'] -%}
        {%- else -%}
          {%- for r in outrules[:outrules.index(outours | first)] if admitted(r, in_safe) | trim != 'yes' -%}
            {%- set ns.p = ns.p + ['iptables OUTPUT : « ' ~ r ~ ' » précède les règles de ' ~ _tag] -%}
          {%- endfor -%}
        {%- endif -%}
        {%- if (outrules | select('search', '--dst-type LOCAL .*' ~ _tag ~ ':local:deny.*-j REJECT') | list | length) == 0 -%}
          {%- set ns.p = ns.p + ['iptables : aucun REJECT du trafic local vers les ports publiés (OUTPUT)'] -%}
        {%- endif -%}
        {#- Proxy sur cette machine : son nginx DOIT être admis (sinon 502 proxy → app, sans alerte). -#}
        {%- if wa_app.wa_h_local_proxy | default(false) | bool
               and (outrules | select('search', '-m cgroup --path [^ ]+ .*' ~ _tag ~ ':local:nginx.*-j ACCEPT') | list | length) < 2 -%}
          {%- set ns.p = ns.p + ['iptables : règles OUTPUT local:nginx absentes (proxy de cette machine : cgroup v2, nginx actif ?)'] -%}
        {%- endif -%}
        {%- if (outrules | select('search', '-d ' ~ _subnet ~ ' .*' ~ _tag ~ ':local:deny.*-j REJECT') | list | length) == 0 -%}
          {%- set ns.p = ns.p + ['iptables : aucun REJECT du trafic local vers ' ~ _subnet ~ ' (OUTPUT)'] -%}
        {%- endif -%}
      {%- endif -%}
      {{ ns.p | join(' ; ') }}
