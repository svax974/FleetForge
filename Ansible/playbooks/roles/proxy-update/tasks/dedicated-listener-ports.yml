---
# Un port dédié partagé avec un autre vhost de ce proxy fusionnerait les deux `server {}` (nginx les distingue par le
# `Host`, et le bloc dédié cesserait d'être le seul servi sur ce port) : AUCUN autre fichier de /etc/nginx ne doit y
# écouter. Lu sur la configuration EFFECTIVE (`nginx -T`, lecture seule), avant le reload.
# Entrées : `site` (fichier de sites-enabled du service), `site_dedicated_listeners` ([{port, …}]).

- name: Dump the effective nginx configuration
  ansible.builtin.command: nginx -T
  register: proxy_listener_dump
  changed_when: false
  check_mode: false

# `nginx -T` fait précéder chaque fichier de `# configuration file <chemin>:`. Une ligne `listen` (adresse nue, `ip:port`
# ou `[::]:port`) d'un AUTRE fichier que celui du service sur un port dédié est refusée. Sans antislash (scalaire de bloc).
- name: Refuse a dedicated port another file also listens on
  vars:
    _own: "{{ '/etc/nginx/sites-enabled/' ~ site ~ ':' }}"
    _shared: >-
      {%- set out = [] -%}
      {%- for segment in proxy_listener_dump.stdout.split('# configuration file ') if not segment.startswith(_own) -%}
      {%- for line in segment.splitlines() -%}
      {%- set words = line.strip().rstrip(';').split() -%}
      {%- if words | length >= 2 and words[0] == 'listen' -%}
      {%- for l in site_dedicated_listeners if (words[1].split(':') | last) == (l.port | string) and l.port not in out -%}
      {%- set _ = out.append(l.port) -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.assert:
    that: _shared | length == 0
    fail_msg: >-
      Port(s) dédié(s) {{ _shared | join(', ') }} déjà écouté(s) par un autre fichier de /etc/nginx sur {{ inventory_hostname }} :
      un écouteur dédié doit être le SEUL `server {}` de son port. Changer le port (dedicated_listeners) ou retirer l'autre `listen`.
    quiet: true
