---
# Resynchronisation complète (main.yml, `update-proxy.yml` / `deploy-proxy.yml`) : les écouteurs dédiés sont contrôlés AVANT
# de vider /etc/nginx et de redémarrer nginx — la déclaration `dedicated_listeners` (fait `proxy_dedicated_listeners`), puis
# le rendu de CHAQUE vhost qui porte un de ces ports (un seul `server {}`, locations restreintes aux seules adresses clientes),
# sur le poste de contrôle. Aucun écouteur dédié applicable à ce proxy : rien de plus, comportement inchangé.
# Produit `proxy_listener_owners` : [{listener, sites}] (`sites` = vhosts du parc dont le rendu écoute sur le port).

# Déclaration invalide : échec ici, avant tout changement (même contrôle que proxy-security, sans règle ufw).
- name: Check the dedicated listener declaration before touching /etc/nginx
  ansible.builtin.include_role:
    name: proxy-security
    tasks_from: dedicated-listeners
    apply:
      tags: [always]
  vars:
    dedicated_listeners_validate_only: true
  tags: [always]

# Un rendu par vhost, découpé en mots (`;`, `{`, `}` isolés, commentaires retirés) : le mot qui suit `listen` donne le port,
# quelle que soit la forme (`9745`, `*:9745`, `[::]:9745`, `0.0.0.0:9745 default_server`…) et la mise en page. Sans antislash.
- name: Find the vhost of the parc that listens on each dedicated port
  vars:
    _files: >-
      {{ query('ansible.builtin.fileglob', proxy_update_dir ~ '/sites-enabled/*')
         | map('basename') | reject('match', '_.*') | list }}
  ansible.builtin.set_fact:
    proxy_listener_owners: >-
      {%- set out = [] -%}
      {%- for l in proxy_dedicated_listeners | default([]) -%}
      {%- set hits = [] -%}
      {%- for f in _files -%}
      {%- set words = (lookup('ansible.builtin.template', proxy_update_dir ~ '/sites-enabled/' ~ f).splitlines()
          | map('regex_replace', '#.*$', '') | join(' ')
          | replace(';', ' ; ') | replace('{', ' { ') | replace('}', ' } ')).split() -%}
      {%- for word in words -%}
      {%- set at = loop.index0 -%}
      {%- if word == 'listen' and at + 1 < words | length and (at == 0 or words[at - 1] in [';', '{', '}'])
             and (words[at + 1].split(':') | last) == (l.port | string) and f not in hits -%}
      {%- set _ = hits.append(f) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- set _ = out.append({'listener': l, 'sites': hits}) -%}
      {%- endfor -%}
      {{ out }}
  tags: [always]

- name: Refuse a dedicated port that several vhosts of the parc listen on
  ansible.builtin.assert:
    that: proxy_listener_owners | map(attribute='sites') | map('length') | select('gt', 1) | list | length == 0
    fail_msg: >-
      Plusieurs vhosts du parc écoutent sur un port dédié sur {{ inventory_hostname }} :
      {% for o in proxy_listener_owners if o.sites | length > 1 %}{{ o.listener.port }} ({{ o.sites | join(', ') }}) {% endfor %}
      — un écouteur dédié doit être le SEUL `server {}` de son port.
    quiet: true

- name: Check the rendered vhost of each dedicated listener
  ansible.builtin.include_tasks:
    file: dedicated-listener-check.yml
  vars:
    site: "{{ item.sites[0] }}"
    site_dedicated_listeners: "{{ [item.listener] }}"
  loop: "{{ proxy_listener_owners | selectattr('sites') | list }}"
  loop_control:
    label: "{{ item.listener.port }} -> {{ item.sites[0] }}"

# nginx.conf et les streams ACTIFS du parc sont rendus eux aussi avant de vider /etc/nginx : un `listen` sur un port dédié
# (dans un `stream {}`, nginx ne démarrerait plus après un redémarrage) y est refusé AVANT toute écriture. Seuls nginx.conf et
# `streams-enabled/` sont lus — `sites-available/` et `streams-available/` ne sont pas chargés. Même découpage en mots que
# ci-dessus. Les vhosts GÉNÉRIQUES des applications (webapp.conf.j2, `listen 443`) et le reste de /etc/nginx (conf.d…) sont
# couverts après l'écriture par la lecture de `nginx -T` (dedicated-listener-sync-ports.yml), dont l'échec restaure l'arbre.
- name: Find the nginx.conf and the active streams of the parc that listen on a dedicated port
  vars:
    _others: >-
      {{ ([proxy_update_dir ~ '/nginx.conf'] if (proxy_update_dir ~ '/nginx.conf') is file else [])
         + (query('ansible.builtin.fileglob', proxy_update_dir ~ '/streams-enabled/*') | reject('match', '.*/_[^/]*$') | list) }}
  ansible.builtin.set_fact:
    proxy_listener_foreign: >-
      {%- set out = [] -%}
      {%- for l in proxy_dedicated_listeners | default([]) -%}
      {%- for f in _others -%}
      {%- set words = (lookup('ansible.builtin.template', f).splitlines()
          | map('regex_replace', '#.*$', '') | join(' ')
          | replace(';', ' ; ') | replace('{', ' { ') | replace('}', ' } ')).split() -%}
      {%- for word in words -%}
      {%- set at = loop.index0 -%}
      {%- if word == 'listen' and at + 1 < words | length and (at == 0 or words[at - 1] in [';', '{', '}'])
             and (words[at + 1].split(':') | last) == (l.port | string) -%}
      {%- set _ = out.append((l.port | string) ~ ' (' ~ (f | basename) ~ ')') -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out | unique | list }}
  tags: [always]

- name: Refuse a dedicated port that nginx.conf or an active stream of the parc listens on
  ansible.builtin.assert:
    that: proxy_listener_foreign | length == 0
    fail_msg: >-
      nginx.conf ou un stream actif du parc écoute sur un port dédié de {{ inventory_hostname }} :
      {{ proxy_listener_foreign | join(', ') }} — un écouteur dédié doit être le SEUL `server {}` de son port (un `listen`
      de `stream` empêcherait nginx de redémarrer).
    quiet: true
