---
# Cœur DESTRUCTIF de la resynchronisation complète (importé par main.yml, `update-proxy.yml` / `deploy-proxy.yml`) : les
# répertoires de vhosts sont vidés puis reconstruits, `nginx.conf` et les fichiers du parc réécrits, puis nginx est contrôlé
# (collision des ports dédiés sur la configuration effective, `nginx -t`) AVANT d'être redémarré.
#
# Un contrôle qui échoue APRÈS l'écriture laissait la nouvelle arborescence sur le disque : nginx continue à tourner sur
# l'ancienne configuration en mémoire, mais un `reload`, un redémarrage ou un redémarrage de la machine activerait la
# configuration en conflit (avec un `listen` de `stream` sur le port dédié, nginx ne redémarrerait plus). On sauvegarde donc
# ce qui est supprimé ou réécrit AVANT de toucher à quoi que ce soit ; un échec (de n'importe quelle tâche du bloc) le
# RESTAURE, puis échoue bruyamment. Simulation (`--check`) : rien n'est écrit, donc rien n'est sauvegardé ni restauré.
#
# Hors sauvegarde (additif, jamais lu par l'ancienne configuration autrement qu'à l'identique) : le jeton d'écriture
# Prometheus (tiré une fois, jamais régénéré), les journaux et la rotation `sync-logs.yml`.
# `--tags` : une tâche de sauvegarde ou de restauration non retenue par les tags laisse `proxy_update_backup_dir` indéfini :
# la restauration n'a alors rien à remettre.

# Deux faits suivent l'état : `proxy_update_backup_done` (la sauvegarde est COMPLÈTE et vérifiée : la restauration n'a lieu
# qu'alors — un échec PENDANT la sauvegarde ne supprime rien du vif, qui n'a pas encore été touché) et
# `proxy_update_restore_pending` (une restauration est en cours : la sauvegarde est alors CONSERVÉE, c'est la seule copie).
# Le répertoire de sauvegarde (clés et htpasswd, créé par root dans /tmp) est supprimé dans `always`, sauf restauration
# inachevée.
# Authenticated Origin Pulls des vhosts écrits à la main (`cloudflare_origin_pull`, papanglabs) : déclaration valide, et `enforce` seulement
# si l'activation chez Cloudflare est prouvée — refusé ICI, avant la sauvegarde et le vidage de /etc/nginx (un refus ne passe jamais par
# la restauration). Le même contrôle, rejoué par nginx.yml, couvre `deploy-one-site` et `deploy-webapp-site`. Aucune entrée ne déclare
# l'attribut : `proxy_update_cloudflare_edge` ne s'en occupe pas, rien ne change.
- name: Check the Authenticated Origin Pulls declarations before touching /etc/nginx
  ansible.builtin.include_role:
    name: cloudflare-origin-pull
    tasks_from: proof
  when: proxy_update_cloudflare_edge | bool

- name: Resynchronise the nginx tree, restoring the previous one when a check fails
  block:
    - name: Start from no backup and no restoration pending
      ansible.builtin.set_fact:
        proxy_update_backup_done: false
        proxy_update_restore_pending: false

    - name: Create the directory that keeps the previous nginx files
      ansible.builtin.tempfile:
        state: directory
        prefix: ff-nginx-backup-
      register: proxy_update_backup_dir
      when: not ansible_check_mode

    # `removes` : ne s'exécute que si le fichier ou le répertoire existe. `cp -a` : propriétaire, droits et dates conservés.
    - name: Keep the nginx files this resynchronisation deletes or rewrites
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ proxy_update_nginx_dir }}/{{ item }}"
          - "{{ proxy_update_backup_dir.path }}/{{ item }}"
        removes: "{{ proxy_update_nginx_dir }}/{{ item }}"
      loop: "{{ proxy_update_backup_items }}"
      changed_when: false
      when: not ansible_check_mode

    # Vérification : chaque élément présent est identique dans la sauvegarde (un `cp` qui réussit sans tout copier, un
    # disque plein, ne doit pas passer pour une sauvegarde).
    - name: Check the backup is complete
      ansible.builtin.command:
        argv:
          - diff
          - -rq
          - "{{ proxy_update_nginx_dir }}/{{ item }}"
          - "{{ proxy_update_backup_dir.path }}/{{ item }}"
        removes: "{{ proxy_update_nginx_dir }}/{{ item }}"
      loop: "{{ proxy_update_backup_items }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Note that the backup is complete
      ansible.builtin.set_fact:
        proxy_update_backup_done: true
      when: not ansible_check_mode

    # Le répertoire du parc FAIT FOI : vidés puis reconstruits, un vhost retiré du
    # dépôt est retiré des proxies au passage suivant.
    - name: Delete the vhost directories
      ansible.builtin.file:
        path: "{{ proxy_update_nginx_dir }}/{{ item }}"
        state: absent
      loop: "{{ proxy_update_subdirs }}"

    - name: Create the vhost directories
      ansible.builtin.file:
        path: "{{ proxy_update_nginx_dir }}/{{ item }}"
        state: directory
      loop: "{{ proxy_update_subdirs }}"

    - name: Copy nginx conf
      ansible.builtin.template:
        src: "{{ proxy_update_dir }}/nginx.conf"
        dest: "{{ proxy_update_nginx_dir }}/nginx.conf"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_group }}"
      when: (proxy_update_dir ~ '/nginx.conf') is file

    # Fichiers sensibles du parc, chiffrés EN ENTIER par `ansible-vault encrypt`
    # dans le répertoire du parc (`copy` les déchiffre à la volée) :
    #   certs/ → /etc/nginx/certs/  (certificat d'origine Cloudflare et sa clé)
    #   auth/  → /etc/nginx/auth/   (htpasswd — une empreinte est un secret, CLAUDE.md)
    # Copiés avant les vhosts : `nginx -t` refuse un `ssl_certificate` absent.
    - name: Create the certs and auth directories
      ansible.builtin.file:
        path: "{{ proxy_update_nginx_dir }}/{{ item }}"
        state: directory
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_secret_group }}"
        mode: '0750'
      loop: [certs, auth]
      when: (proxy_update_dir ~ '/' ~ item) is directory

    - name: Copy the parc certificates and htpasswd files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ proxy_update_nginx_dir }}/{{ item | dirname | basename }}/{{ item | basename }}"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_secret_group }}"
        mode: '0640'
      with_fileglob:
        - "{{ proxy_update_dir }}/certs/*"
        - "{{ proxy_update_dir }}/auth/*"
      no_log: true

    # Autorité des Authenticated Origin Pulls, avant les vhosts : `_cloudflare_front.inc`
    # la référence dès qu'une entrée porte `cloudflare_front: true` (`nginx -t` refuse
    # un `ssl_client_certificate` absent). Aucune entrée : rien n'est déposé.
    - name: Install the Cloudflare origin-pull CA
      ansible.builtin.include_role:
        name: cloudflare-origin-pull
        tasks_from: nginx
      when: proxy_update_cloudflare_edge | bool

    # Journaux dédiés (et leur rotation 7 jours) des vhosts web3c-sync : le
    # répertoire DOIT exister avant la copie des vhosts, sans quoi `nginx` refuse de
    # démarrer (open() failed sur access_log/error_log). Seulement pour un parc qui
    # porte des serveurs de synchronisation.
    - name: Prepare the dedicated sync access-log directory and rotation
      ansible.builtin.include_tasks: sync-logs.yml
      when: groups['sync_servers'] | default([]) | length > 0

    - name: Copy nginx sites enabled confs
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ proxy_update_nginx_dir }}/sites-enabled/{{ item | basename }}"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_group }}"
      with_fileglob:
        - "{{ proxy_update_dir }}/sites-enabled/*"
      # `_*` : fichiers partiels inclus par d'autres gabarits, jamais des vhosts —
      # les déployer ferait inclure leur contenu deux fois.
      when: not (item | basename).startswith('_')

    # Vhosts GÉNÉRIQUES des applications WebAppTemplate (famille `webapp`) qui n'ont pas de vhost écrit à la main : rendus
    # ici, sinon le vidage de sites-enabled ci-dessus les supprimerait à chaque resynchronisation complète.
    - name: Render the generic webapp vhosts
      ansible.builtin.include_tasks: webapp-sites.yml
      vars:
        proxy_update_full_resync: true

    # Authenticated Origin Pulls : chaque nom déclaré par `cloudflare_origin_pull` doit être porté par un vhost RENDU (marqueur
    # `# cf-aop: <nom> <mode>` de _cloudflare_realip.inc). Un nom activé chez Cloudflare que AUCUN vhost ne porte (faute de frappe d'un
    # alias) n'est protégé par personne ; la réciproque (un vhost dont le nom n'est déclaré par aucune entrée) est refusée au rendu par
    # le partiel lui-même. Un échec ici passe par la restauration, comme tout contrôle posé après l'écriture.
    - name: List the Authenticated Origin Pulls names the rendered vhosts declare
      ansible.builtin.command:
        argv: [grep, -rhE, "^# cf-aop: ", "{{ proxy_update_nginx_dir }}/sites-enabled"]
      register: proxy_update_aop_rendered
      changed_when: false
      failed_when: proxy_update_aop_rendered.rc > 1
      when:
        - not ansible_check_mode
        - proxy_update_aop | length > 0

    - name: Fail when a declared Authenticated Origin Pulls name is served by no rendered vhost
      vars:
        _rendered: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for line in proxy_update_aop_rendered.stdout_lines -%}
          {%- set ns.names = ns.names + [line.split(' ')[2]] -%}
          {%- endfor -%}
          {{ ns.names | unique | sort | list }}
        _declared: "{{ proxy_update_aop | dict2items | selectattr('value', 'in', ['observe', 'enforce']) | map(attribute='key') | list | sort }}"
      ansible.builtin.assert:
        that: _rendered == _declared
        fail_msg: >-
          Noms déclarés par `cloudflare_origin_pull` (proxy_hostname, cloudflare_origin_pull_aliases) : {{ _declared | join(', ') }} ; noms
          portés par un vhost rendu : {{ _rendered | join(', ') or '(aucun)' }}. Un nom déclaré qu'aucun vhost ne porte est activé chez
          Cloudflare mais protégé par personne : corriger la faute de frappe (alias, proxy_hostname) ou le vhost.
        quiet: true
      when:
        - not ansible_check_mode
        - proxy_update_aop | length > 0

    # Vhost de santé du front (sonde du Load Balancer Cloudflare), posé APRÈS les
    # vhosts du parc : le répertoire sites-enabled vient d'être vidé, il faut donc le
    # reposer à chaque passage — d'où le rôle plutôt que le répertoire du parc.
    - name: Deploy the front health vhost
      ansible.builtin.template:
        src: healthz.conf.j2
        dest: "{{ proxy_update_nginx_dir }}/sites-enabled/healthz.conf"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_group }}"
        mode: '0644'
      tags: [healthz]

    - name: Copy nginx streams enabled confs
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ proxy_update_nginx_dir }}/streams-enabled/{{ item | basename }}"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_group }}"
      with_fileglob:
        - "{{ proxy_update_dir }}/streams-enabled/*"
      when: not (item | basename).startswith('_')

    - name: Copy nginx sites available confs
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ proxy_update_nginx_dir }}/sites-available/{{ item | basename }}"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_group }}"
      with_fileglob:
        - "{{ proxy_update_dir }}/sites-available/*"
      when: not (item | basename).startswith('_')

    - name: Copy nginx streams available confs
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ proxy_update_nginx_dir }}/streams-available/{{ item | basename }}"
        owner: "{{ proxy_update_owner }}"
        group: "{{ proxy_update_group }}"
      with_fileglob:
        - "{{ proxy_update_dir }}/streams-available/*"
      when: not (item | basename).startswith('_')

    # ── Stream Bitcoin P2P (papanglabs) ────────────────────────────────────────
    # Le gabarit rpcbtc_8333.conf ne connaît pas les nœuds : la liste des amonts
    # est complétée ici à partir du groupe `rpcsbtc`. Sans effet sur un parc dont
    # le répertoire nginx n'active pas ce stream.
    - name: Check if rpcbtc_8333.conf exists in streams-enabled
      ansible.builtin.stat:
        path: "{{ proxy_update_nginx_dir }}/streams-enabled/rpcbtc_8333.conf"
      register: rpcbtc_streams_enabled

    - name: Set rpcbtc.conf path
      ansible.builtin.set_fact:
        rpcbtc_conf_path: "{{ proxy_update_nginx_dir }}/streams-enabled/rpcbtc_8333.conf"
      when: rpcbtc_streams_enabled.stat.exists

    - name: Customize the rpcbtc.conf stream config file with all known BTC RPCs part 1
      ansible.builtin.lineinfile:
        path: "{{ rpcbtc_conf_path }}"
        regexp: "server .*;"
        line: ""
      when: rpcbtc_conf_path is defined

    - name: Customize the rpcbtc.conf stream config file with all known BTC RPCs part 2
      ansible.builtin.lineinfile:
        path: "{{ rpcbtc_conf_path }}"
        regexp: "#ADDSERVERS"
        line: "  server {{ hostvars[item]['ansible_host'] }}:{{ proxy_port_btcd }};\n  #ADDSERVERS"
      loop: "{{ groups['rpcsbtc'] | default([]) }}"
      when: rpcbtc_conf_path is defined

    # ── Jeton d'écriture Prometheus (remote-write, papanglabs) ─────────────────
    # Tiré UNE FOIS sur le proxy et jamais régénéré : le changer à chaque rejeu
    # couperait les émetteurs sans que rien ne l'explique.
    - name: Check if prometheus-write-token.conf exists
      ansible.builtin.stat:
        path: "{{ proxy_update_nginx_dir }}/prometheus-write-token.conf"
      register: prometheus_write_token_file
      when: proxy_write_token_enabled | bool

    - name: Generate prometheus write token
      ansible.builtin.shell: >
        echo 'set $prometheus_write_token "'"$(openssl rand -hex 32)"'";'
        > {{ proxy_update_nginx_dir }}/prometheus-write-token.conf
      when:
        - proxy_write_token_enabled | bool
        - not prometheus_write_token_file.stat.exists

    - name: Set prometheus write token file permissions
      ansible.builtin.file:
        path: "{{ proxy_update_nginx_dir }}/prometheus-write-token.conf"
        owner: www-data
        group: www-data
        mode: '0600'
      when:
        - proxy_write_token_enabled | bool
        - not prometheus_write_token_file.stat.exists

    # Écouteurs dédiés : aucun autre fichier de /etc/nginx n'écoute sur ces ports (configuration effective, vhosts posés,
    # nginx pas encore redémarré). Simulation : les fichiers ne sont pas posés, la lecture porterait sur l'ancienne configuration.
    - name: Check no other file listens on the dedicated ports
      ansible.builtin.include_tasks: dedicated-listener-sync-ports.yml
      when:
        - not ansible_check_mode
        - proxy_listener_owners | default([]) | selectattr('sites') | list | length > 0

    # Contrôle AVANT de redémarrer : un vhost mal templaté couperait TOUS les
    # vhosts de ce proxy, pas seulement le fautif. En simulation les fichiers ne
    # sont pas réellement posés : le test porterait sur l'ancienne configuration.
    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      when: not ansible_check_mode

  rescue:
    # `ansible_failed_*` sont lus ici, avant toute autre tâche du rescue.
    - name: Keep what failed
      ansible.builtin.set_fact:
        proxy_update_failed_at: >-
          « {{ ansible_failed_task.name | default('?') }} » ({{ (ansible_failed_result.msg | default('') | string)[:500] }})

    - name: Say where the previous nginx files are kept
      ansible.builtin.debug:
        msg: "Previous nginx files kept in {{ proxy_update_backup_dir.path }} on {{ inventory_hostname }}."
      when: proxy_update_backup_done | default(false) | bool

    # Ce que cette resynchronisation a supprimé ou réécrit est remis tel quel ; ce qui n'existait pas avant est retiré.
    # Seulement si la sauvegarde est COMPLÈTE : sinon le vif n'a pas été touché et reste tel quel.
    - name: Note that a restoration starts
      ansible.builtin.set_fact:
        proxy_update_restore_pending: true
      when: proxy_update_backup_done | default(false) | bool

    - name: Remove what this resynchronisation wrote
      ansible.builtin.file:
        path: "{{ proxy_update_nginx_dir }}/{{ item }}"
        state: absent
      loop: "{{ proxy_update_backup_items }}"
      when: proxy_update_backup_done | default(false) | bool

    - name: Put the previous nginx files back
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ proxy_update_backup_dir.path }}/{{ item }}"
          - "{{ proxy_update_nginx_dir }}/{{ item }}"
        removes: "{{ proxy_update_backup_dir.path }}/{{ item }}"
      loop: "{{ proxy_update_backup_items }}"
      changed_when: true
      when: proxy_update_backup_done | default(false) | bool

    - name: Note that the previous files are back
      ansible.builtin.set_fact:
        proxy_update_restore_pending: false
      when: proxy_update_backup_done | default(false) | bool

    # Un rechargement a pu avoir lieu pendant l'écriture (vhosts génériques posés seuls, hors resynchronisation complète) ou
    # nginx a pu être rechargé par un autre moyen : nginx est donc relu sur l'arbre restauré — `nginx -t`, puis rechargement
    # s'il tourne. Si cela échoue aussi, l'échec le dit.
    - name: Test the restored nginx configuration
      ansible.builtin.command: nginx -t
      register: proxy_update_restored_test
      changed_when: false
      failed_when: false
      when: proxy_update_backup_done | default(false) | bool

    - name: Look whether nginx is running
      ansible.builtin.command: systemctl is-active --quiet nginx
      register: proxy_update_nginx_active
      changed_when: false
      failed_when: false
      when:
        - proxy_update_backup_done | default(false) | bool
        - proxy_update_restored_test.rc == 0

    - name: Reload nginx on the restored configuration
      ansible.builtin.command: systemctl reload nginx
      register: proxy_update_restored_reload
      failed_when: false
      when:
        - proxy_update_backup_done | default(false) | bool
        - proxy_update_restored_test.rc == 0
        - proxy_update_nginx_active.rc == 0

    - name: Fail loudly, the previous configuration is back
      vars:
        _restored: "{{ proxy_update_backup_done | default(false) | bool }}"
        _test_ok: "{{ _restored and proxy_update_restored_test.rc == 0 }}"
        _reloaded: "{{ _test_ok and proxy_update_nginx_active.rc == 0 and proxy_update_restored_reload.rc == 0 }}"
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} : la resynchronisation nginx a échoué à {{ proxy_update_failed_at }}.
          {% if not _restored %}
          La sauvegarde de l'ancienne arborescence n'a pas abouti : {{ proxy_update_nginx_dir }} n'a pas été modifié, nginx n'a pas été redémarré.
          {% elif not _test_ok %}
          L'ancienne arborescence de {{ proxy_update_nginx_dir }} a été remise en place MAIS `nginx -t` la refuse
          ({{ (proxy_update_restored_test.stderr | default('') | string)[:300] }}) : nginx n'a pas été rechargé, intervention manuelle requise.
          {% elif proxy_update_nginx_active.rc != 0 %}
          L'ancienne arborescence de {{ proxy_update_nginx_dir }} a été remise en place (`nginx -t` passe), nginx n'est pas actif : aucun rechargement.
          {% elif not _reloaded %}
          L'ancienne arborescence de {{ proxy_update_nginx_dir }} a été remise en place (`nginx -t` passe) MAIS le rechargement de nginx a échoué
          ({{ (proxy_update_restored_reload.stderr | default('') | string)[:300] }}) : intervention manuelle requise.
          {% else %}
          L'ancienne arborescence de {{ proxy_update_nginx_dir }} a été remise en place, `nginx -t` passe et nginx a été rechargé dessus ;
          il n'a pas été redémarré.
          {% endif %}

  always:
    # Sauvegarde (clés, htpasswd) supprimée dans tous les cas, sauf restauration commencée et inachevée (c'est alors la seule
    # copie de l'ancienne arborescence). Le chemin est celui du `debug` ci-dessus.
    - name: Drop the backup of the previous nginx files
      ansible.builtin.file:
        path: "{{ proxy_update_backup_dir.path }}"
        state: absent
      when:
        - proxy_update_backup_dir.path is defined
        - not (proxy_update_restore_pending | default(false) | bool)
