---
# Déploie les règles d'alerte sur l'hôte Prometheus du parc courant.
# Joué sur l'hôte Prometheus lui-même (`prometheus1` sur papanglabs, `monitor`
# sur web3c), donc sans delegate_to.

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: "{{ prometheus_home }}/rules"
    state: directory
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: "0755"
  become: true

# Le fichier est déposé à l'écart, validé, puis seulement mis en place.
#
# Prometheus ne dégrade pas : une règle invalide fait échouer le chargement du
# fichier ENTIER, le conteneur refuse de démarrer et le handler de rechargement
# le laisse en boucle de crash. La supervision s'arrête donc net, et c'est
# précisément le moment où plus rien ne peut le signaler. Constat du 13/08/2026 :
# un `\.` dans une regex — échappement que PromQL n'accepte pas — a coupé
# Prometheus sur web3c pendant quatre minutes, sans qu'aucune tâche Ansible
# n'échoue. `promtool` aurait arrêté le déploiement avant d'y toucher.
#
# Le suffixe n'est pas `.yml` : le fichier est déposé dans le répertoire déjà
# monté dans le conteneur, dont le motif de chargement est `rules/*.yml`.
# ── Exemptions par hôte (`alert_exclude`) ─────────────────────────────────────
# Une entrée d'inventaire peut se soustraire à des alertes nommées :
#   nuc:
#     alert_exclude: [DiskWillFillSoon]
# La règle reste unique et commentée dans alerts.yml.j2 ; seule l'expression
# DÉPLOYÉE est enveloppée en `(<expr>) unless on (instance) up{instance=~"…"}`.
# `up` existe pour toute cible scrapée, en panne comprise : l'exclusion vaut
# quel que soit l'état de l'hôte. Le suffixe `-N` couvre les instances
# numérotées d'une entrée (`lamacpp-1`). Une règle dont le résultat n'a pas de
# label `instance` (absent(), agrégat) n'est pas concernée.
- name: Collect the per-host alert exemptions
  ansible.builtin.set_fact:
    prom_alert_exemptions: >-
      {%- set ns = namespace(m={}) -%}
      {%- for h in groups[parc_name] | default([]) | sort -%}
      {%- for a in hostvars[h].alert_exclude | default([]) -%}
      {%- set _ = ns.m.update({a: ns.m.get(a, []) + [h]}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ ns.m }}

- name: Render the alert rules
  ansible.builtin.set_fact:
    prom_alert_rules: "{{ lookup('ansible.builtin.template', 'alerts.yml.j2') | from_yaml }}"

# Une exemption qui ne correspond à aucune règle chargée sur ce parc est
# décorative : faute de frappe, ou règle d'un groupe absent de
# `prom_alert_groups`. Un nom d'entrée hors [A-Za-z0-9_-] casserait la regex
# PromQL (`\-` n'y est pas un échappement valide, cf. defaults).
- name: Check the alert exemptions
  vars:
    loaded: >-
      {{ (prom_alert_rules.groups | default([], true))
         | map(attribute='rules') | flatten | map(attribute='alert') | list }}
    unknown: "{{ prom_alert_exemptions.keys() | difference(loaded) }}"
    bad_hosts: "{{ prom_alert_exemptions.values() | flatten | reject('match', '^[A-Za-z0-9_-]+$') | list }}"
  ansible.builtin.assert:
    that:
      - unknown | length == 0
      - bad_hosts | length == 0
    fail_msg: >-
      Exemptions invalides (`alert_exclude` dans l'inventaire). Alertes
      absentes des règles chargées sur ce parc : {{ unknown }}. Noms d'entrée
      inutilisables dans une regex PromQL : {{ bad_hosts }}.
    quiet: true

- name: Stage alert rules for validation
  ansible.builtin.template:
    src: alerts-final.yml.j2
    dest: "{{ prometheus_home }}/rules/.alerts.staged"
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: "0644"
  become: true

- name: Validate staged alert rules with promtool
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint=promtool
      - --volume={{ prometheus_home }}/rules:/rules:ro
      - "{{ prometheus_image }}"
      - check
      - rules
      - /rules/.alerts.staged
  become: true
  changed_when: false

- name: Install validated alert rules
  ansible.builtin.copy:
    src: "{{ prometheus_home }}/rules/.alerts.staged"
    dest: "{{ prometheus_home }}/rules/alerts.yml"
    remote_src: true
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: "0644"
  become: true
  notify: reload prometheus

- name: Remove staged alert rules
  ansible.builtin.file:
    path: "{{ prometheus_home }}/rules/.alerts.staged"
    state: absent
  become: true
