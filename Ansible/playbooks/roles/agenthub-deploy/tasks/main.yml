---
# Voir defaults/main.yml pour le choix (orchestrer les scripts du dépôt app,
# ne pas réimplémenter le build/déploiement en Ansible).

# .env de prod gardés chiffrés dans le dépôt privé du parc (Ansible/.private,
# voir parcs/README.md) : restaurés dans le dépôt applicatif avant le
# déploiement par la même commande que l'opérateur (app-env.sh), qui ne
# réécrit que s'ils diffèrent et garde la copie locale en .env.bak-<date>.
- name: Check for the vaulted prod env files in the private parc repository
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.private/apps/{{ agenthub_app_env_id }}"
  delegate_to: localhost
  become: false
  register: agenthub_env_vault_dir

# `restore` remplace un .env local qui DIFFÈRE du coffre : une correction faite
# dans le dépôt app sans `./app-env.sh save` était donc défaite à chaque
# déploiement (constat du 28/10/2026 : BACK_HOSTS remis sur l'ancienne machine,
# front Cloudflare remplacé par l'ancien, deux passages sur la mauvaise cible).
# Un écart arrête le déploiement : c'est à l'opérateur de dire quel côté fait foi.
# `status` compare le contenu déchiffré en mémoire et n'affiche aucune valeur.
- name: Compare the local prod env files with the vault
  ansible.builtin.command:
    cmd: ./app-env.sh status {{ agenthub_app_env_id }}
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  become: false
  register: agenthub_env_status
  changed_when: false
  when: agenthub_env_vault_dir.stat.isdir | default(false)

- name: Fail when a local env file differs from the vault
  vars:
    agenthub_env_differing: >-
      {{ agenthub_env_status.stdout_lines
         | select('search', '\s+differs\s*$') | map('split') | map(attribute=1) | list }}
  ansible.builtin.fail:
    msg: >-
      Le .env {{ agenthub_env_differing | join(' et ') }} de {{ agenthub_src }} diffère de la copie du
      coffre : le restaurer écraserait le fichier local. Si le fichier local fait foi :
      `./app-env.sh save {{ agenthub_app_env_id }}` (depuis Ansible/), puis relancer. Si c'est le
      coffre : `./app-env.sh restore {{ agenthub_app_env_id }}` (garde le local en
      .env.bak-<date>). Passer outre : `-e agenthub_env_overwrite_local=true`.
  when:
    - agenthub_env_vault_dir.stat.isdir | default(false)
    - agenthub_env_differing | length > 0
    - not (agenthub_env_overwrite_local | bool)

- name: Restore the AgentHub prod env files from the vault
  ansible.builtin.command:
    cmd: ./app-env.sh restore {{ agenthub_app_env_id }}
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  become: false
  register: agenthub_env_restore
  changed_when: "'restored from' in agenthub_env_restore.stdout"
  when: agenthub_env_vault_dir.stat.isdir | default(false)

- name: Fail early when the prod env files are missing on the control machine
  ansible.builtin.stat:
    path: "{{ agenthub_src }}{{ item }}"
  delegate_to: localhost
  become: false
  loop:
    - "{{ agenthub_back_env_file }}"
    - "{{ agenthub_front_env_file }}"
  loop_control:
    label: "{{ item }}"
  register: agenthub_env_stat

- name: Fail when an env file is absent
  ansible.builtin.fail:
    msg: >-
      {{ agenthub_src }}{{ item.item }} introuvable sur le poste de contrôle.
      Ce fichier porte à la fois les secrets applicatifs de prod et les
      variables de déploiement distant (REMOTE_HOST, REMOTE_USER,
      REMOTE_SSH_PORT, SSH_KEY_FILE, REMOTE_CONTEXT_NAME, PROJECT_NAME — voir
      scripts/deploy-full.sh --help). Ce rôle ne le génère pas : le préparer
      avant de rejouer ce playbook (voir agenthub-deploy/defaults/main.yml
      pour le détail des variables attendues).
  loop: "{{ agenthub_env_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

# Variables que l'INVENTAIRE décide, fixées dans les .env restaurés (voir les
# rôles) : cibles du déploiement, et front sur Cloudflare Pages quand l'entrée
# déclare `cloudflare_front: true`. Pages d'abord : il écrit dans front/.env, que
# webapp-env-update resauvegarde ensuite dans le coffre avec le back/.env.
- name: Prepare the Cloudflare Pages front (project, branch, domain)
  ansible.builtin.include_role:
    name: cloudflare-pages-setup
  vars:
    cfpages_env_file: "{{ agenthub_src }}{{ agenthub_front_env_file }}"
  when: cloudflare_front | default(false) | bool

- name: Pin the deployment targets in the prod env files
  ansible.builtin.include_role:
    name: webapp-env-update
  vars:
    webapp_env_src: "{{ agenthub_src }}"
    webapp_env_back_file: "{{ agenthub_back_env_file }}"
    webapp_env_front_file: "{{ agenthub_front_env_file }}"
    webapp_env_app_id: "{{ agenthub_app_env_id }}"
    webapp_env_api_host: "{{ cfpages_api_domain | default('') }}"

# Sans ces deux clés du back/.env de prod, deploy-full.sh saute le hook d'auto-provisionnement
# sans bruit : un hub neuf n'aurait ni runner ni runners d'utilisateurs (l'étape « Choisis l'IA
# de ton équipe » réduite au LLM direct). grep -q : aucune valeur n'est affichée.
- name: Check the auto-provisioning switches of the prod back/.env
  ansible.builtin.shell: >-
    grep -Eq '^RUNNER_PROVISION=["]?1' {{ (agenthub_src ~ agenthub_back_env_file) | quote }}
    && grep -Eq '^BOOTSTRAP_API_KEY=["]?[^"[:space:]]' {{ (agenthub_src ~ agenthub_back_env_file) | quote }}
  delegate_to: localhost
  become: false
  register: agenthub_env_switches
  changed_when: false
  failed_when: false
  when: agenthub_runner_autoprovision | default(true)

- name: Fail when the auto-provisioning switches are missing
  ansible.builtin.fail:
    msg: >-
      {{ agenthub_src }}{{ agenthub_back_env_file }} doit poser RUNNER_PROVISION=1 et une
      BOOTSTRAP_API_KEY (clé d'API admin d'amorçage, voir back/.env.example) : le déploiement
      apparie alors le runner du hub et installe les runners des utilisateurs tout seul. Sans
      auto-provisionnement : `agenthub_runner_autoprovision: false` (chemin manuel, --tags runner).
  when:
    - agenthub_runner_autoprovision | default(true)
    - agenthub_env_switches.rc != 0

# Cibles du déploiement : `run.sh` ignore l'inventaire et vise les hôtes nommés
# par le back/.env (BACK_HOSTS > BACK_REMOTE_HOST > REMOTE_HOST, idem côté front).
# Après un déplacement de machine, une variable oubliée envoie le déploiement sur
# l'ANCIENNE sans erreur (constat du 28/10/2026 : deux passages sur l'ancienne machine
# alors que l'entrée `agenthub` visait la nouvelle, puis un « Connection refused »
# sur la boucle locale de celle-ci). Le fichier est lu par la même résolution que
# le script (`source`, puis les mêmes replis) : seules les trois valeurs d'hôte sont
# affichées. Le front n'est contrôlé que s'il est un conteneur sur un hôte : avec
# VITE_API_URL en https:// (Cloudflare Pages), deploy-full.sh ne lui donne aucun hôte.
- name: Read the deployment targets of the prod env files
  ansible.builtin.shell:
    cmd: |
      cd {{ agenthub_src | quote }}
      source {{ ('./' ~ agenthub_back_env_file) | quote }} >/dev/null 2>&1 || true
      echo "back=${BACK_HOSTS:-${BACK_REMOTE_HOST:-${REMOTE_HOST:-}}}"
      echo "front=${FRONT_HOSTS:-${FRONT_REMOTE_HOST:-${REMOTE_HOST:-}}}"
      echo "vite=$(grep -E '^[[:space:]]*VITE_API_URL=' {{ ('./' ~ agenthub_front_env_file) | quote }} | tail -1 | sed 's/^[^=]*=//' | tr -d "\"'")"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: agenthub_env_targets
  changed_when: false

- name: Fail when the env files target another machine than the inventory
  vars:
    agenthub_target_lines: "{{ agenthub_env_targets.stdout_lines }}"
    agenthub_expected_hosts: "{{ [hostvars['agenthub'].ansible_host, hostvars['agenthub'].hostname | default('')] | select | list }}"
    agenthub_back_targets: >-
      {{ (agenthub_target_lines | select('match', '^back=') | first | regex_replace('^back=', '')).split(',') | map('trim') | map('regex_replace', '^.*@', '') | reject('equalto', '') | list }}
    agenthub_front_targets: >-
      {{ (agenthub_target_lines | select('match', '^front=') | first | regex_replace('^front=', '')).split(',') | map('trim') | map('regex_replace', '^.*@', '') | reject('equalto', '') | list }}
    agenthub_front_is_cloud: "{{ (agenthub_target_lines | select('match', '^vite=https://') | list | length) > 0 }}"
    agenthub_wrong_targets: >-
      {{ (agenthub_back_targets + ([] if agenthub_front_is_cloud else agenthub_front_targets))
         | difference(agenthub_expected_hosts) }}
  ansible.builtin.assert:
    that:
      - agenthub_back_targets | length > 0
      - agenthub_wrong_targets | length == 0
      - (not (cloudflare_front | default(false) | bool)) or (agenthub_front_targets | length == 0)
    fail_msg: >-
      {{ agenthub_src }}{{ agenthub_back_env_file }} vise {{ agenthub_wrong_targets | join(', ') or 'aucun hôte' }}
      alors que l'entrée `agenthub` de l'inventaire est {{ agenthub_expected_hosts | join(' / ') }}.
      deploy-full.sh lit BACK_HOSTS, puis BACK_REMOTE_HOST, puis REMOTE_HOST (front :
      FRONT_HOSTS, FRONT_REMOTE_HOST, REMOTE_HOST) : la première définie l'emporte. Avec
      `cloudflare_front: true` le front ne doit avoir AUCUN hôte (il part sur Cloudflare Pages).
      Corriger le fichier puis `./app-env.sh save {{ agenthub_app_env_id }}`, sinon la
      restauration depuis le coffre le réécrit au prochain passage.
    quiet: true
  delegate_to: localhost
  become: false

# `run.sh prod` == `deploy-full.sh` (build local + push via un contexte Docker
# SSH + démarrage distant), avec la gestion des migrations en amont (voir
# defaults). Exécuté depuis le poste de contrôle : Ansible n'a pas de contexte
# Docker vers l'hôte cible, le script en crée/gère un lui-même.
- name: Deploy the AgentHub app (build + push + start, via the app's own tooling)
  ansible.builtin.command:
    cmd: "./scripts/run.sh prod{{ ' --migrate' if agenthub_migrate else '' }}"
  args:
    chdir: "{{ agenthub_src }}"
  delegate_to: localhost
  become: false
  environment:
    BACK_ENV_FILE: "{{ agenthub_back_env_file }}"
    FRONT_ENV_FILE: "{{ agenthub_front_env_file }}"
    # Lus par runner/scripts/provision-user-runners.sh (voir defaults).
    USER_RUNNERS_PROVISION: "{{ '1' if agenthub_user_runners | bool else '0' }}"
    USER_RUNNERS_AUTO_ENABLE: "{{ '1' if agenthub_user_runners_auto_enable | bool else '0' }}"
  register: agenthub_deploy_run
  changed_when: true

# Contrôles exécutés SUR l'hôte (boucle locale) plutôt que depuis le poste de
# contrôle : le port n'est joignable depuis l'extérieur que pour les proxies/
# whitelist/VPN une fois agenthub-security appliqué (voir deploy-agenthub.yml,
# joué juste avant) — un contrôle en boucle locale reste valide quel que soit
# l'état du pare-feu ou l'IP du poste de contrôle.
- name: Wait for the front to answer
  when: not (cloudflare_front | default(false) | bool)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hostvars['agenthub'].app_port }}/"
    status_code: [200, 301, 302]
  register: agenthub_front_ready
  until: agenthub_front_ready.status is defined and agenthub_front_ready.status in [200, 301, 302]
  retries: "{{ agenthub_health_retries }}"
  delay: "{{ agenthub_health_delay }}"
  changed_when: false

- name: Wait for the back API health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hostvars['agenthub'].back_port }}/api/v1/health"
    status_code: [200]
  register: agenthub_back_ready
  until: agenthub_back_ready.status is defined and agenthub_back_ready.status == 200
  retries: "{{ agenthub_health_retries }}"
  delay: "{{ agenthub_health_delay }}"
  changed_when: false

- name: Report how the app is exposed
  ansible.builtin.debug:
    msg: >-
      AgentHub déployé : {{ 'front sur Cloudflare Pages, ' if (cloudflare_front | default(false) | bool)
      else 'front sur 127.0.0.1:' ~ hostvars['agenthub'].app_port ~ ', ' }}back sur 127.0.0.1:{{ hostvars['agenthub'].back_port }}. Publiquement
      joignable via https://{{ agenthub_hostname | default('agenthub.' ~ domain_name) }}
      (vhost proxies) une fois `--tags proxy-conf` joué, et filtré dans
      DOCKER-USER (proxies + whitelist + VPN uniquement) une fois
      agenthub-security joué. Runner du hub et runners des utilisateurs mis en
      place par le déploiement lui-même (auto-provisionnement, voir la sortie
      `[RUNNER:…]` / `[USER-RUNNERS:…]` du script ; un avertissement n'arrête
      pas le déploiement). Sans auto-provisionnement : activer le runner
      (tasks/runner.yml, --tags runner) avec un jeton de la page « Nouveau
      runner » du hub.

- name: Activate the AgentHub runner
  ansible.builtin.import_tasks: runner.yml
  tags: [runner]
