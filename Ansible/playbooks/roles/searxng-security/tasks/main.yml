---
# Voir defaults/main.yml : ufw ne voit pas le trafic vers un port publié par
# Docker, seule la chaîne DOCKER-USER le filtre réellement.
#
# Le script est déployé dans les DEUX cas — proxies distants ou non. Dans le
# second il ne pose aucune règle mais purge celles d'un état antérieur : c'est
# ce qui rend le passage « port ouvert filtré » → « boucle locale » réellement
# effectif, au lieu de laisser des règles orphelines sur un port que rien
# n'atteint plus.

- name: Deploy the SearXNG port firewall script
  ansible.builtin.template:
    src: searxng-firewall.sh.j2
    dest: /usr/local/sbin/searxng-firewall.sh
    owner: root
    group: root
    mode: '0750'
  become: true
  notify: reapply searxng firewall

- name: Deploy the SearXNG port firewall unit
  ansible.builtin.template:
    src: searxng-firewall.service
    dest: /etc/systemd/system/searxng-firewall.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reapply searxng firewall

- name: Enable and start the SearXNG port firewall unit
  ansible.builtin.systemd:
    name: searxng-firewall
    state: started
    enabled: true
    daemon_reload: true
  become: true

# Une règle ufw sur ce port serait décorative — mais elle a pu être posée à la
# main, et elle donne l'impression que le port est traité. On la retire pour
# que `ufw status` ne raconte pas une histoire différente de la réalité.
- name: Remove any decorative ufw rule on the SearXNG port
  community.general.ufw:
    rule: "{{ item }}"
    proto: tcp
    port: "{{ searxng_port }}"
    delete: true
  loop: [allow, deny]
  become: true

# ── Contrôle ───────────────────────────────────────────────────────────────
# Les handlers ne tournent qu'en fin de play : le contrôle porte donc sur
# l'état RÉEL de la chaîne après application immédiate, pas sur le fait d'avoir
# déposé un fichier. C'est toute la différence entre une sécurité vérifiée et
# une sécurité déclarée.
- name: Apply the rules now
  ansible.builtin.command: /usr/local/sbin/searxng-firewall.sh
  become: true
  changed_when: false

- name: Read back the DOCKER-USER chain
  ansible.builtin.command: iptables -S DOCKER-USER
  become: true
  register: searxng_chain
  changed_when: false
  check_mode: false

- name: Verify the port is really filtered
  vars:
    sx_lines: "{{ searxng_chain.stdout_lines }}"
  ansible.builtin.assert:
    that:
      # Motif et non égalité : `iptables -S` intercale `-m tcp` et réordonne
      # les options selon la version, une comparaison littérale casserait au
      # premier changement de forme sans qu'aucune règle ne manque.
      # `--ctorigdstport` et non `--dport` : DOCKER-USER voit le port du conteneur
      # après DNAT (cf. searxng-firewall.sh.j2).
      - searxng_chain.stdout is search('--ctorigdstport ' ~ searxng_port ~ '.*-j DROP')
      # Le DROP doit précéder le `-j RETURN` posé par Docker, sinon il n'est
      # jamais évalué (le piège exact du 19/10/2026).
      - >-
        '-A DOCKER-USER -j RETURN' not in sx_lines
        or sx_lines.index(sx_lines | select('search', '--ctorigdstport ' ~ searxng_port ~ '.*-j DROP') | first)
           < sx_lines.index('-A DOCKER-USER -j RETURN')
    fail_msg: >-
      Le port {{ searxng_port }} est publié sur 0.0.0.0 mais aucun DROP ne le
      protège dans DOCKER-USER : le relai est joignable depuis Internet.
      Vérifier `systemctl status searxng-firewall` et `iptables -S DOCKER-USER`.
    success_msg: >-
      Port {{ searxng_port }} filtré dans DOCKER-USER, autorisé pour
      {{ searxng_remote_proxies | join(', ') }}.
  when:
    - searxng_remote_proxies | length > 0
    # En simulation, la tâche d'application est sautée : la chaîne n'a pas
    # encore les règles et le contrôle échouerait sur un hôte parfaitement
    # sain. On ne vérifie que ce qu'on a réellement appliqué.
    - not ansible_check_mode

- name: Report that no opening is needed
  ansible.builtin.debug:
    msg: >-
      Aucun proxy distant : le port {{ searxng_port }} n'est publié que sur
      127.0.0.1 et n'est atteignable que depuis cette machine. Rien à ouvrir —
      contrôle depuis une machine tierce : `nc -z {{ ansible_host }}
      {{ searxng_port }}` doit échouer.
  when: searxng_remote_proxies | length == 0
