---
# Supervision de TradeKong.
#
# Convention `<service>-monitoring` (CLAUDE.md) : le rôle dépose une SONDE
# déclarative pour `svcprobe`, qui expose `service_up{service="tradekong"}`.
# Aucun redémarrage n'est nécessaire — svcprobe relit son répertoire de sondes
# à chaque scrape.

- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Deploy the tradekong probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/tradekong.json"
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [monitoring]

- name: Verify the probe answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: tradekong_probe
  retries: 6
  delay: 5
  until: tradekong_probe.status is defined and tradekong_probe.status == 200
  changed_when: false
  tags: [monitoring]

# Contrôle immédiat : une sonde déposée mais qui répond `service_up 0` alors
# que le service tourne est une sonde MAL ÉCRITE, et elle ferait sonner une
# alerte en permanence. Mieux vaut le voir au déploiement.
- name: Fail when the probe reports the service down
  ansible.builtin.fail:
    msg: >-
      La sonde répond mais annonce `service_up{service="tradekong"} 0` alors
      que le déploiement vient de réussir : la sonde est mal écrite ou
      {{ tkm_health_url }} ne répond pas.
  when: >-
    'service_up{service="tradekong"} 0' in (tradekong_probe.content | default(''))
  tags: [monitoring]
