---
# Remove the Theta Edge sweep cron job and all associated files.
# Node.js/npm are left in place (system packages).

- name: Remove theta-edge-sweep cron job
  ansible.builtin.cron:
    name: "theta-edge-sweep"
    state: absent

# Sans cela la dernière date de succès vieillit pour toujours et ThetaSweepStale
# sonne sur un sweep volontairement retiré.
- name: Remove the sweep metrics
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile_collector') }}/theta-edge-sweep.prom"
    state: absent

- name: Remove sweep directory (script, config, state, node_modules)
  ansible.builtin.file:
    path: /opt/theta-edge/sweep
    state: absent
