---
# A record de CE proxy, publié AVANT tout le reste : `proxyN.<zone>` est l'identité
# de la machine, il doit exister même si un vhost ou une règle casse plus loin
# (constat du 04/11/2026 : proxy3 échoue sur `hostvars['tradingbot']` dans
# proxy-update, les plays suivants sont sautés pour lui, dont le DNS — plus de A).
#
# `run_once` vit dans records.yml : le scope est donc l'ENSEMBLE des hôtes du play
# (`ansible_play_hosts`, après --limit), pas `inventory_hostname` — évalué par le
# seul premier hôte, il laisserait les autres proxies sans A.
#
# L'entrée dans le tourniquet `proxy.<zone>` n'est PAS posée ici : un proxy à
# moitié déployé ne doit pas recevoir de trafic. Elle reste dans le dernier play
# de deploy-proxy.yml, une fois le proxy servi.
- name: Publish the A record of the proxies being deployed (DNS only)
  ansible.builtin.include_role:
    name: cloudflare-dns-update
    tasks_from: records
  vars:
    cfdns_a_scope: "{{ ansible_play_hosts }}"

########### Setup nginx
# Copy config
- name: Copy nginx gobal configuration
  template: src=nginx.conf dest=/etc/nginx/nginx.conf
- name: Copy cloudflare configuration
  template: src=cloudflare.conf dest=/etc/nginx/cloudflare.conf
# Clean up directories in case they already exist
- name: Delete sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: absent
- name: Delete streams directory
  ansible.builtin.file:
    path: /etc/nginx/streams-enabled
    state: absent

- name: Creates http empty directory
  ansible.builtin.file:
    path: /var/www/html
    state: directory
- name: Copy empty index.html
  template: src=index.html dest=/var/www/html/index.html

# Create directories
- name: Creates sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
- name: Creates streams directory
  ansible.builtin.file:
    path: /etc/nginx/streams-enabled
    state: directory
- name: Creates sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    state: directory
- name: Creates streams directory
  ansible.builtin.file:
    path: /etc/nginx/streams-available
    state: directory

# nginx must come back by itself if a start fails (e.g. transient DNS error at restart)
- name: Creates nginx systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
- name: Auto-restart nginx on failure
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/restart.conf
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      Restart=on-failure
      RestartSec=10
  notify: reload systemd
