---
########### Copy and customize config files for proxied servers
# Delete and recreate directories
- name: Delete sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: absent
- name: Delete streams directory
  ansible.builtin.file:
    path: /etc/nginx/streams-enabled
    state: absent
- name: Creates sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
- name: Creates streams directory
  ansible.builtin.file:
    path: /etc/nginx/streams-enabled
    state: directory

- name: Copy nginx conf
  template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root

- name: Copy nginx sites enabled confs
  template:
    src: "{{ item }}"
    dest: /etc/nginx/sites-enabled/{{ item | basename }}
    owner: root
    group: root
  with_fileglob:
    - ../templates/sites-enabled/*
- name: Copy nginx streams enabled confs
  template:
    src: "{{ item }}"
    dest: /etc/nginx/streams-enabled/{{ item | basename }}
    owner: root
    group: root
  with_fileglob:
    - ../templates/streams-enabled/*

# Customize config files on proxies (rpcbtc site and rpcbtc stream)
- name: Check if rpcbtc_8333.conf exists in streams-enabled
  ansible.builtin.stat:
    path: "/etc/nginx/streams-enabled/rpcbtc_8333.conf"
  register: rpcbtc_streams_enabled

- name: Set rpcbtc.conf path
  ansible.builtin.set_fact:
    rpcbtc_conf_path: "/etc/nginx/streams-enabled/rpcbtc_8333.conf"
  when: rpcbtc_streams_enabled.stat.exists

- name: Customize the rpcbtc.conf stream config file with all known BTC RPCs part 1
  ansible.builtin.lineinfile:
    path: "{{ rpcbtc_conf_path }}"
    regexp: "server .*;"
    line: ""
  when: rpcbtc_conf_path is defined

- name: Customize the rpcbtc.conf stream config file with all known BTC RPCs part 2
  ansible.builtin.lineinfile:
    path: "{{ rpcbtc_conf_path }}"
    regexp: "#ADDSERVERS"
    line: "  server {{ hostvars[item]['ansible_host'] }}:{{ proxy_port_btcd }};\n  #ADDSERVERS"
  loop: "{{ groups['rpcsbtc'] }}"
  when: rpcbtc_conf_path is defined

- name: Check if prometheus-write-token.conf exists
  ansible.builtin.stat:
    path: /etc/nginx/prometheus-write-token.conf
  register: prometheus_write_token_file

- name: Generate prometheus write token
  ansible.builtin.shell: >
    echo 'set $prometheus_write_token "'"$(openssl rand -hex 32)"'";'
    > /etc/nginx/prometheus-write-token.conf
  when: not prometheus_write_token_file.stat.exists

- name: Set prometheus write token file permissions
  ansible.builtin.file:
    path: /etc/nginx/prometheus-write-token.conf
    owner: www-data
    group: www-data
    mode: '0600'
  when: not prometheus_write_token_file.stat.exists

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Restart Nginx service
  ansible.builtin.systemd:
    state: restarted
    name: nginx
