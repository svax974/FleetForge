upstream backindicators_cluster {
    server {{ hostvars['backindicators1'].ansible_host }}:{{ hostvars['backindicators1'].app_port }} max_fails=3 fail_timeout=10s;
    #server {{ hostvars['backindicators1'].ansible_host }}:{{ postgres_port }} backup;
    #ADDSERVERS
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           backindicators.{{ domain_name }};

  location / {
    proxy_pass         http://backindicators_cluster;
    #proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_pass_request_headers on;
    # Allow connections from VPNs, back servers and whitelist
    # DEBUG vpns: {{ groups['vpns'] | length }} hosts
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
    {% endfor %}
    # DEBUG whitelist: {{ whitelist | length }} IPs
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    {% for ip in cloudflare_ips %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
  #include /etc/letsencrypt/options-ssl-nginx.conf;
  #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
