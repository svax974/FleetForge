{#
  Deux périmètres distincts :
    - /api/v1/write : machines de l'inventaire de ce parc, et rien d'autre ;
    - le reste (UI, API) : idem, plus les postes d'exploitation (`whitelist`).

  Le filtre sur la forme de l'adresse n'est pas décoratif : une entrée dont
  `ansible_host` est un gabarit non renseigné (`xxx.xxx.xxx.xxx` sur
  docker-repo) produirait un `allow` invalide, et nginx REFUSERAIT de démarrer —
  emportant tous les autres vhosts de la machine avec lui.

  Dédoublonné : plusieurs entrées d'inventaire décrivent la même machine (sept
  partagent `prometheus1` sur papanglabs). Trié, pour qu'un diff ne bouge que
  quand le parc bouge.

  Portée IPv4 seulement : l'inventaire ne connaît pas d'adresse IPv6, un client
  arrivant par `listen [::]:443` serait donc refusé.
-#}
{% set inventory_ips = groups['all']
     | map('extract', hostvars, 'ansible_host')
     | select('defined')
     | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
     | unique | sort %}
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           prometheus1.{{ domain_name }};

  location /api/v1/write {
      proxy_pass          http://{{ hostvars['prometheus1'].ansible_host }}:{{ hostvars['prometheus1'].app_port }};
      proxy_http_version  1.1;
      proxy_set_header    Content-Type     $http_content_type;
      proxy_set_header    Content-Encoding $http_content_encoding;
      proxy_set_header    Host             $host;

    {% for ip in inventory_ips %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }

  location / {
    proxy_pass         http://{{ hostvars['prometheus1'].ansible_host }}:{{ hostvars['prometheus1'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    {# UI : machines du parc, plus les postes d'exploitation (`whitelist`).
       Le récepteur remote_write ci-dessus, lui, reste limité au parc : aucun
       poste n'a de raison d'y pousser des séries. #}
    {% for ip in inventory_ips %}
    allow {{ ip }};
    {% endfor %}
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
