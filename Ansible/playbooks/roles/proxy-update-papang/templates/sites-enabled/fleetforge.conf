{#
  FleetForge — l'application de gestion du parc, servie en HTTP.

  Restriction : postes d'exploitation UNIQUEMENT (`whitelist`). Volontairement
  PAS les adresses de l'inventaire, contrairement à monitoring.conf et
  prometheus1.conf : cette application lance des playbooks sur tout le parc.
  Une machine du parc compromise ne doit pas y trouver de quoi piloter les
  autres — ouvrir le parc à lui-même reviendrait à faire de chaque hôte un
  point d'entrée d'administration.

  L'application porte en outre sa PROPRE authentification basique, qui reste
  active derrière ce filtre. Une whitelist est une liste d'ADRESSES : elle ne
  dit rien de qui se trouve derrière, et ce parc a déjà connu des règles de
  filtrage entièrement décoratives sans que rien ne le signale.

  Le filtre sur la forme de l'adresse n'est pas décoratif : une valeur qui
  n'est pas une adresse produirait un `allow` invalide, et nginx REFUSERAIT de
  démarrer — emportant tous les autres vhosts de la machine avec lui.

  Le bloc entier est conditionné à la présence de l'hôte : sur un inventaire
  qui ne porte pas FleetForge, `hostvars['infra1']` lèverait une erreur de
  rendu et ferait échouer TOUT le déploiement du proxy.
-#}
{% if 'infra1' in hostvars %}
{% set infra_allow = whitelist
     | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$')
     | unique | sort %}
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           infra.{{ domain_name }};

  location / {
    proxy_pass         http://{{ hostvars['infra1'].ansible_host }}:{{ hostvars['infra1'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_http_version 1.1;

    {# L'authentification de l'application voyage dans cet en-tête : sans ce
       relais explicite, l'utilisateur boucle sur la demande de mot de passe. #}
    proxy_set_header   Authorization $http_authorization;
    proxy_pass_header  Authorization;

    {# Sortie de déploiement en flux (Server-Sent Events). `proxy_buffering off`
       est INDISPENSABLE : avec la mise en tampon, nginx retient les lignes et
       l'opérateur voit un écran vide pendant tout le playbook, puis tout d'un
       coup à la fin — ce qui donne un déploiement pour bloqué.
       Le délai de lecture couvre un playbook long (compilation, apt) ; le
       serveur émet un battement toutes les 15 s, mais un intermédiaire trop
       court couperait quand même. #}
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    {% for ip in infra_allow %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }

  {# `/metrics` n'est pas exposé au travers du proxy : Prometheus scrape le
     port applicatif directement, restreint par ufw à sa seule adresse. Le
     publier ici l'ouvrirait à toute la whitelist sans authentification. #}
  location = /metrics {
    deny all;
  }

  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
{% endif %}
