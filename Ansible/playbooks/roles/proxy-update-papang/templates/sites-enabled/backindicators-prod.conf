upstream backindicators_prod_cluster {
    server {{ hostvars['backindicators1-prod'].ansible_host }}:{{ hostvars['backindicators1-prod'].app_port }};
    #server {{ hostvars['backindicators1-prod'].ansible_host }}:{{ hostvars['backindicators1-prod'].app_port }} max_fails=3 fail_timeout=10s;
    #server {{ hostvars['backindicators1-prod'].ansible_host }}:{{ postgres_port }} backup;
    #ADDSERVERS
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           backindicators-prod.{{ domain_name }};

  # Public, non-sensitive assets (a topic's header/footer image, a
  # communication body image — all served by InlineImageController, already
  # @Public()/no-auth on the app side). Must stay reachable by ANY client on
  # the internet, unlike everything else on this host: a recipient's mail
  # client rendering a sent communication, and the admin's own preview
  # (rendered inside a sandboxed srcDoc iframe, which sends "Origin: null" —
  # the app's own CORS config already carves out this same path for that
  # reason). Deliberately kept OUT of the VPN/whitelist/Cloudflare-only
  # allowlist below — rate-limited instead (zone declared in nginx.conf) so
  # it can't be turned into a way to hammer the backend or hotlink-abuse it.
  location /api/v1/inline-image/ {
    limit_req          zone=inline_image_limit burst=40 nodelay;
    proxy_pass         http://backindicators_prod_cluster;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
  }

  location / {
    proxy_pass         http://backindicators_prod_cluster;
    #proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_pass_request_headers on;
    # Allow connections from VPNs, back servers and whitelist
    # DEBUG vpns: {{ groups['vpns'] | length }} hosts
    {% for host in groups['vpns'] %}
    allow {{ hostvars[host]['ansible_host'] }};  # {{ host }}
    {% endfor %}
    # DEBUG whitelist: {{ whitelist | length }} IPs
    {% for ip in whitelist %}
    allow {{ ip }};
    {% endfor %}
    {% for ip in cloudflare_ips %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
  #include /etc/letsencrypt/options-ssl-nginx.conf;
  #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
