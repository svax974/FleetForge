{#
  Esplora — API REST compatible Blockstream Esplora (mempool/electrs),
  déployée par esplora-install sur l'entrée d'inventaire `esplora1`
  (co-localisée avec rpcbtc1/brk1, `brk1`).

  Restriction : whitelist opérateur + TOUS les hôtes de l'inventaire
  (CLAUDE.md § « Obligation DNS + vhost » — obligatoire, pas optionnel,
  puisque `deny all` sans lui laisserait passer n'importe qui d'autre).
  Un jeton applicatif serait un durcissement additionnel pour des appelants
  précis, pas un substitut à cette liste.

  Bloc conditionné à la présence de l'hôte : sur un inventaire qui ne porte
  pas `esplora1`, `hostvars['esplora1']` ferait échouer TOUT le déploiement
  du proxy (même garde que fleetforge.conf/umami.conf).
-#}
{% if 'esplora1' in hostvars %}
{# `selectattr('ansible_host', 'defined')` AVANT l'extraction : un hôte de
   l'inventaire sans `ansible_host` (entrée en cours d'édition, gabarit non
   renseigné) ferait sinon échouer le rendu du gabarit ENTIER — testé en
   isolation, `map('extract', hostvars, 'ansible_host')` direct sur un hôte
   sans cette clé lève une erreur Jinja plutôt que de la sauter. #}
{% set esplora_allow = (whitelist
     | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$') | list)
     + (groups['all'] | default([])
        | map('extract', hostvars)
        | selectattr('ansible_host', 'defined')
        | map(attribute='ansible_host')
        | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list) %}
{% set esplora_allow = esplora_allow | unique | sort %}
server {
  listen      80;
  listen      [::]:80;
  server_name {{ esplora_hostname | default('esplora.' ~ domain_name) }};
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           {{ esplora_hostname | default('esplora.' ~ domain_name) }};

  location / {
    proxy_pass         http://{{ hostvars['esplora1'].ansible_host }}:{{ hostvars['esplora1'].app_port }};
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    proxy_http_version 1.1;

    {% for ip in esplora_allow %}
    allow {{ ip }};
    {% endfor %}
    deny all;
  }

  {# Le endpoint de monitoring Prometheus natif d'electrs écoute sur un port
     SÉPARÉ (esplora_monitoring_port), jamais sur app_port ci-dessus :
     Prometheus le scrape directement (esplora-monitoring), restreint par
     ufw à sa seule adresse. Rien à exclure ici. #}

  ssl_certificate     /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
{% endif %}
