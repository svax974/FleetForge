upstream vpns {
  # No balancing method for master/backup mode
  #hash $remote_addr consistent;
  #ip_hash;
  server {{ hostvars['vpn1'].ansible_host }}:{{ vpn_tcp_port }} max_fails=3 fail_timeout=10s;
  #ADDSERVERS
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           vpn.{{ domain_name }};

  location / {
    proxy_pass         https://vpns;
    #proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           vpn1p.{{ domain_name }};

  location / {
    proxy_pass         https://{{ hostvars['vpn1'].hostname }}:{{ vpn_tcp_port }};
    #proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
}
