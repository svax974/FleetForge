upstream rpcs_btc {
  hash $remote_addr consistent;
  server {{ hostvars['rpcbtc1'].ansible_host }}:{{ proxy_port_btcd }};
  #server {{ hostvars['rpcbtc2'].ansible_host }}:{{ proxy_port_btcd }};
  #ADDSERVERS
}

server {
  listen {{ proxy_port_btcd }};
  proxy_pass rpcs_btc;
  limit_conn stream_limit_conn 10;
}
