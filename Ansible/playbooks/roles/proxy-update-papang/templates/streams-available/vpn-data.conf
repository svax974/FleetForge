upstream pritunl_data1 {
        # No balancing in master/backup mode
        #hash $remote_addr consistent;
        server {{ hostvars['vpn1'].ansible_host }}:{{ vpn_data_port }} max_fails=3 fail_timeout=10s;
        server {{ hostvars['vpn2'].ansible_host }}:{{ vpn_data_port }} backup;
}
server {
        listen {{ vpn_data_port }};
        proxy_pass pritunl_data1;
}

upstream pritunl_data2 {
        #hash $remote_addr consistent;
        server {{ hostvars['vpn1'].ansible_host }}:{{ vpn_data_port2 }} max_fails=3 fail_timeout=10s;
        server {{ hostvars['vpn2'].ansible_host }}:{{ vpn_data_port2 }} backup;
}
server {
        listen {{ vpn_data_port2 }};
        proxy_pass pritunl_data2;
}
