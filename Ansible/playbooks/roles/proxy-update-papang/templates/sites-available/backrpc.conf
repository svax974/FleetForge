upstream backrpcs_cluster {
    server {{ hostvars['backrpc1'].ansible_host }}:{{ hostvars['backrpc1'].port }} max_fails=3 fail_timeout=10s;
    #server {{ hostvars['backrpc2'].ansible_host }}:{{ hostvars['backrpc2'].port }} backup;
    #ADDSERVERS
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name           backrpc.{{ domain_name }};

  location / {
    proxy_pass         http://backrpcs_cluster;
    #proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    proxy_ssl_verify   off;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_pass_request_headers on;
  }
  ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
  #include /etc/letsencrypt/options-ssl-nginx.conf;
  #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
