upstream pgpool_cluster {
    server {{ hostvars['dbproxy1'].ansible_host }}:{{ postgres_port }} max_fails=3 fail_timeout=10s;
    server {{ hostvars['dbproxy2'].ansible_host }}:{{ postgres_port }} backup;
    #ADDSERVERS
}

server {
    listen 443;
    listen [::]:443;
    server_name db.{{ domain_name }};

    # Proxy pass vers le cluster
    location / {
        proxy_pass http://pgpool_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        # Allow connections from VPNs, back servers and whitelist
        {% for host in groups['vpns'] %}
        allow {{ hostvars[host]['ansible_host'] }};
        {% endfor %}
        {% for host in groups['backsrpc'] %}
        allow {{ hostvars[host]['ansible_host'] }};
        {% endfor %}
        {% for ip in whitelist %}
        allow {{ ip }};
        {% endfor %}
        deny all;
    }

    # Logs pour le diagnostic
    access_log /var/log/nginx/pgpool_access.log;
    error_log /var/log/nginx/pgpool_error.log;
}