---
# Nœud Monero (monerod) — binaires OFFICIELS du projet, vérifiés par signature GPG.
#
# Sources (vérifiées le 04/11/2026) : docs.getmonero.org/running-node/monerod-systemd/
# et la publication monero-project/monero v0.18.5.4.
#
# ── Le type de nœud (OBLIGATOIRE) : `-e type=full` ou `-e type=pruned` ────────
#   full    chaîne complète, ~265 GiB (2026-10-05) ; sert aussi les blocs entiers
#           aux autres nœuds (contribue davantage au réseau).
#   pruned  `prune-blockchain=1` : ~105 GiB, soit environ 1/3 — mêmes fonctions
#           pour un portefeuille ou le minage, contribue un peu moins au réseau.
# Un type s'installe d'emblée : passer de `full` à `pruned` impose l'outil
# monero-blockchain-prune (copie élaguée, il faut de la place pour les deux) et
# `pruned` → `full` impose de tout resynchroniser. Ce rôle REFUSE de changer le type
# d'une chaîne existante plutôt que de décider à votre place.
# `-e type=` est la forme voulue en ligne de commande ; `monero_type` l'équivalent
# pour un group_vars/host_vars.
monero_type: "{{ type | default('') }}"

# ── Contrôle d'espace disque, AVANT toute installation ────────────────────────
# Seuils DURS (échec) : taille actuelle de la chaîne × ~1,3 — de quoi tenir environ
# trois ans de croissance (~2,5 GiB/mois, estimation de guides tiers).
# Seuils RECOMMANDÉS (avertissement) : ceux du guide officiel (≈ 2,5 × la taille).
# Tailles de référence : full 265 GiB, pruned 105 GiB (docs.getmonero.org, 2026-10-05).
monero_min_free_gib:
  full: 345
  pruned: 140
monero_recommended_free_gib:
  full: 663
  pruned: 263
# true : ignore le contrôle d'espace (disque monté après coup, chaîne déjà copiée…).
monero_skip_space_check: false
# RAM recommandée par le guide officiel : 4 GiB (avertissement seulement).
monero_min_ram_mb: 3500

# ── Version ────────────────────────────────────────────────────────────────
# Vide : la dernière version de hashes.txt (signé). Figée (ex. 0.18.5.4) : la somme
# doit alors figurer dans hashes.txt (qui ne liste que la version COURANTE) ou être
# donnée par `monero_sha256` — sans quoi la vérification de signature n'a rien à lire.
monero_version: ""
monero_sha256: ""
monero_hashes_url: "https://www.getmonero.org/downloads/hashes.txt"
monero_gpg_key_url: "https://raw.githubusercontent.com/monero-project/monero/master/utils/gpg_keys/binaryfate.asc"
# Empreinte de la clé de signature de binaryFate (docs.getmonero.org). La clé
# téléchargée n'est acceptée que si ELLE signe hashes.txt.
monero_gpg_fingerprint: "81AC591FE9C4B65C5806AFC3F0AF4D462A0BDF92"
monero_download_base: "https://downloads.getmonero.org/cli"
monero_arch: >-
  {{ {'x86_64': 'linux-x64', 'aarch64': 'linux-armv8', 'armv7l': 'linux-armv7'}.get(ansible_architecture, '') }}

# ── Compte et chemins ──────────────────────────────────────────────────────
# Compte système DÉDIÉ, comme dans le guide officiel : démon exposé sur Internet
# (P2P), aucun besoin d'accès interactif — exception documentée à la règle
# « srvc pilote ce qu'il déploie » (CLAUDE.md § 2, même cas qu'astar-install).
# `srvc` administre le service par sudo (systemctl, journalctl).
monero_user: monero
monero_install_dir: /opt/monero
monero_config_dir: /etc/monero
monero_data_dir: /var/lib/monero
monero_log_dir: /var/log/monero

# ── Réseau ─────────────────────────────────────────────────────────────────
# P2P : PUBLIC par nature (les autres nœuds s'y connectent). Un nœud sans port P2P
# joignable fonctionne, mais ne sert pas le réseau (aucun pair entrant).
monero_p2p_port: 18080
# RPC complet : 127.0.0.1 UNIQUEMENT, sans authentification — il commande le démon
# (arrêt, niveau de journal…). Sert le mineur local et la supervision.
monero_rpc_port: 18081
# Publication ZMQ des blocs (127.0.0.1) : notification instantanée pour XMRig/P2Pool.
monero_zmq_enabled: true
monero_zmq_port: 18083
# Nœud public (`public-node`) : RPC RESTREINT (lecture, pas de commande du démon) offert
# à tous, pour les portefeuilles d'autrui. Décision d'EXPOSITION : fermé par défaut
# et consommateur de ressources (guide officiel). Port 18089.
monero_public_node: false
monero_restricted_rpc_port: 18089
# Pas de UPnP sur un serveur : la redirection se fait à la main (routeur) ou n'existe pas.
monero_no_igd: true
monero_in_peers: 48
monero_out_peers: 12
# `sync-pruned-blocks` (type pruned) : télécharge des blocs déjà élagués au lieu de les
# élaguer soi-même — synchronisation plus rapide, au prix de la confiance dans les pairs.
monero_sync_pruned_blocks: true
