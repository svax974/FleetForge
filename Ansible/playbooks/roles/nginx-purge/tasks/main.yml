---
# Purge Nginx — removes packages and all configuration files.

- name: Stop and disable nginx
  ansible.builtin.systemd:
    name: nginx
    state: stopped
    enabled: no
  ignore_errors: true

- name: Remove nginx packages
  ansible.builtin.apt:
    name:
      - nginx
      - nginx-common
    state: absent
    purge: yes

- name: Remove nginx config and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx
    - /var/log/nginx
