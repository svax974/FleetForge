---
# Déploiement du CODE de la passerelle MCP de FleetForge (app Nest du gabarit
# vx-public, dépôt privé `fleetforge-gateway`) — par les scripts DU DÉPÔT APP
# (scripts/run.sh prod → deploy-full.sh, contexte Docker par SSH), jamais par
# un docker_container/docker_compose Ansible : même partage qu'agenthub-deploy
# et llm-proxy-deploy. Ansible orchestre et fixe ce que l'INVENTAIRE décide :
#   • .env de prod restaurés du coffre (Ansible/.private/apps/<id>), écart
#     local ↔ coffre = arrêt (comme agenthub-deploy) ;
#   • cibles du déploiement (webapp-env-update : BACK_HOSTS, TRUST_PROXY…) ;
#   • ports (NODE_PORT = back_port, FRONT_PORT/VITE_PORT = app_port,
#     DB_PORT = pg_port), PROJECT_NAME, FFG_RUNTIME_UID/GID (compte dédié),
#     FFG_DOCKER_SUBNET, FFG_UPSTREAMS (sans secret) ;
#   • mots de passe des comptes aval `FFG_UPSTREAM_<ID>_{READ,CHECK,RUN}_PASSWORD`,
#     lus au vault du parc (`ff_api_password_<compte>`, tirés par
#     fleetforge-install) — tâches `no_log`, écrits dans back/.env (0600,
#     gitignoré dans le dépôt app) puis rechiffrés dans le coffre du dépôt
#     PRIVÉ du parc. Jamais dans ce dépôt, jamais dans un journal ;
#   • contrôle STATIQUE du compose qui sera déployé
#     (scripts/ffg_isolation_check.py compose) AVANT run.sh : un compose non
#     durci n'est pas déployé.

# Dépôt de l'app sur le POSTE de contrôle, voisin de ce dépôt par défaut
# (aucun chemin absolu de machine). Slash final requis.
ffg_src: "{{ playbook_dir }}/../../../fleetforge-gateway/"
ffg_back_env_file: "back/.env"
ffg_front_env_file: "front/.env"

# Identifiant de l'app dans le coffre (.private/apps/apps.yml).
ffg_app_env_id: fleetforge-gateway
ffg_env_overwrite_local: false

ffg_project_name: fleetforge-gateway
ffg_unix_user: ffgateway
ffg_default_users: { read: ffg_read, check: ffg_check, run: ffg_run }

# `run.sh prod` synchronise d'abord les bibliothèques (update_common.sh : commit
# ET push de vx-public/vx-private). Désactivé ici : déployer l'arbre tel quel.
ffg_update_common: false
ffg_migrate: false

ffg_health_retries: 24
ffg_health_delay: 10

# Compose déployé quand back/.env ne nomme pas COMPOSE_FILE_NAME (défaut du
# gabarit pour Postgres). Le contrôle statique le refusera tant qu'il n'est
# pas durci : le dépôt de l'app doit fournir son compose durci et le nommer.
ffg_default_compose_file: scripts/docker-compose.yml
ffg_hardened_services: [back, back-worker]
