---
# Stop and remove mail relay services — preserves certs, DKIM keys, config

- name: Stop all mail relay services
  ansible.builtin.import_role:
    name: mailrelay-stop

- name: Remove Postfix and OpenDKIM packages
  ansible.builtin.apt:
    name:
      - postfix
      - opendkim
      - opendkim-tools
      - prometheus-postfix-exporter
    state: absent
    purge: no

- name: Remove mailfilter user (home directory preserved)
  ansible.builtin.user:
    name: mailfilter
    state: absent
    remove: no

# La sonde svcprobe part avec le service : laissée en place, elle publierait
# `service_up{service="postfix"} 0` et ServiceDown sonnerait sur un relais
# volontairement désinstallé. Le fichier d'avant le renommage aussi.
- name: Remove the mail relay svcprobe checks
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/svcprobe/checks.d/mailrelay.json
    - /etc/svcprobe/checks.d/mailserver.json

- name: Remove Prometheus target file for postfix on monitor
  ansible.builtin.file:
    path: "/home/{{ remote_username }}/prometheus/prometheus-configs/postfix/{{ inventory_hostname }}.json"
    state: absent
  delegate_to: "{{ prometheus_host }}"
  ignore_errors: yes

- name: Reload Prometheus after target removal
  community.docker.docker_container:
    name: prometheus
    state: started
    restart: yes
  delegate_to: "{{ prometheus_host }}"
  ignore_errors: yes

- name: Remove UFW rules for mail ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: yes
  loop:
    - "465"
    - "587"
  become: yes
  ignore_errors: yes
