---
# Ouvertures ufw permettant à Prometheus de scraper node_exporter.
#
# Extraites de main.yml pour être rejouables seules :
#     - ansible.builtin.include_role:
#         name: exporter-sys-install
#         tasks_from: firewall
# `update-ufw-all.yml` s'en sert pour reposer ces règles après un changement de
# whitelist, ou sur une machine où ufw vient d'être installé (cas de `timescale`
# le 06/08/2026 : les règles avaient été appliquées alors qu'ufw était absent,
# elles étaient donc perdues et activer le pare-feu aurait coupé la supervision).

- name: Allow Prometheus to scrape node_exporter port {{ node_exporter_port }} (remote monitor)
  community.general.ufw:
    rule: allow
    src: "{{ hostvars[prometheus_host]['ansible_host'] }}"
    port: "{{ node_exporter_port }}"
    proto: tcp
    comment: "Prometheus scrape - node_exporter"
  become: yes
  when: ansible_host != hostvars[prometheus_host]['ansible_host']
  ignore_errors: true
  tags: [monitoring]

# Prometheus tourne en conteneur : quand il est sur la même machine, le scrape
# arrive par le bridge Docker et non par l'IP publique. Le test porte sur l'IP
# et non sur le nom d'hôte, plusieurs entrées d'inventaire pouvant partager une
# même machine.
- name: Allow Prometheus Docker bridge to scrape node_exporter port {{ node_exporter_port }} (monitor is local)
  community.general.ufw:
    rule: allow
    src: "172.17.0.0/16"
    port: "{{ node_exporter_port }}"
    proto: tcp
    comment: "Prometheus Docker scrape - node_exporter local"
  become: yes
  when: ansible_host == hostvars[prometheus_host]['ansible_host']
  ignore_errors: true
  tags: [monitoring]
