---
# Retire le conteneur du registre Docker privé. Les images (/opt/docker-repo/data) sont CONSERVÉES : `docker-repo-purge`
# les supprime. Retire aussi la rétention planifiée (un timer sans registre échouerait chaque nuit).

# `registry` : nom d'avant l'épinglage du compose (le conteneur s'appelle `docker-repo-registry` depuis).
- name: Stop and remove the registry container
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop: [docker-repo-registry, registry]
  ignore_errors: true

- name: Stop and remove the retention timer
  ansible.builtin.systemd:
    name: docker-repo-prune.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove the retention unit files and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/docker-repo-prune.timer
    - /etc/systemd/system/docker-repo-prune.service
    - /usr/local/sbin/docker-repo-prune.py
    - "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter/textfile') }}/docker_repo_prune.prom"
  become: true

# ── Supervision ────────────────────────────────────────────────────────────
# Convention `-monitoring` (CLAUDE.md) : c'est le rôle de suppression du
# service qui retire sa sonde. Une sonde laissée en place publierait
# `service_up 0` indéfiniment et ferait sonner `ServiceDown` sur un service
# volontairement désinstallé — l'alerte qu'on apprend à ignorer, et qui finit
# par masquer les vraies.
- name: Remove the svcprobe check
  ansible.builtin.file:
    path: "/etc/svcprobe/checks.d/docker-repo.json"
    state: absent
  become: true
  tags: [monitoring]
