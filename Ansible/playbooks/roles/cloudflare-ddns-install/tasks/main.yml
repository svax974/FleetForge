---
- name: Validate the fleet credentials and initial address
  ansible.builtin.assert:
    that:
      - cloudflare_token | default('') | length > 0
      - docker_repo_pass | default('') | length > 0
      - docker_repo_pull_pass | default('') | length > 0
      - cloudflare_ddns_initial_ipv4 | default('') is match('^[0-9]{1,3}([.][0-9]{1,3}){3}(?!(?s:.))')
      # Liste EXPLICITE des noms que ce client a le droit de réécrire : sans elle, tout enregistrement A
      # portant l'ancienne adresse (voisin, zone entière si `zones: []`) serait modifié.
      - cloudflare_ddns_records is sequence and cloudflare_ddns_records is not string
      - cloudflare_ddns_records is not mapping
      - cloudflare_ddns_records | length > 0
      - cloudflare_ddns_records | reject('match', '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(?!(?s:.))') | list | length == 0
      - cloudflare_ddns_zones is sequence and cloudflare_ddns_zones is not string
      - cloudflare_ddns_zones is not mapping
      - cloudflare_ddns_discovery_urls is sequence and cloudflare_ddns_discovery_urls is not string
      - cloudflare_ddns_discovery_urls is not mapping
      - cloudflare_ddns_discovery_urls | unique | length >= 2
      - cloudflare_ddns_discovery_urls | select('match', '^https://') | list | length == cloudflare_ddns_discovery_urls | length
      - ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: "Token Cloudflare, comptes du registre, IPv4 initiale, liste `cloudflare_ddns_records` non vide et architecture amd64/arm64 requis."
  no_log: true

- name: Find the fleet registry
  ansible.builtin.set_fact:
    ddns_registries: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('ansible_roles', 'defined')
         | selectattr('ansible_roles', 'contains', 'docker-repo') | map(attribute='inventory_hostname') | list }}

- name: Require a single inventory registry
  ansible.builtin.assert:
    that: ddns_registries | length == 1
    fail_msg: "Une entrée ansible_roles: [docker-repo] est requise dans le parc."

- name: Resolve the builder and source tag
  ansible.builtin.set_fact:
    ddns_registry_host: "{{ ddns_registries | first }}"
    ddns_platform: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
    ddns_source_tag: "{{ (lookup('file', role_path ~ '/files/ddns.py') ~ lookup('file', role_path ~ '/files/Dockerfile')) | hash('sha256') }}"

- name: Resolve registry endpoints
  ansible.builtin.set_fact:
    ddns_registry: "{{ hostvars[ddns_registry_host].proxy_hostname | default(hostvars[ddns_registry_host].hostname) }}"
    ddns_build_dir: "/home/{{ remote_username }}/.cache/cloudflare-ddns/{{ ddns_source_tag }}-{{ ddns_platform }}"
    ddns_push_image: "localhost:{{ docker_repo_port }}/cloudflare-ddns:{{ ddns_source_tag }}-{{ ddns_platform }}"

- name: Build and push on the inventory registry host
  delegate_to: "{{ ddns_registry_host }}"
  become: false
  when: not ansible_check_mode
  # Plusieurs cibles peuvent utiliser le même constructeur.
  throttle: 1
  block:
    - name: Create the source directory on the builder
      ansible.builtin.file:
        path: "{{ ddns_build_dir }}"
        state: directory
        mode: '0700'

    - name: Send only the public Docker build context
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ddns_build_dir }}/{{ item }}"
        mode: '0644'
      loop: [Dockerfile, ddns.py]

    - name: Authenticate the builder with the fleet push account
      ansible.builtin.command:
        argv: [docker, login, "localhost:{{ docker_repo_port }}", --username, "{{ docker_repo_user | default('srvc') }}", --password-stdin]
        stdin: "{{ docker_repo_pass }}"
        stdin_add_newline: false
      changed_when: false
      no_log: true

    - name: Build the minimal image for the target architecture
      ansible.builtin.command:
        argv: [docker, build, --platform, "linux/{{ ddns_platform }}", --tag, "{{ ddns_push_image }}", "{{ ddns_build_dir }}"]
      changed_when: true

    - name: Push the image to the fleet registry
      ansible.builtin.command:
        argv: [docker, push, "{{ ddns_push_image }}"]
      changed_when: true

- name: Create the service directories
  ansible.builtin.file:
    path: "{{ cloudflare_ddns_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: ['', config]

- name: Create persistent state owned by the unprivileged container user
  ansible.builtin.file:
    path: "{{ cloudflare_ddns_dir }}/state"
    state: directory
    owner: '65532'
    group: '65532'
    mode: '0700'

- name: Store the fleet token outside the image and process environment
  ansible.builtin.copy:
    content: "{{ cloudflare_token }}"
    dest: "{{ cloudflare_ddns_dir }}/config/cloudflare_token"
    owner: '65532'
    group: '65532'
    mode: '0400'
  no_log: true
  register: ddns_token

- name: Write the nonsecret runtime configuration
  ansible.builtin.copy:
    content: "{{ {'initial_ipv4': cloudflare_ddns_initial_ipv4, 'records': cloudflare_ddns_records, 'zones': cloudflare_ddns_zones, 'discovery_urls': cloudflare_ddns_discovery_urls} | to_nice_json }}"
    dest: "{{ cloudflare_ddns_dir }}/config/config.json"
    owner: root
    group: root
    mode: '0644'
  register: ddns_config

- name: Write the container definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ cloudflare_ddns_dir }}/compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Authenticate the target with the fleet pull account
  ansible.builtin.command:
    argv: [docker, login, "{{ ddns_registry }}", --username, "{{ docker_repo_pull_user | default('srvc-pull') }}", --password-stdin]
    stdin: "{{ docker_repo_pull_pass }}"
    stdin_add_newline: false
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Start the hourly updater
  community.docker.docker_compose_v2:
    project_src: "{{ cloudflare_ddns_dir }}"
    files: [compose.yml]
    project_name: cloudflare-ddns
    state: present
    pull: always
    recreate: "{{ 'always' if (ddns_token is changed or ddns_config is changed) else 'auto' }}"
  when: not ansible_check_mode

# Le cycle tourne dès le démarrage : un jeton sans droits, une zone absente ou une liste de noms vide se
# voient ICI, pas des heures plus tard. `ok` du journal d'état est la seule preuve que Cloudflare a répondu.
- name: Wait for the first reconciliation to succeed
  ansible.builtin.shell:
    cmd: >-
      test -r {{ cloudflare_ddns_dir }}/state/status.json &&
      python3 -c "import json,sys; sys.exit(0 if json.load(open('{{ cloudflare_ddns_dir }}/state/status.json')).get('ok') == 1 else 1)"
    executable: /bin/sh
  register: ddns_first_cycle
  changed_when: false
  until: ddns_first_cycle.rc == 0
  retries: 12
  delay: 5
  when: not ansible_check_mode

- name: Fail with the reason when the updater never succeeds
  ansible.builtin.assert:
    that: ddns_first_cycle.rc | default(1) == 0
    fail_msg: >-
      Le client DDNS n'a pas réussi son premier cycle en 60 s. Lire `docker logs cloudflare-ddns` sur la machine :
      jeton sans « Zone → DNS → Edit » sur {{ cloudflare_ddns_zones | join(', ') }}, zone absente, ou
      `cloudflare_ddns_records` ne correspondant à aucun enregistrement A. Rien n'est réécrit tant que ce cycle
      n'aboutit pas (le DNS reste celui d'avant).
    quiet: true
  when: not ansible_check_mode
