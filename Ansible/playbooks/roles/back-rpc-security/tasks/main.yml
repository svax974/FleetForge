---
# Allow connections from proxies and whitelist
- name: Allow RPC connections on "{{ proxy_back_port }}" from front servers
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ proxy_back_port }}"
  loop: "{{ groups['fronts'] | default([]) }}"

- name: Allow RPC connections on "{{ proxy_back_port }}" from vpns
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ proxy_back_port }}"
  loop: "{{ groups['vpns'] | default([]) }}"

- name: Allow RPC connections on "{{ proxy_back_port }}" from proxies
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ hostvars[item].ansible_host }}"
    port: "{{ proxy_back_port }}"
  loop: "{{ groups['proxies'] | default([]) }}"

- name: Allow connections from whitelist
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    port: "{{ proxy_back_port }}"
  with_items:
    "{{ whitelist }}"
