services:
  registry:
    image: {{ docker_repo_image }}
    container_name: docker-repo-registry
    restart: always
    ports:
    - "{{ docker_repo_port }}:5000"
    volumes:
    - {{ docker_repo_dir }}/data:/var/lib/registry
    - {{ docker_repo_dir }}/config/config.yml:/etc/docker/registry/config.yml
    - {{ docker_repo_dir }}/auth:/auth
