version: 0.1
log:
  fields:
    service: registry
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    # Le point de montage du compose (`<répertoire du registre>/data:/var/lib/registry`). Écrit en `/data`, le registre rangeait
    # tout dans la couche inscriptible du conteneur : images perdues à sa recréation (constaté le 15/11/2026).
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
http:
  addr: :5000
  headers:
    Access-Control-Allow-Origin: ["*"]
    Access-Control-Allow-Methods: ["HEAD", "GET", "OPTIONS", "PUT", "DELETE"]
    Access-Control-Allow-Headers: ["Authorization", "Content-Length", "Content-Type"]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
auth:
  htpasswd:
    realm: basic-realm
    path: /auth/htpasswd