---
# Arrête et retire l'unité systemd --user d'OpenClaw, sa sonde et son
# filtrage ufw. Conserve la configuration, le workspace et le jeton de
# gateway sous {{ openclaw_prefix }} (voir openclaw-purge).

- name: Look up the srvc UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ openclaw_user }}"
    fail_key: false
- name: Set the XDG runtime dir fact
  ansible.builtin.set_fact:
    openclaw_xdg_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd[openclaw_user][1] }}"
  when: (ansible_facts.getent_passwd | default({}))[openclaw_user] | default(none) is not none

- name: Stop and disable the OpenClaw gateway unit
  ansible.builtin.systemd:
    scope: user
    name: openclaw-gateway
    state: stopped
    enabled: false
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ openclaw_xdg_runtime_dir | default('/run/user/0') }}"
  when: openclaw_xdg_runtime_dir is defined
  failed_when: false

- name: Remove the openclaw CLI wrapper and the fleet-ssh command
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /usr/local/bin/openclaw
    - /usr/local/bin/fleet-ssh

- name: Close the OpenClaw port
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ openclaw_port }}"
    from_ip: "{{ item }}"
    delete: true
  loop: "{{ (whitelist | default([]))
            + (groups['proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
            + [openclaw_lan_cidr]
            + openclaw_extra_allowed_cidrs }}"
  become: true
  failed_when: false

- name: Remove the default-deny rule on the OpenClaw port
  community.general.ufw:
    rule: deny
    proto: tcp
    port: "{{ openclaw_port }}"
    delete: true
  become: true
  failed_when: false

# Le fichier de métriques part avec : laissé en place, il serait republié
# par svcprobe tant qu'une sonde le lit, et OpenClawModelProbeStale sonnerait
# sur un service volontairement désinstallé. Le compte d'échecs reste (purge).
- name: Stop and disable the model probe timer
  ansible.builtin.systemd:
    name: openclaw-model-probe.timer
    state: stopped
    enabled: false
  become: true
  failed_when: false
  tags: [monitoring]

- name: Remove the model probe, its units and its metrics
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/openclaw-model-probe.timer
    - /etc/systemd/system/openclaw-model-probe.service
    - "{{ openclaw_modelprobe_bin }}"
    - "{{ openclaw_modelprobe_metric_file }}"
  become: true
  tags: [monitoring]

- name: Reload systemd after removing the model probe units
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  tags: [monitoring]

# La sonde svcprobe elle-même (port 9110) reste : elle est PARTAGÉE avec les
# autres alias de cette machine NAT domestique.
- name: Remove the OpenClaw probe
  ansible.builtin.file:
    path: "{{ svcprobe_checks_dir | default('/etc/svcprobe/checks.d') }}/openclaw.json"
    state: absent
  become: true
  tags: [monitoring]
