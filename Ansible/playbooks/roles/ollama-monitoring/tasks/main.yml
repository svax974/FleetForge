---
# Supervision d'Ollama.

- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Deploy the ollama probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/ollama.json"
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [monitoring]
