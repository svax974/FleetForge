---
# Mineur XMR — XMRig (https://xmrig.com), binaire statique OFFICIEL, vérifié par signature GPG.
#
# Pourquoi XMRig : Monero se mine avec RandomX, un algorithme conçu pour les PROCESSEURS
# (pas de gain notable en GPU), et XMRig en est l'implémentation de référence, avec les
# optimisations qui comptent (pages énormes : « jusqu'à +50 % » selon sa doc, registres MSR).
# Version 6.26.0 (2026-03-28, support de RandomX v2).
#
# ── À lire avant de miner ──────────────────────────────────────────────────
# • RENTABILITÉ : sur un serveur loué ou un ordinateur ordinaire, les gains sont presque
#   toujours inférieurs au coût (électricité ou location). À vérifier sur un calculateur
#   avant de déployer.
# • HÉBERGEUR : le minage est souvent INTERDIT par les conditions d'un VPS/serveur loué
#   (CPU saturé, suspension de compte). À contrôler chez le vôtre.
# • Cette installation n'est PAS furtive : service nommé `xmrig`, processus `xmrig`, rien n'est
#   caché. Elle ne sert qu'à miner sur VOS machines, pour VOTRE adresse.
#
# ── Paramètres OBLIGATOIRES ────────────────────────────────────────────────
# Adresse Monero qui reçoit les gains : adresse PRIMAIRE de 95 caractères commençant par 4
# (une sous-adresse, 8…, est refusée par certains pools). Adresse PUBLIQUE : la clé privée
# (les 25 mots) ne doit JAMAIS figurer ici ni sur ce serveur.
xmrig_wallet: ""
# Mode : `pool` (minage mutualisé : gains réguliers, petits) ou `solo` (vers VOTRE nœud
# monerod synchronisé : un bloc très rare, mais la récompense entière).
xmrig_mode: ""
# Mode pool : `hôte:port` du pool (voir la page « getting started » du pool choisi).
xmrig_pool_url: ""
xmrig_pool_tls: true
# Mode solo : RPC de monerod. Par défaut le nœud local (famille `monero`, 127.0.0.1:18081)
# et sa publication ZMQ (blocs reçus instantanément, 18083).
xmrig_daemon_url: "127.0.0.1:{{ monero_rpc_port | default(18081) }}"
xmrig_daemon_zmq_port: "{{ monero_zmq_port | default(18083) }}"
# Nom de la machine côté pool (champ `pass`).
xmrig_worker: "{{ inventory_hostname | regex_replace('[^A-Za-z0-9_-]', '-') }}"

# ── Version ────────────────────────────────────────────────────────────────
# Vide : dernière version publiée sur GitHub. Figée (ex. 6.26.0) : ce numéro exact.
xmrig_version: ""
xmrig_release_api: "https://api.github.com/repos/xmrig/xmrig/releases"
xmrig_download_base: "https://github.com/xmrig/xmrig/releases/download"
xmrig_gpg_key_url: "https://raw.githubusercontent.com/xmrig/xmrig/master/doc/gpg_keys/xmrig.asc"
# Empreinte de la clé de signature de XMRig (SHA256SUMS.sig).
xmrig_gpg_fingerprint: "9AC4CEA8E66E35A5C7CDDC1B446A53638BE94409"
# L'archive statique officielle pour Linux n'existe qu'en x86_64.
xmrig_required_arch: x86_64

# ── Profil de machine : `-e server=vps|physical` (OBLIGATOIRE) ───────────────
# Choisit d'un coup les réglages adaptés à la machine ; chacun reste forçable séparément par
# son propre `-e xmrig_…=` (la valeur passée l'emporte sur le profil).
#
#   vps       machine virtuelle / louée : pages énormes de 2 Mio (réservées et vérifiées),
#             compactage mémoire avant réservation, 50 % des threads (un hébergeur tolère mal un
#             CPU saturé), service SANS privilège. Ni MSR (inaccessibles dans une VM), ni
#             pages de 1 Gio, ni gouverneur CPU (pilotés par l'hôte).
#   physical  machine à vous : tout ce qui précède, plus registres MSR (+10 à 15 % sur certains
#             CPU Intel/AMD), pages de 1 Gio si le processeur les gère (détecté, repli sinon),
#             gouverneur CPU `performance` le temps du minage (restauré à l'arrêt), pages
#             énormes pour le code JIT, 100 % des threads (le mineur reste en priorité minimale).
#             Le service tourne alors en ROOT (le MSR l'exige).
server: ""
xmrig_server: "{{ server | default('') }}"
xmrig_profiles:
  vps:      { msr: false, onegb: false, threads: 50,  governor: false, jit: false, diff: 10000 }
  physical: { msr: true,  onegb: auto,  threads: 100, governor: true,  jit: true,  diff: 0 }
# Profil effectif ; vide tant que `server` est invalide (validate.yml refuse alors le play).
xmrig_profile: "{{ xmrig_profiles[xmrig_server] | default(xmrig_profiles.vps) }}"

# ── Réglages de minage (valeurs par défaut = celles du profil) ─────────────
# Part des threads utilisée (`max-threads-hint`). Le service tourne en priorité minimale
# (`Nice=19`, ordonnancement `idle`) : il cède la place au reste, mais la RAM (~2,5 Go) et la
# chaleur restent.
xmrig_max_threads_hint: "{{ xmrig_profile.threads }}"
# Difficulté FIXE demandée au pool (mode pool seulement), 0 = celle du pool. Syntaxe
# `<adresse>+<difficulté>` (SupportXMR, nanopool…). Un petit processeur (~150 H/s) reçoit sinon
# une difficulté de 75 000 : une share toutes les 8 minutes, donc un worker affiché « hors ligne »
# par le tableau de bord du pool entre deux shares. 10 000 ≈ une share par minute à 150 H/s ;
# les gains ne changent pas (même travail, partagé en plus de shares).
xmrig_pool_diff: "{{ xmrig_profile.diff | default(0) }}"
# Pourcentage de temps de minage reversé aux développeurs de XMRig (défaut amont : 1).
xmrig_donate_level: 1
# Pages énormes : 1280 pages de 2 Mio par nœud NUMA (doc XMRig) = 2,5 Go réservés.
# 0 : ne rien réserver (hashrate nettement plus bas).
xmrig_hugepages: 1280
# Pages de 1 Gio (profil physical) : `auto` = si le processeur (`pdpe1gb`) et le noyau les gèrent
# et qu'il y a au moins 6 Go de RAM ; `true` = obligatoire (le play échoue sinon) ; `false` = non.
# Le jeu de données RandomX (2080 Mio) en demande 3, réservées au démarrage du service et rendues à l'arrêt.
xmrig_1gb_pages: "{{ xmrig_profile.onegb }}"
xmrig_1gb_pages_count: 3
# Pages énormes pour le code JIT de RandomX (petit gain, sur certains processeurs).
xmrig_hugepages_jit: "{{ xmrig_profile.jit }}"
# Compactage de la mémoire avant la réservation : sur une machine allumée depuis longtemps la
# mémoire est fragmentée et le noyau n'accorde qu'une partie des pages demandées.
xmrig_compact_memory: true
# Gouverneur CPU `performance` pendant le minage (machine physique : sur une VM il n'existe pas).
xmrig_cpu_governor: "{{ xmrig_profile.governor }}"
# Registres MSR (gain de hashrate sur certains CPU Intel/AMD, jusqu'à ~15 %) : exige root et
# le module noyau `msr`, impossible dans une machine virtuelle. XMRig les rétablit à l'arrêt.
xmrig_msr: "{{ xmrig_profile.msr }}"
# `auto`, `fast` (2 Go, rapide) ou `light` (256 Mo, très lent : machines à peu de RAM).
xmrig_randomx_mode: auto

# ── Compte et chemins ──────────────────────────────────────────────────────
# Compte système dédié sans accès interactif (le mineur n'a besoin d'aucun fichier de srvc) ;
# root seulement avec `xmrig_msr` (profil physical) ; les pages de 1 Gio et le gouverneur sont
# posés par une étape `ExecStartPre=+` en root, le mineur lui-même reste sans privilège. Exception documentée à « srvc pilote ce qu'il déploie » :
# srvc administre le service par sudo.
xmrig_user: xmrig
xmrig_install_dir: /opt/xmrig
xmrig_config_dir: /etc/xmrig

# ── API HTTP locale (supervision) ──────────────────────────────────────────
# Lecture seule (`restricted`), 127.0.0.1 UNIQUEMENT, jeton aléatoire tiré UNE fois sur
# l'hôte (/etc/xmrig/api-token, 0600) — jamais regénéré ensuite. Utilisée par xmrig-monitoring.
xmrig_api_port: 18088
