---
# Paramètres obligatoires, contrôlés AVANT tout téléchargement, tous d'un coup, avec des
# lignes de commande complètes en exemple.

- name: List the invalid or missing parameters
  ansible.builtin.set_fact:
    xmrig_problems: >-
      {{ ([] if xmrig_wallet | string is match('^[48][0-9AB][1-9A-HJ-NP-Za-km-z]{93}$') else
           ['xmrig_wallet : manquant ou invalide (« ' ~ (xmrig_wallet | string | truncate(20, True, '…')) ~ ' ») — adresse Monero PUBLIQUE de 95 caractères commençant par 4 (jamais les 25 mots de la clé)'])
       + ([] if xmrig_mode | string in ['pool', 'solo'] else
           ['xmrig_mode : manquant ou inconnu (« ' ~ xmrig_mode ~ ' ») — pool (minage mutualisé) ou solo (vers votre nœud monerod)'])
       + ([] if xmrig_mode != 'pool' or xmrig_pool_url | string is match('^[A-Za-z0-9.-]+:[0-9]{2,5}$') else
           ['xmrig_pool_url : manquant ou invalide (« ' ~ xmrig_pool_url ~ ' ») — hôte:port du pool, sans schéma (pool.exemple.org:443)']) }}

- name: Fail with the list of problems and complete examples
  ansible.builtin.fail:
    msg: |-
      Paramètres du mineur XMR manquants ou invalides :
      {% for problem in xmrig_problems %}
        - {{ problem }}
      {% endfor %}

      Minage en pool (le pool se choisit sur sa page « getting started ») :
        ./play.sh <parc> deploy-xmrig.yml --limit {{ inventory_hostname }} \
          -e xmrig_wallet=<adresse 95 caractères commençant par 4> \
          -e xmrig_mode=pool -e xmrig_pool_url=pool.exemple.org:443

      Minage solo (vers un nœud monerod synchronisé de ce parc ; famille `monero`) :
        ./play.sh <parc> deploy-xmrig.yml --limit {{ inventory_hostname }} \
          -e xmrig_wallet=<adresse 95 caractères commençant par 4> -e xmrig_mode=solo
  when: xmrig_problems | length > 0

- name: Warn about a subaddress
  ansible.builtin.debug:
    msg: >-
      L'adresse commence par 8 : c'est une SOUS-ADRESSE. Certains pools (et P2Pool) ne
      l'acceptent pas et les gains ne seraient alors jamais crédités. Préférer l'adresse primaire (4…).
  when: xmrig_wallet | string is match('^8')
