---
# Mineur XMR : paramètres → contrôles → binaire vérifié → configuration → service.
#
#   ./play.sh <parc> deploy-xmrig.yml --limit <hôte> -e xmrig_wallet=<adresse 4…> \
#       -e xmrig_mode=pool -e xmrig_pool_url=<hôte:port>      # ou -e xmrig_mode=solo
#
# Aucun secret : l'adresse est publique, la clé du portefeuille n'est jamais ici. Le seul
# secret créé est le jeton de l'API locale en lecture seule (/etc/xmrig/api-token, 0600).

- name: Validate the parameters
  ansible.builtin.include_tasks: validate.yml

- name: Check this host can mine
  ansible.builtin.include_tasks: checks.yml

- name: Download and verify the official binary
  ansible.builtin.include_tasks: download.yml

- name: Create the miner system account
  ansible.builtin.user:
    name: "{{ xmrig_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ xmrig_config_dir }}"
    state: directory
    owner: root
    group: "{{ xmrig_user }}"
    mode: "0750"

# Tiré UNE fois : un jeton qui change à chaque rejeu casserait la supervision sans que rien
# ne l'explique. Écrit en 0600 root, dans un fichier à part (le collecteur y lit son jeton).
- name: Create the API token once
  ansible.builtin.shell: "umask 077 && openssl rand -hex 24 > {{ xmrig_config_dir }}/api-token"
  args:
    creates: "{{ xmrig_config_dir }}/api-token"

- name: Restrict the token file
  ansible.builtin.file:
    path: "{{ xmrig_config_dir }}/api-token"
    owner: root
    group: root
    mode: "0600"

- name: Read the API token
  ansible.builtin.slurp:
    src: "{{ xmrig_config_dir }}/api-token"
  register: xmrig_token_raw
  no_log: true

- name: Write the miner configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xmrig_config_dir }}/config.json"
    owner: root
    group: "{{ 'root' if xmrig_msr | bool else xmrig_user }}"
    mode: "0640"
  vars:
    xmrig_api_token: "{{ xmrig_token_raw.content | b64decode | trim }}"
  no_log: true
  notify: restart xmrig

- name: Write the service unit
  ansible.builtin.template:
    src: xmrig.service.j2
    dest: /etc/systemd/system/xmrig.service
    owner: root
    group: root
    mode: "0644"
  notify: restart xmrig

# Une mémoire fragmentée (machine allumée depuis longtemps) ne donne qu'une partie des pages
# demandées : on la compacte AVANT de réserver.
- name: Compact memory before reserving huge pages
  ansible.builtin.shell: sync; echo 1 > /proc/sys/vm/compact_memory
  changed_when: false
  failed_when: false
  when:
    - xmrig_hugepages | int > 0
    - xmrig_compact_memory | bool

# Réservé au noyau : chaque page fait 2 Mio, 1280 pages = 2,5 Go qui ne servent plus à rien d'autre.
- name: Reserve huge pages
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ xmrig_hugepages }}"
    sysctl_file: /etc/sysctl.d/99-xmrig.conf
    sysctl_set: true
    state: present
    reload: true
  when: xmrig_hugepages | int > 0

# Le noyau répond « ok » à sysctl même quand il n'a pu réserver qu'une partie des pages : on relit.
- name: Read back the reserved huge pages
  ansible.builtin.command: awk '/^HugePages_Total:/ {print $2}' /proc/meminfo
  register: xmrig_hp_total
  changed_when: false
  check_mode: false
  when: xmrig_hugepages | int > 0

- name: Warn when the kernel gave fewer huge pages than asked
  ansible.builtin.debug:
    msg: >-
      Pages énormes : {{ xmrig_hp_total.stdout }} réservées sur {{ xmrig_hugepages }} demandées (mémoire
      fragmentée ou insuffisante). Le hashrate sera nettement plus bas. Redémarrer la machine (la
      réservation se fait alors sur une mémoire neuve), ou ajouter `hugepages={{ xmrig_hugepages }}` à la
      ligne de commande du noyau.
  when:
    - xmrig_hugepages | int > 0
    - xmrig_hp_total.stdout | default('0') | int < xmrig_hugepages | int

- name: Load the msr module at boot
  ansible.builtin.copy:
    content: "msr\n"
    dest: /etc/modules-load.d/xmrig-msr.conf
    owner: root
    group: root
    mode: "0644"
  when: xmrig_msr | bool

# Réglages root du service (gouverneur CPU, pages de 1 Gio, module msr).
- name: Deploy the root tuning helper
  ansible.builtin.copy:
    src: xmrig-tune.sh
    dest: "{{ xmrig_config_dir }}/xmrig-tune.sh"
    owner: root
    group: root
    mode: "0755"
  notify: restart xmrig

# Ce que CE déploiement a demandé : le collecteur de supervision le compare à ce que XMRig a
# réellement obtenu (pages géantes, MSR). Aucune donnée sensible.
- name: Record the tuning that was asked for
  ansible.builtin.copy:
    content: "{{ xmrig_tuning | to_nice_json }}\n"
    dest: "{{ xmrig_config_dir }}/tuning.json"
    owner: root
    group: root
    mode: "0644"
  vars:
    xmrig_tuning:
      server: "{{ xmrig_server }}"
      hugepages: "{{ xmrig_hugepages | int > 0 }}"
      hugepages_1gb: "{{ xmrig_1gb_pages | bool }}"
      msr: "{{ xmrig_msr | bool }}"
      cpu_governor: "{{ xmrig_cpu_governor | bool }}"
  notify: restart xmrig

- name: Enable and start the miner
  ansible.builtin.systemd:
    name: xmrig
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

# L'API répond dès que le mineur est lancé, avant la première connexion au pool.
- name: Wait for the miner API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ xmrig_api_port }}/2/summary"
    headers:
      Authorization: "Bearer {{ xmrig_token_raw.content | b64decode | trim }}"
    return_content: true
    timeout: 10
  register: xmrig_summary
  retries: 12
  delay: 5
  until: xmrig_summary.status | default(0) == 200
  changed_when: false
  no_log: true

# Ce que XMRig a RÉELLEMENT obtenu (jamais ce qu'on a demandé) : pages énormes et MSR. Lues sur
# `/2/backends` une fois les threads démarrés (l'initialisation du jeu de données prend quelques
# secondes). Avertissement seulement : le mineur tourne de toute façon, mais plus lentement.
- name: Read what the miner obtained (huge pages, MSR)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ xmrig_api_port }}/2/backends"
    headers:
      Authorization: "Bearer {{ xmrig_token_raw.content | b64decode | trim }}"
    return_content: true
    timeout: 10
  register: xmrig_backends
  retries: 18
  delay: 5
  until: >-
    xmrig_backends.status | default(0) == 200
    and (xmrig_backends.json | default([]) | selectattr('type', 'equalto', 'cpu') | map(attribute='hugepages') | first | default([0, 0]) | last | default(0)) | int > 0
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Interpret the obtained tuning
  ansible.builtin.set_fact:
    xmrig_cpu_backend: "{{ xmrig_backends.json | default([]) | selectattr('type', 'equalto', 'cpu') | first | default({}) }}"

- name: Report huge pages and MSR
  ansible.builtin.debug:
    msg:
      - >-
        Pages énormes : {{ xmrig_cpu_backend.hugepages[0] | default('?') }}/{{ xmrig_cpu_backend.hugepages[1] | default('?') }}
        {{ '— OK' if xmrig_cpu_backend.hugepages is defined and xmrig_cpu_backend.hugepages[0] == xmrig_cpu_backend.hugepages[1] and xmrig_cpu_backend.hugepages[1] > 0
           else '— INCOMPLET : hashrate réduit (voir l’avertissement de réservation, ou redémarrer la machine)' if xmrig_hugepages | int > 0
           else '(désactivées)' }}
      - >-
        MSR : {{ 'appliqués' if xmrig_cpu_backend.msr | default(false) else 'non appliqués' }}
        {{ '— ATTENDUS mais absents : voir `journalctl -u xmrig | grep -i msr` (Secure Boot / lockdown, module msr)' if xmrig_msr | bool and not xmrig_cpu_backend.msr | default(false) else '' }}
  when: xmrig_cpu_backend | length > 0

- name: Warn when the miner never reported its backends
  ansible.builtin.debug:
    msg: "Le mineur n'a pas rapporté son état (/2/backends) : pages énormes et MSR non vérifiés — journalctl -u xmrig."
  when: xmrig_cpu_backend | length == 0

- name: Summary
  ansible.builtin.debug:
    msg:
      - "Profil {{ xmrig_server }} : {{ xmrig_max_threads_hint }} % des threads, pages 2 Mio {{ 'oui' if xmrig_hugepages | int > 0 else 'non' }}, pages 1 Gio {{ 'oui' if xmrig_1gb_pages | bool else 'non' }}, MSR {{ 'oui' if xmrig_msr | bool else 'non' }}, gouverneur performance {{ 'oui' if xmrig_cpu_governor | bool else 'non' }}."
      - "XMRig {{ xmrig_summary.json.version | default(xmrig_resolved_version) }} lancé sur {{ inventory_hostname }} ({{ xmrig_mode }}, {{ xmrig_max_threads_hint }} % des threads, donation {{ xmrig_donate_level }} %)."
      - "Gains crédités à {{ xmrig_wallet | truncate(12, True, '…') }}… ({{ 'pool ' ~ xmrig_pool_url if xmrig_mode == 'pool' else 'nœud ' ~ xmrig_daemon_url }})."
      - "Hashrate et partages : journalctl -u xmrig -f (une ligne par minute), ou la supervision."
      - "Un gain n'apparaît qu'après le seuil de paiement du pool (solo : à la découverte d'un bloc)."
