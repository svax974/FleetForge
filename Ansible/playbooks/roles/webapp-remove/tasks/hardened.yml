---
# Retrait de ce que le profil durci (`webapp_hardening`) a posé sur la machine : pare-feu DOCKER-USER propre à l'app
# (unité, script, règles portant son étiquette), règles ufw de ses ports, compte Unix dédié. Les comptes et secrets
# d'un AMONT (ex. `ffg_*` de FleetForge) vivent sur l'entrée de l'amont : rappel affiché, rien n'y est touché.

- name: Check the names that select what is removed
  ansible.builtin.assert:
    that:
      - wa_project is match('^[a-z][a-z0-9-]{0,40}(?!(?s:.))')
      - wa_h_user is match('^[a-z_][a-z0-9_-]{0,30}(?!(?s:.))')
      - wa_h_user != remote_username
      - wa_h_firewall_script is match('^/[A-Za-z0-9._/-]+(?!(?s:.))')
    quiet: true

- name: Stop and disable the firewall unit of the application
  ansible.builtin.systemd:
    name: "{{ wa_h_firewall_unit }}"
    state: stopped
    enabled: false
  become: true
  failed_when: false

# Par leur COMMENTAIRE (`<étiquette>:`), sans se fier à l'inventaire courant.
- name: Remove the rules of the application from DOCKER-USER and INPUT
  ansible.builtin.shell: |
    set -euo pipefail
    for pair in iptables:DOCKER-USER ip6tables:DOCKER-USER iptables:INPUT; do
      cmd="${pair%%:*}"; chain="${pair#*:}"
      "${cmd}" -w -L "${chain}" -n >/dev/null 2>&1 || continue
      while true; do
        n=$("${cmd}" -w -L "${chain}" --line-numbers -n | awk -v t={{ ('/* ' ~ wa_h_tag ~ ':') | quote }} 'index($0, t) && !done {print $1; done=1}')
        [ -z "${n}" ] && break
        "${cmd}" -w -D "${chain}" "${n}"
        echo "removed ${cmd} ${chain} ${n}"
      done
    done
  args:
    executable: /bin/bash
  become: true
  register: wa_h_rules_removed
  changed_when: "'removed' in wa_h_rules_removed.stdout"

# Le profil ne pose aucune règle ufw : rien à retirer. Une règle d'une autre origine sur ces ports est SIGNALÉE.
- name: Look for ufw rules on the application ports
  ansible.builtin.include_role:
    name: webapp-security
    tasks_from: ufw-audit
    apply:
      tags: [always]

- name: Report ufw rules left on the application ports
  ansible.builtin.debug:
    msg: "Règles ufw d'une autre origine sur les ports de {{ wa_project }}, laissées en place : {{ wa_ufw_foreign | join(' | ') }}"
  when: wa_ufw_foreign | length > 0

- name: Remove the firewall unit and script of the application
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ wa_h_firewall_unit }}.service"
    - "/etc/systemd/system/nginx.service.d/{{ wa_h_firewall_unit }}.conf"
    - "{{ wa_h_firewall_script }}"
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# Seulement le compte que CE déploiement a créé (marqueur GECOS posé par webapp-install/account.yml) : un compte
# existant d'une autre origine ne se supprime jamais.
- name: Read the dedicated account
  ansible.builtin.command:
    argv: [getent, passwd, "{{ wa_h_user }}"]
  register: wa_h_account
  changed_when: false
  check_mode: false
  failed_when: false

- name: Remove the dedicated account and group (only when this deployment created them)
  when: ((wa_h_account.stdout | default('')).split(':')[4] | default('')) == 'webapp-hardening ' ~ wa_project
  block:
    - name: Remove the dedicated account
      ansible.builtin.user:
        name: "{{ wa_h_user }}"
        state: absent
      become: true

    - name: Remove the dedicated group
      ansible.builtin.group:
        name: "{{ wa_h_user }}"
        state: absent
      become: true

- name: Report an account left in place
  ansible.builtin.debug:
    msg: >-
      Compte {{ wa_h_user }} LAISSÉ en place : {{ 'absent' if wa_h_account.rc != 0 else 'il ne porte pas le marqueur de ce
      déploiement (webapp-hardening ' ~ wa_project ~ ')' }}.
  when: ((wa_h_account.stdout | default('')).split(':')[4] | default('')) != 'webapp-hardening ' ~ wa_project

- name: Remind what the profile does not remove
  ansible.builtin.debug:
    msg: >-
      {{ wa_project }} : pare-feu, règles ufw et compte {{ wa_h_user }} retirés. Restent : les secrets ou comptes d'un
      amont (`webapp_env_from_vault`, ex. comptes `ffg_*` dans `ff_api_accounts` de l'entrée FleetForge, et l'app dans
      son `access_linked`).
