---
# Installe la sauvegarde de `{{ pgbak_db }}` vers `{{ pgbak_dest_host }}`.
# Calqué sur `timescaledb-backup-install`, sans branche locale (voir
# defaults/main.yml) : la destination est toujours une machine distincte, où
# la source écrit par le compte dédié et la passerelle `backup-gate`
# (rôle backup-setup), jamais par `srvc`.

# `-e` l'emporte sur l'inventaire : `pgbak_dir` désigne le script lancé par cron.
- name: Check the backup directory is a plain absolute path
  ansible.builtin.assert:
    that: pgbak_dir is match('^/[A-Za-z0-9._/-]*$')
    fail_msg: "pgbak_dir : chemin absolu sans espace ni métacaractère ({{ pgbak_dir }})."
    quiet: true
  tags: [always]

- name: Fail if the backup destination is not in the inventory
  ansible.builtin.fail:
    msg: >-
      L'hôte de destination `{{ pgbak_dest_host }}` est absent de
      l'inventaire. Ajoute-le au groupe `backups` avant de jouer ce rôle.
  when: pgbak_dest_host not in hostvars
  tags: [always]

# Le nom de la sauvegarde est aussi le répertoire de la destination et l'argument
# de la commande forcée ; le destinataire, s'il est posé, est une clé publique age.
- name: Check the backup name, the retention and the encryption recipient
  ansible.builtin.assert:
    that:
      - pgbak_name is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - pgbak_db is match('^[A-Za-z0-9_][A-Za-z0-9_-]{0,62}$')
      - pgbak_keep | string is match('^[0-9]{1,4}$') and pgbak_keep | int >= 1
      - pgbak_encrypt_recipient | length == 0 or pgbak_encrypt_recipient is match('^age1[02-9ac-hj-np-z]{58}$')
    fail_msg: >-
      pgbak_name (minuscules, chiffres, tirets), pgbak_db (lettres, chiffres, _ et -), pgbak_keep (>= 1) ou
      pgbak_encrypt_recipient (vide, ou destinataire age « age1… » de 62 caractères) invalide.
    quiet: true
  tags: [always]

- name: Report the resolved backup destination
  ansible.builtin.debug:
    msg: >-
      Sauvegarde de {{ pgbak_db }} → {{ pgbak_dest_user }}@{{ pgbak_dest_addr }}:{{ pgbak_dest_port }}
      ({{ pgbak_dest_dir }}), {{ 'chiffrée (age)' if pgbak_encrypt_recipient | length > 0 else 'NON chiffrée' }}.
  tags: [retarget]

# ── Chiffrement ──────────────────────────────────────────────────────────────
# Paquet officiel de la distribution (Ubuntu 22.04+, Debian 12+), jamais un binaire
# téléchargé. Introuvable : échec explicite, aucun dump ne part en clair.
- name: Install age (encrypted dumps)
  when: pgbak_encrypt_recipient | length > 0
  tags: [retarget]
  block:
    - name: Install the age package
      ansible.builtin.apt:
        name: age
        state: present
        update_cache: true
        cache_valid_time: 3600
      become: true
  rescue:
    - name: Refuse to back up without encryption
      ansible.builtin.fail:
        msg: >-
          Le paquet `age` est introuvable sur {{ ansible_distribution | default('?') }}
          {{ ansible_distribution_version | default('?') }} (paquet officiel : Ubuntu 22.04+, Debian 12+).
          Le chiffrement est demandé (`pgbak_encrypt_recipient`) : aucun dump ne partira en clair. Mettre la
          machine à jour, ou retirer le destinataire en connaissance de cause (jamais pour la passerelle MCP).

# ── Clé, destination (compte dédié, répertoire, clé liée, pare-feu), known_hosts ──

# Tag `retarget` : la clé publique est lue par les tâches de destination, qui le portent.
- name: Generate the dedicated backup SSH key
  community.crypto.openssh_keypair:
    path: "{{ pgbak_ssh_key_path }}"
    type: ed25519
    comment: "{{ inventory_hostname }}-{{ pgbak_name }}-backup"
  register: pgbak_key
  tags: [retarget]

- name: Prepare the destination for this source
  ansible.builtin.import_role:
    name: backup-setup
    tasks_from: source
  vars:
    bk_dest_host: "{{ pgbak_dest_host }}"
    bk_dest_port: "{{ pgbak_dest_port }}"
    bk_name: "{{ pgbak_name }}"
    bk_keep: "{{ pgbak_keep }}"
    bk_pubkey: "{{ pgbak_key.public_key }}"
    bk_comment: "{{ inventory_hostname }}-{{ pgbak_name }}-backup"
  tags: [retarget]

# Clé d'hôte relevée depuis le poste qui joue Ansible (premier contact) : vide =
# destination injoignable sur ce port, refusée plutôt qu'une entrée vide.
- name: Scan the destination host key
  ansible.builtin.set_fact:
    pgbak_dest_hostkey: "{{ lookup('pipe', 'ssh-keyscan -p ' ~ (pgbak_dest_port | string | quote) ~ ' -t ed25519 ' ~ (pgbak_dest_addr | quote) ~ ' 2>/dev/null | grep -v \"^#\" || true') }}"
  tags: [retarget]

- name: Check the destination answered on its SSH port
  ansible.builtin.assert:
    that: pgbak_dest_hostkey | length > 0
    fail_msg: >-
      Aucune clé d'hôte relevée sur {{ pgbak_dest_addr }}:{{ pgbak_dest_port }} depuis ce poste
      (`ssh-keyscan`) : destination éteinte, port non redirigé (NAT) ou filtré.
    quiet: true
  tags: [retarget]

- name: Refresh the destination host key in known_hosts
  ansible.builtin.known_hosts:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    name: "{{ pgbak_known_host }}"
    key: "{{ pgbak_dest_hostkey }}"
    state: present
  tags: [retarget]

# ── Métriques ───────────────────────────────────────────────────────────────

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: '0755'
  become: true

# ── Répertoire local des scripts ────────────────────────────────────────────

- name: Create the local backup script directory
  ansible.builtin.file:
    path: "{{ pgbak_dir }}"
    state: directory
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: '0750'

# ── Scripts ─────────────────────────────────────────────────────────────────

- name: Deploy the PostgreSQL backup script
  ansible.builtin.template:
    src: postgres-backup.sh.j2
    dest: "{{ pgbak_dir }}/postgres-backup.sh"
    mode: '0750'
  tags: [retarget]

- name: Deploy the PostgreSQL restore script
  ansible.builtin.template:
    src: postgres-restore.sh.j2
    dest: "{{ pgbak_dir }}/postgres-restore.sh"
    mode: '0750'
  tags: [retarget]

- name: Schedule the PostgreSQL backup
  ansible.builtin.cron:
    name: "{{ pgbak_name }} postgres backup"
    hour: "{{ pgbak_cron_hour }}"
    minute: "{{ pgbak_cron_minute | default('0') }}"
    job: "{{ pgbak_dir | quote }}/postgres-backup.sh >> {{ pgbak_dir | quote }}/backup.log 2>&1"

- name: Rotate the backup log
  ansible.builtin.copy:
    dest: "/etc/logrotate.d/postgres-backup-{{ pgbak_name }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ pgbak_dir }}/backup.log {
          weekly
          rotate 8
          compress
          missingok
          notifempty
          copytruncate
      }
  become: true
