---
freellm_install_dir: "/home/{{ remote_username }}/freellmapi"
freellm_image: "ghcr.io/tashfeenahmed/freellmapi:latest"
# Dupliqué depuis freellm-remove/defaults plutôt que hérité via
# `include_role` (qui n'expose pas les defaults sans `public: true`) : ce
# rôle a besoin de cette variable dans SES PROPRES tâches (retrait du
# CNAME) — même motif qu'agenthub-purge.
freellm_hostname: "freellm.{{ domain_name }}"
