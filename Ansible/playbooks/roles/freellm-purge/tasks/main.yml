---
# Supprime FreeLLMAPI ET ses données : conteneur, image, volume nommé,
# configuration et clé de chiffrement. Reprend freellm-remove puis efface ce
# que celui-ci préserve.

- name: Remove the service, its probe and its firewall rules
  ansible.builtin.include_role:
    name: freellm-remove

- name: Remove the FreeLLMAPI image
  community.docker.docker_image_remove:
    name: "{{ freellm_image }}"
  become: true
  ignore_errors: true

# Le volume nommé (freellmapi-data) contient les clés fournisseur chiffrées au
# repos par ENCRYPTION_KEY : le compose (et donc `down -v`) doit encore exister
# au moment de cette tâche, d'où l'ordre — AVANT de retirer le répertoire qui
# le porte.
- name: Remove the named data volume
  ansible.builtin.command: docker compose down -v
  args:
    chdir: "{{ freellm_install_dir }}"
  become: true
  ignore_errors: true

- name: Remove the FreeLLMAPI directory (.env, encryption key, configuration)
  ansible.builtin.file:
    path: "{{ freellm_install_dir }}"
    state: absent
  become: true

# ── DNS : retirer le CNAME public ───────────────────────────────────────────
# Symétrique de la publication (freellm-install inclut
# cloudflare-dns-update/tasks/cnames.yml) : le nom public disparaît avec le
# service, sinon il continuerait de résoudre vers le front des proxies et le
# vhost retiré y renverrait un 502.
# ATTENTION : l'entrée d'inventaire porteuse de `proxy_hostname` doit être
# retirée EN MÊME TEMPS (ou son attribut supprimé) — sinon la prochaine
# synchronisation (update-cloudflare-dns.yml) republierait le record.
- name: Remove the FreeLLMAPI CNAME
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_token }}"
    zone: "{{ domain_name }}"
    record: "{{ freellm_hostname }}"
    type: CNAME
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: cloudflare_token | default('') | length > 0
