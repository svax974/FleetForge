---
# Empreinte bcrypt du mot de passe d'accès à Prometheus, pour web.yml.
# Partagé par prometheus-install (papanglabs) et monitoring-install (web3c) :
#   include_role: { name: prometheus-install, tasks_from: web_password }
#   vars: { prometheus_web_file: <chemin de web.yml> }
#
# Deux défauts corrigés ensemble (21/10/2026) :
#   • le clair passait en ARGUMENT de `python3 -c` — `ps` rend les arguments
#     lisibles par tous les comptes de la machine pendant le calcul. Il passe
#     désormais par l'entrée standard (même règle que fleetforge-install) ;
#   • un sel neuf à chaque passage réécrivait web.yml à chaque déploiement,
#     donc un redémarrage de Prometheus à chaque fois sur papanglabs. L'empreinte
#     en place est conservée tant qu'elle correspond au mot de passe : elle ne
#     change que si le mot de passe change.
#
# `check_mode: false` : la tâche ne modifie rien, et sautée en --check elle
# rendrait une empreinte vide — le diff annoncerait alors à tort un web.yml
# sans mot de passe.
- name: Hash the Prometheus password, keeping the current hash when it still matches
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import re, sys, bcrypt
        password = sys.stdin.buffer.read()
        try:
            current = re.search(r"'(\$2[aby]\$[^']+)'", open(sys.argv[1]).read()).group(1).encode()
        except (OSError, AttributeError):
            current = None
        if current and bcrypt.checkpw(password, current):
            print(current.decode())
        else:
            print(bcrypt.hashpw(password, bcrypt.gensalt(rounds=12)).decode())
      - "{{ prometheus_web_file }}"
    stdin: "{{ prometheus_pass }}"
    stdin_add_newline: false
  become: true
  register: _prometheus_pass_bcrypt
  changed_when: false
  check_mode: false
  no_log: true

- name: Set the Prometheus password hash fact
  ansible.builtin.set_fact:
    prometheus_pass_hash: "{{ _prometheus_pass_bcrypt.stdout }}"
  no_log: true
