---
# Remove VPN routing rules added by vpn-routes-install.

- name: Flush iptables VPN forwarding rules
  # `argv:` : chaque commande est une liste, jamais une ligne qu'un `-e item=…` remplacerait.
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [iptables, -F, FORWARD]
    - [iptables, -t, nat, -F, POSTROUTING]
  ignore_errors: true

- name: Disable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    state: present
    reload: yes
