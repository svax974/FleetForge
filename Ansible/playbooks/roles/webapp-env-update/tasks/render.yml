---
# Rend les .env de l'application (poste de contrôle) à partir de l'INVENTAIRE et du COFFRE, pour qu'un simple
# `./scripts/run.sh prod` redéploie ensuite sans rien d'autre. Chemin du déploiement générique
# (`deploy-webapp.yml`) ; `main.yml` reste celui des rôles `*-deploy` historiques.
#
# Séquence (un seul sens : inventaire + coffre → .env → run.sh) :
#   1. garde .env ↔ coffre : un .env local qui DIFFÈRE du coffre arrête (le restaurer l'écraserait) ;
#   2. restauration depuis le coffre (`app-env.sh restore`) ;
#   3. amorçage : .env absent → copie de .env.example (premier déploiement d'une app neuve) ;
#   4. secrets : adoptés du .env ou tirés, mis au coffre (webapp-secrets-setup) ;
#   5. front Cloudflare Pages : projet, domaine, DNS (cloudflare-pages-setup) ;
#   6. rendu des clés POSSÉDÉES par Ansible (toujours réécrites) et des clés « si absentes » (jamais écrasées) ;
#   7. sauvegarde dans le coffre (`app-env.sh save`) — le dépôt privé du parc est à committer.
# Attribut d'hôte optionnel `webapp_back_env_fixed` { CLÉ: valeur } : clés de back/.env que l'inventaire fixe à chaque rendu
# (section 0, puis écriture après les clés injectées) ; absent, rien ne change.
#
# Clés POSSÉDÉES : cibles du déploiement, ports, mode, registre, secrets. Clés « SI ABSENTES » : identité et choix
# d'exploitation qu'une app déjà en production porte (PROJECT_NAME fixe les noms de projet compose, donc les VOLUMES ;
# CLIENT_ORIGINS est une liste d'exploitation) : posées au premier déploiement, jamais modifiées ensuite. Profil DURCI
# (`webapp_hardening`) : PROJECT_NAME est POSSÉDÉ (= `wa_project`) — le pare-feu, le contrôle à l'exécution et la garde
# de la base nomment conteneurs et volumes d'après `wa_project` ; un PROJECT_NAME divergent les ferait viser à côté
# (quatrième revue). Un renommage passe alors par la garde de la base (marqueur d'état, webapp-deploy/db-migration.yml).
# Les clés propres à l'application ne sont JAMAIS touchées. Rien n'est affiché : ni valeur, ni secret.
#
# Prérequis : les faits `wa_*` (webapp-setup, tasks_from: facts).

- name: Check the facts are there
  ansible.builtin.assert:
    that: wa_src is defined and wa_project is defined
    fail_msg: "webapp-setup (tasks_from: facts) doit précéder ce rendu."
    quiet: true

# ── 0. Clés fixées par l'inventaire (`webapp_back_env_fixed`) : refus AVANT tout effet ─────────────────────────────
# Attribut d'hôte OPTIONNEL { CLÉ: valeur } : ces clés de back/.env sont réécrites à CHAQUE rendu, comme BACK_HOSTS ou
# TRUST_PROXY (une ligne `CLÉ="valeur"` remplacée, ou ajoutée). Cas d'origine (17/11/2026) : `DB_SCHEMA_MODE=` vide dans le
# .env de la passerelle ; en production le gabarit ne fait alors rien au démarrage et l'app plante sur une base vide.
# Absent : rien de ce qui suit ne change (listes vides). Refus, par NOM seulement — jamais une valeur — pour : un attribut qui
# n'est pas un dictionnaire, un nom hors `[A-Z_][A-Z0-9_]*`, une clé de `wa_back_env_forbidden` (liste unique de
# webapp-setup/defaults : cibles, relais, secret Redis, compose, déploiement… que le profil durci refuse aussi), une valeur
# qui n'est pas un texte ou un entier, vide, hors grammaire de back/.env durci (ASCII imprimable sans `"` `$` `` ` `` `\`, ni
# `{{` `{%` `{#` que `lineinfile` évaluerait). Les clés que ce rôle pose lui-même sont refusées plus bas (une source par clé).
- name: Check the back keys fixed by the inventory (names only)
  ansible.builtin.set_fact:
    wa_back_fixed_bad: >-
      {%- set out = [] -%}
      {%- if webapp_back_env_fixed is defined and webapp_back_env_fixed is not mapping -%}
      {%- set _ = out.append('webapp_back_env_fixed (un dictionnaire CLÉ: valeur est attendu)') -%}
      {%- else -%}
      {%- for k, v in (webapp_back_env_fixed | default({})).items() -%}
      {%- set s = v | string -%}
      {%- set label = k | string | regex_replace('[^ -~]', '?') | truncate(64, true, '...') -%}
      {%- set ns = namespace(prefixed=false) -%}
      {%- if k is string -%}{%- for p in wa_back_env_forbidden.prefixes if k.startswith(p) -%}{%- set ns.prefixed = true -%}{%- endfor -%}{%- endif -%}
      {%- if not (k is string and k is match('^[A-Z_][A-Z0-9_]{0,63}(?!(?s:.))')) -%}
      {%- set _ = out.append(label ~ ' (nom hors grammaire)') -%}
      {%- elif ns.prefixed or k in wa_back_env_forbidden.names or k in wa_back_env_forbidden.empty_only -%}
      {%- set _ = out.append(label ~ ' (clé interdite : posée ailleurs ou refusée par le déploiement)') -%}
      {%- elif not (v is string or (v is integer and v is not boolean)) -%}
      {%- set _ = out.append(label ~ ' (valeur non scalaire : un texte ou un entier est attendu)') -%}
      {%- elif not (s is match('^[ -~]+(?!(?s:.))')) or s is search('["$`]') or ('\\' in s) or s is search('[{][{%#]') -%}
      {%- set _ = out.append(label ~ ' (valeur vide ou hors grammaire)') -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ out }}
  no_log: true

- name: Fail on a back key the inventory cannot fix
  ansible.builtin.assert:
    that: wa_back_fixed_bad | length == 0
    fail_msg: >-
      `webapp_back_env_fixed` de {{ inventory_hostname }} refusé : {{ wa_back_fixed_bad | join(' ; ') }}. Attendu :
      { CLÉ: valeur } — nom [A-Z_][A-Z0-9_]*, hors cibles du déploiement, relais de confiance, secrets et clés déjà rendues ;
      valeur texte ou entier, non vide, ASCII imprimable sans guillemet double, `$`, accent grave ni antislash.
    quiet: true

# ── 1-2. Coffre ────────────────────────────────────────────────────────────
- name: Check for the vaulted env files of the application
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../.private/apps/{{ wa_app_id }}"
  delegate_to: localhost
  become: false
  register: wa_env_vault_dir

- name: Compare the local env files with the vault
  ansible.builtin.command:
    cmd: ./app-env.sh status {{ wa_app_id | quote }} {{ ('--env=' ~ wa_env) | quote if wa_env != 'prod' else '' }}
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  become: false
  register: wa_env_status
  changed_when: false
  check_mode: false
  when: wa_env_vault_dir.stat.isdir | default(false)

- name: Fail when a local env file differs from the vault
  vars:
    wa_env_differing: "{{ wa_env_status.stdout_lines | select('search', ' differs *(?!(?s:.))') | map('split') | map(attribute=1) | list }}"
  ansible.builtin.fail:
    msg: >-
      Le .env {{ wa_env_differing | join(' et ') }} de {{ wa_src }} diffère de la copie du coffre : le restaurer
      écraserait le fichier local. Si le fichier local fait foi : `./app-env.sh save {{ wa_app_id }}{{ ' --env=' ~ wa_env if wa_env != 'prod' else '' }}`, puis
      relancer. Si c'est le coffre : `./app-env.sh restore {{ wa_app_id }}{{ ' --env=' ~ wa_env if wa_env != 'prod' else '' }}` (garde le local en .env.bak-<date>).
      Passer outre : `-e webapp_env_overwrite_local=true`.
  when:
    - wa_env_vault_dir.stat.isdir | default(false)
    - wa_env_differing | length > 0
    - not (webapp_env_overwrite_local | default(false) | bool)

- name: Restore the env files from the vault
  ansible.builtin.command:
    cmd: ./app-env.sh restore {{ wa_app_id | quote }} {{ ('--env=' ~ wa_env) | quote if wa_env != 'prod' else '' }}
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  become: false
  register: wa_env_restore
  changed_when: "'restored from' in wa_env_restore.stdout"
  when: wa_env_vault_dir.stat.isdir | default(false)

# ── 3. Amorçage d'une app neuve ────────────────────────────────────────────
# `creates` : rien si le .env existe ; `removes` : rien si l'exemple n'existe pas.
- name: Start the env files from the examples when they do not exist yet
  ansible.builtin.command:
    cmd: install -m 0600 -- {{ (wa_src ~ item.example) | quote }} {{ (wa_src ~ item.file) | quote }}
    creates: "{{ wa_src }}{{ item.file }}"
    removes: "{{ wa_src }}{{ item.example }}"
  loop:
    - { file: "{{ wa_back_env_file }}", example: "{{ webapp_back_env_example | default('back/.env.example') }}" }
    - { file: "{{ wa_front_env_file }}", example: front/.env.example }
  loop_control:
    label: "{{ item.file }}"
  delegate_to: localhost
  become: false

# ── 4-5. Secrets et front Pages ────────────────────────────────────────────
- name: Put the secrets of the application in the vault
  ansible.builtin.include_role:
    name: webapp-secrets-setup

- name: Prepare the Cloudflare Pages front (project, branch, domain)
  ansible.builtin.include_role:
    name: cloudflare-pages-setup
  vars:
    cfpages_env_file: "{{ wa_src }}{{ wa_front_env_file }}"
    cfpages_project: "{{ wa_project | lower | replace('_', '-') }}"
    cfpages_domain: "{{ wa_project | lower | replace('_', '-') ~ '.' ~ domain_name }}"
  when:
    - wa_front_mode == 'pages'
    - webapp_pages_managed | default(true) | bool

# ── 6. Rendu ───────────────────────────────────────────────────────────────
- name: Read the env files as they are now
  ansible.builtin.set_fact:
    wa_env_back_text: "{{ lookup('ansible.builtin.file', wa_src ~ wa_back_env_file, errors='ignore') | default('', true) }}"
    wa_env_front_text: "{{ lookup('ansible.builtin.file', wa_src ~ wa_front_env_file, errors='ignore') | default('', true) }}"
  no_log: true
  delegate_to: localhost
  become: false

# ── 6a. Clés optionnelles : profil durci, coffre, play appelant ────────────
# Rien de cette section ne s'applique à une entrée sans `webapp_hardening` ni `webapp_env_from_vault` ni fait
# `wa_env_injected` : ses clés voulues restent exactement celles d'avant.
- name: Read the uid and gid of the dedicated account (hardened application)
  ansible.builtin.command:
    argv: [getent, passwd, "{{ wa_h_user }}"]
  register: wa_h_passwd
  changed_when: false
  check_mode: false
  failed_when: wa_h_passwd.rc != 0 and not ansible_check_mode
  when: webapp_hardening is defined

- name: Work out the keys of the hardening profile
  vars:
    _f: "{{ (wa_h_passwd.stdout | default('')).split(':') }}"
  ansible.builtin.set_fact:
    wa_h_env:
      HARDEN_RUNTIME_UID: "{{ _f[2] if _f | length > 3 else '' }}"
      HARDEN_RUNTIME_GID: "{{ _f[3] if _f | length > 3 else '' }}"
      HARDEN_SUBNET: "{{ wa_h_subnet }}"
      HARDEN_FRONT_IP: "{{ wa_h_front_ip }}"
      HARDEN_BACK_LB_IP: "{{ wa_h_back_lb_ip }}"
      HARDEN_BACK_LB_REALIP: "{{ wa_h_realip }}"
      # deploy-full.sh lit COMPOSE_FILE_NAME dans back/.env : le fichier contrôlé avant run.sh est celui déployé.
      COMPOSE_FILE_NAME: "{{ wa_h_compose_file }}"
      # Liste EXPLICITE (relais admis, front et back-lb) : jamais loopback/linklocal/uniquelocal génériques.
      TRUST_PROXY: "{{ wa_h_trust_proxy }}"
  when: webapp_hardening is defined

- name: Check the keys of the hardening profile
  ansible.builtin.assert:
    that:
      - ansible_check_mode or (wa_h_env.HARDEN_RUNTIME_UID is match('^[1-9][0-9]*(?!(?s:.))') and wa_h_env.HARDEN_RUNTIME_GID is match('^[1-9][0-9]*(?!(?s:.))'))
      - wa_h_env.HARDEN_BACK_LB_REALIP is match('^(set_real_ip_from [0-9.]+;[ ]?)+(?!(?s:.))')
      - wa_h_env.TRUST_PROXY is match('^[0-9.,]+(?!(?s:.))')
    fail_msg: "uid/gid du compte {{ wa_h_user }} (non root), relais de confiance (IPv4) : hors grammaire."
    quiet: true
  when: webapp_hardening is defined

# Secrets qui ne sont PAS ceux de l'app (mots de passe d'un amont, tirés par son propre rôle) : lus au coffre du parc,
# jamais affichés. Un absent ou malformé n'est PAS remplacé par un vide : seuls les NOMS des clés fautives sortent.
- name: Read the secrets the inventory maps from the vault
  ansible.builtin.set_fact:
    wa_env_vault_values: >-
      {%- set out = {} -%}
      {%- for k, v in (webapp_env_from_vault | default({})).items() -%}
      {%- set _ = out.update({k: (lookup('ansible.builtin.vars', v, default='') | string | trim)}) -%}
      {%- endfor -%}
      {{ out }}
    wa_env_vault_bad: >-
      {%- set out = [] -%}
      {%- for k, v in (webapp_env_from_vault | default({})).items() -%}
      {%- if not (k is match('^[A-Z][A-Z0-9_]{0,63}(?!(?s:.))')) or not ((lookup('ansible.builtin.vars', v, default='') | string | trim) is match('^[A-Za-z0-9._~+/=-]{16,512}(?!(?s:.))')) -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
  when: webapp_env_from_vault is defined

- name: Fail when a mapped secret is missing or malformed (names only)
  ansible.builtin.assert:
    that: wa_env_vault_bad | default([]) | length == 0
    fail_msg: >-
      Secret absent ou malformé au coffre du parc pour {{ wa_env_vault_bad | default([]) | join(', ') }}
      (`webapp_env_from_vault` de {{ inventory_hostname }} : CLÉ_DU_ENV → variable du coffre, 16 à 512 caractères
      [A-Za-z0-9._~+/=-]). Déployer d'abord le service qui les tire, puis committer le group_vars du parc.
    quiet: true
  when: webapp_env_from_vault is defined

- name: Work out the desired keys
  vars:
    # `CLÉ=valeur` : valeur entre guillemets ou non, commentaire exclu ; « présente » = non vide.
    wa_read_tpl: "(?m)^[ ]*{key}=[\"']?([^\"'\\n#]*)"
    wa_hosts_now: "{{ (wa_env_back_text | regex_findall(wa_read_tpl | replace('{key}', 'BACK_HOSTS')) | last | default('')).split(',') | map('trim') | map('regex_replace', '^.*@', '') | reject('equalto', '') | list }}"
    wa_hosts_known: "{{ [ansible_host, hostname | default('')] | select | list }}"
    # Valeur déjà en usage conservée tant qu'elle désigne CETTE machine (IP ou nom) : l'écrire en IP là où un nom était
    # utilisé changerait le nom de projet compose (<projet>-back-<hôte>), donc les conteneurs et les volumes.
    wa_back_hosts_value: "{{ (wa_env_back_text | regex_findall(wa_read_tpl | replace('{key}', 'BACK_HOSTS')) | last | trim) if (wa_hosts_now | length > 0 and wa_hosts_now | difference(wa_hosts_known) | length == 0) else ansible_host }}"
    wa_origins: "{{ (['https://' ~ proxy_hostname] if proxy_hostname is defined else []) + (['https://' ~ (wa_project | lower | replace('_', '-')) ~ '.' ~ domain_name] if wa_front_mode == 'pages' else []) }}"
    wa_api_url_pages: "https://{{ (wa_project | lower | replace('_', '-')) }}-back.{{ domain_name }}/api/v1"
    wa_db_name: "{{ wa_project | lower | regex_replace('[^a-z0-9]', '') }}"
  ansible.builtin.set_fact:
    wa_env_back_owned: >-
      {{ {
        'BACK_HOSTS': wa_back_hosts_value,
        'REMOTE_USER': remote_username,
        'REMOTE_SSH_PORT': ansible_port | default(22),
        'NODE_PORT': wa_back_port,
        'VITE_PORT': wa_front_port,
        'REDIS_PORT': wa_redis_port,
        'APP_ENV': wa_env,
        'BACK_REPLICAS': wa_replicas,
        'BACK_WORKER': wa_worker,
        'TRUST_PROXY': webapp_env_trust_proxy,
        'INFRA_BIND': '0.0.0.0' if wa_db_exposed else '127.0.0.1',
        'DEPLOY_MANAGE_UFW': '0'
      } | combine({'DB_PORT': wa_db_port} if wa_db_selfhosted else {})
        | combine({'FRONT_HOSTS': ansible_host} if wa_front_mode == 'container' else {})
        | combine({'COMPOSE_FILE_NAME': webapp_compose_file} if webapp_compose_file | default('') | length > 0 else {})
        | combine({'FRONT_BIND': webapp_publish_bind, 'BACK_LB_BIND': webapp_publish_bind} if webapp_publish_bind | default('') | length > 0 else {})
        | combine({
            'DEPLOY_REGISTRY': wa_registry,
            'DEPLOY_REGISTRY_PUSH': wa_registry_push,
            'DEPLOY_BUILDER': 'remote',
            'DEPLOY_BUILDER_HOST': wa_builder_host,
            'DEPLOY_BUILDER_SSH_PORT': wa_builder_ssh_port
          } if wa_registry_on | bool else {})
        | combine(wa_secret_env | default({}))
        | combine(wa_h_env | default({}))
        | combine(wa_env_vault_values | default({}))
        | combine({'PROJECT_NAME': wa_project} if webapp_hardening is defined else {}) }}
    wa_env_back_absent: >-
      {{ {
        'PROJECT_NAME': wa_project,
        'REMOTE_CONTEXT_NAME': wa_project,
        'DB_ENGINE': webapp_db_engine,
        'CLIENT_ORIGINS': wa_origins | join(','),
        'DB_USER': wa_db_name,
        'DB_NAME': wa_db_name
      } | combine({'SSH_KEY_FILE': webapp_ssh_key_file} if webapp_ssh_key_file | default('') | length > 0 else {})
        | combine({'ADMIN_WALLET': webapp_admin_wallet} if webapp_admin_wallet | default('') | length > 0 else {}) }}
    wa_env_front_owned: >-
      {{ {'VITE_PORT': wa_front_port}
         | combine({'VITE_API_URL': wa_api_url_pages} if (wa_front_mode == 'pages' and (webapp_pages_managed | default(true) | bool)) else {})
         | combine({'PROJECT_NAME': wa_project} if webapp_hardening is defined else {}) }}
    wa_env_front_absent: >-
      {{ {'PROJECT_NAME': wa_project}
         | combine({'VITE_API_URL': '/api/v1'} if wa_front_mode == 'container' else {}) }}
    # Variables de déploiement qui n'existent plus (mode historique, ou ancien nom) : retirées si présentes.
    wa_env_back_removed: "{{ ['REMOTE_HOST', 'BACK_REMOTE_HOST', 'FRONT_REMOTE_HOST'] + ([] if wa_registry_on | bool else ['DEPLOY_REGISTRY', 'DEPLOY_REGISTRY_PUSH', 'DEPLOY_BUILDER', 'DEPLOY_BUILDER_HOST', 'DEPLOY_BUILDER_SSH_PORT']) + (['FRONT_HOSTS'] if wa_front_mode == 'pages' else []) }}"
  no_log: true

# Clés fixées par l'inventaire : refus d'une clé que ce rôle écrit ou retire déjà (possédées, « si absentes », retirées,
# injectées par le play appelant, secrets du coffre : UNE source par clé) et d'une clé présente PLUSIEURS fois dans le fichier
# (`lineinfile` n'en remplacerait qu'une et le back/.env durci refuse les doublons) ; puis, par clé, la ligne `CLÉ="valeur"`
# est à écrire si le fichier ne la porte pas EXACTEMENT (absente, vide, autre valeur, apostrophes, `export`). Noms seulement.
- name: Work out the fixed back keys to write
  ansible.builtin.set_fact:
    wa_back_fixed_problems: >-
      {%- set out = [] -%}
      {%- set managed = wa_env_back_owned.keys() | list + wa_env_back_absent.keys() | list + wa_env_back_removed + (wa_env_injected | default({})).keys() | list + (webapp_env_from_vault | default({})).keys() | list -%}
      {%- for k in (webapp_back_env_fixed | default({})).keys() -%}
      {%- if k in managed -%}
      {%- set _ = out.append(k ~ ' (déjà rendue par Ansible : une seule source par clé)') -%}
      {%- elif (wa_env_back_text | regex_findall('(?m)^[ ]*(?:export[ ]+)?' ~ (k | regex_escape) ~ '=') | length) > 1 -%}
      {%- set _ = out.append(k ~ ' (présente plusieurs fois dans le fichier)') -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    wa_back_fixed_todo: >-
      {%- set out = {} -%}
      {%- for k, v in (webapp_back_env_fixed | default({})).items() -%}
      {%- set lines = wa_env_back_text | regex_findall('(?m)^([ ]*(?:export[ ]+)?' ~ (k | regex_escape) ~ '=.*)$') -%}
      {%- if (lines | length) == 0 or (lines | last) != (k ~ '="' ~ (v | string) ~ '"') -%}{%- set _ = out.update({k: v | string}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: Fail on a fixed back key written elsewhere or present twice in the file
  ansible.builtin.assert:
    that: wa_back_fixed_problems | length == 0
    fail_msg: >-
      `webapp_back_env_fixed` de {{ inventory_hostname }} : {{ wa_back_fixed_problems | join(' ; ') }} ({{ wa_src }}{{ wa_back_env_file }}).
      Une clé a UNE source : retirer la clé de `webapp_back_env_fixed`, ou ne garder qu'une ligne dans le fichier
      (rien n'a été écrit).
    quiet: true

- name: Keep only the keys that change
  vars:
    wa_read_tpl: "(?m)^[ ]*{key}=[\"']?([^\"'\\n#]*)"
    wa_back_now: "{{ wa_env_back_text }}"
    wa_front_now: "{{ wa_env_front_text }}"
  ansible.builtin.set_fact:
    wa_back_todo: >-
      {%- set out = {} -%}
      {%- for k, v in wa_env_back_owned.items() -%}
      {%- if (wa_back_now | regex_findall(wa_read_tpl | replace('{key}', k)) | last | default('') | trim) != (v | string) -%}{%- set _ = out.update({k: v}) -%}{%- endif -%}
      {%- endfor -%}
      {%- for k, v in wa_env_back_absent.items() -%}
      {%- set cur = (wa_back_now | regex_findall(wa_read_tpl | replace('{key}', k)) | last | default('') | trim) -%}
      {%- if cur == '' or (cur | regex_findall('example[.](com|org)|[.]invalid') | length > 0) -%}{%- set _ = out.update({k: v}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    wa_front_todo: >-
      {%- set out = {} -%}
      {%- for k, v in wa_env_front_owned.items() -%}
      {%- if (wa_front_now | regex_findall(wa_read_tpl | replace('{key}', k)) | last | default('') | trim) != (v | string) -%}{%- set _ = out.update({k: v}) -%}{%- endif -%}
      {%- endfor -%}
      {%- for k, v in wa_env_front_absent.items() -%}
      {%- set cur = (wa_front_now | regex_findall(wa_read_tpl | replace('{key}', k)) | last | default('') | trim) -%}
      {%- if cur == '' or (cur | regex_findall('example[.](com|org)|[.]invalid') | length > 0) -%}{%- set _ = out.update({k: v}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: Write the back env keys that change
  ansible.builtin.lineinfile:
    path: "{{ wa_src }}{{ wa_back_env_file }}"
    regexp: '^[ ]*{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
    # En `--check`, un .env neuf n'existe pas encore (l'amorçage est une commande) : simuler la création.
    create: "{{ ansible_check_mode }}"
  loop: "{{ wa_back_todo | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  diff: false
  register: wa_back_written
  # Les valeurs sont des secrets (clés de chiffrement, mots de passe) : `label` ne masque pas `item` dès `-v`.
  # Les NOMS écrits sortent du rapport final (« Report what was rendered »).
  no_log: true

- name: Write the front env keys that change
  ansible.builtin.lineinfile:
    path: "{{ wa_src }}{{ wa_front_env_file }}"
    regexp: '^[ ]*{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
    # En `--check`, un .env neuf n'existe pas encore (l'amorçage est une commande) : simuler la création.
    create: "{{ ansible_check_mode }}"
  loop: "{{ wa_front_todo | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  diff: false
  register: wa_front_written
  # Dérivé du front/.env lu (qui peut porter CLOUDFLARE_API_TOKEN) : par prudence, comme le back.
  no_log: true

# Clés NON secrètes posées par un play appelant (fait `wa_env_injected`, ex. FFG_UPSTREAMS du play passerelle de
# deploy-fleetforge.yml) : valeurs qui peuvent porter des guillemets doubles (JSON), écrites entre apostrophes —
# lues telles quelles par `source` et par l'env_file de compose. Ni apostrophe, ni fin de ligne, ni `$`.
- name: Check the keys injected by the calling play
  ansible.builtin.assert:
    that:
      - wa_env_injected is mapping
      - wa_env_injected.keys() | reject('match', '^[A-Z][A-Z0-9_]{0,63}(?!(?s:.))') | list | length == 0
      - wa_env_injected.values() | map('string') | select('search', "['$\\n\\\\]") | list | length == 0
    fail_msg: "`wa_env_injected` : noms en MAJUSCULES, valeurs sans apostrophe, `$`, antislash ni fin de ligne."
    quiet: true
  when: wa_env_injected is defined

- name: Write the keys injected by the calling play
  ansible.builtin.lineinfile:
    path: "{{ wa_src }}{{ wa_back_env_file }}"
    regexp: '^[ ]*{{ item.key }}='
    line: "{{ item.key }}='{{ item.value }}'"
    create: "{{ ansible_check_mode }}"
  loop: "{{ wa_env_injected | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  diff: false
  register: wa_back_injected
  when: wa_env_injected is defined

# Clés fixées par l'inventaire (`webapp_back_env_fixed`) : `CLÉ="valeur"` (grammaire stricte de hardened.yml), la ligne unique de
# la clé remplacée ou ajoutée ; seules les clés dont la ligne diffère sont écrites (second passage : rien). Valeurs masquées.
- name: Write the back keys fixed by the inventory
  ansible.builtin.lineinfile:
    path: "{{ wa_src }}{{ wa_back_env_file }}"
    regexp: '^[ ]*(export[ ]+)?{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
    # En `--check`, un .env neuf n'existe pas encore (l'amorçage est une commande) : simuler la création.
    create: "{{ ansible_check_mode }}"
  loop: "{{ wa_back_fixed_todo | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  become: false
  diff: false
  register: wa_back_fixed_written
  no_log: true

- name: Remove the deployment keys that no longer apply
  ansible.builtin.lineinfile:
    path: "{{ wa_src }}{{ wa_back_env_file }}"
    regexp: '^[ ]*{{ item }}='
    state: absent
  loop: "{{ wa_env_back_removed }}"
  delegate_to: localhost
  become: false
  diff: false
  register: wa_back_removed

# Cohérence du mode front : seul VITE_API_URL en https:// fait basculer deploy-full.sh sur Cloudflare Pages.
- name: Read VITE_API_URL back from the front env file
  vars:
    wa_read_tpl: "(?m)^[ ]*{key}=[\"']?([^\"'\\n#]*)"
  ansible.builtin.set_fact:
    wa_vite_api_url: "{{ lookup('ansible.builtin.file', wa_src ~ wa_front_env_file, errors='ignore') | default('', true) | regex_findall(wa_read_tpl | replace('{key}', 'VITE_API_URL')) | last | default('') | trim }}"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Check that the front mode matches VITE_API_URL
  ansible.builtin.assert:
    that: (wa_vite_api_url | default('')).startswith('https://') == (wa_front_mode == 'pages')
    fail_msg: >-
      {{ inventory_hostname }} : le front est `{{ wa_front_mode }}` mais VITE_API_URL de
      {{ wa_src }}{{ wa_front_env_file }} {{ 'commence' if (wa_vite_api_url | default('')).startswith('https://') else 'ne commence pas' }}
      par https:// : deploy-full.sh ne publie sur Cloudflare Pages QUE pour une URL https://.
    quiet: true
  when: not ansible_check_mode

# ── Clés manuelles manquantes : seulement leurs NOMS ───────────────────────
- name: Find the manual keys with no value
  vars:
    wa_read_tpl: "(?m)^[ ]*{key}=[\"']?([^\"'\\n#]*)"
    wa_modules_text: "{{ lookup('ansible.builtin.file', wa_src ~ 'shared-modules.json', errors='ignore') | default('', true) }}"
    wa_has_user_module: "{{ (wa_modules_text | regex_search('\"reactcommon\"[^]]*\"user\"')) is not none }}"
    wa_front_after: "{{ lookup('ansible.builtin.file', wa_src ~ wa_front_env_file, errors='ignore') | default('', true) }}"
    wa_manual_keys: "{{ webapp_front_manual_keys | default(['VITE_REOWN_PROJECT_ID'] if wa_has_user_module | bool else []) }}"
  ansible.builtin.set_fact:
    wa_missing_manual: >-
      {%- set out = [] -%}
      {#- Le template accepte `WALLET_CONNECT_ID` à la place de `VITE_REOWN_PROJECT_ID` (le premier l'emporte s'ils sont tous deux posés). -#}
      {%- set aliases = {'VITE_REOWN_PROJECT_ID': ['WALLET_CONNECT_ID']} -%}
      {%- for k in wa_manual_keys -%}
      {%- set ns = namespace(found=false) -%}
      {%- for kk in [k] + aliases.get(k, []) -%}
      {%- if (wa_front_after | regex_findall(wa_read_tpl | replace('{key}', kk)) | last | default('') | trim) != '' -%}{%- set ns.found = true -%}{%- endif -%}
      {%- endfor -%}
      {%- if not ns.found -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  become: false
  no_log: true

# `webapp_env_required` : clés que back/.env doit porter NON VIDES après le rendu (une app qui démarre sans elles
# échouerait plus tard, et moins clairement). Noms seulement.
- name: Find the required back keys with no value (names only)
  vars:
    wa_read_tpl: "(?m)^[ ]*(export[ ]+)?{key}=[\"']?([^\"'\\n#]*)"
    wa_back_after: "{{ lookup('ansible.builtin.file', wa_src ~ wa_back_env_file, errors='ignore') | default('', true) }}"
  ansible.builtin.set_fact:
    wa_missing_required: >-
      {%- set out = [] -%}
      {%- for k in webapp_env_required | default([]) -%}
      {%- set found = wa_back_after | regex_findall(wa_read_tpl | replace('{key}', k)) | last | default(['', '']) -%}
      {%- if (found[1] | default('') | trim) == '' -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - webapp_env_required is defined
    - not ansible_check_mode

# Clés fixées par l'inventaire : relues APRÈS l'écriture, chacune doit figurer UNE fois, telle que voulue (noms seulement).
- name: Read back the fixed back keys (names only)
  ansible.builtin.set_fact:
    wa_back_fixed_unmet: >-
      {%- set out = [] -%}
      {%- set text = lookup('ansible.builtin.file', wa_src ~ wa_back_env_file, errors='ignore') | default('', true) -%}
      {%- for k, v in (webapp_back_env_fixed | default({})).items() -%}
      {%- set lines = text | regex_findall('(?m)^([ ]*(?:export[ ]+)?' ~ (k | regex_escape) ~ '=.*)$') -%}
      {%- if lines != [k ~ '="' ~ (v | string) ~ '"'] -%}{%- set _ = out.append(k) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  delegate_to: localhost
  become: false
  no_log: true
  when: not ansible_check_mode

# ── 7. Coffre ──────────────────────────────────────────────────────────────
- name: Save the env files into the vault
  ansible.builtin.command:
    cmd: ./app-env.sh save {{ wa_app_id | quote }} {{ ('--env=' ~ wa_env) | quote if wa_env != 'prod' else '' }}
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  become: false
  register: wa_env_saved
  changed_when: "'saved to' in wa_env_saved.stdout"
  # Même sans copie préalable dans le coffre : c'est cette sauvegarde qui la crée (app neuve ou migrée).
  when:
    - not ansible_check_mode
    - (wa_back_written is changed) or (wa_front_written is changed) or (wa_back_removed is changed) or (wa_back_injected | default({}) is changed) or (wa_back_fixed_written is changed) or not (wa_env_vault_dir.stat.isdir | default(false))

# Noms seulement : jamais une valeur.
- name: Report what was rendered
  ansible.builtin.debug:
    msg: >-
      .env de {{ wa_app_id }} ({{ wa_env }}) : {{ wa_back_todo | length }} clé(s) back et {{ wa_front_todo | length }}
      clé(s) front à jour ({{ (wa_back_todo.keys() | list + wa_front_todo.keys() | list) | join(', ') or '—' }}).
      {{ 'Coffre mis à jour : à committer dans le dépôt privé du parc.' if wa_env_saved is changed else '' }}

# Noms seulement : jamais une valeur. Rien si l'inventaire ne fixe aucune clé, ou si le fichier les porte déjà.
- name: Report the back keys fixed by the inventory
  ansible.builtin.debug:
    msg: >-
      {{ wa_src }}{{ wa_back_env_file }} : {{ wa_back_fixed_todo | length }} clé(s) fixée(s) par l'inventaire
      ({{ wa_back_fixed_todo.keys() | list | join(', ') }}){{ ' — simulation (--check), rien n est écrit' if ansible_check_mode else '' }}.
  when: wa_back_fixed_todo | length > 0

# ── 8. Refus, APRÈS la sauvegarde ──────────────────────────────────────────
# Les `.env` rendus sont déjà dans le coffre : un refus ici ne laisse plus le fichier local et le coffre divergents, ce qui
# bloquerait le passage suivant (garde `.env` ↔ coffre).
- name: Fail when a manual key is missing
  ansible.builtin.fail:
    msg: >-
      {{ wa_src }}{{ wa_front_env_file }} : à renseigner à la main (une seule fois, jamais devinable) :
      {{ wa_missing_manual | join(', ') }}. Les poser dans le .env puis `./app-env.sh save {{ wa_app_id }}` —
      ou `-e webapp_allow_missing_manual=true` pour déployer sans (l'app démarrera dégradée).
  when:
    - wa_missing_manual | length > 0
    - not (webapp_allow_missing_manual | default(false) | bool)
    - not ansible_check_mode

- name: Fail when a fixed back key is not in the file exactly as wanted
  ansible.builtin.assert:
    that: wa_back_fixed_unmet | default([]) | length == 0
    fail_msg: >-
      {{ wa_src }}{{ wa_back_env_file }} : {{ wa_back_fixed_unmet | default([]) | join(', ') }} absente(s), en double ou
      différente(s) après l'écriture (`webapp_back_env_fixed` de {{ inventory_hostname }}).
    quiet: true
  when: not ansible_check_mode

- name: Fail when a required back key is empty
  ansible.builtin.assert:
    that: wa_missing_required | default([]) | length == 0
    fail_msg: >-
      {{ wa_src }}{{ wa_back_env_file }} : {{ wa_missing_required | default([]) | join(', ') }} vide(s) ou absente(s)
      (`webapp_env_required` de {{ inventory_hostname }}).
    quiet: true
  when:
    - webapp_env_required is defined
    - not ansible_check_mode
