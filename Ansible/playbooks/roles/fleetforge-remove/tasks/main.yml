---
- name: Stop and disable the services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - fleetforge
    - fleetforge-agent
  become: true
  failed_when: false

- name: Remove the systemd units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - fleetforge.service
    - fleetforge-agent.service
  become: true

# La clé dédiée et sa passphrase partent avec le service : les laisser sur une
# machine qui ne porte plus l'application, c'est laisser de quoi administrer
# tout le parc sur un serveur que plus personne ne surveille.
#
# La contrepartie côté parc n'est PAS immédiate : la clé publique reste dans
# les `authorized_keys` de chaque hôte jusqu'au prochain passage de
# security-ssh (`setup-server.yml`, `exclusive: true`), qui lit le dossier
# keys/<parc>/control/ — vidé ci-dessous. Elle y est inoffensive entre-temps :
# le `from="…"` la limite à cette machine, qui n'a plus la privée.
- name: Remove the dedicated key and its passphrase
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ ff_user }}/.ssh/{{ ff_remote_key_name }}"
    - "/home/{{ ff_user }}/.ssh/{{ ff_remote_key_name }}.pub"
    - "{{ ff_passphrase_file }}"
    - "{{ ff_dir }}/askpass.sh"
    - "{{ ff_dir }}/agent-load-key.sh"
  become: true

- name: Withdraw the dedicated public key from the parc control keys
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../keys/{{ parc_name }}/control/{{ ff_control_key_name }}"
    state: absent
  delegate_to: localhost
  become: false
  when: parc_name is defined

- name: Remove the vault password
  ansible.builtin.file:
    path: "/home/{{ ff_user }}/.config/fleetforge/vault-pass"
    state: absent
  become: true

# Clé de diagnostic lecture seule : la privée part avec le service ; la
# publique quitte keys/<parc>/readonly/, dossier qui fait foi — le prochain
# readonly-user-install la révoque sur le parc (`exclusive: true`).
- name: Remove the read-only diagnostics key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ff_ro_key }}"
    - "{{ ff_ro_key }}.pub"
    - "{{ ff_ro_known_hosts }}"
  become: true

- name: Withdraw the read-only diagnostics public key from the parc keys
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../keys/{{ parc_name }}/readonly/{{ ff_ro_key_name }}"
    state: absent
  delegate_to: localhost
  become: false
  when: parc_name is defined

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Remove the built binaries
  ansible.builtin.file:
    path: "{{ ff_dir }}/target"
    state: absent
  become: true

# La cible Prometheus part avec le service, comme l'exige la convention : une
# cible laissée en place publie `up=0` indéfiniment et fait sonner une alerte
# sur un service VOLONTAIREMENT désinstallé — le bruit qui finit par rendre la
# supervision illisible.
- name: Remove the Prometheus target
  ansible.builtin.file:
    path: "/home/{{ remote_username }}/prometheus/prometheus-configs/{{ ff_job }}/{{ inventory_hostname }}.json"
    state: absent
  delegate_to: "{{ prometheus_host }}"
  become: true
  when: prometheus_host is defined and prometheus_host in hostvars

# Toutes les règles de ce service partent, quelles que soient leurs sources : le
# retrait ne se fie pas à l'inventaire COURANT (whitelist, proxies, Prometheus),
# qui peut avoir changé depuis le déploiement — une IP déjà sortie de la
# whitelist serait sinon restée ouverte. Ouverture du scrape comprise, y compris
# celle du bridge Docker quand Prometheus est co-localisé.
- name: Close the application port
  ansible.builtin.include_role:
    name: fleetforge-security
    tasks_from: prune
  vars:
    ff_prune_owner: "{{ ff_ufw_owner_service }}"
    ff_prune_keep: []

- name: Close the Prometheus scrape
  ansible.builtin.include_role:
    name: fleetforge-security
    tasks_from: prune
  vars:
    ff_prune_owner: "{{ ff_ufw_owner_scrape }}"
    ff_prune_keep: []
