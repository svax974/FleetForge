# Fichier : pgpool.conf

# Configuration générale
listen_addresses = '*'  # Permet les connexions externes
port = {{ postgres_port }}             # Port d'écoute de Pgpool
socket_dir = '/var/run/pgpool'

# Backends
backend_hostname0 = '{{ hostvars["dbmaster"].ansible_host }}'
backend_port0 = {{ postgres_port }}
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'

backend_hostname1 = '{{ hostvars["dbbackup"].ansible_host }}'
backend_port1 = {{ postgres_port }}
backend_weight1 = 1
backend_data_directory1 = '/var/lib/postgresql/data'
backend_flag1 = 'ALLOW_TO_FAILOVER'

# Mode de réplication
replication_mode = off
master_slave_mode = on
master_slave_sub_mode = 'stream'
load_balance_mode = on
black_function_list = 'nextval,setval,sequence,pg_advisory_xact_lock'
primary_routing_query = 'write'

# Utilisateur de gestion
sr_check_user = '{{ postgres_replication_user }}'
sr_check_password = '{{ postgres_replication_pw }}'

# Session
enable_pool_hba = on
pool_passwd = '/etc/pgpool/pool_passwd'

# Gestion de la santé des backends
health_check_period = 10
health_check_timeout = 5
health_check_user = '{{ postgres_replication_user }}'
health_check_password = '{{ postgres_replication_pw }}'

# Failover et basculement
#failover_command = 'echo "Failover triggered for backend %d"'
failover_command = '/etc/pgpool/failover.sh %d %H %P %R'
failover_when_quorum_exists = off