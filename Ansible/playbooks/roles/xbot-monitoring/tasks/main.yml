---
# Supervision de xbot (pas de base de données).
#
# Convention `<service>-monitoring` (CLAUDE.md) : le rôle dépose une SONDE
# déclarative pour `svcprobe`, qui expose `service_up{service="xbot"}`.

- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Deploy the xbot probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/xbot.json"
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [monitoring]

- name: Verify the probe answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: xbot_probe
  retries: 6
  delay: 5
  until: xbot_probe.status is defined and xbot_probe.status == 200
  changed_when: false
  tags: [monitoring]

- name: Fail when the probe reports the service down
  ansible.builtin.fail:
    msg: >-
      La sonde répond mais annonce `service_up{service="xbot"} 0` alors que le
      déploiement vient de réussir : la sonde est mal écrite ou les conteneurs
      {{ xbotm_front_container }}/{{ xbotm_back_container }} ne tournent pas.
  when: >-
    'service_up{service="xbot"} 0' in (xbot_probe.content | default(''))
  tags: [monitoring]
