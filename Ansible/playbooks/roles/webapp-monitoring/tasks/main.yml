---
# Supervision d'une application WebAppTemplate (CLAUDE.md, obligation `-monitoring`) : une sonde déclarative pour
# `svcprobe` (port 9110), qui expose `service_up{service="<projet>"}` et `service_check_up{service,check}`. Aucun
# redémarrage : svcprobe relit son répertoire de sondes à chaque scrape. La cible Prometheus et l'ouverture du scrape
# sont celles de svcprobe-install (un exporter par HÔTE, partagé par tous les services de la machine).
#
# Les alertes sont celles du groupe générique `services` (ServiceDown sur service_up == 0, ServiceCheckFailing sur une
# sonde secondaire à 0 alors que le service répond) : une règle par app serait un doublon, et pas de règle = sonde muette.
#
# Sonde principale : la santé de l'API par le chemin RÉEL du vhost (via le front en mode conteneur, via back-lb en mode
# Pages). Sondes secondaires = ce qui distingue un état DÉGRADÉ : front servi, back-lb direct (relais du front cassé,
# back sain), Postgres, Redis — chacune avec son conteneur, nommé par le compose du template (`${PROJECT_NAME}_postgres`).

- name: Work out the facts of the application
  ansible.builtin.include_role:
    name: webapp-setup
    tasks_from: facts
  when: wa_project is not defined
  tags: [monitoring]

- name: Describe the checks of the application
  vars:
    wa_health_container: "http://127.0.0.1:{{ wa_front_port }}/api/v1/health"
    wa_health_pages: "http://127.0.0.1:{{ wa_back_port }}/api/v1/health"
  ansible.builtin.set_fact:
    wa_health_url: "{{ wa_health_pages if wa_front_mode == 'pages' else wa_health_container }}"
    wa_checks: >-
      {{ ([{'name': 'front', 'kind': 'http', 'url': 'http://127.0.0.1:' ~ wa_front_port ~ '/', 'status': [200, 301, 302], 'timeout': 10}]
           if wa_front_mode == 'container' else [])
         + [{'name': 'back_lb_health', 'kind': 'http', 'url': 'http://127.0.0.1:' ~ wa_back_port ~ '/api/v1/health', 'status': [200], 'timeout': 10}]
         + ([{'name': 'postgres', 'kind': 'docker', 'container': wa_project ~ '_postgres'}] if wa_db_selfhosted | bool else [])
         + [{'name': 'redis', 'kind': 'docker', 'container': wa_project ~ '_redis'}] }}
  tags: [monitoring]

# Profil durci (`firewall_<port>`) et amonts (`webapp_upstream_checks`, `upstream_<id>`) : sondes supplémentaires.
- name: Describe the extra checks of the application
  ansible.builtin.include_tasks:
    file: extra-checks.yml
    apply:
      tags: [monitoring]
  when: webapp_hardening is defined or webapp_upstream_checks is defined
  tags: [monitoring]

# `public: true` n'est PAS un détail de style : sans lui, les defaults du rôle inclus (svcprobe_checks_dir,
# svcprobe_listen_port) restent confinés à ses propres tâches (comportement documenté d'`include_role`).
- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Deploy the probe of the application
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/{{ wa_project }}.json"
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [monitoring]

# Une sonde déposée qui répond `service_up 0` juste après un déploiement réussi est MAL ÉCRITE, et ferait sonner une
# alerte en permanence : mieux vaut le voir ici.
- name: Verify the probe answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: wa_probe
  retries: 6
  delay: 5
  until: wa_probe.status is defined and wa_probe.status == 200
  changed_when: false
  tags: [monitoring]

- name: Fail when the probe reports the service down
  ansible.builtin.fail:
    msg: >-
      La sonde répond mais annonce `service_up{service="{{ wa_project }}"} 0` : la sonde est mal écrite, ou
      {{ wa_health_url }} ne répond pas depuis {{ inventory_hostname }}.
  when: >-
    ('service_up{service="' ~ wa_project ~ '"} 0') in (wa_probe.content | default(''))
  tags: [monitoring]

- name: Warn when a secondary check reports down
  vars:
    wa_down_checks: "{{ wa_probe.content.split('\n') | select('search', 'service_check_up[{]service=\"' ~ wa_project ~ '\"') | select('search', ' 0$') | list }}"
  ansible.builtin.debug:
    msg: "Sonde(s) secondaire(s) à 0 : {{ wa_down_checks }} — vérifier les noms de conteneurs (`docker ps` sur {{ ansible_host }})."
  when: wa_down_checks | length > 0
  tags: [monitoring]
