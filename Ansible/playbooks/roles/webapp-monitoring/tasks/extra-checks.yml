---
# Sondes supplémentaires, ajoutées à `wa_checks` (main.yml) — fichier séparé pour être éprouvé hors ligne
# (scripts/test_webapp_hardening_check.py). Aucune commande.
#
# Profil durci : `firewall_<port>` — la règle DROP de chaque port publié est dans DOCKER-USER ET atteinte (aucune
# règle autre qu'un DROP/REJECT avant la première règle de l'app). Docker recrée la chaîne vide à chaque
# démarrage, l'unité de l'app la repose : 0 = ports publiés ouverts → ServiceCheckFailing.
# `webapp_upstream_checks` : `upstream_<id>`, l'URL d'un amont lue DEPUIS le conteneur back (chemin réel app → amont).
# À 0 alors que service_up vaut 1 : l'app répond mais ne joint plus son amont (amont tombé, vhost qui la refuse, DNS).

# Les valeurs entrent dans une commande de sonde : grammaire tenue AVANT de la composer.
- name: Check the values written into the probe commands
  ansible.builtin.assert:
    that:
      - wa_project is match('^[a-z][a-z0-9-]{0,40}(?!(?s:.))')
      - webapp_hardening is not defined or wa_h_tag is match('^webapp-[a-z][a-z0-9-]{0,40}(?!(?s:.))')
      - webapp_upstream_checks | default([]) | map(attribute='id') | reject('match', '^[a-z][a-z0-9_]{0,31}(?!(?s:.))') | list | length == 0
      - webapp_upstream_checks | default([]) | map(attribute='url') | reject('match', '^https://[a-z0-9][a-z0-9.-]{0,252}(:[1-9][0-9]{0,4})?(/[A-Za-z0-9._/-]*)?(?!(?s:.))') | list | length == 0
    fail_msg: "Nom de projet, id ou URL (https://<nom>[:<port>]/<chemin>) d'un amont hors grammaire : ils entrent dans la commande de la sonde."
    quiet: true

# `webapp_public_checks` (E2, bord public) : [{name, path, edge_status, origin_status?}]. Le nom, le chemin, le nom d'hôte et les
# adresses entrent dans une commande de sonde : grammaire tenue AVANT de la composer. L'origine se déduit des proxies ADMIS du profil
# durci (`wa_h_eligible_proxies`, jamais l'adresse d'un VPN) : sans profil, la sonde d'origine n'a pas de cible et est refusée.
- name: Check the public edge probes before writing them into commands
  ansible.builtin.assert:
    that:
      - webapp_public_checks is not string and webapp_public_checks is sequence
      - webapp_public_checks | reject('mapping') | list | length == 0
      - webapp_public_checks | map(attribute='name', default='') | reject('match', '^[a-z][a-z0-9_]{0,31}(?!(?s:.))') | list | length == 0
      - webapp_public_checks | map(attribute='name', default='') | unique | list | length == webapp_public_checks | length
      - webapp_public_checks | map(attribute='path', default='') | reject('match', '^/[A-Za-z0-9._~/-]*(?!(?s:.))') | list | length == 0
      - webapp_public_checks | selectattr('method', 'defined') | map(attribute='method') | reject('match', '^[A-Z]{3,7}(?!(?s:.))') | list | length == 0
      - webapp_public_checks | map(attribute='edge_status', default='') | map('string') | reject('match', '^[1-5][0-9]{2}(?!(?s:.))') | list | length == 0
      - webapp_public_checks | selectattr('origin_status', 'defined') | map(attribute='origin_status') | map('string') | reject('match', '^[1-5][0-9]{2}(?!(?s:.))') | list | length == 0
      - proxy_hostname is defined
      - proxy_hostname is match('^[a-z0-9][a-z0-9.-]{0,252}(?!(?s:.))')
      - (webapp_public_checks | selectattr('origin_status', 'defined') | list | length == 0) or (wa_h_eligible_proxies is defined and wa_h_eligible_proxies | length > 0)
    fail_msg: >-
      `webapp_public_checks` : liste de { name (a-z0-9_, unique), path (/…), method? (GET par défaut), edge_status (100-599),
      origin_status? (100-599) } ;
      `proxy_hostname` de la zone ; `origin_status` exige le profil durci (proxies admis).
    quiet: true
  when: webapp_public_checks is defined

- name: Describe the extra checks of the application
  vars:
    _awk: >-
      /^-A DOCKER-USER/ { if (index($0, t ":")) seen = 1; if (!seen && $0 !~ / -j (DROP|REJECT)( |$)/) bad = 1;
      if (index($0, t ":" p ":deny") && $0 ~ /-j DROP/) ok = 1 } END { exit !(ok && !bad) }
    # Chaînes « refus seulement » par niveaux (DROP/REJECT/RETURN, ou saut vers une telle chaîne ; 5 niveaux, un cycle
    # n'y entre jamais), puis, pour chaque chaîne de `chains`, aucune règle hors refus avant celle de l'app. `opt` :
    # chaîne absente et vide admise (DOCKER-USER IPv6 sans Docker IPv6).
    _order_awk: >-
      $1 == "-N" { decl[$2] = 1 }
      $1 == "-A" { c = $2; n[c]++; r[c, n[c]] = $0; t = ""; for (i = 3; i < NF; i++) if ($i == "-j" || $i == "-g") t = $(i + 1); tg[c, n[c]] = t }
      END { for (d = 0; d < 5; d++) { for (c in decl) { ok = 1; for (i = 1; i <= n[c]; i++) { x = tg[c, i];
      if (!(x == "DROP" || x == "REJECT" || x == "RETURN" || ((x in safe) && safe[x]))) ok = 0 } nx[c] = ok }
      for (c in nx) safe[c] = nx[c] }
      k = split(chains, cs, ","); bad = 0; for (j = 1; j <= k; j++) { c = cs[j]; if (n[c] == 0 && !(c in decl) && opt) continue;
      seen = 0; for (i = 1; i <= n[c]; i++) { if (index(r[c, i], tag ":")) { seen = 1; break } x = tg[c, i];
      if (!(x == "DROP" || x == "REJECT" || ((x in safe) && safe[x]))) bad = 1 } if (!seen) bad = 1 } exit bad }
    _nginx_probe: >-
      pid=$(cat /run/nginx.pid) && cg=$(sed -n 's|^0::/||p' /proc/$pid/cgroup) && [ -n "$cg" ] &&
      exec sh -c 'echo $$ > "/sys/fs/cgroup/$1/cgroup.procs" && exec setpriv --reuid=65534 --regid=65534 --clear-groups
      timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/$2"' probe "$cg" {{ wa_back_port | int }}
    _fmt: "{{ webapp_probe_ps_format }}"
    _firewall: >-
      {%- set out = [] -%}
      {%- if webapp_hardening is defined -%}
      {%- for port in [wa_front_port | int, wa_back_port | int] -%}
      {%- set _ = out.append({'name': 'firewall_' ~ port, 'kind': 'command', 'timeout': 10,
            'argv': ['/bin/sh', '-c', "iptables -w -S DOCKER-USER | awk -v t=" ~ wa_h_tag ~ " -v p=" ~ port ~ " '" ~ _awk ~ "'"]}) -%}
      {%- endfor -%}
      {#- Sortie du sous-réseau dédié : DROP final présent vers les autres machines ET vers l'hôte. -#}
      {%- set _ = out.append({'name': 'firewall_egress', 'kind': 'command', 'timeout': 10,
            'argv': ['/bin/sh', '-c', "iptables -w -S DOCKER-USER | grep -q -- '" ~ wa_h_tag ~ ":egress:deny' && iptables -w -S INPUT | grep -q -- '" ~ wa_h_tag ~ ":host:deny'"]}) -%}
      {#- ORDRE dans DOCKER-USER, INPUT et OUTPUT (IPv4), DOCKER-USER et OUTPUT (IPv6) : rien qui puisse accepter avant
          la première règle de l'app (`ufw reload` replace `ufw-before-output`, `-o lo -j ACCEPT`, en tête) ; un saut
          vers une chaîne qui ne fait que refuser est admis (fail2ban). Table ENTIÈRE lue pour juger ces chaînes. -#}
      {%- set _ = out.append({'name': 'firewall_order4', 'kind': 'command', 'timeout': 10,
            'argv': ['/bin/sh', '-c', "iptables -w -S | awk -v tag=" ~ wa_h_tag ~ " -v chains=DOCKER-USER,INPUT,OUTPUT -v opt=0 '" ~ _order_awk ~ "'"]}) -%}
      {%- set _ = out.append({'name': 'firewall_order6', 'kind': 'command', 'timeout': 10,
            'argv': ['/bin/sh', '-c', "ip6tables -w -S | awk -v tag=" ~ wa_h_tag ~ " -v chains=DOCKER-USER,OUTPUT -v opt=1 '" ~ _order_awk ~ "'"]}) -%}
      {#- Proxy sur cette machine : un processus NON root placé dans le groupe de contrôle VIVANT de nginx joint le
          back-lb — la règle `local:nginx` le vise encore (sinon périmée : nginx recréé, 502 sans alerte). -#}
      {%- if wa_h_local_proxy | default(false) | bool -%}
      {%- set _ = out.append({'name': 'firewall_local_nginx', 'kind': 'command', 'timeout': 10,
            'argv': ['/bin/sh', '-c', _nginx_probe]}) -%}
      {%- endif -%}
      {%- endif -%}
      {{ out }}
    # Bord public : `<name>` joint le NOM public (par Cloudflare) sans identifiant et attend `edge_status` (401 : la route répond
    # mais refuse) ; `<name>_origin` joint chaque proxy ADMIS DIRECTEMENT (`--resolve`, sans le certificat client de Cloudflare) et
    # attend `origin_status` (403) de TOUS, ET l'en-tête `X-FFG-Origin: cert-required` que le vhost pose sur CE refus (sans lui un vhost
    # absent, dont le serveur par défaut répond aussi 403, passerait pour un vhost fermé). Un 200 direct = le vhost est ouvert à qui contourne Cloudflare ; un 403/ban de Cloudflare
    # sur la sonde du nom = règle WAF qui défie les appels serveur. À 0 alors que service_up vaut 1 : ServiceCheckFailing.
    _origins: >-
      {{ (wa_h_eligible_proxies | default([])) | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list }}
    _public: >-
      {%- set out = [] -%}
      {%- for p in webapp_public_checks | default([]) -%}
      {%- set _ = out.append({'name': p.name, 'kind': 'http', 'method': p.method | default('GET'), 'url': 'https://' ~ proxy_hostname ~ p.path, 'status': [p.edge_status | int], 'timeout': 15}) -%}
      {%- if p.origin_status is defined -%}
      {%- set _ = out.append({'name': p.name ~ '_origin', 'kind': 'command', 'timeout': 40,
            'argv': ['/bin/sh', '-c', 'for ip in ' ~ (_origins | join(' ')) ~ '; do o=$(curl -s -o /dev/null -D - -X ' ~ (p.method | default('GET')) ~ ' -w "%{http_code}" --max-time 10 --resolve '
                    ~ proxy_hostname ~ ':443:$ip https://' ~ proxy_hostname ~ p.path ~ '); c=$(printf "%s" "$o" | tail -n 1); [ "$c" = "' ~ (p.origin_status | int)
                    ~ '" ] || exit 1; printf "%s" "$o" | grep -qiE "^x-ffg-origin: cert-required[[:space:]]*$" || exit 1; done']}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    _upstreams: >-
      {%- set out = [] -%}
      {%- for u in webapp_upstream_checks | default([]) -%}
      {%- set _ = out.append({'name': 'upstream_' ~ u.id, 'kind': 'command', 'timeout': 20,
            'argv': ['/bin/sh', '-c', "c=$(docker ps --filter label=com.docker.compose.service=back --format '" ~ _fmt ~ "' | awk '$2 ~ /^" ~ wa_project ~ "-back-/ {print $1}' | head -n 1); [ -n \"$c\" ] && exec docker exec \"$c\" wget -q -O /dev/null -T 10 " ~ u.url]}) -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.set_fact:
    wa_checks: "{{ wa_checks + _firewall + _upstreams + _public }}"
