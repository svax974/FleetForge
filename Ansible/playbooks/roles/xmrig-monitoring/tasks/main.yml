---
# Sonde `service_up{service="xmrig"}` + collecteur de l'API locale (hashrate, connexion au
# pool, partages, version). Cible Prometheus et ouverture ufw du scrape (9110) : celles
# de `svcprobe-install`. Tout est tagué `monitoring` — réarmer la supervision ne doit pas
# imposer de rejouer l'installation.
#   ./play.sh <parc> deploy-xmrig.yml --limit <hôte> -e xmrig_wallet=<adresse> -e xmrig_mode=<pool|solo> -e server=<vps|physical> --tags monitoring

- name: Fail early when no Prometheus host is defined
  ansible.builtin.assert:
    that:
      - prometheus_host is defined
      - prometheus_host in hostvars
    fail_msg: >-
      `prometheus_host` n'est pas défini ou absent de l'inventaire. Un nœud
      que personne ne scrape n'est pas supervisé.
  tags: [monitoring]

- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Install the collector dependencies
  ansible.builtin.apt:
    name: [curl, jq]
    state: present
  become: true
  tags: [monitoring]

- name: Deploy the XMRig metric collector
  ansible.builtin.copy:
    src: xmrig-metrics.sh
    dest: "{{ svcprobe_lib_dir }}/xmrig-metrics.sh"
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [monitoring]

- name: Deploy the XMRig probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/xmrig.json"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [monitoring]

# Contrôle : la série de référence des alertes doit exister RÉELLEMENT (sinon le groupe
# `xmrig` resterait `inactive` avec `health=ok`). svcprobe met 10 s en cache.
- name: Read the probe exposition
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: xmrmon_probe
  retries: 12
  delay: 10
  until: >-
    xmrmon_probe.status | default(0) == 200
    and 'xmrig_hashrate_hps' in (xmrmon_probe.content | default(''))
  changed_when: false
  check_mode: false
  tags: [monitoring]

- name: Report the probe result
  ansible.builtin.debug:
    msg: "{{ xmrmon_probe.content.split('\n') | select('match', '^(service_up|xmrig_)') | reject('match', '^# ') | list }}"
  tags: [monitoring]
