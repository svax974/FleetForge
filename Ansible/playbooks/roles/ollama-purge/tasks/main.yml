---
# Purge Ollama — removes binary, service and all downloaded models.
# WARNING: all models will be deleted and must be re-downloaded.
#
# Fait tout ce que `ollama-remove` fait, plus : les modèles, l'utilisateur
# système et les règles de pare-feu. Voir CLAUDE.md § 2.

# svcprobe relit /etc/svcprobe/checks.d à CHAQUE scrape : supprimer le fichier
# suffit. Sans cela, la sonde publierait `service_up 0` indéfiniment et ferait
# sonner une alerte sur un service volontairement désinstallé.
- name: Remove the ollama probe
  ansible.builtin.file:
    path: /etc/svcprobe/checks.d/ollama.json
    state: absent
  become: true

- name: Stop and disable ollama service
  ansible.builtin.systemd:
    name: ollama
    state: stopped
    enabled: no
  ignore_errors: true

# Le script officiel pose, à côté du binaire, ses bibliothèques d'exécution
# (CUDA, ROCm : 4,7 Go sur hub, constaté le 21/10/2026) — moteur, pas données.
- name: Remove ollama binary and its runtime libraries
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/ollama
    - /usr/local/lib/ollama

- name: Remove systemd service file and drop-in directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/ollama.service
    - /etc/systemd/system/ollama.service.d

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Remove models and ollama data directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/ollama
    - /var/lib/ollama
    - ~/.ollama

# L'utilisateur est créé par le script d'installation officiel, pas par le rôle.
# `ollama-remove` le conserve parce qu'il possède les modèles qu'il préserve ;
# ici les modèles sont partis, l'utilisateur n'a plus lieu d'être.
- name: Remove the ollama system user
  ansible.builtin.user:
    name: ollama
    state: absent
    remove: no
  ignore_errors: true

# Créé lui aussi par le script officiel ; `user: state=absent` ne le retire
# pas quand d'autres comptes en sont membres (root, sur hub).
- name: Remove the ollama group
  ansible.builtin.group:
    name: ollama
    state: absent
  ignore_errors: true

- name: Load the firewall sources computed by ollama-security
  ansible.builtin.include_role:
    name: ollama-security
    tasks_from: vars
    public: true

# Les autorisations sont posées par source (`ollama-security`) : les supprimer
# impose de rejouer la même liste. Un `delete` sans `from_ip` ne matcherait que
# la règle générique et laisserait les autres en place.
- name: Remove the per-source Ollama allow rules
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ ollamasec_port }}"
    from_ip: "{{ item }}"
    delete: true
  loop: "{{ ollamasec_sources | unique }}"
  become: true
  ignore_errors: true

- name: Remove the Ollama default-deny rule
  community.general.ufw:
    rule: deny
    proto: tcp
    port: "{{ ollamasec_port }}"
    delete: true
  become: true
  ignore_errors: true

# ── DNS : retirer le CNAME public ───────────────────────────────────────────
# Symétrique de la publication (ollama-install). L'entrée d'inventaire `ollama`
# (porteuse de `proxy_hostname`) doit être retirée EN MÊME TEMPS — sinon la
# prochaine update-cloudflare-dns.yml republierait le record.
- name: Remove the Ollama CNAME
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_token }}"
    zone: "{{ domain_name }}"
    record: "{{ proxy_hostname | default('ollama.' ~ domain_name) }}"
    type: CNAME
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: cloudflare_token | default('') | length > 0
