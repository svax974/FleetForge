---
# Voir defaults/main.yml.

- name: Check the names that select what is removed
  ansible.builtin.assert:
    that:
      - ffg_project_name is match('^[a-z][a-z0-9-]{0,40}$')
      - ffg_unix_user is match('^[a-z_][a-z0-9_-]{0,30}$')
      - ffg_unix_user != remote_username
      - ffg_firewall_script is match('^/[A-Za-z0-9._/-]+$')
    quiet: true

- name: List the containers with their compose project
  ansible.builtin.command:
    argv: [docker, ps, -a, --format, '{% raw %}{{.ID}} {{.Label "com.docker.compose.project"}}{% endraw %}']
  become: true
  register: ffg_ps
  changed_when: false
  check_mode: false

# Projets `<nom>-back-<hôte>` et `<nom>-front-<hôte>` (deploy-full.sh) : rien
# d'autre sur la machine ne porte ces étiquettes.
- name: Remove the gateway containers (volumes kept)
  ansible.builtin.command:
    argv: "{{ ['docker', 'rm', '-f'] + _ids }}"
  vars:
    _ids: >-
      {{ ffg_ps.stdout_lines | select('match', '^[0-9a-f]+ ' ~ (ffg_project_name | regex_escape) ~ '-(back|front)-')
         | map('split') | map('first') | list }}
  become: true
  when: _ids | length > 0

- name: Remove the gateway probe
  ansible.builtin.file:
    path: "{{ svcprobe_checks_dir | default('/etc/svcprobe/checks.d') }}/fleetforge-gateway.json"
    state: absent
  become: true
  tags: [monitoring]

- name: Stop and disable the gateway firewall unit
  ansible.builtin.systemd:
    name: "{{ ffg_firewall_unit }}"
    state: stopped
    enabled: false
  become: true
  failed_when: false

# Règles retirées par leur COMMENTAIRE, sans se fier à l'inventaire courant
# (proxies et ports ont pu changer depuis le déploiement).
- name: Remove the gateway rules from DOCKER-USER
  ansible.builtin.shell: |
    set -euo pipefail
    for cmd in iptables ip6tables; do
      "${cmd}" -w -L DOCKER-USER -n >/dev/null 2>&1 || continue
      while true; do
        n=$("${cmd}" -w -L DOCKER-USER --line-numbers -n | awk 'index($0, "/* fleetforge-gateway:") && !done {print $1; done=1}')
        [ -z "${n}" ] && break
        "${cmd}" -w -D DOCKER-USER "${n}"
        echo "removed ${cmd} ${n}"
      done
    done
  args:
    executable: /bin/bash
  become: true
  register: ffg_rules_removed
  changed_when: "'removed' in ffg_rules_removed.stdout"

- name: Remove the gateway firewall unit and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/systemd/system/{{ ffg_firewall_unit }}.service"
    - "{{ ffg_firewall_script }}"
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Remove the dedicated account
  ansible.builtin.user:
    name: "{{ ffg_unix_user }}"
    state: absent
  become: true

- name: Remove the dedicated group
  ansible.builtin.group:
    name: "{{ ffg_unix_user }}"
    state: absent
  become: true

- name: Remind what remains
  ansible.builtin.debug:
    msg: >-
      Passerelle arrêtée (conteneurs, sonde, pare-feu, compte retirés ; volumes
      conservés). Restent : le CNAME {{ proxy_hostname | default('') }} (purge),
      le gabarit parcs/<parc>/nginx/sites-enabled/fleetforge-gateway.conf, les
      comptes `ffg_*` de l'entrée FleetForge et la passerelle dans son
      `access_linked`.
