---
# Prérequis Flutter pour le runner AgentHub — voir defaults/main.yml pour le périmètre et ce qui est
# volontairement laissé de côté. Additif et idempotent : rien ici ne touche aux autres paquets,
# conteneurs ou services de cette machine partagée.

# Outils de base de Flutter (curl git unzip xz-utils zip libglu1-mesa) + chaîne de build Linux desktop
# (clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev), telles que listées
# par https://docs.flutter.dev/platform-integration/linux/install-linux/install-linux-from-linux.
- name: Install the Flutter prerequisites and the Linux desktop toolchain
  ansible.builtin.apt:
    name:
      - curl
      - git
      - unzip
      - xz-utils
      - zip
      - libglu1-mesa
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - libstdc++-12-dev
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Le runner (install.sh) crée `agents` quand il manque, avec un home 0700 ; on reproduit ce même
# durcissement si ce rôle passe avant lui (premier déploiement), sans jamais toucher à un compte existant.
- name: Check whether the runner user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ agenthub_flutter_user }}"
    fail_key: false

- name: Create the runner user when the runner is not installed yet
  ansible.builtin.user:
    name: "{{ agenthub_flutter_user }}"
    shell: /bin/bash
    create_home: true
    umask: "077"
  become: true
  when: getent_passwd[agenthub_flutter_user] is none

- name: Look for an existing Flutter SDK
  ansible.builtin.stat:
    path: "{{ agenthub_flutter_dir }}/bin/flutter"
  register: agenthub_flutter_bin

# Cloné en root puis donné à `agents` (un `become_user` non privilégié depuis un compte sudo exige le
# paquet `acl` ou le pipelining) ; une seule fois, voir defaults pour les montées de version.
- name: Clone the Flutter SDK
  ansible.builtin.git:
    repo: https://github.com/flutter/flutter.git
    dest: "{{ agenthub_flutter_dir }}"
    version: "{{ agenthub_flutter_channel }}"
    depth: 1
  become: true
  when: not agenthub_flutter_bin.stat.exists

- name: Give the SDK to the runner user
  ansible.builtin.file:
    path: "{{ agenthub_flutter_dir }}"
    owner: "{{ agenthub_flutter_user }}"
    group: "{{ agenthub_flutter_user }}"
    recurse: true
  become: true
  when: not agenthub_flutter_bin.stat.exists

# Un fichier du SDK partagé modifiable par tous le serait à travers chaque copie des runners des
# utilisateurs (liens physiques, voir agenthub-user-flutter.j2) : retiré à chaque passage.
- name: Remove the world-writable bits from the shared SDK
  ansible.builtin.command: find {{ agenthub_flutter_dir | quote }} -perm -0002 ! -type l -print -exec chmod o-w {} +
  become: true
  register: agenthub_flutter_ow
  changed_when: agenthub_flutter_ow.stdout | length > 0

# Le service du runner a /usr/local/bin dans son PATH (agenthub-runner.service), celui des runners des
# utilisateurs aussi : deux petits scripts plutôt que deux liens, pour qu'un compte `agr-*` prenne SA
# copie (~/.agenthub-flutter) et tout autre compte le SDK partagé — sans toucher à l'environnement des
# services ni les redémarrer (leurs sessions tmux en cours restent intactes). Les anciens liens sont
# retirés d'abord : un gabarit écrit à travers un lien écraserait la cible, le vrai `bin/flutter`.
- name: Look for the former flutter and dart links
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
  loop: [flutter, dart]
  become: true
  register: agenthub_flutter_links

- name: Remove the former flutter and dart links
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ agenthub_flutter_links.results | selectattr('stat.exists') | selectattr('stat.islnk') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"
  become: true

- name: Put flutter and dart on the PATH of every runner
  ansible.builtin.template:
    src: flutter-command.j2
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [flutter, dart]
  become: true

# Première utilisation : télécharge Dart + les artefacts moteur Linux en tant que `agents` (sinon le
# premier `flutter create` d'un utilisateur les télécharge, pendant que « Nouveau projet » attend).
- name: Warm the Flutter cache for the runner user (Dart SDK + Linux engine artifacts)
  ansible.builtin.command:
    argv:
      - runuser
      - -l
      - "{{ agenthub_flutter_user }}"
      - -c
      - "{{ agenthub_flutter_dir }}/bin/flutter config --no-analytics && {{ agenthub_flutter_dir }}/bin/flutter precache --linux"
  become: true
  register: agenthub_flutter_precache
  # Le premier passage télécharge, les suivants n'impriment rien de tel.
  changed_when: "'ownloading' in (agenthub_flutter_precache.stdout ~ agenthub_flutter_precache.stderr)"

- name: Report the Flutter version
  ansible.builtin.command: runuser -l {{ agenthub_flutter_user }} -c '{{ agenthub_flutter_dir }}/bin/flutter --version --machine'
  register: agenthub_flutter_version
  changed_when: false
  become: true

- name: Fail when Flutter does not answer
  ansible.builtin.assert:
    that:
      - agenthub_flutter_version.rc == 0
      - "'frameworkVersion' in agenthub_flutter_version.stdout"
    fail_msg: >-
      Flutter ne répond pas pour l'utilisateur {{ agenthub_flutter_user }} sur {{ inventory_hostname }} :
      vérifier `runuser -l {{ agenthub_flutter_user }} -c 'flutter doctor -v'`.
    success_msg: "Flutter prêt pour {{ agenthub_flutter_user }} ({{ agenthub_flutter_dir }}, canal {{ agenthub_flutter_channel }})."

# ── Runners des utilisateurs (comptes `agr-*`) : une copie légère chacun ────────────────────────
# Le SDK partagé appartient à `agents` et Flutter écrit dans son propre dossier : un autre compte ne
# peut pas s'en servir tel quel, et le rendre modifiable par un groupe laisserait un utilisateur y
# glisser du code que le runner des admins exécuterait. agenthub-user-flutter fait donc à chaque
# compte sa copie (liens physiques en lecture seule + copies privées de ce que Flutter réécrit, voir
# le gabarit). L'outil des runners des utilisateurs d'AgentHub l'appelle à chaque nouveau runner ;
# cette tâche couvre les comptes existants et refait les copies quand le SDK partagé a changé.
- name: Install the per-account Flutter copier for the user runners
  ansible.builtin.template:
    src: agenthub-user-flutter.j2
    dest: /usr/local/sbin/agenthub-user-flutter
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Give every user runner account its own Flutter copy
  ansible.builtin.shell: |
    set -euo pipefail
    for user in $(getent passwd | awk -F: '$1 ~ /^agr-[a-z0-9]+$/ { print $1 }'); do
      /usr/local/sbin/agenthub-user-flutter "$user"
    done
  args:
    executable: /bin/bash
  become: true
  register: agenthub_flutter_user_copies
  changed_when: "'made from' in agenthub_flutter_user_copies.stdout"
