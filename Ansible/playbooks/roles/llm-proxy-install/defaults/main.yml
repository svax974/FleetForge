---
# LLM Proxy (front React/nginx + back NestJS + Postgres + Redis, Docker
# Compose, AppTemplate) — passerelle LLM compatible OpenAI/Anthropic.
#
# Ce rôle ne construit ni ne démarre RIEN : il garantit seulement le CNAME
# public (via cloudflare-dns-update/tasks/cnames.yml, en portée réduite à cet
# hôte — le nom public est déclaré par `proxy_hostname` sur son entrée
# d'inventaire). Le build/démarrage de l'app vit dans `llm-proxy-deploy` (via
# les scripts du dépôt app, pas un docker_container/docker_compose Ansible —
# voir ses defaults pour le pourquoi), le filtrage réseau dans
# `llm-proxy-security`.

llm_proxy_hostname: "llm-proxy.{{ domain_name }}"
