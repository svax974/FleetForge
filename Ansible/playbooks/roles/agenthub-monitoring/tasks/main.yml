---
# Convention `<service>-monitoring` (CLAUDE.md) : le rôle dépose une SONDE
# déclarative pour `svcprobe`, qui expose `service_up{service="agenthub"}`.
# Aucun redémarrage n'est nécessaire — svcprobe relit son répertoire de sondes
# à chaque scrape.

# `public: true` n'est PAS un détail de style : sans lui, les defaults du rôle
# inclus (svcprobe_checks_dir, svcprobe_lib_dir, svcprobe_listen_port) restent
# confinés à ses propres tâches (comportement documenté d'`include_role`,
# `public: no` par défaut).
- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Deploy the AgentHub probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/agenthub.json"
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [monitoring]

# Contrôle immédiat : une sonde déposée mais qui répond `service_up 0` alors
# que le déploiement vient de réussir est une sonde MAL ÉCRITE, et elle ferait
# sonner une alerte en permanence.
- name: Verify the probe answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: agenthub_probe
  retries: 6
  delay: 5
  until: agenthub_probe.status is defined and agenthub_probe.status == 200
  changed_when: false
  tags: [monitoring]

- name: Fail when the probe reports the service down
  ansible.builtin.fail:
    msg: >-
      La sonde répond mais annonce `service_up{service="agenthub"} 0` alors
      que le déploiement vient de réussir : la sonde est mal écrite, ou
      {{ agenthub_svcprobe_back_health_url }}
      {{ '' if hostvars['agenthub'].cloudflare_front | default(false) | bool else '/ ' ~ agenthub_svcprobe_front_url }}
      ne répond(ent) pas.
  when: >-
    'service_up{service="agenthub"} 0' in (agenthub_probe.content | default(''))
  tags: [monitoring]

- name: Report the probe result
  ansible.builtin.debug:
    msg: >-
      {{ agenthub_probe.content.split('\n')
         | select('search', 'agenthub')
         | list }}
  tags: [monitoring]
