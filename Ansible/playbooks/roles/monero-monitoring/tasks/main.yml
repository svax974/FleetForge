---
# Sonde `service_up{service="monero"}` + collecteur du RPC (hauteur, retard, pairs, disque,
# âge du dernier bloc, version). Cible Prometheus et ouverture ufw du scrape (9110) : celles
# de `svcprobe-install`. Tout est tagué `monitoring` — réarmer la supervision ne doit pas
# imposer de rejouer l'installation.
#   ./play.sh <parc> deploy-monero.yml --limit <hôte> -e type=<full|pruned> --tags monitoring

- name: Fail early when no Prometheus host is defined
  ansible.builtin.assert:
    that:
      - prometheus_host is defined
      - prometheus_host in hostvars
    fail_msg: >-
      `prometheus_host` n'est pas défini ou absent de l'inventaire. Un nœud
      que personne ne scrape n'est pas supervisé.
  tags: [monitoring]

- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Install the collector dependencies
  ansible.builtin.apt:
    name: [curl, jq]
    state: present
  become: true
  tags: [monitoring]

- name: Deploy the Monero metric collector
  ansible.builtin.copy:
    src: monero-metrics.sh
    dest: "{{ svcprobe_lib_dir }}/monero-metrics.sh"
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [monitoring]

- name: Deploy the Monero probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/monero.json"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [monitoring]

# Contrôle : la série de référence des alertes doit exister RÉELLEMENT (sinon le groupe
# `monero` resterait `inactive` avec `health=ok`). svcprobe met 10 s en cache.
- name: Read the probe exposition
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: monmon_probe
  retries: 12
  delay: 10
  until: >-
    monmon_probe.status | default(0) == 200
    and 'monero_height' in (monmon_probe.content | default(''))
  changed_when: false
  check_mode: false
  tags: [monitoring]

- name: Report the probe result
  ansible.builtin.debug:
    msg: "{{ monmon_probe.content.split('\n') | select('match', '^(service_up|monero_)') | reject('match', '^# ') | list }}"
  tags: [monitoring]
