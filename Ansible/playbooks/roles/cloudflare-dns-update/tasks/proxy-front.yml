---
# Nom canonique du front des proxies (round-robin).
#
# `proxy_hostname` (group_vars/<parc>.yml) route en répartition DNS entre TOUS
# les hôtes du groupe `proxies` : un A record par proxy sous ce MÊME nom,
# `solo: false` — contrairement à la synchronisation par hôte de main.yml,
# plusieurs enregistrements doivent coexister sous ce nom. Les services dont
# le vhost tourne sur plusieurs proxies y font pointer leur CNAME public
# (tasks/cnames.yml, attribut d'inventaire `proxy_hostname`) plutôt que sur un
# proxy nommé en dur : le nom reste correct quels que soient les proxies qui
# composent le groupe.
#
# Le nom du front est construit en dur (`proxy.` + zone, même valeur que le
# global `proxy_hostname`) plutôt que lu depuis cette variable : un hôte
# portant l'attribut d'inventaire `proxy_hostname` la MASQUE (les vars d'hôte
# gagnent sur les group_vars), et selon l'hôte qui exécute ce fichier le
# `record` vaudrait tantôt le front, tantôt un nom de service.
#
# Fichier séparé pour être inclus des DEUX côtés :
#   - tasks/cnames.yml (synchronisation générique ET rôles `-install` via
#     `include_role: { name: cloudflare-dns-update, tasks_from: cnames }`) —
#     pour garantir ces enregistrements AVANT de publier un CNAME, sans quoi
#     le CNAME pointerait vers un nom sans aucun A record, donc injoignable.
#
# Désactivable : `cfdns_publish_proxy_front: false` quand le front est servi
# par un Load Balancer Cloudflare. Ce nom appartient alors au load balancer et
# un A record à côté serait refusé (erreur 81054 — un nom de load balancer ne
# coexiste pas avec un enregistrement DNS), sans que le reste du déploiement
# n'y gagne rien. Les CNAME de service vers `proxy.<zone>` restent publiés :
# le load balancer répond à ce nom.
#
# Ne PURGE PAS un proxy retiré du groupe : un record laissé par un proxy
# démantelé resterait dans le tourniquet. À nettoyer à la main le jour où le
# groupe `proxies` change (aucun parc de ce dépôt n'en a fait l'expérience).
- name: Publish the round-robin A records for the canonical proxy front
  community.general.cloudflare_dns:
    api_token: "{{ cfdns_token }}"
    zone: "{{ cfdns_zone }}"
    record: "proxy.{{ cfdns_zone }}"
    type: A
    value: "{{ hostvars[item].ansible_host }}"
    ttl: "{{ cfdns_ttl }}"
    proxied: false
    solo: false
    state: present
  loop: "{{ groups['proxies'] | default([]) }}"
  loop_control:
    label: "proxy.{{ cfdns_zone }} → {{ hostvars[item].ansible_host }} ({{ item }})"
  when:
    - cfdns_publish_proxy_front | bool
    - groups['proxies'] | default([]) | length > 0
  delegate_to: localhost
  become: false
  run_once: true
  register: cfdns_proxy_lb_published

- name: Summarise the canonical proxy front
  ansible.builtin.debug:
    msg: >-
      proxy.{{ cfdns_zone }} : {{ groups['proxies'] | default([]) | length }} proxy(ies) en
      round-robin ({{ groups['proxies'] | default([]) | map('extract', hostvars, 'ansible_host') | join(', ') }}).
  when:
    - cfdns_publish_proxy_front | bool
    - groups['proxies'] | default([]) | length > 0
  delegate_to: localhost
  become: false
  run_once: true

# ── Front PRIVÉ ────────────────────────────────────────────────────────────
# `proxy-private.<zone>` : les proxies dont l'adresse n'est celle d'AUCUN serveur
# VPN du parc (défaut `cfdns_publish_private_front`, voir defaults). Dérivé de
# l'inventaire — groupes `proxies` et `vpns` —, jamais d'une liste recopiée :
# ajouter un proxy ou déplacer un VPN le met à jour au passage suivant.
#
# Aucun proxy éligible (papanglabs : chaque proxy est aussi un serveur VPN) : le
# nom n'est pas publié et les services privés restent sur `proxy.<zone>` (voir
# tasks/cnames.yml, qui s'appuie sur `cfdns_private_proxies`), avec un
# avertissement — mieux vaut un nom qui répond une fois sur deux qu'un CNAME qui
# ne mène nulle part.
#
# Ne purge pas un proxy devenu inéligible : son A record resterait dans le
# tourniquet jusqu'à un nettoyage manuel (même limite que le front public).
- name: Work out the proxies that can serve private services
  ansible.builtin.set_fact:
    cfdns_private_proxies: >-
      {%- set vpn_addrs = groups['vpns'] | default([]) | map('extract', hostvars, 'ansible_host') | list -%}
      {%- set ns = namespace(out=[]) -%}
      {%- for p in groups['proxies'] | default([]) -%}
      {%- if hostvars[p].ansible_host not in vpn_addrs -%}
      {%- set ns.out = ns.out + [p] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Publish the round-robin A records for the private proxy front
  community.general.cloudflare_dns:
    api_token: "{{ cfdns_token }}"
    zone: "{{ cfdns_zone }}"
    record: "proxy-private.{{ cfdns_zone }}"
    type: A
    value: "{{ hostvars[item].ansible_host }}"
    ttl: "{{ cfdns_ttl }}"
    proxied: false
    solo: false
    state: present
  loop: "{{ cfdns_private_proxies }}"
  loop_control:
    label: "proxy-private.{{ cfdns_zone }} → {{ hostvars[item].ansible_host }} ({{ item }})"
  when: cfdns_publish_private_front | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: Report the private proxy front
  ansible.builtin.debug:
    msg: >-
      {{ ('proxy-private.' ~ cfdns_zone ~ ' : ' ~ (cfdns_private_proxies | join(', ')) ~ ' (sans adresse de serveur VPN).')
         if cfdns_private_proxies | length > 0 else
         ('AUCUN proxy sans adresse de serveur VPN : les services en `access_mode: private` restent sur proxy.'
          ~ cfdns_zone ~ ' et un client VPN y sera refusé une fois sur deux. Déplacer un proxy ou un VPN.') }}
  delegate_to: localhost
  become: false
  run_once: true
  when: cfdns_publish_private_front | bool
