---
# Arrête et supprime le conteneur Prometheus.
# Conserve les données (TSDB), la configuration et les règles d'alerte —
# la suppression de celles-ci relève de `prometheus-purge`.

- name: Stop and remove Prometheus container
  community.docker.docker_container:
    name: prometheus
    state: absent
  become: true
  ignore_errors: true

- name: Remove Prometheus firewall rules
  community.general.ufw:
    rule: "{{ item }}"
    proto: tcp
    port: "{{ prometheus_port }}"
    delete: true
  loop: [allow, deny]
  become: true
  ignore_errors: true

- name: Report preserved data
  ansible.builtin.debug:
    msg: >-
      Conteneur supprimé. Données et configuration conservées dans
      {{ prometheus_home }} — utiliser prometheus-purge pour les supprimer.

# ── Supervision ────────────────────────────────────────────────────────────
# Convention `-monitoring` (CLAUDE.md) : c'est le rôle de suppression du service qui retire sa sonde.
# Une sonde laissée en place publierait `service_up 0` indéfiniment et ferait sonner `ServiceDown`
# sur un service volontairement désinstallé.
- name: Remove the svcprobe check
  ansible.builtin.file:
    path: "/etc/svcprobe/checks.d/prometheus.json"
    state: absent
  become: true
  tags: [monitoring]
