---
# OpenClaw (https://openclaw.ai) — assistant IA auto-hébergé, installé
# NATIVEMENT via le script officiel `install-cli.sh` (auto-suffisant : Node
# embarqué sous le préfixe, aucune dépendance système). Tourne sous
# `remote_username` (srvc), PAS sous un compte système dédié : srvc doit
# pouvoir piloter le service directement (CLAUDE.md § 2, « srvc doit pouvoir
# piloter les services qu'il déploie »). Démon géré par une unité systemd
# --user (`openclaw gateway install`), pas une unité système — c'est le mode
# officiellement documenté pour un compte non-root sans accès root permanent.

openclaw_user: "{{ remote_username }}"
openclaw_home: "/home/{{ openclaw_user }}"
# Préfixe par défaut d'install-cli.sh : binaire sous <prefix>/bin/openclaw,
# Node embarqué sous <prefix>/tools/. On garde le défaut plutôt que de forcer
# --prefix : c'est aussi ce que `openclaw onboard`/`gateway install` attendent
# comme OPENCLAW_HOME quand rien ne l'override.
openclaw_prefix: "{{ openclaw_home }}/.openclaw"
openclaw_binary: "{{ openclaw_prefix }}/bin/openclaw"

# Port sur lequel la gateway écoute DIRECTEMENT sur l'hôte (pas de publication
# Docker ici) : ufw filtre donc réellement ce port (openclaw-security),
# contrairement à l'ancienne installation en conteneur (CLAUDE.md — un port
# publié par Docker contourne ufw, un binaire natif sous systemd non).
openclaw_port: "{{ app_port | default(18789) }}"

# `lan` fait écouter la gateway sur toutes les interfaces de l'hôte : c'est ce
# qui la rend joignable depuis les proxies. `loopback` la confinerait à
# 127.0.0.1, injoignable même en local sur le port ouvert par ufw.
openclaw_gateway_bind: lan

openclaw_tz: UTC

# IP LAN du réseau domestique partagé par hub/nuc/station/proxy2/vpn1 — sert
# de garde-fou dans openclaw-security et de repli dans trustedProxies. Aucune
# tentative de résoudre le cas hairpin NAT de proxy2 ici : proxy1 (IP publique
# réelle, cf. `openclaw_trusted_proxies`) est le chemin réellement servi pour
# ce vhost (voir le commentaire dans openclaw.conf, proxy-update).
openclaw_lan_cidr: "192.168.1.0/24"

# Proxies de confiance pour `gateway.trustedProxies` : sans conteneur, plus de
# passerelle de bridge Docker à déclarer — le process voit directement l'IP
# source réelle de la connexion entrante.
#
# UNIQUEMENT proxy1, PAS `groups['proxies']` en entier : DNS ne pointe que sur
# lui (openclaw.web3c.cc → proxy.web3c.cc → IP de proxy1), proxy2 ne sert
# jamais ce vhost (cf. openclaw.conf, proxy-update). Le déclarer quand
# même serait activement DANGEREUX ici, pas juste inutile : `ansible_host` de
# proxy2 est derrière LE MÊME NAT domestique que hub/nuc/vpn1. Un
# visiteur qui teste depuis ce réseau a donc cette adresse comme IP réelle —
# si elle figure dans trustedProxies, la gateway la voit comme un SAUT DE
# PROXY supplémentaire plutôt que comme le client final et rejette la requête
# (« observed unattributable proxy-shaped traffic », proxy_attribution_required),
# même une fois X-Forwarded-For correctement écrasé côté nginx. Constaté le
# 10/09/2026.
openclaw_trusted_proxies: >-
  {{ [hostvars['proxy1'].ansible_host, openclaw_lan_cidr] }}

# Origines EXACTES (schéma+hôte, PAS de motif générique — imposé par la
# gateway elle-même) autorisées à charger la Control UI. Le vhost public
# (openclaw.conf) sert le service sous ce nom : sans cette entrée la Control
# UI répond « Origine du navigateur non autorisée » même une fois
# trustedProxies/XFF corrects.
openclaw_control_ui_allowed_origins:
  - "https://openclaw.{{ domain_name }}"

# ── Authentification du fournisseur d'inférence ────────────────────────────
# Valeurs possibles : voir `openclaw onboard --help` (openai-api-key,
# custom-api-key, ollama, zai-api-key, skip, ...). `skip` n'enregistre aucun
# fournisseur : à régler ensuite dans OpenClaw (UI ou `models auth login`).
# La clé (openclaw_openai_api_key) est vide par défaut : elle n'est exigée, par
# un `assert` en tâche, que pour `openai-api-key`. Vide, elle n'est pas écrite
# dans `.openclaw.env`.
openclaw_auth_choice: openai-api-key
openclaw_openai_api_key: ""

# ── Embeddings de la mémoire ─────────────────────────────────────────────────
# `openclaw_memory_search_provider` vide = rien n'est posé (défaut OpenClaw :
# openai). Avec `ollama`, le modèle doit déjà être tiré sur l'hôte Ollama
# (`deploy-ollama-model.yml -e ollama_model_name=<modèle>`). Avec
# `openai-compatible` (llama-server `--embeddings`, deploy-llamacpp.yml),
# `openclaw_memory_search_base_url` désigne son `/v1/`. Changer de fournisseur
# ou de modèle change l'identité de l'index : OpenClaw suspend la recherche
# vectorielle jusqu'à `openclaw memory index --force --agent <id>`.
openclaw_memory_search_provider: ""
openclaw_memory_search_model: ""
openclaw_memory_search_fallback: none
openclaw_memory_search_base_url: ""

# ── Fournisseur de modèles personnalisé (optionnel) ────────────────────────
# Ajouté via `config set --batch-file` (jamais `--batch-json`/argv pour
# celui-ci : la clé API y serait lisible par tout compte via `ps`, comme le
# rappelle déjà CLAUDE.md pour ansible-vault --stdin-name). `config set` ne
# teste JAMAIS la connectivité au provider au moment de l'écriture (vérifié le
# 10/09/2026 : `--dry-run` sur une URL bidon passe sans erreur) — des valeurs
# provisoires ici sont donc sans risque, à corriger ensuite dans l'UI.
# Fonctionnalité désactivée par défaut : `openclaw_custom_provider_name` vide
# saute la tâche entièrement.
openclaw_custom_provider_name: ""
openclaw_custom_provider_base_url: ""
openclaw_custom_provider_api: "openai-completions"
openclaw_custom_provider_models: []
# Défaut vide (pas absent) : `content:` du fichier de batch est TEMPLATÉ même
# quand `when:` saute la tâche (Ansible évalue les paramètres avant `when`) —
# une variable non définie y ferait échouer le rôle même provider désactivé.
# À surcharger via ansible-vault dans group_vars/web3c.yml pour l'activer,
# comme openclaw_openai_api_key.
openclaw_custom_provider_api_key: ""

# ── Onboarding non interactif ───────────────────────────────────────────────
# Mode « headless » documenté par le projet : jeton de gateway généré une fois
# sur l'hôte (jamais régénéré, voir tasks/main.yml — un jeton qui change à
# chaque rejeu invaliderait un accès Control UI sans que rien ne l'explique),
# clé fournisseur et jeton lus depuis l'ENVIRONNEMENT du process Ansible
# (--secret-input-mode env), jamais sur la ligne de commande — un secret en
# argv est lisible par tout compte via `ps`, ce que CLAUDE.md documente déjà
# pour ansible-vault --stdin-name. Pas de canal de discussion connecté
# (--skip-channels — aucun n'a été demandé).

# ── Modèle par défaut des agents ────────────────────────────────────────────
# `provider/model`, posé dans `agents.defaults.model` ; vide = réglage laissé à
# OpenClaw (UI). C'est aussi le modèle du heartbeat, de fleet-watch et de
# l'agent `watch` quand ils n'en fixent pas. Constat du 24/10/2026 : réglé
# seulement dans l'UI, `poe/mimo-v2.6-flash` est resté en place après son
# retrait par Poe — 404 à chaque appel. Dans l'inventaire, un changement de
# modèle se lit dans un diff et se rejoue. La sonde des modèles
# (openclaw-monitoring) alerte quand il cesse de répondre. Le modèle doit
# figurer dans la liste du fournisseur (`models.providers.<fournisseur>`).
# Valeur scalaire : des replis posés dans l'UI (`{primary, fallbacks}`) sont
# remplacés.
openclaw_default_model: ""
# Modèle des tâches annexes d'OpenClaw (titres, résumés, rêverie de la
# mémoire). Vide = rien n'est posé.
openclaw_utility_model: "{{ openclaw_default_model }}"

# ── Heartbeat : surveillance du parc ────────────────────────────────────────
# Le heartbeat interroge Alertmanager et Prometheus et signale sur Telegram.
# Tout ce qui décrit le parc (adresse d'Alertmanager, hôtes et services
# surveillés) est LU DANS L'INVENTAIRE au rendu du prompt
# (templates/heartbeat-prompt.j2) : rien n'est écrit en dur, un hôte ou un
# service ajouté/retiré de l'inventaire change la consigne au déploiement
# suivant. Aucune exclusion : tout ce qui est ouvert est rapporté.
#
# Désactivé tant que `openclaw_heartbeat_to` est vide (sauté entièrement).
# Ici on ne règle que la ROUTE du heartbeat ; le canal Telegram lui-même
# (jeton du bot) se pose plus bas (`openclaw_telegram_bot_token`). Sans `accountId`, OpenClaw résout le compte
# `default` — non configuré — et le heartbeat reste `skipped: no-route`
# (constaté le 05/10/2026).
openclaw_heartbeat_to: ""
openclaw_heartbeat_target: telegram
# Compte du canal qui porte le bot (multi-comptes Telegram).
openclaw_heartbeat_account_id: ""
# Modèle FIXE du heartbeat (`provider/model`, cf. `openclaw models list`).
# Vide = modèle par défaut de l'agent. À ne JAMAIS laisser sur un routeur
# `llm-proxy/auto:*` : il change de modèle à CHAQUE appel, y compris d'un tour
# à l'autre d'une même exécution. Constaté le 09/10/2026 : modèles « flash »
# qui publient leur raisonnement avant le NO_REPLY, puis un tour de relance
# routé vers un autre modèle qui, sans contexte, invente un texte (critique de
# livre, « Good morning ! ») — et c'est ce texte qui part sur Telegram.
openclaw_heartbeat_model: ""

# Plugin d'outils Prometheus (prometheus_query/alerts/targets) : code seul,
# la configuration (instances, secrets) se règle par sa page d'admin.
openclaw_prometheus_monitor_enabled: true

# ── Veille du parc (`fleet-watch`) ──────────────────────────────────────────
# Remplace le heartbeat LLM : une automation OpenClaw de type commande (sans
# modèle) lit Alertmanager toutes les `openclaw_fleetwatch_every`, retire les
# hôtes `monitor: off` et n'écrit au modèle que si l'ensemble des alertes
# change ou persiste plus de `openclaw_fleetwatch_renotify_hours`. Le modèle
# analyse alors et PROPOSE des solutions, sans rien appliquer. Active si
# `openclaw_heartbeat_to` est renseigné (même route Telegram).
# Veille de CE parc par fleet-watch (le parc du play : `parc_name`). `false` :
# l'automation est DÉSACTIVÉE, pas supprimée — script, configuration et
# historique restent, `true` la réactive. Pour un parc dont la veille est
# reprise par le poste « Infrastructure Manager » d'AgentHub (webhook
# d'Alertmanager vers le poste, `alertmanager_agenthub_webhook_url`) : web3c
# depuis le 26/10/2026. Sans effet tant que `openclaw_heartbeat_to` est vide.
openclaw_fleetwatch_enabled: true
openclaw_fleetwatch_every: 30m
openclaw_fleetwatch_renotify_hours: 6
# Modèle d'analyse (`provider/model`) ; vide = défaut de l'agent. Jamais un
# routeur `auto:*` (voir ci-dessus).
openclaw_fleetwatch_model: "{{ openclaw_heartbeat_model }}"
# `low` exige un modèle qui le supporte (ex. opencode-go) ; poe/mimo-v2.6-flash,
# le défaut de l'agent du 17 au 24/10/2026, n'accepte que `off` ou `ultra` et
# fait échouer `openclaw agent` sinon (constaté le 18/10/2026 : fleet-watch
# tombait en secours « modèle indisponible » alors que le modèle répondait).
openclaw_fleetwatch_thinking: "off"
openclaw_fleetwatch_timeout: 300
# Instances ignorées EN PLUS des hôtes `monitor: off` : noms d'instance
# Prometheus qui ne sont pas des noms d'inventaire (le job `mtbridge` expose
# `mtbridge1`).
openclaw_fleetwatch_ignore_extra: [mtbridge1]
# Réponse convenue du modèle quand aucune alerte ouverte n'est un problème EN
# COURS (toutes dans la rétention `prom_alert_flap_grace` après rétablissement).
# fleet-watch.py ne l'envoie pas : seuls les problèmes sont notifiés, jamais les
# rétablissements (demande opérateur du 24/10/2026).
openclaw_fleetwatch_quiet_reply: "RAS"

# ── Travail de fond facturé au modèle ───────────────────────────────────────
# Constat du 20/10/2026 : 9 234 points Poe dans la journée, dont 4 % pour la
# seule réponse utile, puis 402 (points épuisés) et plus aucun modèle.
# - Skill Workshop en `auto` (défaut amont) : après tout run d'au moins
#   10 itérations, y compris interrompu (timeout), une « experience review »
#   détachée rejoue le contexte complet sur le même modèle. Les runs de
#   fleet-watch en font ~30 : 118 requêtes de revue, 7 649 points, rien de
#   visible. `propose` ne suffit pas, la revue tourne quand même ; seul `off`
#   l'empêche, et coupe aussi la revue hebdomadaire des skills.
openclaw_skill_workshop_mode: "off"
# - Fin d'un exec passé en arrière-plan : OpenClaw ouvre un tour pour le
#   signaler, sans le contexte du run qui l'a lancé. L'agent a passé
#   60 itérations à chercher ce qu'était ce processus, puis a envoyé
#   « Hello — I'm here » sur Telegram (828 points). `process poll` reste
#   disponible pour suivre un processus dans le run qui l'a lancé.
openclaw_exec_notify_on_exit: false

# ── Accès du modèle au parc, en lecture seule ───────────────────────────────
# Constat du 20/10/2026 : chaque analyse fleet-watch passait ~15 itérations à
# redécouvrir comment joindre les machines (root@, clé à passphrase, port 22)
# et où était le dépôt (clone obsolète du 07/09), au point de dépasser le
# timeout. Tout est désormais donné : clé dédiée SANS passphrase (le modèle
# ne peut pas en saisir), configuration SSH dérivée de l'inventaire, clone frais
# du dépôt public.
# La clé publique est recopiée sur le poste de contrôle dans
# keys/<parc_name>/readonly/ — à COMMITTER dans le dépôt privé du parc — puis
# posée par `deploy-readonly-user.yml` sur le compte ci-dessous, jamais sur
# root ni srvc.
openclaw_ssh_key: "{{ openclaw_home }}/.ssh/id_openclaw"
# Doit valoir `readonly_user_name` de readonly-user-install.
openclaw_ssh_user: openclaw-ro
# Rôles et playbooks seulement : ni inventaire, ni variables, ni secrets du
# parc (dépôt privé, absent ici). `force` à la mise à jour : c'est un miroir,
# une modification locale n'a rien à y faire.
openclaw_repo_url: https://github.com/svax974/FleetForge.git
openclaw_repo_version: main
# Dans le workspace de l'agent watch, seul endroit que son `read` peut ouvrir.
openclaw_repo_dir: "{{ openclaw_watch_workspace }}/FleetForge"
# Index des playbooks et des fichiers de chaque rôle. OpenClaw n'a aucun outil
# pour lister un répertoire (`group:fs` = read, write, edit, apply_patch) et
# l'`exec` de l'agent watch n'accepte que fleet-ssh : sans index, il ne peut
# ouvrir que les chemins qu'il devine. Constat du 24/10/2026 : analyse d'un
# échec Postfix sans pouvoir nommer le playbook du relais mail. Hors du clone :
# `force` le réinitialise à chaque déploiement.
openclaw_repo_index: "{{ openclaw_watch_workspace }}/FleetForge-INDEX.md"

# ── Agent dédié à fleet-watch ───────────────────────────────────────────────
# L'agent `main` (conversations Telegram) a le profil `coding` : exec libre et
# `read` sous srvc, donc accès à openclaw.json et à ses clés API. Les analyses
# automatiques n'en ont pas besoin : elles tournent sous un agent séparé dont
# `exec` n'accepte QUE fleet-ssh (liste blanche du document d'approbations,
# arguments fermés) et `read` ne voit que son workspace (le dépôt), sans web
# ni mémoire. Même hub passe par
# fleet-ssh et la passerelle ro-gate. `main` reste inchangé.
openclaw_watch_agent: watch
openclaw_watch_workspace: "{{ openclaw_prefix }}/workspace-{{ openclaw_watch_agent }}"
openclaw_watch_prometheus_tools:
  - prometheus_instances
  - prometheus_alerts
  - prometheus_alerts_diff
  - prometheus_query
  - prometheus_targets
# Root, hors de portée des commandes de l'agent (voir tasks).
openclaw_fleet_ssh: /usr/local/bin/fleet-ssh
openclaw_fleet_ssh_config: /etc/openclaw/fleet-ssh.conf

# ── Canal Telegram (optionnel) ──────────────────────────────────────────────
# Jeton du bot, à chiffrer dans group_vars/web3c.yml comme
# openclaw_openai_api_key (`ansible-vault encrypt_string --stdin-name
# 'openclaw_telegram_bot_token'`). Vide = canal non géré par Ansible (la
# tâche est sautée). Le compte est celui visé par le heartbeat par défaut :
# `openclaw_heartbeat_account_id` doit désigner un compte configuré, sinon
# OpenClaw résout le compte `default` et le heartbeat reste `no-route`.
# Défaut vide (pas absent) : `content:` du fichier de batch est TEMPLATÉ même
# quand `when:` saute la tâche, une variable non définie y ferait échouer le
# rôle (même piège que openclaw_custom_provider_api_key).
openclaw_telegram_account: "{{ openclaw_heartbeat_account_id }}"
openclaw_telegram_bot_token: ""
