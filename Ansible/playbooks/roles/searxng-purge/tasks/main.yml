---
# Supprime SearXNG ET ses données : conteneur, image, configuration et clé
# secrète. Reprend `searxng-remove` puis efface ce que celui-ci préserve.

- name: Remove the service, its probe and its firewall rules
  ansible.builtin.include_role:
    name: searxng-remove

- name: Remove the SearXNG image
  community.docker.docker_image_remove:
    name: "{{ searxng_image }}"
  become: true
  ignore_errors: true

# Contient la clé secrète : regénérée au prochain déploiement, ce qui
# invalidera les préférences enregistrées. Sans conséquence pour un relai
# applicatif, à savoir si l'interface est aussi utilisée.
- name: Remove the SearXNG directory (configuration and secret key)
  ansible.builtin.file:
    path: "{{ searxng_home }}"
    state: absent
  become: true

# ── DNS : retirer le CNAME public ───────────────────────────────────────────
# Symétrique de la publication (cloudflare-dns-update/tasks/cnames.yml, via
# `proxy_hostname` de l'entrée d'inventaire `station`) : le nom public
# disparaît avec le service.
# ATTENTION : l'entrée d'inventaire porteuse de `proxy_hostname` doit être
# retirée EN MÊME TEMPS (ou son attribut supprimé) — sinon la prochaine
# synchronisation (update-cloudflare-dns.yml) republierait le record.
- name: Remove the SearXNG CNAME
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_token }}"
    zone: "{{ domain_name }}"
    record: "{{ searxng_hostname }}"
    type: CNAME
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: cloudflare_token | default('') | length > 0
