---
# Tout est tagué `monitoring` : réarmer la supervision ne doit jamais imposer de
# rejouer l'installation (rsync, build, recréation du conteneur).
#   ./play.sh web3c deploy-sync-server.yml --tags monitoring

- name: Fail early when no Prometheus host is defined
  ansible.builtin.assert:
    that:
      - prometheus_host is defined
      - prometheus_host in hostvars
      - sync_metrics_port is defined
    fail_msg: >-
      `prometheus_host` n'est pas défini ou absent de l'inventaire (ou
      `sync_metrics_port` manque sur {{ inventory_hostname }}). Un service que
      personne ne scrape n'est pas supervisé.
    quiet: true
  tags: [monitoring]

# ── Ouverture du scrape ─────────────────────────────────────────────────────
# Le port /metrics est publié par Docker : une règle ufw n'aurait AUCUN effet
# (CLAUDE.md). L'autorisation de l'hôte Prometheus est un drop-in de
# docker-ports-security ; le DROP par défaut du port vient de host_vars/
# ctdapi.yml (sync-server-security). Sans cette ouverture la cible
# s'enregistre puis reste `down`, ce qui ressemble à une panne du service.
- name: Check that the Docker port firewall is installed
  ansible.builtin.stat:
    path: "{{ sync_mon_firewall_script }}"
  register: sync_mon_fw
  tags: [monitoring]

- name: Fail when the Docker port firewall has not been applied yet
  ansible.builtin.fail:
    msg: >-
      {{ sync_mon_firewall_script }} est absent : sync-server-security n'a pas
      encore été joué sur `ctdapi`. Jouer d'abord deploy-sync-server.yml en
      entier (ou update-ufw-all.yml --limit ctdapi).
  when: not sync_mon_fw.stat.exists
  tags: [monitoring]

- name: Allow Prometheus to scrape the sync metrics port in DOCKER-USER
  ansible.builtin.template:
    src: sources.conf.j2
    dest: "{{ sync_mon_dropin_dir }}/sync-{{ sync_instance }}.conf"
    owner: root
    group: root
    mode: '0644'
  become: true
  register: sync_mon_dropin
  tags: [monitoring]

# Le drop-in n'est lu qu'à l'application des règles : sans cette réapplication
# l'autorisation existerait sur disque et pas dans iptables. Le script est
# idempotent (purge puis repose les règles de chaque port) — rejouable à volonté.
- name: Reapply the Docker port rules
  ansible.builtin.command: "{{ sync_mon_firewall_script }}"
  become: true
  changed_when: sync_mon_dropin.changed
  tags: [monitoring]

# ── Sonde svcprobe (disponibilité du listener public) ───────────────────────
# `public: true` : sans lui les defaults de svcprobe-install restent confinés à
# ce rôle inclus (comportement d'`include_role`).
- name: Ensure the shared probe is installed
  ansible.builtin.include_role:
    name: svcprobe-install
    public: true
  tags: [monitoring]

- name: Deploy the sync probe
  ansible.builtin.template:
    src: check.json.j2
    dest: "{{ svcprobe_checks_dir }}/sync-{{ sync_instance }}.json"
    owner: root
    group: root
    mode: '0644'
  become: true
  tags: [monitoring]

# ── Cible Prometheus ────────────────────────────────────────────────────────
- name: Create the target directory on the Prometheus host
  ansible.builtin.file:
    path: "/home/{{ remote_username }}/prometheus/prometheus-configs/{{ sync_mon_job }}"
    state: directory
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: '0755'
  delegate_to: "{{ prometheus_host }}"
  become: true
  tags: [monitoring]

- name: Deploy the sync Prometheus target
  ansible.builtin.template:
    src: prometheus-target.json.j2
    dest: "/home/{{ remote_username }}/prometheus/prometheus-configs/{{ sync_mon_job }}/{{ inventory_hostname }}.json"
    owner: "{{ remote_username }}"
    group: "{{ remote_username }}"
    mode: '0644'
  delegate_to: "{{ prometheus_host }}"
  become: true
  tags: [monitoring]

# ── Contrôles ───────────────────────────────────────────────────────────────
# Une cible enregistrée ne prouve rien : c'est l'exposition qui fait foi.
- name: Read the sync /metrics endpoint
  ansible.builtin.uri:
    url: "{{ sync_mon_url }}/metrics"
    return_content: true
  register: sync_mon_exposition
  retries: 6
  delay: 5
  until: sync_mon_exposition.status | default(0) == 200
  changed_when: false
  check_mode: false
  tags: [monitoring]

- name: Fail when the reference metric is absent or the server reports itself down
  ansible.builtin.assert:
    that:
      - sync_mon_reference_metric in (sync_mon_exposition.content | default(''))
      - ('sync_up{instance="' ~ sync_instance ~ '"} 1') in (sync_mon_exposition.content | default(''))
    fail_msg: >-
      L'endpoint répond mais n'expose pas `sync_up{instance="{{ sync_instance }}"} 1`
      (série de référence des règles du groupe d'alertes `sync`). Lire la sortie
      réelle : `curl 127.0.0.1:{{ sync_mon_port }}/metrics` sur {{ ansible_host }}.
    quiet: true
  tags: [monitoring]

- name: Verify the svcprobe probe answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ svcprobe_listen_port }}/metrics"
    return_content: true
  register: sync_mon_probe
  retries: 6
  delay: 5
  until: sync_mon_probe.status is defined and sync_mon_probe.status == 200
  changed_when: false
  check_mode: false
  tags: [monitoring]

- name: Fail when the probe reports the service down
  ansible.builtin.fail:
    msg: >-
      La sonde répond mais annonce `service_up{service="sync-{{ sync_instance }}"} 0`
      alors que le déploiement vient de réussir : sonde mal écrite, ou
      {{ sync_mon_health_url }} ne répond pas.
  when: >-
    'service_up{service="sync-' ~ sync_instance ~ '"} 0' in (sync_mon_probe.content | default(''))
  tags: [monitoring]

# La CHAÎNE COMPLÈTE : seule l'API de Prometheus prouve que la série existe
# vraiment (CLAUDE.md : `count(sync_up)` non nul). Non bloquant — un `file_sd`
# neuf n'est lu qu'au cycle suivant, et un job absent de prometheus.yml
# (monitoring-install non rejoué) se voit ici sans faire échouer le déploiement.
- name: Ask Prometheus whether the sync target is really scraped
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ prometheus_port | default(9090) }}/api/v1/query?query=sync_up%7Bjob%3D%22{{ sync_mon_job }}%22%2Cexported_instance%3D%22{{ sync_instance }}%22%7D
    user: "{{ prometheus_user | default(omit) }}"
    password: "{{ prometheus_pass | default(omit) }}"
    force_basic_auth: true
    return_content: true
  delegate_to: "{{ prometheus_host }}"
  register: sync_mon_series
  retries: 12
  delay: 15
  until: (sync_mon_series.json.data.result | default([])) | length > 0
  failed_when: false
  changed_when: false
  check_mode: false
  tags: [monitoring]

- name: Warn when Prometheus has no sync_up series for this instance
  ansible.builtin.debug:
    msg: >-
      ATTENTION — Prometheus ne connaît aucune série sync_up pour l'instance
      {{ sync_instance }} (job {{ sync_mon_job }}). Causes : le job
      `{{ sync_mon_job }}` manque dans prometheus.yml (rejouer
      deploy-monitoring.yml), le scrape est bloqué (DOCKER-USER : `iptables -S
      DOCKER-USER | grep {{ sync_mon_port }}` doit montrer un RETURN pour
      {{ hostvars[prometheus_host]['ansible_host'] }}), ou le cycle file_sd
      n'est pas encore passé. Tant que `count(sync_up)` est nul, les alertes du
      groupe `sync` sont décoratives.
  when: (sync_mon_series.json.data.result | default([])) | length == 0
  tags: [monitoring]
