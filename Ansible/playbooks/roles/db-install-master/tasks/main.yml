---
- name: Creates directory for container
  ansible.builtin.file:
    path: ~/pgdatabase/
    state: directory
    mode: '0750'
- name: Creates directory for PG data
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/pgdatabase/data"
    state: directory
    mode: '0750'
    owner: 70
  become: true

# Copy needed files on servers : docker-compose.yml and init script
- name: Copy docker-compose.yml for master
  template:
    src: docker-compose_master.yml
    dest: ~/pgdatabase/docker-compose.yml
- name: Copy init-master.sql for master
  template:
    src: init-master.sql
    dest: ~/pgdatabase/init-master.sql

# Start container and wait for the server to be up
- name: Start postgres
  community.docker.docker_compose_v2:
    project_src: ~/pgdatabase/
    state: present
- name: Get container information
  community.docker.docker_container_info:
    name: postgres
  register: container_info
- name: Wait max 2'30" for container to be running
  until: container_info.container.State.Status == "running"
  retries: 30
  delay: 5
  community.docker.docker_container_info:
    name: postgres
  register: container_info

######################################################## MASTER STUFF
- name: Copy pg_hba.conf
  template:
    src: pg_hba_master.conf
    dest: "{{ ansible_env.HOME }}/pgdatabase/data/pg_hba.conf"
    owner: 70
    mode: '0750'
  become: yes

- name: Restart postgresql master server in container to take the newpg_hba.conf into account
  community.docker.docker_container_exec:
    container: postgres
    user: postgres
    command: "pg_ctl -D /var/lib/postgresql/data -m fast -w reload -U {{ postgres_user }}"
    detach: no

# Populate the DB with dump if exists
- name: Copy the dbdump.sql file to the container 
  ansible.builtin.template:
    src: dbdump.sql
    dest: "{{ ansible_env.HOME }}/pgdatabase/data/dbdump.sql"
    owner: 70
    group: 70
    mode: '0750'
  become: yes

- name: Check if the dbdump.sql file exists
  stat:
    path: "{{ ansible_env.HOME }}/pgdatabase/data/dbdump.sql"
  become: yes
  register: dumpfile

- name: Display if the file exists
  debug:
    msg: "Found dbdump.sql, importing it..."
  when: dumpfile.stat.exists

- name: Populate initial database if dbdump.sql file exists
  community.docker.docker_container_exec:
    container: postgres
    user: postgres
    command: "psql -U {{ postgres_user }} -d {{ postgres_db }} -f /var/lib/postgresql/data/dbdump.sql"
    detach: no
  when: dumpfile.stat.exists

# Inject DB connection in pgadmin
- name: Create the temporary directory for the key on the control machine
  delegate_to: localhost
  file:
    path: "/tmp/pgadmin_key"
    state: directory
    mode: "0700"

- name: Generate a 32 bytes symmetric key (base64)
  delegate_to: localhost
  run_once: true
  shell: head -c 32 /dev/urandom | base64
  register: pgadmin_key_b64

- name: Upload the base64 encoded pgadmin4.key
  copy:
    content: "{{ pgadmin_key_b64.stdout }}"
    dest: "/opt/pgadmin/pgadmin4.key"
    owner: 5050
    mode: "0600"
  become: yes

- name: Delete the temporary key
  delegate_to: localhost
  file:
    path: "/tmp/pgadmin_key"
    state: absent

- name: Copy the pgadmin servers file
  template:
    src: servers.json
    dest: /opt/pgadmin/servers.json
    mode: "0640"
    owner: 5050
  become: yes
