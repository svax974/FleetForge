---
# Reconstruit la page à partir des marqueurs présents (voir register.yml / unregister.yml).
- name: Create the state directory of the index
  ansible.builtin.file:
    path: "{{ apps_index_state_dir }}"
    state: directory
    owner: "{{ webapp_root_owner | default('root') }}"
    group: "{{ webapp_root_group | default('root') }}"
    mode: '0755'
  become: true

- name: List the registered applications
  ansible.builtin.find:
    paths: "{{ apps_index_state_dir }}"
    patterns: "*.json"
    file_type: file
  register: apps_index_files
  become: true

- name: Read them
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ apps_index_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: apps_index_contents
  become: true

# Le LIBELLÉ est calculé ICI, pas au moment du marqueur : le nom de projet de l'entrée (`webapp_project`), sinon le nom
# d'entrée d'inventaire — jamais le nom d'hôte, qui mélangeait les deux présentations. Le marqueur porte l'URL, qui
# identifie l'entrée.
- name: Work out the entries of the page
  vars:
    _by_url: >-
      {%- set ns = namespace(out={}) -%}
      {%- for host in groups['all'] | default([]) -%}
      {%- set name = hostvars[host].proxy_hostname | default('') -%}
      {%- if name | length > 0 -%}{%- set _ = ns.out.update({'https://' ~ name: host}) -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.out }}
  ansible.builtin.set_fact:
    apps_index_entries: >-
      {%- set out = [] -%}
      {%- for marker in (apps_index_contents.results | default([]) | map(attribute='content') | map('b64decode') | map('from_json') | list) -%}
      {%- set entry = _by_url.get(marker.url, marker.entry | default('')) -%}
      {%- set label = (hostvars[entry].webapp_project | default(entry)) if entry | length > 0 else marker.label | default(marker.url) -%}
      {%- set _ = out.append({'label': label, 'url': marker.url, 'mode': marker.mode | default('private')}) -%}
      {%- endfor -%}
      {{ out | sort(attribute='label') }}

- name: Create the directory of the index
  ansible.builtin.file:
    path: "{{ apps_index_root }}"
    state: directory
    owner: "{{ webapp_root_owner | default('root') }}"
    group: "{{ webapp_root_group | default('root') }}"
    mode: '0755'
  become: true

- name: Write the index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ apps_index_root }}/index.html"
    owner: "{{ webapp_root_owner | default('root') }}"
    group: "{{ webapp_root_group | default('root') }}"
    mode: '0644'
  become: true

- name: Report
  ansible.builtin.debug:
    msg: "Répertoire : {{ apps_index_entries | length }} application(s) — {{ apps_index_entries | map(attribute='label') | join(', ') }}"
  run_once: true
