---
# Supprime AgentHub ET ses données : conteneurs (via agenthub-remove),
# volumes (base SQLite ou Postgres, Redis, dossier partagé, vmagent, y compris
# ceux de l'ancien nom AgentCenter), images, CNAME public. Destructif
# — la base applicative (projets, sessions, historique, clés API) n'est pas
# reconstructible sans sauvegarde.

- name: Refuse to purge without explicit confirmation
  ansible.builtin.assert:
    that:
      - (confirm | default('')) == 'yes'
    fail_msg: >-
      Purge refusée. Cette opération supprime les volumes de données
      AgentHub (Postgres : projets, sessions, prompts, interactions,
      historique, clés API), non reconstructibles sans sauvegarde. Relance
      avec -e confirm=yes en connaissance de cause.

# Pose aussi le fait `agenthub_project_name` (PROJECT_NAME du back/.env de
# prod), réutilisé ci-dessous.
- name: Remove the containers and disable the runner
  ansible.builtin.include_role:
    name: agenthub-remove

# Volumes : seul `postgres_data` porte un nom explicite
# (`${PROJECT_NAME}_postgres_data`, scripts/docker-compose.yml du template) ;
# les autres (`sqlite_data`, `redis_data`, `shared_directory`, `vmagent_data`)
# sont préfixés par le projet compose de deploy-full.sh
# (`<PROJECT_NAME>-back-<hôte>_…`), pas par PROJECT_NAME seul — la liste en dur
# `<project>_redis_data`… ne correspondait à aucun volume réel. Listés par
# l'étiquette compose des projets (nom courant + anciens noms) plutôt que
# devinés, puis filtrés : seul un nom qui commence par l'un de ces préfixes
# suivi de `_` ou `-` est supprimé, quoi que réponde Docker.
- name: Collect the AgentHub project names (current and legacy)
  ansible.builtin.set_fact:
    agenthub_purge_projects: "{{ [agenthub_project_name] + agenthub_legacy_project_names }}"

- name: List the AgentHub volumes
  ansible.builtin.shell: |
    set -euo pipefail
    host={{ ansible_host | replace('.', '-') }}
    {
      for name in {{ agenthub_purge_projects | join(' ') }}; do
        for p in "${name}-back-${host}" "${name}-front-${host}"; do
          docker volume ls -q --filter "label=com.docker.compose.project=${p}"
        done
        if docker volume inspect "${name}_postgres_data" >/dev/null 2>&1; then
          echo "${name}_postgres_data"
        fi
      done
    } | sort -u
  args:
    executable: /bin/bash
  become: true
  register: agenthub_volumes
  changed_when: false

- name: Remove the AgentHub volumes
  community.docker.docker_volume:
    name: "{{ item }}"
    state: absent
  loop: >-
    {{ agenthub_volumes.stdout_lines
       | select('match', '^(' ~ (agenthub_purge_projects | map('regex_escape') | join('|')) ~ ')[_-]')
       | list }}
  become: true

# Images construites sur l'hôte (contexte Docker SSH) : `<PROJECT_NAME>_back`,
# l'image du front nommée d'après son projet compose, l'image de base
# `<project>-nestcli:*`. Même filtre de préfixe que les volumes.
- name: List the AgentHub images
  ansible.builtin.shell: |
    set -euo pipefail
    docker images --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}' \
      | grep -E '^({{ agenthub_purge_projects | join('|') }})[_-]' || true
  args:
    executable: /bin/bash
  become: true
  register: agenthub_images
  changed_when: false

- name: Remove the AgentHub images
  community.docker.docker_image_remove:
    name: "{{ item }}"
  loop: "{{ agenthub_images.stdout_lines }}"
  become: true
  ignore_errors: true

# ── DNS : retirer le CNAME public ───────────────────────────────────────────
- name: Remove the AgentHub CNAME
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_token }}"
    zone: "{{ domain_name }}"
    record: "{{ agenthub_hostname }}"
    type: CNAME
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when: cloudflare_token | default('') | length > 0

- name: Remind the operator about the vhost and the firewall rules
  ansible.builtin.debug:
    msg: >-
      AgentHub purgé (conteneurs, volumes, images, CNAME DNS). Restent à
      retirer à la main si le port doit être réattribué : le gabarit
      sites-enabled/agenthub.conf (proxy-update) et les entrées
      {{ agenthub_front_port }}/{{ agenthub_back_port }} de
      docker_ports_rules (host_vars/ctdapi.yml) — voir la limite documentée
      dans agenthub-remove.
