---
# Supprime AgentHub ET ses données : conteneurs (via agenthub-remove),
# volumes (base SQLite ou Postgres, Redis, dossier partagé, vmagent, y compris
# ceux de l'ancien nom AgentCenter), images, CNAME public. Destructif
# — la base applicative (projets, sessions, historique, clés API) n'est pas
# reconstructible sans sauvegarde.

- name: Refuse to purge without explicit confirmation
  ansible.builtin.assert:
    that:
      - (confirm | default('')) == 'yes'
    fail_msg: >-
      Purge refusée. Cette opération supprime les volumes de données
      AgentHub (Postgres : projets, sessions, prompts, interactions,
      historique, clés API), non reconstructibles sans sauvegarde. Relance
      avec -e confirm=yes en connaissance de cause.

# Pose aussi le fait `agenthub_project_name` (PROJECT_NAME du back/.env de
# prod), réutilisé ci-dessous.
- name: Remove the containers and disable the runner
  ansible.builtin.include_role:
    name: agenthub-remove

# Volumes : seul `postgres_data` porte un nom explicite
# (`${PROJECT_NAME}_postgres_data`, scripts/docker-compose.yml du template) ;
# les autres (`sqlite_data`, `redis_data`, `shared_directory`, `vmagent_data`)
# sont préfixés par le projet compose de deploy-full.sh
# (`<PROJECT_NAME>-back-<hôte>_…`), pas par PROJECT_NAME seul — la liste en dur
# `<project>_redis_data`… ne correspondait à aucun volume réel. Listés par
# l'étiquette compose des projets (nom courant + anciens noms) plutôt que
# devinés, puis filtrés : seul un nom qui commence par l'un de ces préfixes
# suivi de `_` ou `-` est supprimé, quoi que réponde Docker.
- name: Collect the AgentHub project names (current and legacy)
  ansible.builtin.set_fact:
    agenthub_purge_projects: "{{ [agenthub_project_name] + agenthub_legacy_project_names }}"

- name: List the AgentHub volumes
  ansible.builtin.shell: |
    set -euo pipefail
    host={{ ansible_host | replace('.', '-') }}
    {
      for name in {{ agenthub_purge_projects | join(' ') }}; do
        for p in "${name}-back-${host}" "${name}-front-${host}"; do
          docker volume ls -q --filter "label=com.docker.compose.project=${p}"
        done
        if docker volume inspect "${name}_postgres_data" >/dev/null 2>&1; then
          echo "${name}_postgres_data"
        fi
      done
    } | sort -u
  args:
    executable: /bin/bash
  become: true
  register: agenthub_volumes
  changed_when: false

- name: Remove the AgentHub volumes
  community.docker.docker_volume:
    name: "{{ item }}"
    state: absent
  loop: >-
    {{ agenthub_volumes.stdout_lines
       | select('match', '^(' ~ (agenthub_purge_projects | map('regex_escape') | join('|')) ~ ')[_-]')
       | list }}
  become: true

# Images construites sur l'hôte (contexte Docker SSH) : `<PROJECT_NAME>_back`,
# l'image du front nommée d'après son projet compose, l'image de base
# `<project>-nestcli:*`. Même filtre de préfixe que les volumes.
- name: List the AgentHub images
  ansible.builtin.shell: |
    set -euo pipefail
    docker images --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}' \
      | grep -E '^({{ agenthub_purge_projects | join('|') }})[_-]' || true
  args:
    executable: /bin/bash
  become: true
  register: agenthub_images
  changed_when: false

- name: Remove the AgentHub images
  community.docker.docker_image_remove:
    name: "{{ item }}"
  loop: "{{ agenthub_images.stdout_lines }}"
  become: true
  ignore_errors: true

# ── Runners des utilisateurs : comptes, dossiers, unités, puis l'accès du hub ──────────────
# Chaque compte `agr-*` part avec son dossier (connexions aux CLI, copies de projets : des données
# d'AgentHub, comme la base) par l'outil que setup-user-runners.sh a installé (`remove` : unités du
# compte, fichier d'env, commande, processus, `userdel -r`, avec sa propre validation des noms) ;
# sans l'outil (installation incomplète), les mêmes étapes à la main. Puis ce que
# setup-user-runners.sh a posé : le compte de provisionnement (seulement s'il porte son marqueur),
# l'outil, la commande forcée, la règle sudo, le bloc sshd (rechargé) et la règle hosts.allow
# repérée par son commentaire. Le runner du hub (`agents`, /opt/agenthub-runner) reste installé,
# comme avant.
- name: Remove the user runners and their accounts (homes included)
  ansible.builtin.shell: |
    set -euo pipefail
    helper=/usr/local/sbin/agenthub-user-runner
    for user in $(getent passwd | awk -F: '$1 ~ /^agr-[a-z0-9]+$/ { print $1 }'); do
      if [ -x "$helper" ]; then
        "$helper" remove "$user" "${user#agr-}"
      else
        for unit in /etc/systemd/system/agenthub-runner-*.service; do
          [ -e "$unit" ] && grep -qx "User=$user" "$unit" || continue
          name="$(basename "$unit" .service)"
          systemctl disable --now --quiet "$name.service" || true
          rm -f "$unit" "/etc/$name.env" "/usr/local/bin/$name"
        done
        pkill -KILL -u "$user" || true
        userdel -r "$user"
      fi
      echo "removed $user"
    done
    systemctl daemon-reload
  args:
    executable: /bin/bash
  become: true
  register: agenthub_user_runners_purge
  changed_when: "'removed' in agenthub_user_runners_purge.stdout"

# Le filtre de la boucle locale des runners d'utilisateurs (setup-user-runners.sh, 2026-10-30) :
# son service de rafraîchissement, puis sa table nftables (rien d'autre du pare-feu n'est touché).
- name: Remove the user runners' loopback filter (service and nftables table)
  ansible.builtin.shell: |
    set -uo pipefail
    unit=/etc/systemd/system/agenthub-user-runners-firewall.service
    changed=0
    if [ -e "$unit" ]; then
      systemctl disable --now --quiet agenthub-user-runners-firewall.service || true
      rm -f "$unit"
      systemctl daemon-reload
      changed=1
    fi
    if command -v nft >/dev/null 2>&1 && nft list table inet agenthub_user_runners >/dev/null 2>&1; then
      nft delete table inet agenthub_user_runners
      changed=1
    fi
    [ "$changed" -eq 0 ] || echo removed
  args:
    executable: /bin/bash
  become: true
  register: agenthub_user_runners_firewall_purge
  changed_when: "'removed' in agenthub_user_runners_firewall_purge.stdout"

- name: Remove the hub's provisioning account (only the one setup-user-runners.sh created)
  ansible.builtin.shell: |
    set -euo pipefail
    account={{ agenthub_user_runners_account | quote }}
    getent passwd "$account" >/dev/null || exit 0
    [ "$(getent passwd "$account" | cut -d: -f5)" = 'AgentHub user runners (provisioning, SSH forced command)' ] || exit 0
    pkill -KILL -u "$account" || true
    userdel -r "$account"
    echo removed
  args:
    executable: /bin/bash
  become: true
  register: agenthub_provision_account_purge
  changed_when: "'removed' in agenthub_provision_account_purge.stdout"

- name: Remove the user-runner helper, forced command, sudo rule and sshd block
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/agenthub-user-runner
    - /usr/local/bin/agenthub-user-runner-ssh
    - /etc/sudoers.d/agenthub-user-runner
    - /etc/ssh/sshd_config.d/90-agenthub-user-runners.conf
    - /etc/ssh/sshd_config.d/10-agenthub-user-runners-deny.conf
  become: true
  register: agenthub_user_runner_files

- name: Reload sshd without the hub network's block
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  become: true
  when: >-
    agenthub_user_runner_files.results
    | selectattr('changed') | map(attribute='item') | select('search', 'sshd_config') | list | length > 0

- name: Look for /etc/hosts.allow
  ansible.builtin.stat:
    path: /etc/hosts.allow
  become: true
  register: agenthub_hosts_allow

# Le commentaire repère + la ligne qui le suit, exactement ce que setup-user-runners.sh ajoute ;
# le reste du fichier (bloc « ANSIBLE sshd whitelist », lignes d'autres rôles) n'est pas touché.
- name: Remove the hub network's hosts.allow rule (setup-user-runners.sh)
  ansible.builtin.replace:
    path: /etc/hosts.allow
    regexp: '^# AgentHub user runners \(setup-user-runners\.sh\):[^\n]*\nsshd: [^\n]*\n'
    replace: ''
  become: true
  when: agenthub_hosts_allow.stat.exists

# ── DNS : retirer le CNAME public (sauf `cloudflare_front: true`) ────
- name: Remove the AgentHub CNAME
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_token }}"
    zone: "{{ domain_name }}"
    record: "{{ agenthub_hostname }}"
    type: CNAME
    state: absent
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - cloudflare_token | default('') | length > 0
    # Enregistrement géré à la main chez Cloudflare : jamais retiré d'ici.
    - not (hostvars['agenthub'].cloudflare_front | default(false) | bool)

- name: Remind the operator about the vhost and the firewall rules
  ansible.builtin.debug:
    msg: >-
      AgentHub purgé (conteneurs, volumes, images, CNAME DNS, runners des
      utilisateurs et leurs comptes `agr-*`, accès du hub à ce serveur). Restent à
      retirer à la main si le port doit être réattribué : le gabarit
      sites-enabled/agenthub.conf (proxy-update) et les entrées
      {{ agenthub_front_port }}/{{ agenthub_back_port }} de
      docker_ports_rules (host_vars/ctdapi.yml) — voir la limite documentée
      dans agenthub-remove.
