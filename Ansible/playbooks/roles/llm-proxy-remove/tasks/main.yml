---
# Arrête et retire les conteneurs LLM Proxy (via `scripts/clean-remote.sh`
# du dépôt app, la contrepartie de `run.sh prod`/`deploy-full.sh` — voir
# llm-proxy-deploy/defaults pour le choix de ne pas réimplémenter ce mécanisme
# en Ansible), puis retire la sonde. Conserve les volumes de données
# (Postgres, Redis, dossier partagé) — leur suppression relève de
# llm-proxy-purge.
#
# Ne retire PAS le filtrage DOCKER-USER (docker_ports_rules vit dans
# host_vars/ctdapi.yml, une liste par MACHINE, pas par service — voir la
# limite connue de docker-ports-security documentée dans rotki-remove) ni le
# CNAME DNS (llm-proxy-purge s'en charge, destructif).

- name: Check the prod back env file on the control machine
  ansible.builtin.stat:
    path: "{{ llm_proxy_src }}back/.env"
  delegate_to: localhost
  become: false
  register: llm_proxy_remove_env_stat

# PROJECT_NAME lu dans le back/.env de prod plutôt que supposé : il préfixe
# les conteneurs, les projets compose et les volumes. Le fait survit à ce rôle
# (set_fact est porté par l'hôte), llm-proxy-purge le réutilise.
- name: Read PROJECT_NAME from the local back/.env
  ansible.builtin.set_fact:
    llm_proxy_project_name: >-
      {{ (lookup('ansible.builtin.file', llm_proxy_src ~ 'back/.env', errors='ignore')
          | default('', true) | regex_findall('^PROJECT_NAME=["\']?([^"\'\n]*)', multiline=True)
          | first | default(llm_proxy_project_name_default)) | trim }}

- name: Stop and remove the LLM Proxy containers (clean-remote.sh)
  ansible.builtin.command:
    cmd: ./scripts/clean-remote.sh
  args:
    chdir: "{{ llm_proxy_src }}"
  delegate_to: localhost
  become: false
  register: llm_proxy_clean_remote
  changed_when: true
  when: llm_proxy_remove_env_stat.stat.exists
  failed_when: false

- name: Warn when clean-remote.sh could not run
  ansible.builtin.debug:
    msg: >-
      {{ llm_proxy_src }}back/.env introuvable sur le poste de contrôle (ou
      clean-remote.sh en échec) : la passe suivante, exécutée sur l'hôte,
      retire quand même les conteneurs des projets compose
      {{ llm_proxy_project_name }}-back-*/-front-*.
  when: >-
    not llm_proxy_remove_env_stat.stat.exists
    or (llm_proxy_clean_remote.rc | default(0)) != 0

# clean-remote.sh ne connaît que `<PROJECT_NAME>_front`/`_back`/`_postgres`.
# Or deploy-full.sh lance le back en projet compose `<PROJECT_NAME>-back-<hôte>`
# (réplicas `…-back-1`, sans container_name), avec `_back_lb` et `_redis` : ils
# resteraient en marche, ports 4801/4803 tenus. Passe complémentaire sur
# l'hôte, par l'étiquette compose des DEUX projets de déploiement — rien
# d'autre sur la machine ne porte ces étiquettes.
- name: Remove every container left in the LLM Proxy compose projects
  ansible.builtin.shell: |
    set -euo pipefail
    for p in {{ llm_proxy_project_name }}-back-{{ ansible_host | replace('.', '-') }} {{ llm_proxy_project_name }}-front-{{ ansible_host | replace('.', '-') }}; do
      ids=$(docker ps -aq --filter "label=com.docker.compose.project=${p}")
      if [ -n "${ids}" ]; then
        docker rm -f ${ids} >/dev/null
        echo "removed ${p}"
      fi
    done
  args:
    executable: /bin/bash
  become: true
  register: llm_proxy_sweep
  changed_when: "'removed' in llm_proxy_sweep.stdout"

- name: Remove the LLM Proxy probe
  ansible.builtin.file:
    path: "{{ svcprobe_checks_dir | default('/etc/svcprobe/checks.d') }}/llm-proxy.json"
    state: absent
  become: true
  tags: [monitoring]

- name: Remind the operator about docker_ports_rules and the CNAME
  ansible.builtin.debug:
    msg: >-
      LLM Proxy arrêté (conteneurs retirés, volumes conservés). Les ports
      {{ llm_proxy_front_port }}/{{ llm_proxy_back_port }}/4802/4803 restent
      dans docker_ports_rules (host_vars/ctdapi.yml), le vhost
      sites-enabled/llm-proxy.conf sur les proxies et le CNAME
      {{ llm_proxy_hostname }} restent publiés tant qu'ils ne sont pas retirés
      à la main (voir llm-proxy-purge pour le CNAME).
