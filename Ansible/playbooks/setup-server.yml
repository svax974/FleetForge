---
# Bootstrap d'une machine NEUVE : connexion en root sur le port 22, migration
# vers le port SSH du parc, création de l'utilisateur de service, outillage de
# base et node_exporter.
#
#   ./play.sh papanglabs setup-server.yml --limit <hôte>
#
# Machine dont l'image INTERDIT le login root (Oracle Cloud : forced-command
# « Please login as the user "ubuntu" » dans /root/.ssh/authorized_keys) —
# l'utilisateur de service n'existe pas encore, c'est ce playbook qui le crée,
# donc le seul compte disponible est celui de l'image, sudoer sans mot de passe :
#
#   ./play.sh web3c setup-server.yml --limit small3 -e ansible_user=ubuntu
#
# Le compte d'image est DÉDUIT du `provider` (`bootstrap_users` ci-dessous) :
# ovh et oracle interdisent root, ils se connectent en `ubuntu` sans `-e`, les
# autres (contabo…) en root. Posé en VARIABLE de play (`ansible_user`) et non en
# mot-clé `remote_user` : les group_vars du parc posent `ansible_user:
# {{ remote_username }}`, et une variable de connexion l'emporte sur le
# mot-clé — la connexion partait en `srvc`, qui n'existe pas encore (constat du
# 27/10/2026 sur une machine contabo neuve). Une variable de play l'emporte sur
# group_vars et host_vars. Le `-e ansible_user=…` reste prioritaire (image
# atypique, compte `debian`). Ne vaut que pour ce playbook : les `deploy-*` se
# connectent en `srvc`.
#
# Ne pas figer ce compte dans l'inventaire : il ne vaut QUE pour le tout premier
# passage. Une fois `security-create-user` joué, la machine se pilote comme les
# autres, avec `remote_username` hérité des group_vars.
#
# C'est le SEUL point d'entrée pour une machine vierge : `host-preflight`, joué
# par tous les `deploy-*`, ne peut rien réparer avant que SSH et l'utilisateur
# de service n'existent — il se connecte justement avec eux.
#
# Ne jamais jouer sans `--limit` : le motif `all` rejouerait le bootstrap sur
# tout l'inventaire, dont `install-tools` qui fait un `apt upgrade dist`.
#
# INDÉPENDANT de la supervision et des services : le socle (SSH, utilisateur,
# outils, Docker, node_exporter) se pose sans toucher à aucun autre hôte, y
# compris sur la machine de supervision elle-même. L'enregistrement de la cible
# Prometheus est une étape finale « au mieux » (post_tasks) : si elle échoue —
# supervision absente ou pas encore installée, ou `-e ansible_user=ubuntu`, qui
# s'applique aussi à l'hôte vers lequel on délègue —, un AVERTISSEMENT le dit
# et le play réussit quand même. La cible est alors posée par `host-preflight`
# au premier `deploy-*`, ou tout de suite par :
#   ./play.sh <parc> deploy-exporter-sys.yml --limit <hôte>

- name: Common server setup
  hosts: all
  gather_facts: false

  vars:
    ansible_user: "{{ bootstrap_users[provider | default('')] | default('root') }}"
    # Fournisseurs dont l'image interdit le login root : compte sudoer d'origine.
    bootstrap_users:
      ovh: ubuntu
      oracle: ubuntu

  # `become` est porté par les RÔLES, pas par le play : se connecter en root ne
  # décide de rien (le compte d'image peut être `ubuntu`), et surtout
  # une image cloud peut interdire le login root — le bootstrap arrive alors
  # avec un compte sudoer ordinaire. Sans become, la première tâche qui touche
  # à systemd part en polkit et meurt sur un timeout D-Bus de 25 s, dont le
  # message ne parle jamais de permissions : « Failed to disable unit:
  # Connection timed out ». Quand la connexion se fait en root, become est un
  # no-op — le comportement des machines déjà en parc est inchangé.
  pre_tasks:
    # Le cache de faits (ansible.cfg, 2 h) est indexé par NOM d'inventaire : une
    # entrée déplacée sur une machine neuve hérite de l'interpréteur Python
    # découvert sur l'ancienne (`/usr/bin/python3.12: not found`, constaté le
    # 27/10/2026 sur agenthub). Un bootstrap ne se fie à rien de ce qui a été
    # mémorisé sur ce nom.
    - name: Forget the cached facts of this host
      ansible.builtin.meta: clear_facts

    # `host-preflight` ne tourne que sur les `deploy-*` : une machine qui ne
    # reçoit que le socle n'y passerait jamais, et son inventaire ne serait donc
    # jamais contrôlé. L'assert est local, il n'exige aucune connexion.
    - name: Check the mandatory inventory metadata
      ansible.builtin.include_role:
        name: host-preflight
        tasks_from: inventory
      tags: [always]

  roles:
    - { role: security-ssh, become: true }
    - { role: set-hostname, become: true }
    - { role: install-tools, become: true }
    - { role: install-python, become: true }
    - { role: install-docker, become: true }
    - { role: security-create-user, become: true }
    # Compte openclaw-ro, seulement si le parc déclare des clés en lecture
    # seule (keys/<parc>/readonly/) : sinon le rôle ne fait rien.
    - { role: readonly-user-install, become: true }
    # APRÈS security-create-user, et pas avant : les scripts et alias vont dans
    # le home de `remote_username`, qui doit donc exister.
    - { role: install-scripts, become: true }
    # Plafond du journal systemd. Posé sur une machine NEUVE, donc avant qu'elle
    # n'accumule : le défaut de journald (10 % du disque, aucune rétention
    # maximale) ne se remarque que le jour où on cherche de la place.
    - { role: journald-setup, become: true }
    # `exporter-sys-install`, et non l'ancien `exporter-sys` supprimé le
    # 13/08/2026 : ce dernier n'enregistrait AUCUNE cible Prometheus (son
    # gabarit JSON n'était appelé par aucune tâche), ignorait `monitor_port`
    # — donc écoutait toujours sur 9100, y compris derrière le NAT partagé de
    # hub/nuc — et n'activait ni `--collector.systemd` ni `--collector.textfile`,
    # laissant SystemdUnitFailed et les alertes de sauvegarde sans séries.
    # Une machine bootstrapée gagnait ainsi un exporter que personne ne scrapait,
    # cas de small3.
    # Installe node_exporter SEUL : pas d'enregistrement de cible, pas de règle
    # de scrape (`exporter_register_target: false`). Le bootstrap ne dépend ni
    # de la supervision ni d'aucun autre hôte — voir post_tasks.
    - { role: exporter-sys-install, become: true, exporter_register_target: false }
    # At the end of root stuff, disable root ssh and ssh from everywhere
    #- security-restrict

  post_tasks:
    # Témoin d'exécution : c'est lui que `host-preflight` cherche au début de
    # chaque déploiement pour savoir si la machine a été bootstrapée, et lui
    # qui permet de répondre depuis la machine — sans le dépôt sous la main —
    # à « quand, et depuis quel poste ? ».
    #   jq . /var/lib/fleetforge/state/setup-server.json
    - name: Record the bootstrap
      ansible.builtin.include_role:
        name: host-preflight
        tasks_from: stamp
      vars:
        stamp_name: setup-server
        stamp_detail: >-
          security-ssh, set-hostname, install-scripts, install-tools,
          install-python, install-docker, security-create-user,
          readonly-user-install, journald-setup, exporter-sys-install

    # Au mieux, et APRÈS le témoin : le bootstrap est réussi quoi qu'il arrive
    # ici. `rescue` rend l'échec visible sans le propager (jamais silencieux :
    # une cible absente = une machine que personne ne supervise).
    # `ignore_unreachable` : un `rescue` n'attrape PAS un hôte injoignable, et ici
    # la délégation vers `prometheus_host` l'est si un `-e ansible_user=…`
    # (compte de l'image, précédence maximale) s'applique aussi à cet hôte — l'hôte bootstrapé serait alors
    # marqué injoignable (rc=4) alors que son socle est entièrement posé.
    - name: Register the node_exporter target (best effort)
      tags: [monitoring]
      become: true
      ignore_unreachable: true
      block:
        - name: Register the Prometheus target and open the scrape
          ansible.builtin.include_role:
            name: exporter-sys-install
            tasks_from: target
      rescue:
        - name: Warn that the target is not registered
          ansible.builtin.debug:
            msg: >-
              ATTENTION : la cible node_exporter de {{ inventory_hostname }} n'est
              PAS enregistrée sur {{ prometheus_host | default('prometheus_host') }}
              — cette machine n'est pas supervisée. Le socle est posé. Pour
              l'enregistrer : ./play.sh {{ parc_name | default('<parc>') }}
              deploy-exporter-sys.yml --limit {{ inventory_hostname }}

# ── Verrouillage SSH ─────────────────────────────────────────────────────────
# Après le bootstrap : l'utilisateur de service et ses clés existent, la connexion se fait désormais
# avec eux. Placer ce rôle dans la première étape couperait l'amorçage, qui s'authentifie par mot de
# passe tant que la clé n'est pas posée.
- name: SSH hardening and cloud-init neutralisation
  hosts: all
  remote_user: "{{ remote_username }}"
  gather_facts: false
  roles:
    - sshd-security
