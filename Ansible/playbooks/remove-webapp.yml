---
# Retire une application WebAppTemplate de sa machine : conteneurs et sonde (volumes conservés — `purge-webapp.yml`),
# puis son vhost des proxies. Contrepartie de `deploy-webapp.yml`.
#
#   ./play.sh web3c remove-webapp.yml -e webapp=llm-proxy
#   ./play.sh web3c remove-webapp.yml -e webapp=llm-proxy --tags proxy-conf    # le vhost seulement
- name: Select the application
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    # Un fait interne donné par `-e` (wa_ufw_foreign, webapp_target…) fausserait le retrait (no-overrides.yml).
    - name: Refuse internal facts given on the command line
      ansible.builtin.include_role:
        name: webapp-setup
        tasks_from: no-overrides
        apply:
          tags: [always]
    - name: Check the parameter and find the entry
      ansible.builtin.assert:
        that: webapp is defined and webapp in groups['all']
        fail_msg: "`-e webapp=<entrée d'inventaire>` est requis."
        quiet: true
    - name: Put the application in the target group
      ansible.builtin.add_host:
        name: "{{ webapp }}"
        groups: webapp_target
      changed_when: false

# Adresses et ports de chaque entrée, lus dans leur contexte (les gardes de ports du profil durci comparent les voisines).
- name: Lecture des ports de chaque entrée
  ansible.builtin.import_playbook: lib/probe-entry-ports.yml

- name: Retirer l'application de sa machine
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  roles:
    - webapp-remove

- name: Retirer le vhost des proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  tags: [proxy-conf]
  tasks:
    - name: Remove the generic vhost
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: remove-one-site
      vars:
        site: "webapp-{{ ((hostvars[webapp].webapp_project | default(webapp)) | lower | replace('_', '-') ~ '-back.' ~ domain_name) if (hostvars[webapp].cloudflare_front | default(false) | bool) else hostvars[webapp].proxy_hostname }}.conf"
      when: hostvars[webapp].proxy_hostname is defined

# Le répertoire suit le retrait : marqueur retiré, page reconstruite.
- name: Refresh the applications index
  hosts: proxies
  remote_user: "{{ remote_username }}"
  gather_facts: false
  become: true
  tags: [apps-index]
  tasks:
    - name: unregister the application
      ansible.builtin.include_role:
        name: apps-index
        tasks_from: unregister
      loop: "{{ groups['webapp_target'] | default([]) }}"
      loop_control:
        label: "{{ item }}"
      vars:
        apps_index_entry: "{{ item }}"

    - name: Rebuild the page
      ansible.builtin.include_role:
        name: apps-index
        tasks_from: page
