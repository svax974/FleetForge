---
# Purge complète du périmètre Ansible sur tradekong : sonde svcprobe ET
# sauvegarde PostgreSQL (dispositif + dumps sur la destination). DESTRUCTIF.
# Ne touche pas à la stack docker-compose, hors Ansible.
#
#   ./play.sh web3c purge-tradekong.yml -e confirm=yes

- name: Purge de la supervision et de la sauvegarde
  hosts: tradekong
  remote_user: "{{ remote_username }}"
  roles:
    - tradekong-purge
