---
# ./play.sh <parc> deploy-cloudflare-ddns.yml --limit <machine>
# Ajouter cloudflare-ddns à ansible_roles de l'entrée CANONIQUE de la machine,
# et à prom_alert_groups du parc. Voir docs/cloudflare-ddns.md.
- name: Sélection des machines portant la famille cloudflare-ddns
  hosts: all
  gather_facts: false
  tags: [always]
  tasks:
    - name: Select the DDNS hosts
      ansible.builtin.group_by:
        key: "cloudflare_ddns_{{ 'yes' if 'cloudflare-ddns' in (ansible_roles | default([])) else 'no' }}"

    - name: Require a selected machine and the service alert group
      ansible.builtin.assert:
        that:
          - groups['cloudflare_ddns_yes'] | default([]) | length > 0
          - "'services' in (prom_alert_groups | default([]))"
        fail_msg: "Déclarer ansible_roles: [..., cloudflare-ddns] sur la machine et le groupe services dans prom_alert_groups du parc."
      run_once: true

    # Le groupe `cloudflare-ddns` n'est PAS exigé : sur une machine dont svcprobe n'est pas scrapable (routeur),
    # une règle chargée serait indiscernable d'une règle qui veille. On le signale, sans bloquer.
    - name: Say when the DDNS alerts are not loaded
      ansible.builtin.debug:
        msg: >-
          ATTENTION — le groupe d'alertes `cloudflare-ddns` n'est pas dans prom_alert_groups : le client est déployé
          SANS alerte. L'ajouter dès que la sonde svcprobe de cette machine est scrapée par Prometheus
          (voir docs/cloudflare-ddns.md, « Supervision »).
      when: "'cloudflare-ddns' not in (prom_alert_groups | default([]))"
      run_once: true

- name: Contrôle préalable des machines DDNS
  hosts: cloudflare_ddns_yes
  remote_user: "{{ remote_username }}"
  roles:
    - role: host-preflight
      preflight_require_docker: true

- name: Déploiement du client Cloudflare DDNS
  hosts: cloudflare_ddns_yes
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - cloudflare-ddns-install
    - role: cloudflare-ddns-monitoring
      tags: [monitoring]

  tasks:
    # Délégation : le --limit de la machine ne doit pas exclure Prometheus.
    - name: Load the DDNS alerts on the monitoring host
      ansible.builtin.include_role:
        name: prometheus-alerts-update
        apply:
          delegate_to: "{{ prometheus_host }}"
          become: true
          tags: [alerts, monitoring]
      vars:
        prom_alerts_target: "{{ prometheus_host }}"
      when: inventory_hostname == groups['cloudflare_ddns_yes'] | first
      tags: [alerts, monitoring]
