---
# OpenClaw (https://openclaw.ai) — assistant IA auto-hébergé, installé
# NATIVEMENT (CLI officiel, `install-cli.sh`, auto-suffisant) sur la machine
# hub (entrée d'inventaire `openclaw`), sous le compte `srvc` avec démon en systemd --user. Bootstrap
# entièrement non interactif : jeton de gateway généré une fois sur l'hôte,
# clé fournisseur lue depuis l'environnement du process, pas de canal de
# discussion connecté.
#
# Idempotent : si OpenClaw est déjà installé et onboardé, seuls la
# configuration des proxies de confiance et le contrôle de santé rejouent. Le
# pare-feu et la supervision, eux, sont TOUJOURS rejoués : ce sont les étapes
# annexes que ce playbook garantit à chaque exécution, install ou pas.
#
# Entrée dédiée `openclaw` (service publié par les proxies, CLAUDE.md § 2) :
# même adresse, port SSH et ports de scrape que l'entrée `hub`, dont elle
# décrit la machine. Celle-ci partage le NAT domestique avec
# station/nuc/proxy2/vpn1 ; host-preflight retrouve node_exporter/svcprobe
# déjà enregistrés par adresse + port de scrape.
#
#   ./play.sh web3c deploy-openclaw.yml
#   ./play.sh web3c deploy-openclaw.yml --tags monitoring   # réarmer la supervision

# ── Contrôle préalable (OBLIGATOIRE, voir CLAUDE.md) ───────────────────────
- name: Contrôle préalable
  hosts: openclaw
  remote_user: "{{ remote_username }}"
  roles:
    - host-preflight

- name: Deploy OpenClaw
  hosts: openclaw
  remote_user: "{{ remote_username }}"
  roles:
    - openclaw-install

# Installation native sous systemd : ufw filtre RÉELLEMENT ce port (pas de
# publication Docker à contourner ici, contrairement à l'ancienne install).
- name: OpenClaw firewall
  hosts: openclaw
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - openclaw-security

# ── Supervision (OBLIGATOIRE, voir CLAUDE.md) ──────────────────────────────
- name: Supervision du service
  hosts: openclaw
  remote_user: "{{ remote_username }}"
  roles:
    - openclaw-monitoring

# ── Vhost sur les proxies ──────────────────────────────────────────────────
# Sans lui le nom public (CNAME garanti par le rôle d'installation) ne répond pas.
# Pousse SEULEMENT sites-enabled/openclaw.conf : reload si le fichier a changé, jamais les
# autres vhosts (même motif que deploy-agenthub.yml / deploy-fleetforge.yml). Un parc
# dont le dossier nginx ne le porte pas est simplement ignoré. Pas de `--limit` : il
# exclurait les proxies.
- name: Vhost OpenClaw sur les proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  tags: [proxy-conf]
  tasks:
    - name: Look for the OpenClaw vhost of this parc
      ansible.builtin.set_fact:
        vhost_wanted: >-
          {{ (query('ansible.builtin.fileglob',
                    playbook_dir ~ '/../parcs/' ~ parc_name ~ '/nginx/sites-enabled/openclaw.conf') | length > 0)
             and ('openclaw' in groups['all']) }}

    - name: Deploy just the OpenClaw vhost
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: deploy-one-site
      vars:
        site: openclaw.conf
      when: vhost_wanted | bool
