---
# FleetForge servi dans un navigateur.
#
# La même application que le paquetage de bureau — même frontal React, même
# cœur `fleetforge-core` — servie en HTTP par le binaire `fleetforge-web`. Le paquetage
# Tauri n'est pas abandonné pour autant : `npm run tauri:build` continue de
# produire l'application de bureau, à partir des mêmes sources.
#
# PARTICULARITÉ DE CE SERVICE : la machine devient un NŒUD DE CONTRÔLE Ansible.
# L'application y lance de vrais playbooks sur tout le parc. D'où deux
# dispositifs qu'aucun autre rôle du dépôt n'a :
#   • le serveur REFUSE de démarrer sur une interface publique sans mot de
#     passe — un port ouvert ici est un accès administrateur ;
#   • les secrets de pilotage (clé SSH du parc, mot de passe du vault) ne sont
#     PAS livrés par défaut. Sans eux l'application montre le parc mais ne peut
#     rien déployer. C'est une décision à prendre explicitement.
#
# Prérequis sur le POSTE : le frontal doit être construit.
#   cd apps/gui && npm install && npm run build
#
#   ./play.sh web3c deploy-fleetforge.yml
#   ./play.sh papanglabs deploy-fleetforge.yml
#   ./play.sh web3c deploy-fleetforge.yml --tags monitoring   # réarmer la supervision
#   ./play.sh web3c deploy-fleetforge.yml --tags code         # relivrer le code seul
#
# Avec pilotage réel du parc (à jouer en connaissance de cause) :
#   ./play.sh web3c deploy-fleetforge.yml -e ff_deploy_secrets=true
#
# Ce mode crée au premier passage une clé SSH DÉDIÉE sur le poste, dépose sa
# passphrase et le mot de passe d'accès — chiffrés — dans
# playbooks/group_vars/<parc>.yml, et autorise la clé sur le parc en la
# restreignant à l'adresse de cette machine. Rien n'est régénéré ensuite : un
# rejeu réutilise ce que le vault contient déjà. Le fichier de parc modifié est
# à COMMITTER, faute de quoi un autre clone tirera d'autres secrets.
#
# Le vhost (infra.<domaine>, mode privé : vpns, supervision, whitelist, serveurs
# liés) et les règles d'alerte sont posés par ce playbook (tags `proxy-conf` et
# `alerts`) ; `update-proxy.yml` reste la resynchronisation complète des proxies :
#   ./play.sh web3c deploy-fleetforge.yml --tags proxy-conf   # vhost seul
#   ./play.sh web3c deploy-fleetforge.yml --tags alerts       # règles d'alerte seules
# Son nom public est un CNAME vers le front des proxies, garanti par le rôle
# d'installation (`proxy_hostname` sur l'entrée, tag `dns`) ; le `hostname` de
# l'entrée (infra-priv.<domaine>) reste l'identité machine.
#
# Pare-feu : `fleetforge-security` pose les ouvertures et RETIRE celles dont la
# source n'est plus voulue, sans `ufw reset`. À rejouer sans redéployer quand la
# whitelist ou les proxies changent :
#   ./play.sh web3c update-ufw-all.yml --limit infra1
#
# Facultatif, pour AgentHub (poste « Infrastructure Manager », RUNNING.md,
# « API d'automatisation ») :
#   • `ff_api_user: agenthub` dans le group_vars du parc — compte
#     d'automatisation, cantonné à l'API ; mot de passe tiré au premier
#     passage et chiffré dans le même fichier (à committer) ;
#   • `ff_ro_diagnostics: true` — clé de diagnostic lecture seule, déposée dans
#     keys/<parc>/readonly/ puis posée sur le parc avec `from=` :
#       ./play.sh web3c deploy-readonly-user.yml --limit <entrées canoniques>
#   • `ff_ansible_dir` / `ff_ansible_sync: false` — arbre Ansible tenu ailleurs.
#
# ════ UN PLAYBOOK : FleetForge, sa passerelle MCP ET la sauvegarde de sa base ═
# Ce playbook déploie aussi la passerelle MCP de FleetForge (`fleetforge-gateway`,
# app Nest du gabarit, dépôt PRIVÉ séparé) : une entrée d'inventaire DÉDIÉE du
# groupe `fleetforge_gateways`, de famille GÉNÉRIQUE `webapp` avec le profil
# durci `webapp_hardening` (jamais l'entrée de FleetForge, jamais la famille
# `fleetforge`). Ses plays sont ceux de deploy-webapp.yml, IMPORTÉ après ceux de
# FleetForge (docs/etude-passerelle-sur-webapp.md), suivi de la sauvegarde de sa base (ci-dessous). Un parc sans ce groupe
# (papanglabs) se déploie exactement comme avant : rien n'est visé.
#
#   ./play.sh web3c deploy-fleetforge.yml                              # les deux
#   ./play.sh web3c deploy-fleetforge.yml -e ff_deploy_scope=fleetforge  # FleetForge seul
#   ./play.sh web3c deploy-fleetforge.yml -e ff_deploy_scope=gateway     # passerelle seule
#   ./play.sh web3c deploy-fleetforge.yml --tags gateway               # plays de la passerelle
#   ./play.sh web3c deploy-fleetforge.yml --tags proxy-conf            # les DEUX vhosts
#   ./play.sh web3c deploy-fleetforge.yml -e ff_deploy_scope=gateway --tags hardening
#                                                   # recontrôle du durcissement seul
#   ./play.sh web3c deploy-fleetforge.yml --tags backup                # sauvegarde de la base seule
# Retrait : remove-webapp.yml / purge-webapp.yml -e webapp=fleetforge-gateway.
#
# SAUVEGARDE DE LA BASE DE LA PASSERELLE (famille `backup`, tag `backup`) : jouée EN FIN de
# playbook, une fois la base créée, pour la seule passerelle et sa seule destination
# (`backup-fleetforge-gateway`) — avant, `deploy-backup.yml --limit
# fleetforge-gateway:backup-fleetforge-gateway` à part. Opt-in par l'inventaire (`backup` dans
# `ansible_roles` de la passerelle, `pgbak_*`, destinataire age ; docs/etude-passerelle-sur-webapp.md) :
# sans cela, aucun hôte visé et aucune connexion. `ff_deploy_scope=fleetforge` la saute ; en
# `--check` elle n'est pas simulée (voir le bas du fichier). `deploy-backup.yml` reste le
# playbook des autres sauvegardes et de `--tags retarget` ; il importe les mêmes plays de la
# passerelle (lib/gateway-backup-*.yml).
#
# PRÉREQUIS AVANT LE PREMIER DÉPLOIEMENT RÉEL de la passerelle :
#   1. CHOISIR LA MACHINE : `ansible_host` de l'entrée dédiée (aucune adresse,
#      aucun chemin de la machine de contrôle n'est écrit dans les rôles).
#      Décision du 16/11/2026 : machine PROPRE (partagée avec d'autres apps
#      `webapp`), hors du nœud de contrôle `infra1` ; l'ancien choix (la MÊME
#      machine qu'`infra1`) reste géré : proxy local, `access_local_cidrs`.
#      Machine distante : AUCUN proxy dessus, tous distants ; l'amont est joint
#      par le proxy de SA machine (443, FORWARD, MASQUÉ sous l'adresse publique
#      de la passerelle : `masquerade_ack: true` sur les lignes `egress_allow`
#      qui visent un proxy), le relais SMTP de même ; prérequis hors dépôt :
#      A de `hostname`, soumission 587 de mail1 ouverte à cette adresse + compte
#      SASL lié à un expéditeur, vhost de l'amont rejoué (`--tags proxy-conf`)
#      pour qu'il admette la nouvelle adresse (`access_linked`) ;
#   2. les comptes aval `ffg_read`/`ffg_check`/`ffg_run` dans `ff_api_accounts`
#      de l'entrée FleetForge (mots de passe tirés et chiffrés au group_vars du
#      parc par fleetforge-install, à COMMITTER), la passerelle dans son
#      `access_linked`, les mots de passe nommés par `webapp_env_from_vault` de
#      la passerelle — le play de garde le vérifie ;
#   3. le compose DURCI du gabarit (`scripts/docker-compose-hardened.yml`,
#      spécification : docs/etude-passerelle-sur-webapp.md § 8) — refusé AVANT
#      déploiement sinon (scripts/webapp_hardening_check.py, interpolation +
#      `docker compose config`), puis vérifié sur la machine (dans le bloc du
#      déploiement et par le tag `hardening` : conteneurs ARRÊTÉS au moindre
#      écart ou échec) ;
#   4. une revue Opus indépendante (docs/avant-ouverture-public.md).
#
# EXPOSITION (E1, plan 06 §7) : vhost PRIVÉ ; `/mcp` (location de
# `webapp_vhost_locations` relayée au back-lb, liste NOMMÉE `access`) limité aux
# serveurs `hosts` (infra1, AgentHub) et, en TEST seulement, à la whitelist
# (`whitelist: true` — à repasser à `false` dès la fin des tests et avant toute
# exposition E2/E3), filtrée : IPv4 seule ou /32, IPv6 de préfixe ≥
# `v6_min_prefix` (128 par défaut) ; ni vpns ni plage large. Second niveau, côté app : chaque credential `exec`
# porte sa propre allow-list d'adresses (≤ /16, `mcp-access`), qui ne
# s'élargit pas avec la whitelist. Ports publiés (DOCKER-USER, règles en tête
# de chaîne) : proxies ADMIS seulement — jamais un proxy à l'adresse d'un VPN —,
# plus le seul sous-réseau Docker dédié pour le back-lb. Les autres apps de la
# machine (chaîne alimentée par `docker-ports-security`, règles AJOUTÉES en
# queue) ne sont pas touchées : le pare-feu de la passerelle est propre à elle.
# TRUST_PROXY de l'app :
# liste EXPLICITE (proxies admis, passerelle du réseau dédié si un proxy est
# sur la machine, front et back-lb à adresse fixe), et le back-lb réécrit
# X-Forwarded-For.
# Adresses des serveurs VPN écartées de `/mcp` (proxy2 = vpn1 = NAT domestique) :
# `vpn_addresses: true` OUVRE /mcp À TOUT CE QUI SORT PAR LE VPN — décision
# explicite du propriétaire, pour des tests depuis chez lui (décision : false).
# Comptes `ffg_check`/`ffg_run` : liste blanche `allow_playbooks` =
# update-prometheus-alerts.yml + check-monitoring.yml (décision du 15/11/2026),
# et liste de refus couvrant tout playbook « sensible » (scripts/webapp_hardening_check.py).
# Ports publiés en `0.0.0.0:` EXPLICITE (sinon docker-proxy publierait aussi
# `[::]`, en INPUT, hors DOCKER-USER) ; ufw actif en `deny` entrant vérifié.
# RISQUE RÉSIDUEL tant qu'un PROXY partage la machine : tout processus local peut
# joindre les ports publiés par la boucle locale (vu comme le proxy local, donc
# de confiance) et choisir l'adresse qu'il annonce — la clé `ffg_` reste exigée,
# mais l'allow-list d'adresses d'un credential ne protège plus contre lui (sans
# proxy sur la machine : seul root joint ces ports en local).
# RISQUE RÉSIDUEL d'une machine distante : la sortie vers l'amont est masquée sous
# l'adresse publique de la machine, que les vhosts écrits à la main du parc
# admettent au titre de « tous les hôtes de l'inventaire » (le conteneur choisit
# le `Host` envoyé au proxy : seul l'ensemble IP:443 est filtré, pas le vhost). Fermé en déclarant un ÉCOUTEUR DÉDIÉ
# (`dedicated_listeners` sur l'entrée FleetForge + `egress_allow.upstream.port` de la passerelle = ce port, ufw de proxy1
# ouvert à sa seule adresse : docs/etude-passerelle-sur-webapp.md, « Écouteur dédié »). Rejeu : `--tags proxy-conf` AVANT
# la passerelle ; `-e ff_deploy_scope=gateway` ne pose ni le vhost ni l'ouverture ufw.
# Comptes aval : `ffg_run` porte `accept_own_checks: false` — seuls les checks
# de `ffg_check` ouvrent ses runs réels.
# E2/E3 (OAuth public) : voir docs/avant-ouverture-public.md (machine partagée avec
# d'autres applications ; docs/etude-isolation-passerelle-vm.md pour un noyau séparé).

# ── Paramètres (AVANT toute connexion) ─────────────────────────────────────
# `ff_deploy_scope` validé d'emblée ; un `-e webapp=…` l'emporterait sur les
# `vars:` de l'import de deploy-webapp.yml : il n'est admis que s'il désigne
# l'entrée de la passerelle, et jamais avec le scope `fleetforge`.
- name: Paramètres du déploiement
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Check the deployment scope and the application named on the command line
      ansible.builtin.assert:
        that:
          - (ff_deploy_scope | default('all')) in ['all', 'fleetforge', 'gateway']
          - >-
            webapp is not defined
            or ((ff_deploy_scope | default('all')) != 'fleetforge'
                and webapp == (groups['fleetforge_gateways'] | default([]) | first | default('')))
        fail_msg: >-
          ff_deploy_scope : all, fleetforge ou gateway (reçu « {{ ff_deploy_scope | default('all') }} ») ; `-e webapp`
          n'est admis ici que pour l'entrée de la passerelle ({{ groups['fleetforge_gateways'] | default([]) | first | default('aucune') }}),
          jamais avec ff_deploy_scope=fleetforge — les autres applications passent par deploy-webapp.yml.
        quiet: true

# ── Contrôle préalable (OBLIGATOIRE, voir CLAUDE.md) ───────────────────────
# `ff_deploy_scope=gateway` : les plays de FleetForge s'arrêtent avant toute
# connexion (`gather_facts` faux, puis
# `end_play`). Valeur par défaut `all` : comportement inchangé.
- name: Contrôle préalable
  hosts: infras
  remote_user: "{{ remote_username }}"
  gather_facts: "{{ (ff_deploy_scope | default('all')) != 'gateway' }}"
  pre_tasks:
    - name: Skip FleetForge when only the gateway is deployed
      ansible.builtin.meta: end_play
      when: (ff_deploy_scope | default('all')) == 'gateway'
      tags: [always]
  roles:
    - host-preflight

- name: Deploy FleetForge
  hosts: infras
  remote_user: "{{ remote_username }}"
  gather_facts: "{{ (ff_deploy_scope | default('all')) != 'gateway' }}"
  pre_tasks:
    - name: Skip FleetForge when only the gateway is deployed
      ansible.builtin.meta: end_play
      when: (ff_deploy_scope | default('all')) == 'gateway'
      tags: [always]
  roles:
    - fleetforge-install

# Le port n'est pas publié par Docker : les règles ufw s'appliquent réellement,
# contrairement à ce qui vaut pour Prometheus ou Alertmanager.
- name: FleetForge firewall
  hosts: infras
  remote_user: "{{ remote_username }}"
  gather_facts: "{{ (ff_deploy_scope | default('all')) != 'gateway' }}"
  pre_tasks:
    - name: Skip FleetForge when only the gateway is deployed
      ansible.builtin.meta: end_play
      when: (ff_deploy_scope | default('all')) == 'gateway'
      tags: [always]
  roles:
    - fleetforge-security

# ── Vhost sur les proxies ──────────────────────────────────────────────────
# Sans lui le nom public ne répond pas (le CNAME pointe sur le front des proxies,
# qui n'a aucun vhost pour lui) et AgentHub ne peut pas joindre l'application.
# Pousse SEULEMENT sites-enabled/fleetforge.conf : reload si le fichier a changé,
# ni restart ni resynchronisation des autres vhosts (même motif que
# deploy-agenthub.yml). Mode d'accès, serveurs liés : l'entrée dédiée, via
# `_access.inc`. Un parc dont le dossier nginx ne porte pas ce vhost (le gabarit
# est rangé dans `unused/`) est simplement ignoré.
# Pas de `--limit` : il exclurait les proxies, et le vhost ne serait pas posé.
- name: Vhost FleetForge sur les proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  gather_facts: "{{ (ff_deploy_scope | default('all')) != 'gateway' }}"
  tags: [proxy-conf]
  tasks:
    - name: Skip FleetForge when only the gateway is deployed
      ansible.builtin.meta: end_play
      when: (ff_deploy_scope | default('all')) == 'gateway'
      tags: [always]

    - name: Look for the FleetForge vhost of this parc
      ansible.builtin.set_fact:
        ff_vhost_wanted: >-
          {{ (query('ansible.builtin.fileglob',
                    playbook_dir ~ '/../parcs/' ~ parc_name ~ '/nginx/sites-enabled/fleetforge.conf') | length > 0)
             and (groups['infras'] | default([]) | length > 0) }}

    # Écouteurs DÉDIÉS (`dedicated_listeners` de l'entrée FleetForge, optionnel) : un port propre sur le proxy de la machine
    # de FleetForge, un `server {}` unique, admis à la seule passerelle (`access_linked`), ouvert dans ufw à sa seule
    # adresse — AVANT le vhost, qui lit la même déclaration. Rien de déclaré : aucune ouverture, comportement inchangé.
    - name: Open the dedicated listeners to their named clients only
      ansible.builtin.include_role:
        name: proxy-security
        tasks_from: dedicated-listeners
      when: ff_vhost_wanted | bool

    - name: Deploy just the FleetForge vhost
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: deploy-one-site
      vars:
        site: fleetforge.conf
        site_dedicated_listeners: "{{ proxy_dedicated_listeners | default([]) | selectattr('entry', 'in', groups['infras'] | default([])) | list }}"
      when: ff_vhost_wanted | bool

# ── Règles d'alerte ────────────────────────────────────────────────────────
# `fleetforge_ansible_available` et `fleetforge_inventories` n'alertent que si le
# groupe `fleetforge` est chargé sur ce parc : une règle jamais chargée est
# indiscernable d'une règle qui veille. Le rôle charge TOUS les groupes de
# `prom_alert_groups` (source unique, partagée avec update-prometheus-alerts.yml) ;
# le play échoue si `fleetforge` n'y figure pas plutôt que de réussir sans alerte.
# Motif d'hôte en dur : un `hosts:` est résolu avant les group_vars (CLAUDE.md).
- name: Règles d'alerte FleetForge
  hosts: prometheus1:monitor
  remote_user: "{{ remote_username }}"
  become: true
  gather_facts: "{{ (ff_deploy_scope | default('all')) != 'gateway' }}"
  tags: [alerts, monitoring]
  pre_tasks:
    - name: Nothing to arm without a FleetForge host (or when only the gateway is deployed)
      ansible.builtin.meta: end_play
      when: >-
        groups['infras'] | default([]) | length == 0
        or (ff_deploy_scope | default('all')) == 'gateway'
      tags: [always]

    - name: Fail when the alert group is not enabled for this parc
      ansible.builtin.assert:
        that: "'fleetforge' in prom_alert_groups"
        fail_msg: >-
          `fleetforge` absent de `prom_alert_groups` (group_vars du parc) : les
          règles FleetForgeAnsibleUnavailable et FleetForgeFleetEmpty ne seraient
          PAS chargées, et l'état dégradé de l'application n'alerterait jamais.
  roles:
    - prometheus-alerts-update

# ── Autorisation de la clé dédiée sur le parc ──────────────────────────────
# Ne s'exécute qu'avec `ff_deploy_secrets=true`. C'est ce play qui donne sa
# valeur à la clé dédiée : `from="<adresse d'infra1>"` la rend inutilisable
# depuis ailleurs, donc révocable et sans portée hors de cette machine — ce
# qu'une clé personnelle recopiée n'offre pas.
#
# La clé est d'abord déposée dans keys/<parc>/control/ (rôle d'installation),
# puis les authorized_keys de `srvc` sont reposés depuis le dossier des clés du
# parc (security-ssh, `exclusive: true`) : la clé dédiée y est DANS la liste
# voulue, donc un `setup-server.yml` ultérieur ne la retire pas, et une rotation
# retire l'ancienne. Le dossier keys/ est à COMMITTER dans le dépôt privé.
#
# `ignore_unreachable` est assumé : le parc contient des entrées volontairement
# injoignables (docker-repo en xxx.xxx.xxx.xxx). Mais le résultat est RAPPORTÉ
# hôte par hôte : une autorisation à moitié posée ne doit pas passer pour une
# autorisation posée.
#
#   ./play.sh web3c deploy-fleetforge.yml -e ff_deploy_secrets=true --tags authorize
- name: Autoriser la clé dédiée sur le parc
  hosts: all
  remote_user: "{{ remote_username }}"
  gather_facts: false
  ignore_unreachable: true
  tags: [authorize]
  tasks:
    - name: Skip unless the driving secrets were requested
      ansible.builtin.meta: end_play
      when: >-
        not (ff_deploy_secrets | default(false) | bool)
        or (ff_deploy_scope | default('all')) == 'gateway'

    - name: Authorize the parc keys for srvc, the dedicated one included
      ansible.builtin.include_role:
        name: security-ssh
        tasks_from: authorized_keys
      vars:
        ak_user: "{{ remote_username }}"

    # Les hôtes injoignables sortent du play : ils n'atteignent pas cette
    # tâche. Le décompte final ci-dessous est donc le SEUL endroit qui les
    # nomme — sans lui, une autorisation posée à moitié ressemblerait en tout
    # point à une autorisation posée.
    - name: Report the hosts left without the key
      ansible.builtin.debug:
        msg: >-
          Clé autorisée sur {{ ansible_play_hosts | length }} hôte(s).
          {{ 'Non traités (injoignables) : '
             ~ (ansible_play_hosts_all | difference(ansible_play_hosts) | join(', '))
             ~ ' — l_application ne pourra pas les piloter.'
             if (ansible_play_hosts_all | difference(ansible_play_hosts)) | length > 0
             else 'Aucun hôte laissé de côté.' }}
      run_once: true

# ── Supervision (OBLIGATOIRE, voir CLAUDE.md) ──────────────────────────────
# Cible native sur le port applicatif. Vérifie qu'un `scrape_config` lit
# réellement le répertoire de cibles — une cible que personne ne lit ne
# supervise rien, et ne se distingue pas d'une cible qui veille.
- name: Supervision du service
  hosts: infras
  remote_user: "{{ remote_username }}"
  gather_facts: "{{ (ff_deploy_scope | default('all')) != 'gateway' }}"
  pre_tasks:
    - name: Skip FleetForge when only the gateway is deployed
      ansible.builtin.meta: end_play
      when: (ff_deploy_scope | default('all')) == 'gateway'
      tags: [always]
  roles:
    - fleetforge-monitoring

# ════════════════════════════════════════════════════════════════════════════
# Passerelle MCP de FleetForge — entrée `webapp` DURCIE du groupe
# `fleetforge_gateways`. Aucun hôte dans le groupe (papanglabs) : rien n'est
# visé. `ff_deploy_scope=fleetforge` : idem, sans connexion. `hosts:` en dur
# (CLAUDE.md : jamais de variable dans un `hosts:`), jamais `infras` ni `all`.
# ════════════════════════════════════════════════════════════════════════════

# Garde STATIQUE (aucune connexion) de ce que SEUL FleetForge sait : entrée
# dédiée hors `infras` sans la famille `fleetforge`, privée et durcie, `/mcp`
# derrière une liste nommée, comptes aval bornés de l'entrée FleetForge
# (`access_linked`, liste blanche, refus), mots de passe aval nommés. Prépare
# FFG_UPSTREAMS et, au premier passage, les mots de passe tirés dans CE run.
- name: Garde de la passerelle (inventaire, sans connexion)
  hosts: fleetforge_gateways
  gather_facts: false
  tags: [gateway, always]
  tasks:
    - name: Skip the gateway when only FleetForge is deployed
      ansible.builtin.meta: end_play
      when: (ff_deploy_scope | default('all')) == 'fleetforge'

    - name: Check the gateway entry and prepare what only FleetForge knows
      ansible.builtin.include_role:
        name: fleetforge-install
        tasks_from: gateway-guard
        apply:
          tags: [always]

# Déploiement par la famille GÉNÉRIQUE `webapp` (profil `webapp_hardening`) :
# DNS, vhost (`/mcp` : liste nommée, le reste privé), compte dédié, pare-feu
# DOCKER-USER propre (proxies admis distants), .env rendus (secrets adoptés,
# mots de passe aval no_log), compose durci contrôlé AVANT run.sh, durcissement
# vérifié APRÈS — conteneurs ARRÊTÉS au moindre écart —, sonde svcprobe.
# `webapp` vide (scope `fleetforge`, ou pas de groupe) : `webapp_optional`,
# rien n'est visé, aucune connexion.
- name: Déploiement de la passerelle (famille webapp)
  ansible.builtin.import_playbook: deploy-webapp.yml
  vars:
    webapp: >-
      {{ '' if (ff_deploy_scope | default('all')) == 'fleetforge'
         else (groups['fleetforge_gateways'] | default([]) | first | default('')) }}
    webapp_optional: true
  tags: [gateway]

# ════════════════════════════════════════════════════════════════════════════
# Sauvegarde de la base de la passerelle (famille `backup`) — APRÈS les plays de
# la passerelle : la base existe. Ce que `./play.sh <parc> deploy-backup.yml
# --limit fleetforge-gateway:backup-fleetforge-gateway` faisait à part, sans
# toucher aux autres sauvegardes du parc (tradekong, ctdapi, brk, serveurs de
# synchro : jamais visés ici). Les plays source (garde, contrôle préalable,
# `postgres-backup-install`) sont ceux de deploy-backup.yml, importés de
# lib/gateway-backup-*.yml : une seule définition.
#
# Opt-in par l'inventaire (docs/etude-passerelle-sur-webapp.md, « Sauvegarde de
# la base de la passerelle », « Activation ») : l'entrée de la passerelle porte
# `backup` dans `ansible_roles` + `pgbak_*` + le destinataire age, et son
# `pgbak_dest_host` est l'entrée `backup-fleetforge-gateway` (groupe `backups`).
# Parc sans passerelle, passerelle sans `backup` : AUCUN hôte visé, aucune
# connexion (groupe construit sans connexion par la garde). `ff_deploy_scope=
# fleetforge` : idem. Tag `backup` (`--tags backup` : la sauvegarde seule ; les
# autres tags ne rouvrent aucune connexion pour elle).
#
# `--check` : la garde et l'ouverture du pare-feu de la destination sont jouées ;
# le rôle d'installation est SAUTÉ (clé SSH et compte de destination n'existent
# pas encore au premier passage, leur simulation lirait des résultats absents —
# le play de contrôle préalable, lui, est simulé comme partout).
# ════════════════════════════════════════════════════════════════════════════
- name: Sauvegarde de la passerelle — opt-in et garde (sans connexion)
  ansible.builtin.import_playbook: lib/gateway-backup-guard.yml
  vars:
    gwbk_embedded: true
  tags: [backup]

# Le motif d'hôte du pare-feu ci-dessous est EN DUR (jamais une variable dans un
# `hosts:`) : la destination déclarée doit être cette entrée, sinon l'ouverture
# serait sautée sans bruit après l'installation de la sauvegarde. Aucune connexion.
- name: Sauvegarde de la passerelle — destination attendue (sans connexion)
  hosts: fleetforge_gateways_backup
  gather_facts: false
  tags: [backup]
  tasks:
    - name: Check the destination is the entry this playbook opens
      ansible.builtin.assert:
        that: pgbak_dest_host | default('') == 'backup-fleetforge-gateway'
        fail_msg: >-
          {{ inventory_hostname }} : `pgbak_dest_host` = « {{ pgbak_dest_host | default('?') }} » ; deploy-fleetforge.yml ouvre le
          pare-feu de l'entrée `backup-fleetforge-gateway` seule (motif d'hôte en dur). Nommer ainsi l'entrée de destination, ou
          jouer `deploy-backup.yml --limit {{ inventory_hostname }}:{{ pgbak_dest_host | default('<destination>') }}`.
        quiet: true

    - name: Say that the backup install is not simulated in check mode
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} : sauvegarde non simulée en --check (clé SSH dédiée et compte de destination absents au
          premier passage) ; garde passée, rien n'est lu ni écrit.
      when: ansible_check_mode

- name: Sauvegarde de la passerelle — contrôle préalable et installation
  ansible.builtin.import_playbook: lib/gateway-backup-install.yml
  vars:
    gwbk_embedded: true
  tags: [backup]

# Reposé après coup, comme deploy-backup.yml : l'installation ouvre le SSH pour LA
# source, ce play couvre la destination (`backup_sources` de son entrée). Pas
# d'entrée de la destination concernée par une passerelle sans `backup` : le
# play s'arrête sans connexion (`gather_facts` faux, `end_play`).
- name: Pare-feu de la destination de la sauvegarde de la passerelle
  hosts: backup-fleetforge-gateway
  remote_user: "{{ remote_username }}"
  become: true
  gather_facts: false
  tags: [backup]
  pre_tasks:
    - name: Skip unless a gateway that backs up names this destination
      ansible.builtin.meta: end_play
      when: >-
        inventory_hostname not in (groups['fleetforge_gateways_backup'] | default([])
        | map('extract', hostvars, 'pgbak_dest_host') | select('defined') | list)
      tags: [always]
  roles:
    - backup-security
