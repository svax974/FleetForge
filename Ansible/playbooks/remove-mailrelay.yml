---
- name: Remove mail relay services (certs and DKIM keys preserved)
  hosts: all
  remote_user: "{{ remote_username }}"
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Skip hosts that do not carry the mailrelay family
      ansible.builtin.meta: end_host
      when: "'mailrelay' not in ansible_roles | default([])"

    - name: Confirm removal
      ansible.builtin.debug:
        msg: |
          Stopping and removing Postfix, OpenDKIM and postfix-exporter.
          Certs (/etc/letsencrypt) and DKIM keys (/etc/opendkim/keys) are preserved.
          Use purge-mailrelay.yml to delete everything.

  roles:
    - mailrelay-remove
