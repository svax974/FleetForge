---
# Déploiement GÉNÉRIQUE d'une application bâtie sur WebAppTemplate (vx-public / vx-private) : un seul passage rend
# l'application atteignable ET surveillée — DNS, front Cloudflare Pages, vhost, filtrage DOCKER-USER, secrets,
# .env, images (build → registre → hôte), sonde et alertes — et laisse des `.env` tels qu'un simple
# `./scripts/run.sh prod` dans le dépôt de l'application redéploie ensuite sans Ansible.
#
#   ./play.sh web3c deploy-webapp.yml -e webapp=llm-proxy
#   ./play.sh web3c deploy-webapp.yml -e webapp=papanglabs -e webapp_env=preprod
#
# `webapp` = le nom de l'entrée d'inventaire (ou son `webapp_project`). L'entrée porte `ansible_roles: [webapp]` et ses
# attributs (roles/webapp-setup/defaults/main.yml) : `app_port`, `proxy_hostname`, `access_mode`, `cloudflare_front`
# (front sur Pages) ou `cloudflare_named` (nom proxifié, front en conteneur), `webapp_db_engine` à la main ; tout le reste est dérivé. Les secrets sont ADOPTÉS du .env existant puis mis au coffre,
# ou tirés s'ils n'existent nulle part (jamais régénérés : CRYPT_DB_MASTER_KEY perdue = données illisibles).
#
# Pas de variable dans un `hosts:` (résolu avant les group_vars) : le premier play valide `webapp` puis range l'entrée
# dans le groupe constant `webapp_target` (et sa machine canonique dans `webapp_machine`). Jamais de `--limit` : il
# exclurait les proxies et la machine canonique.
#
# Phases (mode registre) : -e webapp_phase=all|build|push|deploy [-e webapp_tag=<tag>]
#   build   construit l'image sur le constructeur du registre, rien d'autre
#   push    construit ET pousse
#   deploy  tire un tag déjà poussé et bascule (rollback = redéployer un ancien tag)
# Tags :
#   --tags config      rend seulement les .env (secrets, cibles, ports, registre)
#   --tags image       .env puis run.sh (build/push/deploy selon webapp_phase), sans DNS ni pare-feu ni vhost
#   --tags install     DNS + connexion de l'hôte au registre
#   --tags proxy-conf  vhost (et activation des Authenticated Origin Pulls qui le précède)
#   --tags security    filtrage DOCKER-USER
#   --tags monitoring  sonde svcprobe
#   --tags hardening   (profil durci) recontrôle du durcissement RÉEL, conteneurs arrêtés au moindre écart
# Un jamais-joué : `--check` rend le diff des .env sans écrire (valeurs masquées), sans connexion aux proxies.
#
# Profil DURCI (`webapp_hardening` sur l'entrée, docs/etude-passerelle-sur-webapp.md) : garde sans connexion, compte
# dédié, pare-feu DOCKER-USER propre à l'app, compose durci contrôlé avant run.sh, durcissement vérifié après,
# conteneurs ARRÊTÉS au moindre écart. Sans l'attribut : comportement inchangé.
#
# `webapp_optional: true` (un playbook qui IMPORTE celui-ci, ex. deploy-fleetforge.yml pour sa passerelle) : sans
# `webapp`, rien n'est visé (aucune connexion) au lieu d'échouer.

# ── Sélection de l'application ─────────────────────────────────────────────
- name: Select the application
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    # Avant tout : un fait interne donné par `-e` effacerait un contrôle (webapp-setup/tasks/no-overrides.yml).
    - name: Refuse internal facts given on the command line
      ansible.builtin.include_role:
        name: webapp-setup
        tasks_from: no-overrides
        apply:
          tags: [always]

    - name: Select nothing when the application is optional and not named
      ansible.builtin.meta: end_play
      when:
        - webapp_optional | default(false) | bool
        - (webapp | default('')) | length == 0

    - name: Check the parameters
      ansible.builtin.assert:
        that:
          - webapp is defined
          - webapp | length > 0
          - webapp_phase | default('all') in ['all', 'build', 'push', 'deploy']
        fail_msg: >-
          `-e webapp=<entrée>` est requis (l'entrée d'inventaire ou son `webapp_project`) ;
          `webapp_phase` : all | build | push | deploy.
        quiet: true

    - name: Find the entries of the application
      ansible.builtin.set_fact:
        wa_selected: >-
          {%- set out = [] -%}
          {%- for n in groups['all'] -%}
          {%- set h = hostvars[n] -%}
          {%- if 'webapp' in (h.ansible_roles | default([])) and (n == webapp or (h.webapp_project | default(n)) == webapp) and (h.webapp_env | default('prod')) == (webapp_env | default('prod')) -%}
          {%- set _ = out.append(n) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Fail when no entry matches, or when the group has several entries
      ansible.builtin.assert:
        that: wa_selected | length == 1
        fail_msg: >-
          {{ 'Aucune entrée `webapp` ne correspond à' if wa_selected | length == 0 else wa_selected | length ~ ' entrées correspondent à' }}
          webapp={{ webapp }} (environnement {{ webapp_env | default('prod') }}) : {{ wa_selected | join(', ') or '—' }}.
          L'entrée porte `ansible_roles: [webapp]`. Les applications à plusieurs hôtes par environnement
          (PapangWorkspace) ne sont pas encore prises en charge par ce playbook.
        quiet: true

    - name: Put the application in the target group
      ansible.builtin.add_host:
        name: "{{ wa_selected | first }}"
        groups: webapp_target
      changed_when: false

    - name: Put the canonical machine of the application in its group
      ansible.builtin.add_host:
        name: "{{ hostvars[wa_selected | first].webapp_machine | default(wa_selected | first) }}"
        groups: webapp_machine
        webapp_target: "{{ wa_selected | first }}"
      changed_when: false

    # Les alertes de ce service sont celles du groupe générique `services` : sans lui la sonde est muette.
    - name: Check the alert group the probe relies on is loaded
      ansible.builtin.assert:
        # Lu sur l'entrée : `localhost` n'appartient à aucun groupe du parc, donc n'a pas ses group_vars.
        that: "'services' in (hostvars[wa_selected | first].prom_alert_groups | default([]))"
        fail_msg: "Le groupe d'alertes `services` n'est pas dans `prom_alert_groups` du parc : ServiceDown ne sonnerait jamais."
        quiet: true

# ── Lecture des adresses et ports de CHAQUE entrée, dans son contexte (aucune connexion) ──
# Les gardes de ports d'une machine partagée (machine-rules, profil durci) comparent les entrées voisines : une valeur ne se
# rend correctement que dans le contexte de SON entrée (probe-entry-ports.yml). Jamais de `--limit` : il exclurait des entrées.
- name: Lecture des ports de chaque entrée
  ansible.builtin.import_playbook: lib/probe-entry-ports.yml
  when: groups['webapp_target'] | default([]) | length > 0

# ── Garde du profil durci (inventaire seul, AUCUNE connexion) ──────────────
- name: Garde du profil durci
  hosts: webapp_target
  gather_facts: false
  tags: [always]
  tasks:
    # Passerelle MCP de FleetForge : sa garde (comptes aval bornés, profil durci EXIGÉ, mots de passe aval nommés,
    # FFG_UPSTREAMS) est jouée ICI aussi — un `-e webapp=<passerelle>` ne la contourne pas (un `-e` l'emporte sur les
    # `vars:` d'un import, et un fait « garde passée » se forgerait de même).
    - name: Check the MCP gateway entry before any connection
      ansible.builtin.include_role:
        name: fleetforge-install
        tasks_from: gateway-guard
      when: inventory_hostname in (groups['fleetforge_gateways'] | default([]))

    - name: Check the hardening profile of the entry before any connection
      ansible.builtin.include_role:
        name: webapp-setup
        tasks_from: facts
      when: webapp_hardening is defined

    # Le compose durci est contrôlé ICI, avant le CNAME, le compte, le vhost et le pare-feu (sur le poste).
    - name: Check the hardened compose before any connection
      ansible.builtin.include_role:
        name: webapp-deploy
        tasks_from: compose-check
      when: webapp_hardening is defined

    # Machine partagée : tous les ports de toutes ses apps dans le host_vars canonique (un seul script de pare-feu par machine).
    - name: Check the shared machine declares the Docker ports of every webapp
      ansible.builtin.include_role:
        name: webapp-setup
        tasks_from: machine-rules
        apply:
          tags: [always]

# ── Contrôle préalable (OBLIGATOIRE, voir CLAUDE.md) ───────────────────────
- name: Contrôle préalable
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  tags: [always]
  roles:
    - role: host-preflight
      preflight_require_docker: true
  post_tasks:
    - name: Work out the facts of the application
      ansible.builtin.include_role:
        name: webapp-setup
        tasks_from: facts
      tags: [always]

# ── DNS + registre ─────────────────────────────────────────────────────────
- name: Install the application prerequisites (DNS, registry login)
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  tags: [install]
  roles:
    - webapp-install

# ── Vhost ──────────────────────────────────────────────────────────────────
# `cloudflare_front` (front sur Pages, API sous `<projet>-back.<domaine>`) OU `cloudflare_named` (nom `proxy_hostname` servi par
# Cloudflare, front en conteneur) : les Authenticated Origin Pulls sont activés chez Cloudflare AVANT le vhost, qui les exige
# (autorité propre au parc générée une fois, envoyée à Cloudflare, activée sur les noms de `cfopull_hostnames`, mode TLS de la zone
# lu). Le DNS (CNAME proxifié pour `cloudflare_named`) est posé par le play précédent (webapp-install) ; l'autorité est déposée
# sur les proxies par proxy-update avant tout gabarit. Un seul passage : rien à jouer à la main.
- name: Authenticated Origin Pulls côté Cloudflare
  hosts: webapp_target
  gather_facts: false
  become: false
  tags: [proxy-conf]
  tasks:
    - name: Create the parc certificate and enable it on the API name
      ansible.builtin.include_role:
        name: cloudflare-origin-pull
      vars:
        cfopull_part: cloudflare
      when:
        - (cloudflare_front | default(false) | bool) or (cloudflare_named | default(false) | bool)
        - (webapp_proxy | default('internal')) != 'external'

# Reload seul, jamais les autres vhosts. Un vhost écrit à la main `<projet>.conf` (parcs/<parc>/nginx/sites-enabled/) a
# la priorité ; sinon le gabarit générique est rendu. Pas de `--limit` : il exclurait les proxies.
- name: Vhost de l'application sur les proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  # Aucune application sélectionnée (`webapp_optional`) : aucune connexion aux proxies.
  gather_facts: "{{ groups['webapp_target'] | default([]) | length > 0 }}"
  tags: [proxy-conf]
  vars:
    # Même chemin que `proxy_update_dir` (defaults du rôle proxy-update, non chargés à ce niveau) : sert à savoir si un
    # vhost écrit à la main existe, côté poste de contrôle.
    webapp_vhost_dir: "{{ playbook_dir }}/../parcs/{{ parc_name }}/nginx"
    # Fichier du vhost écrit à la main : `webapp_vhost_file` (nom du fichier) sinon `<webapp_project>.conf`.
    webapp_vhost_site: "{{ hostvars[groups['webapp_target'] | first].webapp_vhost_file | default((hostvars[groups['webapp_target'] | first].webapp_project | default(groups['webapp_target'] | first)) ~ '.conf') if groups['webapp_target'] | default([]) | length > 0 else '' }}"
  tasks:
    - name: Nothing to do without a selected application
      ansible.builtin.meta: end_play
      when: groups['webapp_target'] | default([]) | length == 0

    - name: Deploy the hand-written vhost of the application
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: deploy-one-site
      vars:
        site: "{{ webapp_vhost_site }}"
      when:
        - (hostvars[groups['webapp_target'] | first].webapp_proxy | default('internal')) != 'external'
        - (webapp_vhost_dir ~ '/sites-enabled/' ~ webapp_vhost_site) is file

    - name: Deploy the generic vhost of the application
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: deploy-webapp-site
      vars:
        webapp_vhost_entries: "{{ groups['webapp_target'] }}"
      when:
        - (hostvars[groups['webapp_target'] | first].webapp_proxy | default('internal')) != 'external'
        - hostvars[groups['webapp_target'] | first].proxy_hostname is defined
        - not ((webapp_vhost_dir ~ '/sites-enabled/' ~ webapp_vhost_site) is file)

# ── Filtrage des ports publiés par Docker ──────────────────────────────────
# Sur la machine CANONIQUE (`webapp_machine`, partagée ou non) : c'est elle qui porte `docker_ports_rules`.
- name: Filter the application ports in DOCKER-USER
  hosts: webapp_machine
  remote_user: "{{ remote_username }}"
  become: true
  tags: [security]
  roles:
    # `webapp_proxy: external` (VPS joint directement, ex. par Cloudflare) : aucun filtrage posé ici. Un DROP sur les ports publiés
    # couperait ce trafic, que l'inventaire ne décrit pas (aucune source à admettre).
    - role: webapp-security
      when: (hostvars[webapp_target].webapp_proxy | default('internal')) != 'external'

# ── Silence pendant le déploiement ─────────────────────────────────────────
# `deploy-full.sh` coupe le service le temps de la bascule : sans silence, ServiceDown part et la veille analyse une
# panne qui n'en est pas une. Limité à ce service ; hors des phases qui touchent l'hôte, rien.
- name: Silence the application alerts during the deploy
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  gather_facts: false
  tags: [deploy, image]
  tasks:
    - name: Silence service="<project>"
      ansible.builtin.include_role:
        name: alertmanager-update
        tasks_from: silence
      vars:
        alertmanager_silence_matchers: [{ name: service, value: "{{ wa_project }}" }]
        alertmanager_silence_comment: "deploy-webapp.yml {{ wa_project }}"
      when: webapp_phase | default('all') in ['all', 'deploy']

# ── .env + images + bascule ────────────────────────────────────────────────
- name: Deploy the application
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  tags: [config, image, deploy]
  roles:
    - webapp-deploy

# ── Durcissement RÉEL (profil durci) ───────────────────────────────────────
# Déjà vérifié dans le bloc du déploiement ; ce play permet le recontrôle seul (`--tags hardening`). Écart : conteneurs
# de l'app ARRÊTÉS, play en échec. Sans profil : sauté, aucune connexion.
- name: Durcissement de l'application
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  gather_facts: false
  tags: [hardening]
  tasks:
    - name: Verify the hardening of the running application
      ansible.builtin.include_role:
        name: webapp-security
        tasks_from: runtime
        apply:
          tags: [hardening]
      when:
        - webapp_hardening is defined
        - webapp_phase | default('all') in ['all', 'deploy']

# ── Supervision (OBLIGATOIRE, voir CLAUDE.md) ──────────────────────────────
- name: Supervision du service
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  tags: [monitoring]
  roles:
    - role: webapp-monitoring
      when: webapp_phase | default('all') in ['all', 'deploy']

# Après la sonde : le service répond de nouveau, le silence ne couvre plus que la retombée des alertes de la coupure.
- name: End the application silence
  hosts: webapp_target
  remote_user: "{{ remote_username }}"
  gather_facts: false
  tags: [deploy, image]
  tasks:
    - name: Shorten the silence
      ansible.builtin.include_role:
        name: alertmanager-update
        tasks_from: unsilence
      when: webapp_phase | default('all') in ['all', 'deploy']
