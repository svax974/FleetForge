---
# Proxies de tous les parcs (famille `proxy`). Les vhosts propres à chaque parc
# ne sont plus des rôles distincts (ex-`proxy-update-web3c` / `-papang`) : le
# rôle unique `proxy-update` lit Ansible/parcs/<parc_name>/nginx/, et
# `proxy-security` n'applique que les sections dont le parc déclare le port.
#
#   ./play.sh web3c deploy-proxy.yml
#   ./play.sh papanglabs deploy-proxy.yml
#   ./play.sh web3c deploy-proxy.yml --tags monitoring   # supervision seule

# ── Contrôle préalable (OBLIGATOIRE, voir CLAUDE.md) ───────────────────────
# Échoue immédiatement si le parc n'a pas d'hôte de supervision utilisable,
# puis vérifie — et répare — le socle de la machine, node_exporter et sa cible
# Prometheus. Un service déployé sans supervision est un service dont personne
# ne saura qu'il est tombé.
# Les contrôles bloquants portent le tag `always` : ils s'appliquent même à un
# rejeu ciblé par `--tags`.
- name: Contrôle préalable
  hosts: proxies
  remote_user: "{{ remote_username }}"
  roles:
    - role: host-preflight
      preflight_require_docker: false

- name: Install proxy
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  gather_facts: false

  roles:
    - install-nginx
    - install-cert
    - proxy-install
    - proxy-update
    - proxy-security

# Pas de variable dans un `name:` de play : comme `hosts:`, il est résolu avant
# le chargement des group_vars, donc `remote_username` y est toujours indéfini.
# Le playbook devenait invérifiable au --syntax-check. La variable reste
# légitime dans `remote_user:`, évalué au moment de la connexion.
- name: Install aliases / tools for the service user
  hosts: proxies
  remote_user: "{{ remote_username }}"
  gather_facts: false

  roles:
    - install-scripts

# ── Supervision (OBLIGATOIRE, voir CLAUDE.md) ──────────────────────────────
# Sonde `service_up` + métriques du service, et enregistrement de la cible
# auprès de Prometheus. Rejouable seule :
#   ./play.sh web3c deploy-proxy.yml --tags monitoring
- name: Supervision du service
  hosts: proxies
  remote_user: "{{ remote_username }}"
  roles:
    - proxy-monitoring
