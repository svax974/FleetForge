---
- name: Deploy a llama.cpp model instance
  hosts: all
  remote_user: "{{ remote_username }}"
  become: true
  tags: deploy

  roles:
    - llamacpp-model-install

- name: Register llama.cpp instance Prometheus target on monitor
  hosts: all
  remote_user: "{{ remote_username }}"
  become: false
  tags: monitoring

  roles:
    - exporter-llamacpp-install
