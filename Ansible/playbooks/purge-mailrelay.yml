---
- name: Purge mail relay — removes services, certs, DKIM keys, config and data
  hosts: all
  remote_user: "{{ remote_username }}"
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Skip hosts that do not carry the mailrelay family
      ansible.builtin.meta: end_host
      when: "'mailrelay' not in ansible_roles | default([])"

    - name: Confirm purge
      ansible.builtin.debug:
        msg: |
          PURGE: will delete Postfix, OpenDKIM, Let's Encrypt certs,
          DKIM keys, SASL database and all configuration.
          This action is IRREVERSIBLE.

  roles:
    - mailrelay-purge
