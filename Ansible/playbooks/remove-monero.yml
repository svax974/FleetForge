---
# Désinstalle monerod en conservant la chaîne et la configuration : un redéploiement
# (deploy-monero.yml) repart de la même base, sans resynchronisation.
#
#   ./play.sh <parc> remove-monero.yml --limit <hôte>
#
# Retire le service, les binaires, les règles ufw et la sonde svcprobe — laissée en place elle
# publierait `service_up 0` et ferait sonner `ServiceDown` sur un service volontairement
# désinstallé. Tout supprimer, chaîne comprise : purge-monero.yml.
#
# `--limit` est OBLIGATOIRE.

- name: Désinstallation du nœud Monero (chaîne conservée)
  hosts: all
  remote_user: "{{ remote_username }}"
  become: true
  pre_tasks:
    - name: Refuse to run without an explicit --limit
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Sans --limit, tous les hôtes de l'inventaire seraient visés. Ajouter --limit <hôte>."
      run_once: true
  roles:
    - monero-remove
