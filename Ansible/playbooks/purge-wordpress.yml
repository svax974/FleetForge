---
# Supprime WordPress ET ses données (fichiers, base). Destructif.
# Tout ce que fait purge-wordpress.yml, plus le contenu.
#
#   ./play.sh web3c purge-wordpress.yml
- name: Purge WordPress
  hosts: www
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - wordpress-purge

- name: Retire le vhost www des proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  tasks:
    - name: Remove the www vhost
      ansible.builtin.include_role:
        name: proxy-update-web3c
        tasks_from: remove-one-site
      vars:
        site: www.conf
