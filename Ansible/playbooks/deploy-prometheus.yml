---
- name: Deploy Prometheus (metrics collection + alert rules) for PapangLabs
  hosts: prometheus1
  remote_user: "{{ remote_username }}"
  roles:
    - prometheus-install
    - prometheus-alerts-update
    - prometheus-security
    # Sonde `service_up{service="prometheus"}` : le rôle d'installation seul laissait Prometheus sans sonde.
    - prometheus-monitoring
