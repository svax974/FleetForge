---
# AgentHub — hub d'orchestration d'agents CLI (Claude Code, Codex, ...).
# Front React (Cloudflare Pages) + back NestJS + SQLite (AppTemplate, Docker Compose) sur l'entrée d'inventaire
# `agenthub`, machine DÉDIÉE depuis le 27/10/2026 (elle était partagée avec ctdapi, rotki, xbot… ; l'ancienne se
# retire par remove-/purge-agenthub.yml --limit agenthub-old). Machine neuve : `setup-server.yml --limit agenthub`
# d'abord. Voir docs/plans/2026-09-24-agenthub/09-implementation-plan.md Phase 7 pour les règles déjà appliquées côté
# runner (T7.1), reprises ici côté hub.
#
#   ./play.sh web3c deploy-agenthub.yml
#
# ENVELOPPE de `deploy-webapp.yml -e webapp=agenthub` (15/11/2026, docs/deploiement-webapp.md) : l'entrée porte
# `ansible_roles: [webapp]`, et le déploiement générique fait DNS (Cloudflare Pages), Authenticated Origin Pulls, vhost,
# filtrage DOCKER-USER, silence Alertmanager, `.env`, `run.sh prod`, sonde. Ne reste ici que ce qui est PROPRE à AgentHub :
#   1. agenthub-install  : pile d'affichage (Xvfb, x11vnc, wine) et prérequis Flutter du runner
#   2. (import)          : tout le déploiement générique — `webapp_run_env` y passe USER_RUNNERS_PROVISION /
#                          USER_RUNNERS_AUTO_ENABLE à `run.sh`, `webapp_env_required` refuse un back/.env sans
#                          RUNNER_PROVISION ni BOOTSTRAP_API_KEY (l'auto-provisionnement apparie le runner du hub et
#                          installe les runners des utilisateurs pendant le déploiement lui-même)
#   3. relais SMTP       : le hub y est autorisé en 465/587 (mailrelay-security rejoué sur l'hôte `mailrelay`, qui
#                          n'admet que les IP de l'inventaire) — SANS ce pas, un hub déménagé n'envoie plus aucun mail
#                          (le 01/11/2026 : timeout SMTP à l'inscription, 504, parce que l'adresse du hub n'était pas
#                          autorisée sur le relais)
#   4. runner manuel     : seulement `--tags runner` (agenthub_runner_autoprovision: false), avec un jeton émis par le hub
#
# Le vhost est écrit à la main (parcs/<parc>/nginx/sites-enabled/agenthub.conf : WebSocket, timeout 1h, buffering off sur
# /api/v1/agenthub/ws/) et l'emporte sur le gabarit générique ; avec `cloudflare_front: true` il ne sert que l'API
# (agenthub-back.<domaine>, derrière le certificat client de Cloudflare) : le front est sur Cloudflare Pages.
# `docker_ports_rules` : host_vars/agenthub.yml (entrée canonique de la machine).
#
# Tags :
#   --tags proxy-conf   rejoue seulement le vhost (reload, pas les autres sites), avec l'activation Cloudflare des
#                       Authenticated Origin Pulls qui le précède
#   --tags config|image|install|security|monitoring   voir deploy-webapp.yml
#   --tags runner       rejoue seulement l'activation MANUELLE du runner (jeton `agenthub_runner_token`)
#   --tags flutter      rejoue seulement les prérequis Flutter du runner (SDK + chaîne Linux desktop, agenthub-install)
#   --tags mail-relay   rejoue seulement l'autorisation du hub sur le relais SMTP (sans --limit : le play vise l'hôte du
#                       relais, qu'un --limit agenthub exclurait)
#
# Prérequis côté poste de contrôle : back/.env et front/.env de prod présents dans le dépôt app (secrets applicatifs, jamais
# générés ici sauf ceux de `webapp-secrets-setup`, adoptés avant tout tirage). Le jeton du runner (`agenthub_runner_token`)
# ne peut être obtenu qu'APRÈS un premier déploiement réussi (page « Nouveau runner » du hub) : seulement pour les runners
# distants (agenthub_runner_autoprovision: false).

# ── Prérequis propres à AgentHub (pile d'affichage, Flutter) ───────────────
- name: AgentHub prerequisites (display stack, Flutter)
  hosts: agenthub
  remote_user: "{{ remote_username }}"
  roles:
    - agenthub-install

# ── Déploiement générique ──────────────────────────────────────────────────
- name: Déploiement générique (famille webapp)
  ansible.builtin.import_playbook: deploy-webapp.yml
  vars:
    webapp: agenthub

# Le relais SMTP n'admet en 465/587 que les IP des hôtes de l'inventaire (plus la whitelist) : mailrelay-security les relit
# à chaque passage, donc le rejouer ici autorise le hub à la première mise en ligne ou après un changement d'adresse.
# Aucun `--limit` : il exclurait l'hôte du relais (le play est alors sans effet).
- name: Authorize the AgentHub on the SMTP relay
  hosts: all
  remote_user: "{{ remote_username }}"
  become: true
  gather_facts: false
  tags: [mail-relay]
  pre_tasks:
    - name: Skip hosts that do not carry the mailrelay family
      ansible.builtin.meta: end_host
      when: "'mailrelay' not in ansible_roles | default([])"
  roles:
    - mailrelay-security

# Chemin MANUEL du runner (jeton émis par le hub) : `never` l'écarte d'un passage normal, où l'auto-provisionnement s'en charge.
- name: Activate the AgentHub runner (manual path)
  hosts: agenthub
  remote_user: "{{ remote_username }}"
  tags: [never, runner]
  tasks:
    - name: Activate the AgentHub runner
      ansible.builtin.include_role:
        name: agenthub-deploy
        tasks_from: runner
