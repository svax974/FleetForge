---
# Purge les sauvegardes des deux parcs (famille `backup`) : scripts, clés, ET
# les données sauvegardées sur les destinations. DESTRUCTIF — après cette purge
# il n'existe plus aucune copie du magasin BRK, de la base d'indicateurs ni des
# bases PostgreSQL de tradekong, ctdapi et de la passerelle MCP (si elle porte
# `backup`). Sur la destination, seuls la clé et le répertoire de chaque source
# purgée disparaissent : le compte dédié (`backup_account`) et les répertoires
# des autres sources (serveurs de synchro) restent.
#
#   ./play.sh papanglabs purge-backup.yml -e confirm=yes
#   ./play.sh web3c purge-backup.yml -e confirm=yes
#
# Les archives SQLite des serveurs de synchro ne sont pas concernées : leur
# purge passe par purge-sync-server.yml (voir remove-backup.yml).

- name: Purge de la sauvegarde du magasin BRK
  hosts: brk1
  remote_user: "{{ remote_username }}"
  roles:
    - brk-backup-purge

- name: Purge de la sauvegarde de la base d'indicateurs
  hosts: timescale1
  remote_user: "{{ remote_username }}"
  roles:
    - timescaledb-backup-purge

# Passerelle MCP : seulement l'entrée qui porte `backup`.
- name: Passerelle MCP — entrées sauvegardées
  hosts: fleetforge_gateways
  gather_facts: false
  tasks:
    - name: Keep the gateways that opt in
      ansible.builtin.group_by:
        key: "{{ 'fleetforge_gateways_backup' if 'backup' in (ansible_roles | default([])) else 'fleetforge_gateways_nobackup' }}"
      changed_when: false
      # Un rejeu `--tags` doit encore savoir quelles passerelles sont concernées.
      tags: [always]

- name: Purge de la sauvegarde PostgreSQL — tradekong, ctdapi et passerelle MCP
  hosts: tradekong:ctdapi:fleetforge_gateways_backup
  remote_user: "{{ remote_username }}"
  roles:
    - postgres-backup-purge
