---
# Repointe les sauvegardes PostgreSQL de tradekong, ctdapi et de la passerelle MCP
# (entrée de `fleetforge_gateways` qui porte `backup`) sur un nouveau serveur de
# destination.
#
# ── Procédure ──────────────────────────────────────────────────────────────
#   1. Modifier `ansible_host` — et `ansible_port` si la machine a son propre port
#      SSH (NAT) — de l'entrée de destination (`backup-tradekong`, `backup-ctdapi`,
#      ou le `pgbak_dest_host` de la passerelle) dans l'inventaire web3c.
#      Passerelle : `pgbak_dest_port` explicite dès que ce port diffère de celui du
#      parc (garde de la passerelle).
#   2. Si la nouvelle machine est neuve, la préparer d'abord :
#        ./play.sh web3c setup-server.yml --limit <entrée de destination>
#   3. ./play.sh web3c retarget-backups-web3c.yml
#
# Ce playbook refait TOUT ce qui dépend de l'adresse : compte dédié et passerelle
# `backup-gate` sur la nouvelle destination (rôle backup-setup), répertoire de la
# source, clé liée à la source (`from=`, commande forcée), ouverture du pare-feu,
# entrée known_hosts, réécriture des scripts de sauvegarde et de restauration.
# Il vérifie ensuite que la destination répond réellement (par la passerelle).
# Serveurs de synchro : `deploy-backup.yml --tags retarget --limit sync_servers`.
#
# ── Les anciennes sauvegardes ne sont PAS recopiées ────────────────────────
# Volontairement : la prochaine exécution reconstitue la destination depuis la
# base vivante. L'ANCIEN SERVEUR CONSERVE LES SAUVEGARDES tant qu'on ne le
# purge pas — un filet pendant la bascule, une fuite de données si on l'oublie
# (chiffrées si le destinataire age était posé, en clair sinon).
#
# ── Options ────────────────────────────────────────────────────────────────
#   -e run_now=true            lance immédiatement les sauvegardes en tâche de
#                              fond au lieu d'attendre le cron
#   -e purge_old=<adresse>     sur l'ANCIENNE destination, révoque les clés des
#                              sources repointées ici (compte dédié et
#                              `remote_username` de l'ancien schéma) et supprime
#                              LEURS répertoires (ceux des autres sources
#                              restent), une fois la nouvelle vérifiée. Refusé si
#                              l'adresse est celle d'une destination encore en
#                              service.
#   -e purge_old_port=<port>   port SSH de l'ancienne destination (défaut : celui
#                              du parc)

# ── Passerelle MCP : opt-in et garde, SANS connexion (comme deploy-backup.yml) ──
- name: Passerelle MCP — opt-in et garde de la sauvegarde
  hosts: fleetforge_gateways
  gather_facts: false
  tasks:
    - name: Check the database backup declaration of the gateway
      ansible.builtin.include_role:
        name: fleetforge-install
        tasks_from: gateway-backup-guard
        apply:
          tags: [always]
      when: "'backup' in (ansible_roles | default([]))"
      tags: [always]

    - name: Keep the gateways that opt in
      ansible.builtin.group_by:
        key: "{{ 'fleetforge_gateways_backup' if 'backup' in (ansible_roles | default([])) else 'fleetforge_gateways_nobackup' }}"
      changed_when: false
      tags: [always]

- name: Préflight — destinations résolues
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    retarget_sources: >-
      {{ (['tradekong', 'ctdapi'] + (groups['fleetforge_gateways_backup'] | default([])))
         | select('in', hostvars) | list }}
  tasks:
    - name: Afficher les destinations telles que l'inventaire les définit
      ansible.builtin.debug:
        msg: >-
          {{ item }} ({{ hostvars[item].pgbak_name | default('?') }}) →
          {{ hostvars[item].pgbak_dest_host | default('?') }} =
          {{ hostvars[hostvars[item].pgbak_dest_host | default('')].ansible_host | default('ABSENTE') }}:{{
          hostvars[hostvars[item].pgbak_dest_host | default('')].ansible_port | default(hostvars[item].ssh_custom_port | default('?')) }}
      loop: "{{ retarget_sources }}"

    - name: Refuser une destination absente ou confondue avec sa propre source
      ansible.builtin.fail:
        msg: >-
          `{{ hostvars[item].pgbak_dest_host | default('?') }}` (destination de {{ item }}) est absente de l'inventaire
          ou pointe sur {{ hostvars[item].ansible_host }}, la machine qui produit la base. Corrige l'inventaire.
      loop: "{{ retarget_sources }}"
      when: >-
        hostvars[item].pgbak_dest_host | default('') not in hostvars
        or hostvars[hostvars[item].pgbak_dest_host].ansible_host | default('') == hostvars[item].ansible_host

    # `purge_old` supprime des sauvegardes : jamais sur une destination ENCORE en service (une entrée du groupe
    # `backups`, ou la destination courante d'une source repointée). Un échec ici arrête le playbook avant tout
    # repointage. Les deux côtés sont normalisés (espaces, casse, crochets d'une adresse IPv6 littérale) : `2001:DB8::30`,
    # `2001:db8::30` et `[2001:db8::30]` sont la même destination. Limite assumée (aucune dépendance ajoutée : ni
    # `ansible.utils` ni netaddr) : deux écritures d'une même IPv6 qui diffèrent autrement (zéros omis ou compression
    # `::`, forme IPv4-mappée) ou un NOM et son adresse ne sont pas reconnus égaux — voir Ansible/README.md.
    - name: Refuser de purger une destination encore en service
      vars:
        _current: >-
          {{ ((groups['backups'] | default([])) + (retarget_sources | map('extract', hostvars, 'pgbak_dest_host') | list))
             | select('in', hostvars) | map('extract', hostvars) | selectattr('ansible_host', 'defined')
             | map(attribute='ansible_host') | map('string') | map('trim') | map('lower')
             | map('replace', '[', '') | map('replace', ']', '') | unique | list }}
        _asked: "{{ purge_old | string | trim | lower | replace('[', '') | replace(']', '') }}"
      ansible.builtin.fail:
        msg: >-
          purge_old={{ purge_old }} est l'adresse d'une destination encore en service ({{ _current | join(', ') }}) :
          refusé. Donner l'adresse de l'ANCIENNE destination, une fois l'inventaire repointé.
      when: purge_old is defined and _asked in _current

    # Variables du parc lues sur une source (localhost n'est pas dans le groupe du parc).
    - name: Retenir les sources repointées (purge de l'ancienne destination)
      vars:
        _parc: "{{ hostvars[retarget_sources[0]] if retarget_sources | length > 0 else {} }}"
        _account: "{{ _parc.backup_account | default('dbbackup') }}"
      ansible.builtin.set_fact:
        retarget_old_entries: "{{ retarget_sources | zip(retarget_sources | map('extract', hostvars, 'pgbak_name')) | map('join', '-') | list }}"
        retarget_old_dirs: "{{ retarget_sources | map('extract', hostvars, 'pgbak_name') | list }}"
        retarget_remote_username: "{{ _parc.remote_username | default('') }}"
        retarget_parc_port: "{{ _parc.ssh_custom_port | default(22) }}"
        retarget_backup_account: "{{ _account }}"
        retarget_backup_account_root: "{{ _parc.backup_account_root | default('/home/' ~ _account ~ '/backups') }}"
        # Ancien schéma (clés posées sur `remote_username`, dumps sous `backup_root`) : purgé aussi.
        retarget_legacy_root: "{{ _parc.backup_root | default('/home/' ~ (_parc.remote_username | default('')) ~ '/backups') }}"

- name: Repointage de la sauvegarde PostgreSQL — tradekong, ctdapi et passerelle MCP
  hosts: tradekong:ctdapi:fleetforge_gateways_backup
  remote_user: "{{ remote_username }}"
  roles:
    - postgres-backup-install

- name: Pare-feu des destinations
  hosts: backups
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - backup-security

# ── Vérification ───────────────────────────────────────────────────────────
- name: Vérification — chaque destination répond par la passerelle
  hosts: tradekong:ctdapi:fleetforge_gateways_backup
  remote_user: "{{ remote_username }}"
  vars:
    # `-e` l'emporte : `pgbak_dir` désigne le script lancé ; défaut du rôle sinon.
    retarget_pgbak_dir: "{{ pgbak_dir | default(ansible_env.HOME ~ '/postgres-backup') }}"
  tasks:
    - name: Répertoire de sauvegarde simple
      ansible.builtin.assert:
        that: retarget_pgbak_dir is match('^/[A-Za-z0-9._/-]*$')
        fail_msg: "pgbak_dir : chemin absolu sans espace ni métacaractère."
        quiet: true

    - name: Interroger la destination via postgres-restore.sh --check
      ansible.builtin.command: "{{ retarget_pgbak_dir | quote }}/postgres-restore.sh --check"
      changed_when: false
      register: retarget_check

    - name: Afficher l'état
      ansible.builtin.debug:
        var: retarget_check.stdout_lines

# ── Première sauvegarde immédiate (optionnelle) ────────────────────────────
- name: Lancement immédiat des sauvegardes
  hosts: tradekong:ctdapi:fleetforge_gateways_backup
  remote_user: "{{ remote_username }}"
  vars:
    retarget_pgbak_dir: "{{ pgbak_dir | default(ansible_env.HOME ~ '/postgres-backup') }}"
  tasks:
    - name: Répertoire de sauvegarde simple
      ansible.builtin.assert:
        that: retarget_pgbak_dir is match('^/[A-Za-z0-9._/-]*$')
        fail_msg: "pgbak_dir : chemin absolu sans espace ni métacaractère."
        quiet: true
      when: run_now | default(false) | bool

    - name: Lancer la sauvegarde en tâche de fond
      ansible.builtin.shell: "{{ retarget_pgbak_dir | quote }}/postgres-backup.sh >> {{ retarget_pgbak_dir | quote }}/backup.log 2>&1"
      async: 3600
      poll: 0
      changed_when: true
      when: run_now | default(false) | bool

    - name: Rappel de suivi
      ansible.builtin.debug:
        msg: "Sauvegarde lancée en tâche de fond. Suivi : tail -f {{ retarget_pgbak_dir }}/backup.log"
      when: run_now | default(false) | bool

# ── Nettoyage de l'ancienne destination (optionnel) ────────────────────────
- name: Purge de l'ancienne destination
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Déclarer l'ancienne destination comme hôte temporaire
      ansible.builtin.add_host:
        name: old-backup-host
        ansible_host: "{{ purge_old }}"
        ansible_port: "{{ purge_old_port | default(retarget_parc_port) }}"
        ansible_user: "{{ retarget_remote_username }}"
        remote_username: "{{ retarget_remote_username }}"
        backup_account: "{{ retarget_backup_account }}"
        old_roots: ["{{ retarget_backup_account_root }}", "{{ retarget_legacy_root }}"]
        old_accounts: ["{{ retarget_backup_account }}", "{{ retarget_remote_username }}"]
        retarget_old_entries: "{{ retarget_old_entries }}"
        retarget_old_dirs: "{{ retarget_old_dirs }}"
        groups: [old_backups_web3c]
      when: purge_old is defined
      changed_when: false

- name: Révocation et suppression sur l'ancienne destination
  hosts: old_backups_web3c
  gather_facts: false
  remote_user: "{{ remote_username }}"
  tasks:
    # Compte dédié ET `remote_username` (ancien schéma, clé sans restriction), par le commentaire de la clé.
    - name: Révoquer les clés des sources repointées
      ansible.builtin.lineinfile:
        path: "/home/{{ item.0 }}/.ssh/authorized_keys"
        regexp: " {{ item.1 | regex_escape }}-backup$"
        state: absent
      loop: "{{ old_accounts | product(retarget_old_entries) | list }}"
      become: true

    - name: Supprimer leurs sauvegardes
      ansible.builtin.file:
        path: "{{ item.0 }}/{{ item.1 }}"
        state: absent
      loop: "{{ old_roots | product(retarget_old_dirs) | list }}"
      when: item.1 is match('^[a-z0-9][a-z0-9-]{0,62}$')
      become: true
