---
# Désinstalle le mineur XMRig : service, binaire, configuration, réservation de pages énormes
# et sonde svcprobe — laissée en place, elle publierait `service_up 0` et ferait sonner
# `ServiceDown` sur un service volontairement désinstallé. Le mineur ne détient aucune donnée :
# `purge-xmrig.yml` fait la même chose.
#
#   ./play.sh <parc> remove-xmrig.yml --limit <hôte>
#
# `--limit` est OBLIGATOIRE.

- name: Désinstallation du mineur XMRig
  hosts: all
  remote_user: "{{ remote_username }}"
  become: true
  pre_tasks:
    - name: Refuse to run without an explicit --limit
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Sans --limit, tous les hôtes de l'inventaire seraient visés. Ajouter --limit <hôte>."
      run_once: true
  roles:
    - xmrig-remove
