---
# Désinstalle Ollama en conservant les modèles téléchargés.
#
#   ./play.sh web3c remove-ollama.yml
#
# Retire le binaire, l'unité systemd et son override, ainsi que la sonde — une
# sonde laissée en place publierait `service_up 0` indéfiniment et ferait
# sonner une alerte sur un service volontairement désinstallé.
#
# Conserve /usr/share/ollama et son utilisateur propriétaire : les modèles
# pèsent plusieurs gigaoctets et une réinstallation les retrouve en place.
# Pour tout supprimer : `purge-ollama.yml`.
#
# Vise l'entrée dédiée `ollama` (machine hub, CLAUDE.md § 2) depuis le
# 11/10/2026 — plus de `hosts: all` à restreindre par `--limit`.

- name: Désinstallation d'Ollama (modèles conservés)
  hosts: ollama
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - ollama-remove
