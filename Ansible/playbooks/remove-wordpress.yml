---
# Retire Apache/MySQL, la sonde, les règles ufw et le vhost des proxies.
# Fichiers et base conservés (voir purge-wordpress.yml).
#
#   ./play.sh web3c remove-wordpress.yml
- name: Remove WordPress
  hosts: www
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - wordpress-remove

- name: Retire le vhost www des proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  tasks:
    - name: Remove the www vhost
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: remove-one-site
      vars:
        site: www.conf
