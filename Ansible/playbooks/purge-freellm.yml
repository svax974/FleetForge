---
# Supprime FreeLLMAPI ET ses données : conteneur, image, volume nommé,
# configuration, ENCRYPTION_KEY, clés fournisseur et vhost sur les proxies.
# Destructif.
#
#   ./play.sh web3c purge-freellm.yml
- name: Purge FreeLLMAPI
  hosts: freellm
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - freellm-purge

# freellm-purge inclut freellm-remove (hôte `freellm`) mais ne touche pas aux
# proxies : symétrique de la play de remove-freellm.yml.
- name: Retire le vhost FreeLLMAPI des proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  tasks:
    - name: Remove the FreeLLMAPI vhost
      ansible.builtin.include_role:
        name: proxy-update-web3c
        tasks_from: remove-one-site
      vars:
        site: freellm.conf
