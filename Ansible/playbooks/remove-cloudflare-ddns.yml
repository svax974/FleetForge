---
# Conserve le jeton, la configuration et l'état pour un redéploiement.
- name: Retrait du client Cloudflare DDNS
  hosts: all
  remote_user: "{{ remote_username }}"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require an explicit target
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Ajouter --limit <machine>."
      run_once: true
  roles: [cloudflare-ddns-remove]
