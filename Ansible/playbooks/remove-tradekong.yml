---
# Retire la sonde svcprobe de tradekong. Ne touche pas à la stack
# docker-compose (hors Ansible). Utilise purge-tradekong.yml pour aussi
# supprimer la sauvegarde PostgreSQL.
#
#   ./play.sh web3c remove-tradekong.yml

- name: Suppression de la supervision
  hosts: tradekong
  remote_user: "{{ remote_username }}"
  roles:
    - tradekong-remove
