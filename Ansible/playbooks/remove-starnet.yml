---
# Retire StarNet : unité --user, relai, code, Node embarqué, sonde, règles ufw
# et vhost sur les proxies. Conserve les workspaces et la configuration (voir
# purge-starnet.yml).
#
#   ./play.sh web3c remove-starnet.yml
- name: Remove StarNet
  hosts: starnet
  remote_user: "{{ remote_username }}"
  become: true
  roles:
    - starnet-remove

# Symétrique de la play « Vhost StarNet sur les proxies » de
# deploy-starnet.yml — sans quoi le vhost survivrait au service et renverrait
# 502.
- name: Retire le vhost StarNet des proxies
  hosts: proxies
  remote_user: "{{ remote_username }}"
  become: true
  tasks:
    - name: Remove the StarNet vhost
      ansible.builtin.include_role:
        name: proxy-update
        tasks_from: remove-one-site
      vars:
        site: starnet.conf
