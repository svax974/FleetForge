[package]
name = "fleetforge-providers"
description = "Accès aux API des hébergeurs — GCP, AWS, Contabo, OVH, Oracle, et machines physiques."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["keyring"]
# Trousseau système. Désactivable pour les environnements sans agent (CI,
# conteneur) : le stockage retombe alors sur un fichier en 0600.
keyring = ["dep:keyring"]

[dependencies]
fleetforge-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"], optional = true }
